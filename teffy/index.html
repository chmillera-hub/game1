<title>Teffy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the council chamber (16 seats in a ring around the Consciousness) stays pinned on the left; the deliberation log reads down the right and ends in the composer. One column on phones. */
:root {
  --bg: #eef1f6;
  --surface: #fafbfd;
  --ink: #161b26;
  --muted: #586174;
  --line: #d3d9e4;
  --accent: #2d4f8e;
  --accent-soft: #dce4f3;
  --on-accent: #ffffff;
  --suffer: #bf3a27;
  --suffer-soft: #f8e1db;
  --calm: #2b7651;
  --calm-soft: #d9eee2;
  --heart: #c2366a;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b;
    --surface: #171c27;
    --ink: #e6eaf2;
    --muted: #9ba5b9;
    --line: #2a3245;
    --accent: #93b2ff;
    --accent-soft: #1f2b47;
    --on-accent: #0f131b;
    --suffer: #ff8069;
    --suffer-soft: #3b1f1a;
    --calm: #72d3a1;
    --calm-soft: #15301f;
    --heart: #ff7aa3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b;
  --surface: #171c27;
  --ink: #e6eaf2;
  --muted: #9ba5b9;
  --line: #2a3245;
  --accent: #93b2ff;
  --accent-soft: #1f2b47;
  --on-accent: #0f131b;
  --suffer: #ff8069;
  --suffer-soft: #3b1f1a;
  --calm: #72d3a1;
  --calm-soft: #15301f;
  --heart: #ff7aa3;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

.app {
  max-width: 1200px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 0;
}

/* Header */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.brand { min-width: 0; max-width: 40rem; }
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 6vw, 3rem);
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.brand p { margin: 0.5rem 0 0; color: var(--muted); text-wrap: pretty; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.engine { display: flex; flex-direction: column; gap: 2px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.engine select {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 0.45rem 2rem 0.45rem 0.7rem;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.5rem 0.95rem;
  font-weight: 700;
  line-height: 1.2;
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn-quiet:hover:not(:disabled) { color: var(--ink); }
.btn-small { padding: 0.3rem 0.7rem; font-size: 0.85rem; }

.notice {
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-size: 0.95rem;
  max-width: 62rem;
}
.notice b { font-weight: 700; }

/* Main layout */
.layout {
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 36px;
  align-items: start;
  padding-top: 20px;
}
.chamber {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding-bottom: 16px;
  scrollbar-width: thin;
}

/* Council ring */
.ring {
  container-type: inline-size;
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 1 / 1;
  margin-inline: auto;
}
.ring::before {
  content: "";
  position: absolute;
  inset: 9%;
  border-radius: 50%;
  border: 1px dashed var(--line);
}
.seat {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: 14%;
  aspect-ratio: 1 / 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  font-size: 22px;
  font-size: 6.6cqi;
  line-height: 1;
  transition: transform 0.25s ease, border-color 0.25s, background-color 0.25s;
}
.seat-emoji { filter: saturate(0.3); opacity: 0.5; transition: opacity 0.25s, filter 0.25s; }
.seat:hover .seat-emoji { opacity: 0.85; }
.seat[data-state="suffer"] { border-color: var(--suffer); background: var(--suffer-soft); animation: pulse 2.4s ease-in-out infinite; }
.seat[data-state="soothed"] { border-color: var(--calm); background: var(--calm-soft); }
.seat[data-state="calm"] { border-color: var(--calm); }
.seat[data-state="suffer"] .seat-emoji,
.seat[data-state="soothed"] .seat-emoji,
.seat[data-state="calm"] .seat-emoji { filter: none; opacity: 1; }
.seat.speaking { transform: translate(-50%, -50%) scale(1.16); z-index: 2; }
.seat[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 3px; }
.seat:hover, .seat:focus-visible { z-index: 3; }
.seat-score {
  position: absolute;
  right: -10%;
  bottom: -8%;
  padding: 0.2em 0.35em;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid currentColor;
  font: 600 9px/1 var(--f-mono);
  font-size: max(9px, 2.5cqi);
  font-variant-numeric: tabular-nums;
}
.seat-score:empty { display: none; }
.seat[data-state="suffer"] .seat-score { color: var(--suffer); }
.seat[data-state="soothed"] .seat-score, .seat[data-state="calm"] .seat-score { color: var(--calm); }
.seat-pick {
  position: absolute;
  top: -10%;
  right: -8%;
  display: none;
  color: var(--heart);
  font-size: max(12px, 3.6cqi);
  line-height: 1;
}
.seat.picked .seat-pick { display: block; }
.seat::after {
  content: attr(data-name);
  position: absolute;
  top: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%);
  padding: 0.2rem 0.45rem;
  border-radius: 6px;
  background: var(--ink);
  color: var(--bg);
  font: 700 11px/1.2 var(--f-body);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.seat:hover::after, .seat:focus-visible::after { opacity: 1; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--suffer) 40%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--suffer) 0%, transparent); }
}

.core {
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--accent-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.25em;
  padding: 7%;
  text-align: center;
  overflow: hidden;
}
.ring.thinking .core { animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { border-color: var(--accent-soft); }
  50% { border-color: var(--accent); }
}
.core-brain { font-size: 30px; font-size: 10cqi; line-height: 1; }
.core-label {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 12px;
  font-size: max(11px, 3.4cqi);
  line-height: 1.2;
  color: var(--accent);
}
.core-text {
  font-size: 11px;
  font-size: max(11px, 3.1cqi);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.core-big {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 26px;
  font-size: 9cqi;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.core-big .neg { color: var(--suffer); }
.core-big .zero { color: var(--calm); }

.tally-box { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.tally-box p { margin: 0; }
.tally-box .k { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: 0.82rem; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); flex: none; }
.swatch.suffer { border-color: var(--suffer); background: var(--suffer-soft); }
.swatch.calm { border-color: var(--calm); }
.swatch.soothed { border-color: var(--calm); background: var(--calm-soft); }
.legend .heart { color: var(--heart); }

.profile {
  border-top: 1px solid var(--line);
  padding-top: 14px;
  font-size: 0.93rem;
}
.profile > p { margin: 0; }
.pf-head { display: flex; gap: 12px; align-items: flex-start; }
.pf-emoji { font-size: 2rem; line-height: 1; }
.pf-name { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.pf-line { margin: 0.25rem 0 0; }
.pf { margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.pf dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pf dd { margin: 0.1rem 0 0; }
.pf-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* Deliberation log */
.log { min-width: 0; display: flex; flex-direction: column; max-width: 46rem; }
.rounds { display: flex; flex-direction: column; }
.empty { padding: 28px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; }
.empty p { margin: 0; color: var(--muted); max-width: 34rem; }

.round {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-block: 4px 28px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
  scroll-margin-top: 16px;
}
.round-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.round-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.round-head .spacer { flex: 1; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0.3rem 0.55rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}
.chip.warn { background: var(--suffer-soft); color: var(--suffer); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.dots::after { content: "…"; display: inline-block; animation: blink 1.4s steps(4, end) infinite; width: 1em; text-align: left; }
@keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
.example-note { margin: -6px 0 0; color: var(--muted); font-size: 0.92rem; }

.you {
  align-self: flex-end;
  max-width: min(88%, 34rem);
  padding: 0.7rem 1rem;
  border-radius: 18px 18px 4px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.you p { margin: 0.15rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.who { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.steps { display: flex; flex-direction: column; gap: 22px; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; }
.step-n {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.step-body { min-width: 0; }
.step-title { margin: 0 0 0.5rem; font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; line-height: 1.3; }
.step-body > p { margin: 0; max-width: 65ch; }
.idea { font-size: 1.05rem; }
.challenges { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; }

.voices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.voice { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.v-emoji { font-size: 1.3rem; line-height: 1.3; text-align: center; }
.v-body { min-width: 0; }
.v-name { font-weight: 700; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.v-says { display: block; overflow-wrap: anywhere; }
.v-add { display: block; margin-top: 0.2rem; color: var(--ink); }
.v-add b { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.tag-new { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--suffer); border: 1px solid currentColor; border-radius: 999px; padding: 0.1rem 0.4rem; }
.pill {
  display: inline-block;
  min-width: 2.6em;
  padding: 0.3rem 0.45rem;
  border-radius: 999px;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.8rem;
  line-height: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.pill.neg { background: var(--suffer-soft); color: var(--suffer); }
.pill.zero { background: var(--calm-soft); color: var(--calm); }
.shift { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }

.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.path {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}
.path.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.path-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.path-n { font-family: var(--f-display); font-weight: 700; }
.path-idea { margin: 0; }
.path .voices { gap: 10px; font-size: 0.94rem; }
.choose { margin: 12px 0 0; max-width: 65ch; }

.sadness { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr) auto; gap: 10px; align-items: start; margin-bottom: 14px; }
.sadness .v-name { color: var(--heart); }

.plan {
  margin: 0;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--accent-soft);
  font-size: 1.06rem;
  max-width: 65ch;
}

.consc { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 10px; align-items: start; }
.consc-face { font-size: 1.6rem; line-height: 1.1; text-align: center; }
.consc p { margin: 0.15rem 0 0; font-size: 1.05rem; max-width: 65ch; }

.writing { margin: 0; color: var(--muted); font-size: 0.95rem; }
.round-foot { display: flex; flex-direction: column; gap: 8px; }
.tally-line { margin: 0; font-family: var(--f-mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.tally-line b { font-weight: 600; color: var(--ink); }
.note { margin: 0; font-size: 0.88rem; color: var(--muted); }
.err { margin: 0; color: var(--suffer); font-size: 0.95rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.paste-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px dashed var(--accent);
  border-radius: 14px;
  background: var(--surface);
}
.paste-box p { margin: 0; }
.paste, .prompt-out {
  width: 100%;
  min-height: 6rem;
  resize: vertical;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 0.6rem 0.75rem;
  background: var(--bg);
  color: var(--ink);
  font-size: 0.9rem;
}
.prompt-out { font-family: var(--f-mono); font-size: 0.78rem; min-height: 8rem; }
.paste:focus, .prompt-out:focus { border-color: var(--accent); outline: none; }

/* Composer */
.composer {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.mode {
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 0.35rem 0.8rem;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}
.mode[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.add-voice { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.add-voice .k { flex: none; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.add-voice button {
  flex: none;
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.22rem 0.6rem;
  font-size: 0.85rem;
  white-space: nowrap;
  cursor: pointer;
}
.add-voice button:hover { border-color: var(--accent); }
.entry { display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1;
  min-width: 0;
  min-height: 3.3rem;
  max-height: 40vh;
  resize: vertical;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 0.7rem 0.9rem;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.4;
}
#input:focus { border-color: var(--accent); outline: none; }
.entry-actions { display: flex; flex-direction: column; gap: 6px; }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .chamber { position: static; max-height: none; overflow: visible; padding-bottom: 0; }
  .ring { max-width: 330px; }
  .log { max-width: none; }
}
@media (max-width: 520px) {
  .step { grid-template-columns: 1.3rem minmax(0, 1fr); gap: 8px; }
  .step-n { font-size: 1.15rem; }
  .entry { flex-direction: column; align-items: stretch; }
  .entry-actions { flex-direction: row; justify-content: flex-end; }
  .top { align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    const t = String(s == null ? "" : s).trim();
    const m = t.match(/^["“'‘]([\s\S]*)["”'’]$/);
    return m ? m[1].trim() : t;
  }
  function toScore(v) {
    if (typeof v === "number") return v < 0 ? -1 : 0;
    return /[-−–]\s*1/.test(String(v)) ? -1 : 0;
  }
  function normEvent(o) {
    if (!o || typeof o !== "object" || Array.isArray(o)) return [];
    const t = String(o.t || o.type || "").trim();
    const n = Number(o.n) === 2 ? 2 : 1;
    switch (t) {
      case "idea": case "overlook": case "challenge": case "plan": case "voice": {
        const text = cleanQuote(o.text);
        return text ? [{ t, text }] : [];
      }
      case "react": case "pathReact": case "care": case "sadness": {
        const em = findEmotion(o.emotion);
        if (!em) return [{ t: "offlist", name: cleanQuote(o.emotion) }];
        const e = { t, emotion: em.name, says: cleanQuote(o.says) };
        if (t !== "sadness") e.score = toScore(o.score);
        if (t === "pathReact") { e.n = n; e.isNew = o.new === true || o.new === "true" || o.isNew === true; }
        if (t === "care") e.add = cleanQuote(o.add);
        return [e];
      }
      case "path": {
        const out = [{ t, n, idea: cleanQuote(o.idea || o.text) }];
        const list = Array.isArray(o.reacts) ? o.reacts : Array.isArray(o.reactions) ? o.reactions : [];
        for (const x of list) out.push(...normEvent(Object.assign({}, x, { t: "pathReact", n })));
        return out;
      }
      case "choose":
        return [{ t, n, why: cleanQuote(o.why || o.text) }];
      default:
        return [];
    }
  }
  function parseEvents(text) {
    const events = [], offList = [];
    for (const o of scanObjects(String(text || ""))) {
      for (const e of normEvent(o)) {
        if (e.t === "offlist") { if (e.name && !offList.includes(e.name)) offList.push(e.name); }
        else events.push(e);
      }
    }
    return { events, offList };
  }

  // ---------- Reading a round: who is suffering, who was soothed ----------

  function upsert(list, e) {
    const i = list.findIndex(x => x.emotion === e.emotion);
    if (i >= 0) list[i] = e; else list.push(e);
  }
  function analyze(events, done) {
    const a = { idea: "", reacts: [], overlook: "", challenges: [], paths: {}, chosen: null, sadness: null, care: [], plan: "", voice: "", last: null };
    const path = n => (a.paths[n] = a.paths[n] || { n, idea: "", reacts: [] });
    for (const e of events) {
      if (e.emotion) a.last = e;
      switch (e.t) {
        case "idea": a.idea = e.text; break;
        case "react": upsert(a.reacts, e); break;
        case "overlook": a.overlook = e.text; break;
        case "challenge": a.challenges.push(e.text); break;
        case "path": path(e.n).idea = e.idea; break;
        case "pathReact": upsert(path(e.n).reacts, e); break;
        case "choose": a.chosen = e; break;
        case "sadness": a.sadness = e; break;
        case "care": upsert(a.care, e); break;
        case "plan": a.plan = e.text; break;
        case "voice": a.voice = e.text; break;
      }
    }
    // The council's state: Step 2, then the chosen pathway, then Step 6. Anyone left out of a later step keeps their earlier score.
    const seats = new Map();
    const touch = (name, score) => {
      const s = seats.get(name) || { score: 0, ever: false };
      s.score = score;
      if (score < 0) s.ever = true;
      seats.set(name, s);
    };
    a.reacts.forEach(r => touch(r.emotion, r.score));
    const chosenPath = a.chosen ? a.paths[a.chosen.n] : null;
    if (chosenPath) chosenPath.reacts.forEach(r => touch(r.emotion, r.score));
    a.care.forEach(c => touch(c.emotion, c.score));
    // Sadness suffers (-1) when the emotion it named is not brought to 0.
    if (a.sadness && (done || a.plan)) {
      const pick = seats.get(a.sadness.emotion);
      touch("Sadness", pick && pick.score < 0 ? -1 : 0);
    }
    a.seats = seats;
    a.initial = a.reacts.filter(r => r.score < 0).length;
    a.final = [...seats.values()].filter(s => s.score < 0).length;
    a.before = name => {
      const p = chosenPath && chosenPath.reacts.find(r => r.emotion === name);
      if (p) return p.score;
      const r = a.reacts.find(x => x.emotion === name);
      return r ? r.score : -1;
    };
    return a;
  }

  // ---------- State ----------

  const KEY = "teffy.thread.v1";
  function loadRounds() {
    const data = store.get(KEY, null);
    const rounds = data && Array.isArray(data.rounds)
      ? data.rounds.filter(r => r && typeof r.input === "string" && Array.isArray(r.events) && typeof r.id === "string")
      : [];
    rounds.forEach(r => {
      if (r.status === "streaming") { r.status = "stopped"; r.error = "reloaded"; }
    });
    return rounds;
  }
  // Which Claude answers. Haiku at low effort is the lightest option; modelTier is the fallback if that model can't answer for this viewer.
  const ENGINES = {
    "haiku-low": { label: "Haiku · low effort", model: "claude-haiku-5-5", modelTier: "quick", effort: "low" },
    "haiku-medium": { label: "Haiku · medium effort", model: "claude-haiku-5-5", modelTier: "quick", effort: "medium" },
    "opus-low": { label: "Opus · low effort", model: "claude-opus-5-5", modelTier: "complex", effort: "low" },
    "opus-medium": { label: "Opus · medium effort", model: "claude-opus-5-5", modelTier: "complex", effort: "medium" },
    "manual": { label: "Copy and paste" },
  };
  const DEFAULT_ENGINE = "haiku-low";
  const savedEngine = store.get("teffy.engine.v2", DEFAULT_ENGINE);
  const state = {
    rounds: loadRounds(),
    showingExample: false,
    mode: "reevaluate",
    engine: Object.prototype.hasOwnProperty.call(ENGINES, savedEngine) ? savedEngine : DEFAULT_ENGINE,
    selected: null,
    busy: false,
    ctl: null,
    startedAt: 0,
    sample: undefined,      // undefined while connecting; null when Claude can't answer here; otherwise the sample function
    blocked: "",            // an error code that turned Claude off for this view
    confirmNew: false,
  };
  state.showingExample = state.rounds.length === 0 && !store.get("teffy.hideExample", false);

  const claudeAvailable = () => typeof state.sample === "function" && !state.blocked;
  const isManual = () => state.engine === "manual" || state.sample === null || !!state.blocked;
  const visibleRounds = () => (state.showingExample ? [EXAMPLE] : state.rounds);
  const latestRound = () => { const v = visibleRounds(); return v[v.length - 1] || null; };
  const awaitingPaste = () => state.rounds.some(r => r.status === "paste");

  function save() {
    store.set(KEY, { rounds: state.rounds });
  }

  // Connect to Claude through the viewer's own account. Resolves null outside claude.ai.
  const samplePromise = (async () => {
    try {
      if (window.claude && typeof window.claude.use === "function") return await window.claude.use("sample");
    } catch { /* treated as unavailable */ }
    return null;
  })();
  samplePromise.then(fn => {
    state.sample = typeof fn === "function" ? fn : null;
    renderComposer();
    renderNotice();
  });

  // ---------- Building what Claude reads ----------

  function carriedForward() {
    const last = [...state.rounds].reverse().find(r => r.status === "done");
    if (!last) return [];
    const a = analyze(last.events, true);
    return [...a.seats].filter(([, s]) => s.ever || s.score < 0).map(([name, s]) => ({ name, score: s.score }));
  }
  function userTurn(r) {
    const lines = [`MODE: ${MODE_TAG[r.mode] || MODE_TAG.reevaluate}`];
    if (r.carried && r.carried.length) {
      lines.push("CARRIED FORWARD from the last round (each must appear in Step 2 with an honest current score): " +
        r.carried.map(c => `${c.name} (${c.score < 0 ? "still -1" : "was -1, ended at 0"})`).join(", "));
    }
    lines.push("", "USER:", r.input, "", MODE_ASK[r.mode] || MODE_ASK.reevaluate, "Reply in JSON Lines only.");
    return lines.join("\n");
  }
  function priorRounds(round) {
    return state.rounds.filter(r => r !== round && r.status === "done" && r.raw).slice(-HISTORY);
  }
  function buildTurns(round) {
    const turns = [{ role: "user", content: FRAMEWORK_PROMPT }];
    for (const r of priorRounds(round)) {
      turns.push({ role: "user", content: userTurn(r) }, { role: "assistant", content: r.raw });
    }
    turns.push({ role: "user", content: userTurn(round) });
    return turns;
  }
  function manualPrompt(round) {
    const parts = [FRAMEWORK_PROMPT];
    priorRounds(round).forEach((r, i) => {
      parts.push(`=== EARLIER ROUND ${i + 1} ===\n${userTurn(r)}\n\nYOUR REPLY THEN:\n${r.raw}`);
    });
    parts.push(`=== NOW ===\n${userTurn(round)}`);
    return parts.join("\n\n");
  }

  // ---------- Talking to the council ----------

  const ERR = {
    not_granted: "Claude wasn't allowed for this page, so Teffy switched to copy and paste. Reload the page to be asked again.",
    sampling_disabled: "Claude isn't available on this account, so Teffy switched to copy and paste.",
    not_declared: "This page can't reach Claude right now, so Teffy switched to copy and paste.",
    capability_disabled: "This page can't reach Claude right now, so Teffy switched to copy and paste.",
    capability_removed: "This Claude app is too old to answer here, so Teffy switched to copy and paste.",
    rate_limited: "You've reached a Claude usage limit for now. Wait a bit, then send again.",
    session_expired: "Your Claude sign-in expired. Sign in again, then send again.",
    refused: "Claude declined to answer this one. Try putting the thought another way.",
    empty_completion: "The council came back empty. Send again, maybe with fewer details at once.",
    prompt_too_large: "This conversation got too long for one message. Start a new thought to keep going.",
    unreadable: "Teffy couldn't find the council's lines in that reply. Paste the whole reply: it should be lines that start with {\"t\":",
    reloaded: "The page reloaded before the council finished.",
    upstream_error: "The connection dropped partway. Anything that arrived is kept. Send again to retry.",
  };
  const OFF_CODES = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

  async function send(text, modeOverride) {
    text = String(text || "").trim();
    if (!text || state.busy || awaitingPaste()) return;
    state.showingExample = false;
    const mode = modeOverride || (state.rounds.length ? state.mode : "evaluate");
    const round = { id: uid(), mode, input: text, raw: "", events: [], status: "streaming", carried: carriedForward() };
    state.rounds.push(round);
    input.value = "";
    store.set("teffy.draft", "");

    if (isManual()) {
      startPaste(round);
      return;
    }

    state.busy = true;
    state.startedAt = Date.now();
    save();
    renderAll();
    scrollToRound(round);
    startTicker();

    const sample = state.sample === undefined ? await samplePromise : state.sample;
    if (typeof sample !== "function" || state.blocked) {
      state.busy = false;
      stopTicker();
      startPaste(round);
      return;
    }

    const ctl = new AbortController();
    state.ctl = ctl;
    const engineKey = state.engine === "manual" ? DEFAULT_ENGINE : state.engine;
    const engine = ENGINES[engineKey];
    round.engine = engineKey;
    try {
      const res = await sample(buildTurns(round), {
        cache: false,
        signal: ctl.signal,
        model: engine.model,
        modelTier: engine.modelTier,
        effort: engine.effort,
        onText: ({ text }) => {
          round.raw = text;
          round.events = parseEvents(text).events;
          scheduleLive(round);
        },
      });
      const parsed = parseEvents(res.text);
      round.raw = res.text;
      round.events = parsed.events;
      round.offList = parsed.offList;
      round.truncated = !!res.truncated;
      round.fellBack = res.modelApplied !== engine.model ? (res.modelTierApplied || engine.modelTier) : "";
      if (parsed.events.length) { round.status = "done"; round.error = null; }
      else { round.status = "error"; round.error = "unreadable"; }
    } catch (e) {
      const code = e && typeof e.code === "string" ? e.code : "upstream_error";
      if (code === "refused") { round.raw = ""; round.events = []; }
      else if (e && typeof e.text === "string" && e.text) {
        const parsed = parseEvents(e.text);
        round.raw = e.text;
        round.events = parsed.events;
        round.offList = parsed.offList;
      }
      round.status = code === "cancelled" ? "stopped" : "error";
      round.error = code;
      if (OFF_CODES.has(code)) state.blocked = code;
    } finally {
      state.busy = false;
      state.ctl = null;
      stopTicker();
      save();
      renderAll();
      if (round.status === "done") {
        const a = analyze(round.events, true);
        announce(`The council finished. Suffering voices went from ${a.initial} to ${a.final}.`);
      } else if (round.status === "error") {
        announce(ERR[round.error] || ERR.upstream_error);
      }
    }
  }

  function startPaste(round) {
    round.status = "paste";
    round.clip = "";
    // The copy runs inside the click that sent the message, so the browser allows it.
    copyText(manualPrompt(round)).then(ok => {
      round.clip = ok ? "ok" : "failed";
      rerenderRound(round);
    });
    save();
    renderAll();
    scrollToRound(round);
  }
  function readPaste(round, text) {
    const parsed = parseEvents(text);
    if (!parsed.events.length) {
      round.error = "unreadable";
      rerenderRound(round);
      return;
    }
    round.raw = String(text).trim();
    round.events = parsed.events;
    round.offList = parsed.offList;
    round.status = "done";
    round.error = null;
    delete round.pasteDraft;
    delete round.clip;
    save();
    renderAll();
    const a = analyze(round.events, true);
    announce(`The council finished. Suffering voices went from ${a.initial} to ${a.final}.`);
  }
  function discardRound(round) {
    const i = state.rounds.indexOf(round);
    if (i >= 0) state.rounds.splice(i, 1);
    if (!input.value.trim()) input.value = round.input;
    save();
    renderAll();
    input.focus();
  }
  function retry(round) {
    const i = state.rounds.indexOf(round);
    if (i >= 0) state.rounds.splice(i, 1);
    send(round.input, round.mode);
  }

  // ---------- Rendering: the log ----------

  function pill(score) {
    return h("span", { class: "pill " + (score < 0 ? "neg" : "zero"), title: score < 0 ? "Suffering" : "Neutral or agreeable" }, score < 0 ? "−1" : "0");
  }
  function voiceRow(e) {
    const em = emo(e.emotion);
    return h("li", { class: "voice" },
      h("span", { class: "v-emoji", "aria-hidden": "true" }, em.emoji),
      h("div", { class: "v-body" },
        h("span", { class: "v-name" }, em.name, e.isNew ? h("span", { class: "tag-new" }, "new") : null),
        e.says ? h("q", { class: "v-says" }, e.says) : null),
      pill(e.score));
  }
  function voiceList(list) {
    return h("ul", { class: "voices" }, list.map(voiceRow));
  }
  function careRow(c, a) {
    const em = emo(c.emotion);
    const before = a.before(c.emotion);
    return h("li", { class: "voice" },
      h("span", { class: "v-emoji", "aria-hidden": "true" }, em.emoji),
      h("div", { class: "v-body" },
        h("span", { class: "v-name" }, em.name),
        c.add ? h("span", { class: "v-add" }, h("b", null, "Add"), c.add) : null,
        c.says ? h("q", { class: "v-says" }, c.says) : null),
      before < 0 && c.score === 0
        ? h("span", { class: "shift", "aria-label": "from minus one to zero" }, pill(-1), "→", pill(0))
        : pill(c.score));
  }
  function step(n, title, ...body) {
    return h("section", { class: "step" },
      h("div", { class: "step-n", "aria-hidden": "true" }, String(n)),
      h("div", { class: "step-body" },
        h("h3", { class: "step-title" }, h("span", { class: "sr" }, `Step ${n}: `), title),
        ...body));
  }
  function pathCard(p, chosen) {
    const isChosen = !!(chosen && chosen.n === p.n);
    return h("div", { class: "path" + (isChosen ? " chosen" : "") },
      h("div", { class: "path-head" },
        h("span", { class: "path-n" }, `Pathway ${p.n}`),
        isChosen ? h("span", { class: "chip" }, "Chosen") : null),
      h("p", { class: "path-idea" }, p.idea || "…"),
      p.reacts.length ? voiceList(p.reacts) : null);
  }
  function sadnessRow(a) {
    const s = a.sadness;
    const em = emo(s.emotion);
    const own = a.seats.get("Sadness");
    return h("div", { class: "sadness" },
      h("span", { class: "v-emoji", "aria-hidden": "true" }, "❤️"),
      h("div", { class: "v-body" },
        h("span", { class: "v-name" }, `Sadness names ${em.name} ${em.emoji}`),
        s.says ? h("q", { class: "v-says" }, s.says) : null),
      own ? pill(own.score) : null);
  }
  function seconds() {
    return Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
  }

  function renderRound(r, idx) {
    const done = r.status !== "streaming";
    const a = analyze(r.events, done);
    const art = h("article", { class: "round", id: "round-" + r.id, "aria-busy": r.status === "streaming" ? "true" : null });

    const statusChip =
      r.status === "streaming" ? h("span", { class: "chip" }, h("span", { class: "dots" }, "Council is meeting")) :
      r.status === "paste" ? h("span", { class: "chip" }, "Waiting for the reply") :
      r.status === "stopped" ? h("span", { class: "chip plain" }, "Stopped") :
      r.status === "error" ? h("span", { class: "chip warn" }, "Interrupted") : null;
    const copyBtn = r.events.length && done
      ? h("button", {
          type: "button", class: "btn btn-quiet btn-small",
          onclick: ev => {
            const btn = ev.currentTarget;
            copyText(roundToText(r)).then(ok => {
              btn.textContent = ok ? "Copied" : "Couldn't copy";
              setTimeout(() => { btn.textContent = "Copy"; }, 1600);
            });
          },
        }, "Copy")
      : null;
    const answeredBy = r.example ? null : r.engine && ENGINES[r.engine] ? ENGINES[r.engine].label : r.raw ? "Pasted reply" : null;
    art.append(h("div", { class: "round-head" },
      h("h2", { class: "round-title" }, r.example ? "Example round" : `Round ${idx + 1}`),
      h("span", { class: "chip plain" }, r.example ? "From the framework" : MODE_LABEL[r.mode] || "Round"),
      answeredBy ? h("span", { class: "chip plain", title: "Who answered this round" }, answeredBy) : null,
      statusChip,
      h("span", { class: "spacer" }),
      copyBtn));
    if (r.example) {
      art.append(h("p", { class: "example-note" }, "This is the disc golf example from the framework, so you can see how a round works. Send your own thought below to start."));
    }

    art.append(h("div", { class: "you" }, h("span", { class: "who" }, "You"), h("p", null, r.input)));

    const steps = h("div", { class: "steps" });
    if (a.idea) steps.append(step(1, "The idea", h("p", { class: "idea" }, a.idea)));
    if (a.reacts.length) steps.append(step(2, "Emotional reactions", voiceList(a.reacts)));
    if (a.overlook) steps.append(step(3, "What I'm tempted to overlook", h("p", null, a.overlook)));
    if (a.challenges.length) steps.append(step(4, "Imagining the challenges", h("ul", { class: "challenges" }, a.challenges.map(c => h("li", null, c)))));
    const paths = [1, 2].map(n => a.paths[n]).filter(Boolean);
    if (paths.length) {
      steps.append(step(5, "Two pathways",
        h("div", { class: "paths" }, paths.map(p => pathCard(p, a.chosen))),
        a.chosen && a.chosen.why ? h("p", { class: "choose" }, h("strong", null, `Taking pathway ${a.chosen.n}. `), a.chosen.why) : null));
    }
    if (a.sadness || a.care.length) {
      steps.append(step(6, "Meeting the needs",
        a.sadness ? sadnessRow(a) : null,
        a.care.length ? h("ul", { class: "voices" }, a.care.map(c => careRow(c, a))) : null));
    }
    if (a.plan) steps.append(step(7, "The updated plan", h("p", { class: "plan" }, a.plan)));
    if (steps.childElementCount) art.append(steps);

    if (a.voice) {
      art.append(h("div", { class: "consc" },
        h("span", { class: "consc-face", "aria-hidden": "true" }, "🧠"),
        h("div", null, h("span", { class: "who" }, "Consciousness"), h("p", null, a.voice))));
    }

    const foot = h("div", { class: "round-foot" });
    if (r.status === "streaming") {
      foot.append(h("p", { class: "writing" },
        r.events.length ? "The council is still talking" : "Listening to the council",
        h("span", { class: "dots" }), " ",
        h("span", { class: "elapsed" }, seconds() + "s")));
    }
    if (r.status === "paste") foot.append(pasteBlock(r));
    if (done && r.status !== "paste" && a.reacts.length) {
      foot.append(h("p", { class: "tally-line" }, "Suffering voices ", h("b", null, String(a.initial)), " → ", h("b", null, String(a.final))));
    }
    if (r.offList && r.offList.length) {
      foot.append(h("p", { class: "note" }, `Left out ${r.offList.join(", ")}: not on the master list of 16 emotions.`));
    }
    if (r.truncated) foot.append(h("p", { class: "note" }, "The answer hit the length limit and was cut short."));
    if (r.fellBack && r.engine && ENGINES[r.engine]) {
      foot.append(h("p", { class: "note" }, `Claude didn't confirm that ${ENGINES[r.engine].label.split(" ·")[0]} answered this round, so its ${TIER_NAME[r.fellBack] || r.fellBack} setting may have stood in.`));
    }
    if (r.status === "error" || r.status === "stopped") {
      const msg = r.status === "stopped" && r.error === "cancelled" ? "You stopped this round." : ERR[r.error] || ERR.upstream_error;
      foot.append(h("p", { class: r.status === "error" ? "err" : "note" }, msg));
      if (!r.example) {
        foot.append(h("div", { class: "row" },
          h("button", { type: "button", class: "btn btn-small", disabled: state.busy || awaitingPaste() ? true : null, onclick: () => retry(r) }, "Send again"),
          h("button", { type: "button", class: "btn btn-quiet btn-small", disabled: state.busy ? true : null, onclick: () => discardRound(r) }, "Remove")));
      }
    }
    if (foot.childElementCount) art.append(foot);
    return art;
  }
  const TIER_NAME = { quick: "quick", default: "everyday", complex: "most capable" };

  function pasteBlock(r) {
    const ta = h("textarea", { id: "paste-" + r.id, class: "paste", rows: "5", placeholder: "Paste the chatbot's whole reply here", "aria-label": "The chatbot's reply" });
    ta.value = r.pasteDraft || "";
    ta.addEventListener("input", () => { r.pasteDraft = ta.value; });
    const parts = [];
    if (r.clip === "failed") {
      const out = h("textarea", { class: "prompt-out", readonly: true, rows: "6", "aria-label": "Prompt to copy" });
      out.value = manualPrompt(r);
      parts.push(
        h("p", null, h("b", null, "1. "), "Copy this prompt into Claude, ChatGPT or any chatbot."),
        out,
        h("div", { class: "row" }, h("button", { type: "button", class: "btn btn-small", onclick: () => { out.focus(); out.select(); } }, "Select the prompt")));
    } else {
      parts.push(h("p", null, h("b", null, "1. "),
        r.clip === "ok" ? "The prompt is copied. Paste it into Claude, ChatGPT or any chatbot." : "Copying the prompt…"));
    }
    parts.push(h("p", null, h("b", null, "2. "), "Paste the chatbot's reply here, then show the council."), ta);
    if (r.error === "unreadable") parts.push(h("p", { class: "err" }, ERR.unreadable));
    parts.push(h("div", { class: "row" },
      h("button", { type: "button", class: "btn btn-primary btn-small", onclick: () => readPaste(r, ta.value) }, "Show the council"),
      h("button", {
        type: "button", class: "btn btn-small",
        onclick: () => copyText(manualPrompt(r)).then(ok => { r.clip = ok ? "ok" : "failed"; rerenderRound(r); }),
      }, "Copy the prompt again"),
      h("button", { type: "button", class: "btn btn-quiet btn-small", onclick: () => discardRound(r) }, "Cancel")));
    return h("div", { class: "paste-box" }, parts);
  }

  function roundToText(r) {
    const a = analyze(r.events, true);
    const L = [`You: ${r.input}`, ""];
    const v = (e, extra) => `${emo(e.emotion).emoji} ${e.emotion}: "${e.says}" (${e.score < 0 ? "-1" : "0"})${extra || ""}`;
    if (a.idea) L.push("🧠 Step 1: The idea", a.idea, "");
    if (a.reacts.length) { L.push("Step 2: Emotional reactions", ""); a.reacts.forEach(e => L.push(v(e), "")); }
    if (a.overlook) L.push("Step 3: What I'm tempted to overlook", a.overlook, "");
    if (a.challenges.length) L.push("Step 4: Imagining the challenges", ...a.challenges.map(c => `- ${c}`), "");
    [1, 2].map(n => a.paths[n]).filter(Boolean).forEach(p => {
      L.push(`Step 5, pathway ${p.n}${a.chosen && a.chosen.n === p.n ? " (chosen)" : ""}: ${p.idea}`, "");
      p.reacts.forEach(e => L.push(v(e, e.isNew ? " (new)" : ""), ""));
    });
    if (a.sadness || a.care.length) {
      L.push("Step 6: Meeting the needs", "");
      if (a.sadness) L.push(`❤️ Sadness names ${a.sadness.emotion}: "${a.sadness.says}"`, "");
      a.care.forEach(c => L.push(`${emo(c.emotion).emoji} ${c.emotion}. Add: ${c.add}`, `"${c.says}" (${c.score < 0 ? "-1" : "0"})`, ""));
    }
    if (a.plan) L.push("Step 7: The updated plan", a.plan, "");
    if (a.voice) L.push(`🧠 ${a.voice}`, "");
    L.push(`Suffering voices: ${a.initial} → ${a.final}`);
    return L.join("\n");
  }

  function renderRounds() {
    const box = $("#rounds");
    const list = visibleRounds();
    if (!list.length) {
      box.replaceChildren(h("div", { class: "empty" },
        h("h2", null, "What's on your mind?"),
        h("p", null, "Type a thought you're weighing, like \"I want to go disc golf this morning, but…\". Mention any emotion that's already speaking up. The council takes it from there."),
        h("button", { type: "button", class: "btn btn-small", onclick: () => { state.showingExample = true; store.set("teffy.hideExample", false); renderAll(); } }, "Show the example round")));
      return;
    }
    box.replaceChildren(...list.map((r, i) => renderRound(r, i)));
  }
  function rerenderRound(r) {
    const node = document.getElementById("round-" + r.id);
    const idx = visibleRounds().indexOf(r);
    if (!node || idx < 0) return;
    // Keep a half-typed paste and its focus across the redraw.
    const focusedPaste = document.activeElement && document.activeElement.id === "paste-" + r.id;
    node.replaceWith(renderRound(r, idx));
    if (focusedPaste) { const ta = document.getElementById("paste-" + r.id); if (ta) ta.focus(); }
  }
  let liveFrame = 0, liveRound = null;
  function scheduleLive(r) {
    liveRound = r;
    if (liveFrame) return;
    liveFrame = requestAnimationFrame(() => {
      liveFrame = 0;
      if (liveRound) { rerenderRound(liveRound); renderCouncil(); }
    });
  }
  function scrollToRound(r) {
    requestAnimationFrame(() => {
      const node = document.getElementById("round-" + r.id);
      if (node) node.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    });
  }

  // ---------- Rendering: the council chamber ----------

  const ring = $("#ring");
  const core = $("#core");
  const STATE_LABEL = { quiet: "quiet", suffer: "suffering, minus one", calm: "at peace, zero", soothed: "soothed this round, zero" };
  const seatEls = EMOTIONS.map((em, i) => {
    const angle = (-90 + i * (360 / EMOTIONS.length)) * Math.PI / 180;
    const x = 50 + 41 * Math.cos(angle);
    const y = 50 + 41 * Math.sin(angle);
    const btn = h("button", {
      type: "button", class: "seat", "data-name": em.name, "data-state": "quiet", "aria-pressed": "false",
      style: `--x:${x.toFixed(2)}%;--y:${y.toFixed(2)}%`,
      onclick: () => { state.selected = state.selected === em.name ? null : em.name; renderCouncil(); },
    },
      h("span", { class: "seat-emoji", "aria-hidden": "true" }, em.emoji),
      h("span", { class: "seat-score", "aria-hidden": "true" }),
      h("span", { class: "seat-pick", "aria-hidden": "true" }, "♥"));
    ring.append(btn);
    return btn;
  });

  function renderCouncil() {
    const r = latestRound();
    const done = r ? r.status !== "streaming" : true;
    const a = r ? analyze(r.events, done) : null;
    const live = !!(r && r.status === "streaming");

    for (const btn of seatEls) {
      const name = btn.dataset.name;
      const s = a ? a.seats.get(name) : null;
      const st = !s ? "quiet" : s.score < 0 ? "suffer" : s.ever ? "soothed" : "calm";
      btn.dataset.state = st;
      btn.querySelector(".seat-score").textContent = s ? (s.score < 0 ? "−1" : "0") : "";
      btn.classList.toggle("picked", !!(a && a.sadness && a.sadness.emotion === name));
      btn.classList.toggle("speaking", !!(live && a && a.last && a.last.emotion === name));
      btn.setAttribute("aria-pressed", String(state.selected === name));
      btn.setAttribute("aria-label", `${name}: ${STATE_LABEL[st]}`);
    }
    ring.classList.toggle("thinking", !!(live && r && !r.events.length));

    // The Consciousness in the middle.
    const parts = [h("span", { class: "core-brain", "aria-hidden": "true" }, "🧠")];
    if (!r) {
      parts.push(h("span", { class: "core-label" }, "Consciousness"), h("span", { class: "core-text" }, "Tell me a thought."));
    } else if (live && !r.events.length) {
      parts.push(h("span", { class: "core-label" }, "Listening"), h("span", { class: "core-text" }, h("span", { class: "elapsed" }, seconds() + "s")));
    } else if (live && a.last) {
      const em = emo(a.last.emotion);
      const says = a.last.t === "sadness" ? `${a.last.emotion} needs us most.` : a.last.says;
      parts.push(h("span", { class: "core-label" }, `${em.emoji} ${em.name}`), h("span", { class: "core-text" }, says || ""));
    } else if (live) {
      parts.push(h("span", { class: "core-label" }, "Consciousness"), h("span", { class: "core-text" }, a.idea || "Thinking it over"));
    } else if (r.status === "paste") {
      parts.push(h("span", { class: "core-label" }, "Waiting"), h("span", { class: "core-text" }, "Paste the chatbot's reply."));
    } else if (a.reacts.length) {
      parts.push(
        h("span", { class: "core-label" }, "Suffering voices"),
        h("span", { class: "core-big" },
          h("span", { class: a.initial ? "neg" : "zero" }, String(a.initial)), " → ",
          h("span", { class: a.final ? "neg" : "zero" }, String(a.final))));
    } else {
      parts.push(h("span", { class: "core-label" }, "Consciousness"), h("span", { class: "core-text" }, r.status === "error" ? "The council was interrupted." : "Tell me a thought."));
    }
    core.replaceChildren(...parts);

    // Who is still suffering, who was soothed.
    const tally = $("#tally");
    if (a && a.seats.size) {
      const list = pred => [...a.seats].filter(([, s]) => pred(s)).map(([n]) => `${emo(n).emoji} ${n}`);
      const suffering = list(s => s.score < 0);
      const soothed = list(s => s.score === 0 && s.ever);
      tally.replaceChildren(
        h("p", null, h("span", { class: "k" }, live ? "Suffering now" : "Still suffering"), suffering.length ? suffering.join(", ") : "No one"),
        soothed.length ? h("p", null, h("span", { class: "k" }, "Soothed"), soothed.join(", ")) : null);
    } else {
      tally.replaceChildren(h("p", { class: "muted" }, "Every emotion is quiet until a thought is on the table."));
    }
    renderProfile(a);
  }

  function renderProfile(a) {
    const panel = $("#profile");
    const em = state.selected ? findEmotion(state.selected) : null;
    if (!em) {
      panel.replaceChildren(h("p", { class: "muted" }, "Tap a seat to meet that emotion and let it speak."));
      return;
    }
    const s = a ? a.seats.get(em.name) : null;
    panel.replaceChildren(
      h("div", { class: "pf-head" },
        h("span", { class: "pf-emoji", "aria-hidden": "true" }, em.emoji),
        h("div", null,
          h("h2", { class: "pf-name" }, em.name, " ", s ? pill(s.score) : null),
          h("p", { class: "pf-line" }, h("q", null, em.line), " ", h("span", { class: "muted" }, `(${em.when})`)))),
      h("dl", { class: "pf" },
        h("div", null, h("dt", null, "Purpose"), h("dd", null, em.purpose)),
        h("div", null, h("dt", null, "To satisfy its need"), h("dd", null, em.need)),
        em.personality ? h("div", null, h("dt", null, "Personality"), h("dd", null, em.personality)) : null),
      h("div", { class: "pf-actions" },
        h("button", { type: "button", class: "btn btn-primary btn-small", onclick: () => speakAs(em.name) }, `Speak as ${em.name}`),
        h("button", { type: "button", class: "btn btn-small", onclick: () => { state.selected = null; renderCouncil(); } }, "Close")));
  }

  // ---------- Rendering: composer and notice ----------

  const form = $("#composer");
  const input = $("#input");
  const sendBtn = $("#sendBtn");
  const stopBtn = $("#stopBtn");
  const engineSel = $("#engine");
  const newBtn = $("#newBtn");
  const modeBtns = [...document.querySelectorAll(".mode")];
  const PLACEHOLDER = {
    evaluate: "I want to go disc golf this morning, but…",
    reevaluate: "My doubt says… what if my friend thinks I don't want to go?",
    talk: "Talk to your Consciousness…",
  };
  const HINT = {
    evaluate: "Say what you want to do and any emotion that's already speaking up.",
    reevaluate: "Add an objection from any emotion, a clarification, or a disagreement. The whole template runs again.",
    talk: "The template runs again, and your Consciousness answers you in the emotions' own language.",
  };

  const addVoice = $("#addVoice");
  EMOTIONS.forEach(em => {
    addVoice.append(h("button", { type: "button", onclick: () => speakAs(em.name) }, `${em.emoji} ${em.name}`));
  });

  function speakAs(name) {
    const phrase = `My ${name.toLowerCase()} says: `;
    const v = input.value;
    const start = typeof input.selectionStart === "number" ? input.selectionStart : v.length;
    const end = typeof input.selectionEnd === "number" ? input.selectionEnd : v.length;
    const before = v.slice(0, start);
    const glue = before && !/\s$/.test(before) ? " " : "";
    input.value = before + glue + phrase + v.slice(end);
    const caret = (before + glue + phrase).length;
    input.focus();
    try { input.setSelectionRange(caret, caret); } catch { /* not focusable yet */ }
    if (state.rounds.length && state.mode !== "talk") state.mode = "reevaluate";
    store.set("teffy.draft", input.value);
    renderComposer();
  }

  function renderComposer() {
    const hasThread = state.rounds.length > 0;
    const mode = hasThread ? state.mode : "evaluate";
    $("#modes").hidden = !hasThread;
    modeBtns.forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
    input.placeholder = PLACEHOLDER[mode];
    const manual = isManual();
    sendBtn.textContent = manual ? "Copy prompt" : !hasThread ? "Ask the council" : mode === "talk" ? "Send" : "Reevaluate";
    sendBtn.disabled = state.busy || awaitingPaste();
    stopBtn.hidden = !state.busy;
    let hint = HINT[mode];
    if (awaitingPaste()) hint = "Paste the chatbot's reply into the round above, or cancel it, before sending again.";
    else if (manual) hint += " Send copies a prompt you paste into any chatbot.";
    else if (!hasThread && claudeAvailable()) hint += " It runs on your Claude account; the first time, Claude asks you to allow this page.";
    $("#hint").textContent = hint + " Ctrl or ⌘ + Enter sends.";

    const claudeOff = state.sample === null || !!state.blocked;
    [...engineSel.options].forEach(o => { o.disabled = o.value !== "manual" && claudeOff; });
    engineSel.value = claudeOff ? "manual" : state.engine;

    newBtn.disabled = state.busy;
    newBtn.textContent = state.confirmNew ? "Tap again to clear" : "New thought";
  }

  function renderNotice() {
    const n = $("#notice");
    let msg = null;
    if (state.blocked) {
      msg = [h("b", null, "Copy-and-paste mode. "), ERR[state.blocked] || ERR.capability_disabled];
    } else if (state.sample === null) {
      msg = [h("b", null, "Copy-and-paste mode. "),
        "Claude can't answer from this copy of the page, so Send copies a prompt you can paste into any chatbot (Claude, ChatGPT…), and you paste its reply back here. Open Teffy on claude.ai to have the council answer on your own Claude account."];
    }
    n.hidden = !msg;
    n.replaceChildren(...(msg || []));
  }

  function renderAll() {
    renderRounds();
    renderCouncil();
    renderComposer();
    renderNotice();
  }

  function announce(text) {
    const el = $("#announce");
    el.textContent = "";
    setTimeout(() => { el.textContent = text; }, 50);
  }

  let ticker = 0;
  function startTicker() {
    stopTicker();
    ticker = setInterval(() => {
      document.querySelectorAll(".elapsed").forEach(el => { el.textContent = seconds() + "s"; });
    }, 1000);
  }
  function stopTicker() {
    if (ticker) clearInterval(ticker);
    ticker = 0;
  }

  // ---------- Events ----------

  form.addEventListener("submit", ev => { ev.preventDefault(); send(input.value); });
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); send(input.value); }
  });
  let draftTimer = 0;
  input.addEventListener("input", () => {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => store.set("teffy.draft", input.value), 300);
  });
  stopBtn.addEventListener("click", () => { if (state.ctl) state.ctl.abort(); });
  modeBtns.forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; renderComposer(); }));
  engineSel.addEventListener("change", () => {
    state.engine = Object.prototype.hasOwnProperty.call(ENGINES, engineSel.value) ? engineSel.value : DEFAULT_ENGINE;
    store.set("teffy.engine.v2", state.engine);
    renderComposer();
  });
  let confirmTimer = 0;
  newBtn.addEventListener("click", () => {
    if (state.busy) return;
    if (!state.rounds.length) {
      state.showingExample = false;
      store.set("teffy.hideExample", true);
      renderAll();
      input.focus();
      return;
    }
    if (!state.confirmNew) {
      state.confirmNew = true;
      renderComposer();
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(() => { state.confirmNew = false; renderComposer(); }, 4000);
      return;
    }
    clearTimeout(confirmTimer);
    state.confirmNew = false;
    state.rounds = [];
    state.mode = "reevaluate";
    state.showingExample = false;
    store.set("teffy.hideExample", true);
    save();
    renderAll();
    input.focus();
  });

  // ---------- Start ----------

  input.value = store.get("teffy.draft", "") || "";
  renderAll();
})();
</script>
