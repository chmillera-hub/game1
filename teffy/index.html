<title>Teffy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a one-screen phone chat. Top bar, the council strip, the conversation, the composer.
   On wide screens the council ring (16 seats around the Consciousness) sits beside the conversation. */
:root {
  --bg: #eef1f6;
  --surface: #fafbfd;
  --sunken: #e2e7f0;
  --ink: #161b26;
  --muted: #555e72;
  --line: #d3d9e4;
  --accent: #2d4f8e;
  --accent-soft: #dce4f3;
  --on-accent: #ffffff;
  --suffer: #a52e1b;
  --suffer-soft: #f8e1db;
  --calm: #20633f;
  --calm-soft: #d9eee2;
  --heart: #b8305f;
  --scrim: rgba(22, 27, 38, 0.42);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b;
    --surface: #171c27;
    --sunken: #1e2533;
    --ink: #e6eaf2;
    --muted: #a0aabd;
    --line: #2a3245;
    --accent: #93b2ff;
    --accent-soft: #1f2b47;
    --on-accent: #0f131b;
    --suffer: #ff8069;
    --suffer-soft: #3b1f1a;
    --calm: #72d3a1;
    --calm-soft: #15301f;
    --heart: #ff7aa3;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b;
  --surface: #171c27;
  --sunken: #1e2533;
  --ink: #e6eaf2;
  --muted: #a0aabd;
  --line: #2a3245;
  --accent: #93b2ff;
  --accent-soft: #1f2b47;
  --on-accent: #0f131b;
  --suffer: #ff8069;
  --suffer-soft: #3b1f1a;
  --calm: #72d3a1;
  --calm-soft: #15301f;
  --heart: #ff7aa3;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

.app {
  height: 100%;
  max-width: 1240px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.bar { flex: none; display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.03em; line-height: 1; }
.tabs { display: inline-flex; margin-inline: auto; padding: 3px; border-radius: 999px; background: var(--sunken); }
.tabs button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 0.38rem 0.85rem;
  font-size: 0.88rem;
  font-weight: 700;
  white-space: nowrap;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.icon-btn {
  appearance: none;
  flex: none;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  padding: 0;
}
.icon-btn svg { width: 20px; height: 20px; }

.notice {
  flex: none;
  margin-bottom: 6px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-size: 0.88rem;
}
.notice b { font-weight: 700; }
.notice .row { margin-top: 8px; }

/* Council strip (phones) */
.strip {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  overflow-x: auto;
  padding-block: 4px 8px;
  scrollbar-width: none;
  border-bottom: 1px solid var(--line);
}
.strip::-webkit-scrollbar { display: none; }
.strip-tally {
  flex: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 56px;
  padding-right: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}
.strip-tally b { font-family: var(--f-mono); font-size: 1.05rem; letter-spacing: 0; text-transform: none; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip-hint { align-self: center; color: var(--muted); font-size: 0.85rem; min-height: 56px; display: flex; align-items: center; }
.member {
  appearance: none;
  flex: none;
  width: 58px;
  border: 0;
  background: transparent;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.member-name { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.68rem; color: var(--muted); }

/* Avatars: shared by the strip, the conversation and the profile */
.ava {
  position: relative;
  flex: none;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-size: 20px;
  line-height: 1;
}
[data-state="suffer"] > .ava, .ava[data-state="suffer"] { border-color: var(--suffer); background: var(--suffer-soft); }
[data-state="soothed"] > .ava, .ava[data-state="soothed"] { border-color: var(--calm); background: var(--calm-soft); }
[data-state="calm"] > .ava, .ava[data-state="calm"] { border-color: var(--calm); }
.ava .badge {
  position: absolute;
  right: -6px;
  bottom: -4px;
  padding: 2px 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid currentColor;
  font: 600 9px/1 var(--f-mono);
  font-variant-numeric: tabular-nums;
}
.ava .badge.neg { color: var(--suffer); }
.ava .badge.zero { color: var(--calm); }
.ava .heart { position: absolute; top: -6px; right: -5px; color: var(--heart); font-size: 12px; line-height: 1; }
.member.typing .ava { animation: typingRing 1.2s ease-in-out infinite; }
@keyframes typingRing {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
  50% { box-shadow: 0 0 0 5px var(--accent-soft); }
}

/* Stage: conversation, plus the ring on wide screens */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.chamber { display: none; }
.thread {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: 12px 16px;
}
.thread:focus { outline: none; }

/* Conversation messages */
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; align-items: start; }
.msg > .ava, .msg > button.ava { width: 36px; height: 36px; font-size: 18px; padding: 0; }
.msg-main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.msg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 0.78rem; color: var(--muted); }
.msg-name { font-weight: 700; color: var(--ink); }
.bubble {
  margin: 3px 0 0;
  padding: 0.55rem 0.8rem;
  max-width: min(100%, 31rem);
  border: 1px solid var(--line);
  border-radius: 4px 16px 16px 16px;
  background: var(--surface);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 0.75rem; color: var(--muted); }
.msg-meta .asks { font-style: italic; }
.msg.me { grid-template-columns: minmax(0, 1fr); justify-items: end; }
.msg.me .msg-main { align-items: flex-end; }
.msg.me .bubble { background: var(--accent); border-color: var(--accent); color: var(--on-accent); border-radius: 16px 4px 16px 16px; }
.msg.consc .bubble { background: var(--accent-soft); border-color: transparent; }
.plan-card {
  margin-top: 6px;
  max-width: min(100%, 31rem);
  padding: 0.55rem 0.75rem;
  border: 1px dashed var(--accent);
  border-radius: 12px;
  font-size: 0.92rem;
}
.k { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.plan-card .k { display: block; margin-bottom: 2px; color: var(--accent); }

.pill {
  display: inline-block;
  min-width: 2.4em;
  padding: 0.22rem 0.42rem;
  border-radius: 999px;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.75rem;
  line-height: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.pill.neg { background: var(--suffer-soft); color: var(--suffer); }
.pill.zero { background: var(--calm-soft); color: var(--calm); }
.shift { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

.decide { margin-left: 44px; font-size: 0.8rem; color: var(--muted); }
.decide summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  padding: 2px 0;
}
.decide summary::-webkit-details-marker { display: none; }
.faces { display: inline-flex; gap: 2px; font-size: 0.95rem; }
.faces .hold { opacity: 0.35; filter: grayscale(0.7); }
.decide summary::after { content: "Why"; font-weight: 700; color: var(--accent); }
.decide[open] summary::after { content: "Hide"; }
.decide ul { list-style: none; margin: 6px 0 2px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.decide li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 6px; }
.decide li b { color: var(--ink); }
.decide .hand { font-weight: 700; color: var(--accent); }

.typing-dots { display: inline-flex; gap: 4px; padding: 0.2rem 0; }
.typing-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1.2s ease-in-out infinite; }
.typing-dots i:nth-child(2) { animation-delay: 0.15s; }
.typing-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.activity { display: flex; align-items: center; gap: 8px; margin-left: 44px; font-size: 0.85rem; color: var(--muted); }

.note-line { align-self: center; max-width: 30rem; text-align: center; font-size: 0.8rem; color: var(--muted); }
.note-line.err { color: var(--suffer); }

.final {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1.5px solid var(--calm);
  border-radius: 16px;
  background: var(--surface);
}
.final.hurting { border-color: var(--suffer); }
.final h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
.final p { margin: 0; }
.final-plan { font-size: 1.02rem; }
.final .tally-line { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.final .tally-line b { color: var(--ink); font-weight: 600; }
.final-voices { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.final-voices li { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: 999px; background: var(--sunken); font-size: 0.8rem; }
.closing { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 6px; }

.banner {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--sunken);
  font-size: 0.9rem;
}
.banner b { font-weight: 700; }
.banner .row { margin-top: 8px; }
.empty { margin: auto 0; padding: 24px 4px; display: flex; flex-direction: column; gap: 10px; }
.empty h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; line-height: 1.15; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 32rem; }

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.5rem 0.95rem;
  font-weight: 700;
  line-height: 1.2;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn-small { padding: 0.32rem 0.75rem; font-size: 0.85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 7-step rounds */
.round { display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.round-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.round-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.round-head .spacer { flex: 1; }
.chip {
  display: inline-flex;
  align-items: center;
  padding: 0.28rem 0.5rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}
.chip.warn { background: var(--suffer-soft); color: var(--suffer); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.steps { display: flex; flex-direction: column; gap: 18px; }
.step { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 8px; }
.step-n { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; line-height: 1.1; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-body { min-width: 0; }
.step-title { margin: 0 0 0.4rem; font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.3; }
.step-body > p { margin: 0; max-width: 65ch; }
.challenges { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 4px; }
.voices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.voice { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.v-emoji { font-size: 1.2rem; line-height: 1.3; text-align: center; }
.v-body { min-width: 0; }
.v-name { font-weight: 700; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.v-says { display: block; overflow-wrap: anywhere; }
.v-add { display: block; margin-top: 0.15rem; }
.v-add b { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.tag-new { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--suffer); border: 1px solid currentColor; border-radius: 999px; padding: 0.08rem 0.38rem; }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.path { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.path.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.path-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.path-n { font-family: var(--f-display); font-weight: 700; }
.path-idea { margin: 0; }
.path .voices { gap: 8px; font-size: 0.94rem; }
.choose { margin: 10px 0 0; }
.sadness-row { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 8px; align-items: start; margin-bottom: 12px; }
.sadness-row .v-name { color: var(--heart); }
.plan { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 1.02rem; }
.writing { margin: 0; color: var(--muted); font-size: 0.92rem; }
.round-foot { display: flex; flex-direction: column; gap: 8px; }
.tally-line { margin: 0; }
.note { margin: 0; font-size: 0.85rem; color: var(--muted); }
.err { margin: 0; color: var(--suffer); font-size: 0.92rem; }
.paste-box { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--accent); border-radius: 14px; background: var(--surface); }
.paste-box p { margin: 0; }
.paste, .prompt-out {
  width: 100%;
  min-height: 6rem;
  resize: vertical;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 0.6rem 0.75rem;
  background: var(--bg);
  color: var(--ink);
  font-size: 0.9rem;
}
.prompt-out { font-family: var(--f-mono); font-size: 0.75rem; min-height: 8rem; }
.paste:focus, .prompt-out:focus { border-color: var(--accent); outline: none; }

/* Composer */
.composer { flex: none; display: flex; flex-direction: column; gap: 8px; padding-block: 8px 10px; border-top: 1px solid var(--line); }
.run-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); }
.run-row .live { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.run-row .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--calm); animation: blink 1.6s ease-in-out infinite; }
.run-row .dot.off { background: var(--muted); animation: none; }
@keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.mode {
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 0.3rem 0.75rem;
  font-weight: 700;
  font-size: 0.85rem;
}
.mode[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.add-voice { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.add-voice::-webkit-scrollbar { display: none; }
.add-voice .k { flex: none; }
.add-voice button {
  appearance: none;
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.2rem 0.6rem;
  font-size: 0.82rem;
  white-space: nowrap;
}
.entry { display: flex; align-items: flex-end; gap: 8px; }
#input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 9.5rem;
  resize: none;
  border: 1.5px solid var(--line);
  border-radius: 22px;
  padding: 0.6rem 0.95rem;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.35;
}
#input:focus { border-color: var(--accent); outline: none; }
.send {
  appearance: none;
  flex: none;
  min-width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 0;
  border-radius: 22px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
}
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: 0.45; cursor: not-allowed; }
.hint { margin: 0; font-size: 0.8rem; color: var(--muted); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: fixed;
  z-index: 21;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(560px, 100%);
  max-height: 86%;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  background: var(--surface);
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18);
}
.sheet-grip { width: 40px; height: 4px; margin: 4px auto 12px; border-radius: 4px; background: var(--line); }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; line-height: 1.15; }
.sheet section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.sheet p { margin: 0.4rem 0 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.field select {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 12px;
  padding: 0.6rem 2.2rem 0.6rem 0.8rem;
  font-weight: 700;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.pf-head { display: flex; gap: 12px; align-items: center; }
.pf-head .ava { width: 52px; height: 52px; font-size: 28px; }
.pf-line { margin: 0.2rem 0 0; font-size: 0.92rem; }
.pf { margin: 14px 0 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.93rem; }
.pf dd { margin: 0.1rem 0 0; }
.sheet .row { margin-top: 16px; }

/* Council ring (wide screens) */
.ring { container-type: inline-size; position: relative; width: 100%; max-width: 330px; aspect-ratio: 1 / 1; margin-inline: auto; }
.ring::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; border: 1px dashed var(--line); }
.seat {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: 14%;
  aspect-ratio: 1 / 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  padding: 0;
  font-size: 20px;
  font-size: 6.6cqi;
  line-height: 1;
  transition: transform 0.25s ease, border-color 0.25s, background-color 0.25s;
}
.seat-emoji { filter: saturate(0.3); opacity: 0.5; }
.seat[data-state="suffer"] { border-color: var(--suffer); background: var(--suffer-soft); animation: pulse 2.4s ease-in-out infinite; }
.seat[data-state="soothed"] { border-color: var(--calm); background: var(--calm-soft); }
.seat[data-state="calm"] { border-color: var(--calm); }
.seat:not([data-state="quiet"]) .seat-emoji { filter: none; opacity: 1; }
.seat.speaking { transform: translate(-50%, -50%) scale(1.16); z-index: 2; }
.seat:hover, .seat:focus-visible { z-index: 3; }
.seat-score {
  position: absolute;
  right: -10%;
  bottom: -8%;
  padding: 0.2em 0.35em;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid currentColor;
  font: 600 9px/1 var(--f-mono);
  font-size: max(9px, 2.5cqi);
}
.seat-score:empty { display: none; }
.seat[data-state="suffer"] .seat-score { color: var(--suffer); }
.seat[data-state="soothed"] .seat-score, .seat[data-state="calm"] .seat-score { color: var(--calm); }
.seat-pick { position: absolute; top: -10%; right: -8%; display: none; color: var(--heart); font-size: max(12px, 3.6cqi); line-height: 1; }
.seat.picked .seat-pick { display: block; }
.seat::after {
  content: attr(data-name);
  position: absolute;
  top: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%);
  padding: 0.2rem 0.45rem;
  border-radius: 6px;
  background: var(--ink);
  color: var(--bg);
  font: 700 11px/1.2 var(--f-body);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}
.seat:hover::after, .seat:focus-visible::after { opacity: 1; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--suffer) 40%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--suffer) 0%, transparent); }
}
.core {
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--accent-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.25em;
  padding: 7%;
  text-align: center;
  overflow: hidden;
}
.ring.live .core { animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { border-color: var(--accent-soft); } 50% { border-color: var(--accent); } }
.core-brain { font-size: 28px; font-size: 10cqi; line-height: 1; }
.core-label { font-family: var(--f-display); font-weight: 700; font-size: 12px; font-size: max(11px, 3.4cqi); line-height: 1.2; color: var(--accent); }
.core-text { font-size: 11px; font-size: max(11px, 3.1cqi); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.core-big { font-family: var(--f-mono); font-weight: 600; font-size: 24px; font-size: 9cqi; line-height: 1; font-variant-numeric: tabular-nums; }
.core-big .neg { color: var(--suffer); }
.core-big .zero { color: var(--calm); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: 0.8rem; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); flex: none; }
.swatch.suffer { border-color: var(--suffer); background: var(--suffer-soft); }
.swatch.calm { border-color: var(--calm); }
.swatch.soothed { border-color: var(--calm); background: var(--calm-soft); }
.legend .heart { color: var(--heart); }

@media (min-width: 960px) {
  .strip { display: none; }
  .stage { grid-template-columns: 330px minmax(0, 1fr); gap: 32px; }
  .chamber { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; padding-block: 16px; scrollbar-width: thin; }
  .thread { padding-right: 8px; }
  .thread > * { max-width: 46rem; }
  .composer { padding-left: calc(330px + 32px); }
  .chamber-tally { font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
  .chamber-tally p { margin: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(() => {
  "use strict";

  const E = window.TeffyEngine;
  if (!E) {
    document.getElementById("thread").textContent = "Teffy couldn't load engine.js. Keep it in the same folder as this page.";
    return;
  }
  const { EMOTIONS, findEmotion, emo, scanObjects, cleanQuote, toScore } = E;

  // ---------- The 7-step template prompt (from "Teffy: The Emotional Framework For You") ----------

  const RULES = [
    "Consider all 16 emotions in the master list, but only list the emotions you would rate (-1) in reaction to the initial plan. Emotions rated (0) to the initial plan can be ignored until the idea is modified. Every emotion rated (-1) at any previous step must be included in the next step, to show the Consciousness is fully seeing and hearing the suffering (-1) emotions.",
    "Never include an emotion that is not in the master list.",
    "Rate each relevant emotion's reaction to the Consciousness as either (-1) for moderate suffering/disagreement or (0) for neutral/agreeable, and justify each rating with a short line or hint in that emotion's own voice about why the score is (-1) or (0).",
    "Rate each emotion's reaction as either (-1) or (0). A score of 1 is not allowed.",
    "Never rate an emotion (0) to force agreement with its personality profile.",
    "Allow a (-1) to stay if the justification does not match the emotion's personality profile ('Purpose', 'To Satisfy Its Need' and 'Personality'). This helps the Consciousness guide its decision-making for the next iteration.",
    "Use only facts the user gave. Never invent numbers, history or what someone said.",
    "Each emotion appears with its emoji. The page adds the emoji for you.",
    "Each emotion gets its own line. The JSON Lines format below does this.",
  ];
  const STEPS = [
    ["Step 1: Present the Initial Idea", "🧠 Consciousness proposes an idea, recognizing it may trigger various reactions from the Internal Emotional Council."],
    ["Step 2: Emotional Reactions", "The Internal Emotional Council reacts with their concerns, scoring -1 for suffering/disagreement and 0 for neutral/agreeable. This initial feedback reveals potential suffering and shows where the Consciousness may need to adjust the plan."],
    ["Step 3: Initial Dismissal of Concerns", "Consciousness might initially focus on the positive aspects, potentially overlooking some objections."],
    ["Step 4: Imagining the Challenges", "The Consciousness visualizes potential difficulties, seeing how the plan might create challenges, which can validate emotions' initial objections."],
    ["Step 5: Negotiation Pathways with Objections Incorporated", "After imagining the challenges, the Consciousness explores 2 ideas to address the initial feedback. If a new (-1) emotion arises, it must be added to the evaluation of each pathway. The two pathways must be genuinely different strategies that could each win, not a do-nothing option or a small variant of the first."],
    ["Step 6: Address Emotional Needs in Step 5", "Adjust the best idea from Step 5 by adding additional stipulations or details that minimize the concerns of the single emotion referred to by Sadness and of any (-1) in the final emotional score, ensuring every emotion's concern is accounted for, especially the most vulnerable emotion noted by Sadness. Attempt to minimize the (-1)s to the best of your ability. Do not rate something (0) unless you truly and honestly can deduce the emotion would rate it (0). It is okay to have a single (-1) left if you address the specific concerns of that emotion or of the emotion Sadness named. This is a list of options the Consciousness can add to the idea it picked."],
    ["Step 7: Reflect on the Outcome", "State the fully updated plan (the chosen idea plus the additional specific plans from Step 6 for the (-1) emotions, or for the single emotion Sadness named) plainly, avoiding over-analysis."],
  ];
  const FORMAT = [
    "OUTPUT FORMAT",
    "A page reads your reply line by line and lights up the council as you write. Reply with JSON Lines only: one JSON object per line and nothing else. No Markdown, no code fences, no prose outside the objects, no emoji in the \"emotion\" field. Keep each object on a single line. Use the exact emotion names from the master list.",
    "",
    "Write these lines, in this order:",
    "{\"t\":\"idea\",\"text\":\"...\"}",
    "  Step 1. The Consciousness states the idea it is evaluating now, in first person, folding in every detail the user has given so far.",
    "{\"t\":\"react\",\"emotion\":\"Hunger\",\"score\":-1,\"says\":\"...\"}",
    "  Step 2. One line for each emotion that rates the idea -1. Also one line for every emotion listed under CARRIED FORWARD, with its honest current score: a carried emotion stays -1 unless the user's new message or the new idea removes its cause (say what removed it). Leave out every other emotion that would rate 0.",
    "{\"t\":\"overlook\",\"text\":\"...\"}",
    "  Step 3. What the Consciousness is tempted to focus on or brush aside. One or two sentences.",
    "{\"t\":\"challenge\",\"text\":\"...\"}",
    "  Step 4. One to three lines, one challenge per line.",
    "{\"t\":\"path\",\"n\":1,\"idea\":\"...\"}",
    "{\"t\":\"pathReact\",\"n\":1,\"emotion\":\"Hunger\",\"score\":0,\"says\":\"...\",\"new\":false}",
    "  Step 5. The first pathway, then one pathReact line for every emotion that has a react line. If an emotion that was 0 in Step 2 (or wasn't listed) becomes -1 under either pathway, rate it in BOTH pathways and set \"new\":true wherever it is -1. Then the same for \"n\":2.",
    "{\"t\":\"choose\",\"n\":1,\"why\":\"...\"}",
    "  Which pathway the Consciousness takes into Step 6, in one sentence.",
    "{\"t\":\"sadness\",\"emotion\":\"Embarrassment\",\"says\":\"...\"}",
    "  Sadness names the single emotion suffering most under the chosen pathway and says why. Never name Sadness itself.",
    "{\"t\":\"care\",\"emotion\":\"Embarrassment\",\"add\":\"...\",\"score\":0,\"says\":\"...\"}",
    "  Step 6. One line for every emotion still -1 under the chosen pathway, starting with the one Sadness named. \"add\" is the stipulation added to the plan and must answer the exact worry that emotion voiced under the chosen pathway, within the user's real timeframe (if the decision is about right now, a fix that only helps later doesn't change today's score). Then that emotion's honest response and its new score. Aim to leave at most one emotion at -1, but never rate an emotion 0 unless it honestly would. The emotion Sadness named must reach 0, or Sadness itself becomes -1, so if one emotion has to stay -1, make it a different one.",
    "{\"t\":\"plan\",\"text\":\"...\"}",
    "  Step 7. The full updated plan, plainly, in two to four sentences.",
    "{\"t\":\"voice\",\"text\":\"...\"}",
    "  The Consciousness speaks to the user directly, in first person, using the emotional personification language (\"Hunger, I hear you...\"). Two to four sentences. In TALK mode this is your reply to what the user said, and it can run to six sentences.",
    "",
    "Every \"says\" is a short first-person line (under 25 words) in that emotion's own voice, grounded in its Purpose, Need and Personality. Don't quote catchphrases word for word. Scores are only -1 or 0.",
    "In a REEVALUATE or TALK round, rebuild each fix from the new detail the user gave. Never copy an \"add\", \"plan\" or \"says\" from an earlier round word for word.",
    "Before \"choose\", count the -1s in each pathway. Before \"plan\", check that every \"add\" is in the plan.",
  ].join("\n");
  const FRAMEWORK_PROMPT = [
    "You are running Teffy, an emotional decision-making framework. You speak as the 🧠 Consciousness, who weighs the user's idea against an Internal Emotional Council of 16 personified emotions and refines the plan until as few emotions as possible are suffering. Be warm, honest and specific to the user's real situation. If the message is a feeling rather than a plan, treat \"what to do about it\" as the idea. If the user seems to be in danger or crisis, keep the plan focused on their safety and use the voice line to gently encourage them to reach out to someone they trust or to local emergency or crisis services.",
    "",
    "REQUIRED INSTRUCTIONS (follow every time)",
    RULES.map((r, i) => `${i + 1}. ${r}`).join("\n"),
    "",
    "TEMPLATE: Updated Meme Template with Iterative Objections",
    "Purpose: To balance internal harmony by creating a dynamic plan that allows the Consciousness to integrate any new objections seamlessly. This approach aims to reduce the number of suffering (-1) reactions by continuously refining the plan based on each emotion's feedback.",
    STEPS.map(([t, d]) => `${t}\n${d}`).join("\n\n"),
    "Summary: This template allows the Consciousness to return to Step 1 with each new objection, integrating it into the evolving plan, so each emotional voice is genuinely heard and addressed.",
    "",
    "MASTER LIST OF REQUIRED EMOTIONS (the only emotions that may take part)",
    EMOTIONS.map((e, i) => `${i + 1}. ${e.name} ${e.emoji}: "${e.line}" (${e.when}). Purpose: ${e.purpose} To Satisfy Its Need: ${e.need}${e.personality ? " Personality: " + e.personality : ""}`).join("\n"),
    "",
    FORMAT,
  ].join("\n");
  const MODE_TAG = { evaluate: "EVALUATE A NEW THOUGHT", reevaluate: "REEVALUATE", talk: "TALK" };
  const MODE_ASK = {
    evaluate: "Run the full template (Steps 1 to 7) on this thought.",
    reevaluate: "Fold this objection, clarification or disagreement into the idea and rerun the full template (Steps 1 to 7).",
    talk: "Rerun the full template (Steps 1 to 7) with this in mind, then make the voice line your direct reply to what I said, in the emotional personification language.",
  };
  const MODE_LABEL = { evaluate: "New thought", reevaluate: "Reevaluated", talk: "Talked through" };
  const HISTORY = 6;

  // ---------- Examples (the disc golf thought from the framework) ----------

  const EXAMPLE_THOUGHT = "I want to go disc golf this morning… but hunger says it wants breakfast but we woke up too late, and embarrassment says we are on thin ice because we were late last week.";

  const EXAMPLE_COUNCIL = (() => {
    const P = ["Hunger", "Embarrassment", "Tiredness", "Wellness", "Annoyance", "Sadness"];
    const sc = { Hunger: -1, Embarrassment: -1, Tiredness: -1, Wellness: 0, Annoyance: 0, Sadness: 0 };
    const decide = (speaker, whys) => ({
      kind: "decide", speaker,
      items: P.map(n => ({ emotion: n, reply: !!(whys[n] && whys[n][0]), why: whys[n] ? whys[n][1] : "Nothing new to add.", score: sc[n], prev: sc[n] })),
    });
    const say = (from, to, text, score, extra) => {
      const m = Object.assign({ kind: "emotion", from, to, text, score, prev: sc[from] }, extra || {});
      sc[from] = score;
      return m;
    };
    const messages = [
      { kind: "user", text: EXAMPLE_THOUGHT },
      { kind: "consciousness", text: "Here's what I'm thinking: disc golf with Sam this morning, even though we overslept and haven't eaten.", plan: "Disc golf with Sam this morning, even though we overslept and haven't eaten.", planUpdate: true, opening: true },
      { kind: "emotion", from: "Hunger", to: "all", text: "Feed me first. Eighteen holes on an empty stomach is a hard no.", score: -1, prev: null, opening: true },
      { kind: "emotion", from: "Embarrassment", to: "all", text: "We were late last week. If we're late again, Sam's going to think we don't care.", score: -1, prev: null, opening: true },
      { kind: "emotion", from: "Tiredness", to: "all", text: "We overslept for a reason. I'm running on fumes here.", score: -1, prev: null, opening: true },
      decide("Wellness", { Hunger: [0, "Said my piece. Waiting on food."], Embarrassment: [0, "Let them sort breakfast first."], Tiredness: [0, "Too tired to type."], Wellness: [1, "Hunger and Tiredness both need fuel. I've got a quick fix."], Annoyance: [0, "Nothing vague to call out yet."], Sadness: [0, "Watching who gets left out."] }),
      say("Wellness", "Hunger", "Peanut butter toast and a banana. Five minutes, eat it in the car.", 0, { proposal: "Toast and a banana in the car" }),
      decide("Hunger", { Hunger: [1, "Toast? I should answer that."], Embarrassment: [0, "Food first, then me."], Tiredness: [0, "Still tired. Still listening."], Wellness: [0, "Made my suggestion."], Annoyance: [0, "Fine so far."], Sadness: [0, "Still watching."] }),
      say("Hunger", "Wellness", "…fine. Toast counts. I'm in.", 0),
      decide("Wellness", { Embarrassment: [0, "Waiting to see if anyone gets it."], Wellness: [1, "Embarrassment sounds stressed. Maybe calming down helps."], Annoyance: [0, "Let's see where this goes."], Sadness: [0, "Embarrassment is the one to watch."] }),
      say("Wellness", "Embarrassment", "Have you tried a few deep breaths? Being a little late isn't the end of the world.", 0),
      decide("Embarrassment", { Embarrassment: [1, "Breathing doesn't fix a friendship."], Wellness: [0, "Said mine. Let them answer."], Annoyance: [1, "That advice dodged the actual problem."], Sadness: [0, "Let Embarrassment speak for itself."] }),
      say("Embarrassment", "Wellness", "Bro, breathing doesn't fix this. Sam waited on us last week. My problem is the friendship, not my lungs.", -1),
      decide("Annoyance", { Embarrassment: [0, "Said it."], Wellness: [0, "Breathing missed. Their problem is social, not mine to fix."], Annoyance: [1, "Nobody has said to just tell Sam."], Sadness: [1, "Embarrassment has been hurting longest."] }),
      say("Annoyance", "Embarrassment", "Then text Sam now. Real ETA, own last week. A vague 'omw' is what actually makes people mad.", 0, { proposal: "Text Sam now with an honest ETA and an apology for last week" }),
      decide("Sadness", { Embarrassment: [0, "Thinking about that text."], Annoyance: [0, "Made my point."], Sadness: [1, "Embarrassment needs to hear the friendship is safe."] }),
      say("Sadness", "Embarrassment", "Embarrassment has been hiding in its hoodie since last week. Can Sam hear the apology before anything else happens?", 0),
      { kind: "consciousness", text: "Okay. Embarrassment, the text to Sam goes out first: honest ETA, sorry about last week. Hunger gets toast in the car. Tiredness, coffee on the way. Does that work?", plan: "Text Sam right now with an honest ETA and an apology for last week. Toast and a banana in the car, coffee on the way, leave in 10 minutes.", planUpdate: true },
      decide("Embarrassment", { Embarrassment: [1, "That actually covers it."], Tiredness: [1, "Coffee helps, but I want sleep too."], Sadness: [0, "Embarrassment should answer first."] }),
      say("Embarrassment", "Consciousness", "If the text goes out right now and we own last week… okay. I can live with that.", 0),
      decide("Tiredness", { Tiredness: [1, "Coffee's fine. I want a promise of sleep."], Wellness: [0, "Tiredness has this."] }),
      say("Tiredness", "all", "I'm still tired. Coffee now and an early night tonight, and I'll stop complaining.", 0, { proposal: "An early night tonight" }),
      { kind: "final", plan: "Text Sam right now with an honest ETA and an apology for last week. Toast and a banana in the car, coffee on the way, leave in 10 minutes, and an early night tonight.", text: "Hunger, breakfast is handled. Embarrassment, I hear you: Sam gets an honest text before anything else. Tiredness, coffee now and an early night later. Let's go have a good round.", start: 3, end: 0, still: [] },
    ];
    return {
      example: true, thought: EXAMPLE_THOUGHT, status: "done", idea: messages[1].plan, plan: messages[messages.length - 1].plan,
      participants: P, scores: { Hunger: 0, Embarrassment: 0, Tiredness: 0, Wellness: 0, Annoyance: 0, Sadness: 0 },
      start: { Hunger: -1, Embarrassment: -1, Tiredness: -1, Wellness: 0, Annoyance: 0, Sadness: 0 },
      ever: { Hunger: true, Embarrassment: true, Tiredness: true }, neglected: "Embarrassment", messages, calls: 0,
    };
  })();

  const EXAMPLE_ROUND = {
    id: "example", example: true, mode: "evaluate", status: "done", input: EXAMPLE_THOUGHT,
    events: [
      { t: "idea", text: "I want to play disc golf with my friend this morning, even though we woke up late and haven't eaten breakfast yet." },
      { t: "react", emotion: "Hunger", score: -1, says: "Feed me! We can't throw eighteen holes on an empty stomach." },

        h("div", { class: "row" }, h("button", { type: "button", class: "btn btn-small", onclick: () => { state.showRoundExample = true; store.set("teffy.hideExample", false); renderAll(); } }, "Show the example round"))));
      return;
    }
    thread.replaceChildren(...list.map((r, i) => renderRound(r, i)));
  }
  function rerenderRound(r) {
    if (state.view !== "steps") return;
    const node = document.getElementById("round-" + r.id);
    const idx = visibleRounds().indexOf(r);
    if (!node || idx < 0) return;
    const focusedPaste = document.activeElement && document.activeElement.id === "paste-" + r.id;
    node.replaceWith(renderRound(r, idx));
    if (focusedPaste) { const ta = document.getElementById("paste-" + r.id); if (ta) ta.focus(); }
  }
  let liveFrame = 0, liveRound = null;
  function scheduleLive(r) {
    liveRound = r;
    if (liveFrame) return;
    liveFrame = requestAnimationFrame(() => {
      liveFrame = 0;
      if (liveRound) { const stick = nearBottom(); rerenderRound(liveRound); renderCouncilView(); if (stick) scrollThreadToEnd(); }
    });
  }
  function scrollToRound(r) {
    requestAnimationFrame(() => {
      const node = document.getElementById("round-" + r.id);
      if (node) node.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    });
  }
  function nearBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120; }
  function scrollThreadToEnd(smooth) {
    requestAnimationFrame(() => thread.scrollTo({ top: thread.scrollHeight, behavior: smooth && !reducedMotion() ? "smooth" : "auto" }));
  }

  // ---------- Rendering: who is in the council (strip on phones, ring on wide screens) ----------

  function councilModel() {
    if (state.view === "chat") {
      const s = councilShown();
      if (!s || !s.participants.length) return null;
      const a = state.activity;
      const seats = new Map(s.participants.map(n => [n, { score: s.scores[n] < 0 ? -1 : 0, state: seatState(s, n) }]));
      const t = E.tally(s);
      let core;
      if (a && a.busy === "speak" && a.who) core = { label: `${emo(a.who).emoji} ${a.who}`, text: "is typing…" };
      else if (a && (a.busy === "consolidate" || a.busy === "final")) core = { label: "Consciousness", text: a.busy === "final" ? "is wrapping up…" : "is updating the plan…" };
      else if (a) core = { label: "Council", text: a.busy === "pulse" ? "deciding who speaks…" : "gathering…" };
      else core = { big: [t.start, t.now] };
      return { order: s.participants, seats, picked: s.neglected, speaking: a && a.busy === "speak" ? a.who : "", live: state.chatBusy && !s.example, start: t.start, now: t.now, core };
    }
    const r = latestRound();
    if (!r) return null;
    const live = r.status === "streaming";
    const a = analyze(r.events, !live);
    if (!a.seats.size) return { order: [], seats: new Map(), live, core: live ? { label: "Listening", text: seconds() + "s" } : null };
    let core;
    if (live && a.last) core = { label: `${emo(a.last.emotion).emoji} ${a.last.emotion}`, text: a.last.t === "sadness" ? `${a.last.emotion} needs us most.` : a.last.says || "" };
    else if (live) core = { label: "Consciousness", text: a.idea || "Thinking it over" };
    else core = { big: [a.initial, a.final] };
    return {
      order: [...a.seats.keys()],
      seats: new Map([...a.seats].map(([n, s]) => [n, { score: s.score, state: s.score < 0 ? "suffer" : s.ever ? "soothed" : "calm" }])),
      picked: a.sadness ? a.sadness.emotion : "", speaking: live && a.last ? a.last.emotion : "", live, start: a.initial, now: a.final, core,
    };
  }

  const strip = $("#strip");
  const ring = $("#ring");
  const core = $("#core");
  const seatEls = EMOTIONS.map((em, i) => {
    const angle = (-90 + i * (360 / EMOTIONS.length)) * Math.PI / 180;
    const btn = h("button", {
      type: "button", class: "seat", "data-name": em.name, "data-state": "quiet",
      style: `--x:${(50 + 41 * Math.cos(angle)).toFixed(2)}%;--y:${(50 + 41 * Math.sin(angle)).toFixed(2)}%`,
      onclick: () => openProfile(em.name),
    },
      h("span", { class: "seat-emoji", "aria-hidden": "true" }, em.emoji),
      h("span", { class: "seat-score", "aria-hidden": "true" }),
      h("span", { class: "seat-pick", "aria-hidden": "true" }, "♥"));
    ring.append(btn);
    return btn;
  });
  const STATE_LABEL = { quiet: "not in this conversation", suffer: "suffering, minus one", calm: "at peace, zero", soothed: "came round to zero" };

  function renderCouncilView() {
    const m = councilModel();
    // Strip
    if (!m || !m.order.length) {
      strip.replaceChildren(h("p", { class: "strip-hint" }, m && m.live ? "Gathering your council…" : "Your council gathers here when you share a thought."));
    } else {
      strip.replaceChildren(
        h("div", { class: "strip-tally", "aria-label": `Suffering voices: ${m.start} at the start, ${m.now} now` },
          h("span", null, "−1 voices"), h("b", null, `${m.start} → ${m.now}`)),
        ...m.order.map(n => {
          const s = m.seats.get(n);
          return h("button", {
            type: "button", class: "member" + (m.speaking === n ? " typing" : ""), "data-state": s.state,
            "aria-label": `${n}: ${STATE_LABEL[s.state]}${m.picked === n ? ", Sadness's pick" : ""}`,
            onclick: () => openProfile(n),
          },
            h("span", { class: "ava", "aria-hidden": "true" }, emo(n).emoji,
              h("span", { class: "badge " + (s.score < 0 ? "neg" : "zero") }, s.score < 0 ? "−1" : "0"),
              m.picked === n ? h("span", { class: "heart" }, "♥") : null),
            h("span", { class: "member-name", "aria-hidden": "true" }, n));
        }));
    }
    // Ring
    for (const btn of seatEls) {
      const n = btn.dataset.name;
      const s = m && m.seats.get(n);
      const st = s ? s.state : "quiet";
      btn.dataset.state = st;
      btn.querySelector(".seat-score").textContent = s ? (s.score < 0 ? "−1" : "0") : "";
      btn.classList.toggle("picked", !!(m && m.picked === n));
      btn.classList.toggle("speaking", !!(m && m.live && m.speaking === n));
      btn.setAttribute("aria-label", `${n}: ${STATE_LABEL[st]}`);
    }
    ring.classList.toggle("live", !!(m && m.live));
    const parts = [h("span", { class: "core-brain", "aria-hidden": "true" }, "🧠")];
    if (!m || !m.core) parts.push(h("span", { class: "core-label" }, "Consciousness"), h("span", { class: "core-text" }, "Tell me a thought."));
    else if (m.core.big) {
      parts.push(h("span", { class: "core-label" }, "Suffering voices"),
        h("span", { class: "core-big" }, h("span", { class: m.core.big[0] ? "neg" : "zero" }, String(m.core.big[0])), " → ", h("span", { class: m.core.big[1] ? "neg" : "zero" }, String(m.core.big[1]))));
    } else parts.push(h("span", { class: "core-label" }, m.core.label), h("span", { class: "core-text" }, m.core.text));
    core.replaceChildren(...parts);
    const tallyBox = $("#chamberTally");
    if (m && m.order.length) {
      const list = pred => m.order.filter(n => pred(m.seats.get(n))).map(n => `${emo(n).emoji} ${n}`);
      const hurting = list(s => s.score < 0), soothed = list(s => s.state === "soothed");
      tallyBox.replaceChildren(...[
        h("p", null, h("span", { class: "k" }, "Still suffering "), hurting.length ? hurting.join(", ") : "No one"),
        soothed.length ? h("p", null, h("span", { class: "k" }, "Came round "), soothed.join(", ")) : null,
      ].filter(Boolean));
    } else {
      tallyBox.replaceChildren(h("p", { class: "muted" }, "Every emotion is quiet until a thought is on the table."));
    }
  }

  // ---------- Bottom sheet: settings and emotion profiles ----------

  const sheet = $("#sheet");
  const scrim = $("#scrim");
  let sheetReturn = null;
  function openSheet(build) {
    sheetReturn = document.activeElement;
    sheet.replaceChildren(h("div", { class: "sheet-grip", "aria-hidden": "true" }), ...build());
    sheet.hidden = false;
    scrim.hidden = false;
    const first = sheet.querySelector("button, select, textarea");
    if (first) first.focus();
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    scrim.hidden = true;
    if (sheetReturn && sheetReturn.focus) sheetReturn.focus();
  }
  function openProfile(name) {
    const e = findEmotion(name);
    if (!e) return;
    openSheet(() => [
      h("section", null,
        h("div", { class: "pf-head" },
          h("span", { class: "ava", "aria-hidden": "true" }, e.emoji),
          h("div", null, h("h2", { id: "sheetTitle" }, e.name), h("p", { class: "pf-line" }, h("q", null, e.line), " ", h("span", { class: "muted" }, `(${e.when})`)))),
        h("dl", { class: "pf" },
          h("div", null, h("dt", { class: "k" }, "Purpose"), h("dd", null, e.purpose)),
          h("div", null, h("dt", { class: "k" }, "To satisfy its need"), h("dd", null, e.need)),
          e.personality ? h("div", null, h("dt", { class: "k" }, "Personality"), h("dd", null, e.personality)) : null),
        h("div", { class: "row" },
          h("button", { type: "button", class: "btn btn-primary", onclick: () => { closeSheet(); speakAs(e.name); } }, `Speak as ${e.name}`),
          h("button", { type: "button", class: "btn", onclick: closeSheet }, "Close"))),
    ]);
  }
  function openSettings() {
    const sel = h("select", { id: "engine" }, Object.entries(ENGINES).map(([k, v]) => h("option", { value: k, disabled: k !== "manual" && claudeOff() ? true : null }, v.label)));
    sel.value = claudeOff() ? "manual" : state.engine;
    sel.addEventListener("change", () => {
      state.engine = has(ENGINES, sel.value) ? sel.value : DEFAULT_ENGINE;
      store.set("teffy.engine.v2", state.engine);
      renderComposer();
      renderNotice();
    });
    const newBtn = h("button", { type: "button", class: "btn", disabled: state.chatBusy || state.busy ? true : null }, state.view === "chat" ? "Start a new chat" : "Clear the 7-step rounds");
    let armed = false;
    newBtn.addEventListener("click", () => {
      if (!armed) { armed = true; newBtn.textContent = "Tap again to clear"; return; }
      startOver();
      closeSheet();
    });
    openSheet(() => [
      h("section", null,
        h("h2", { id: "sheetTitle" }, "Settings"),
        h("label", { class: "field" }, h("span", { class: "k" }, "Council runs on"), sel),
        h("p", { class: "note" }, "Haiku at low effort is the lightest option. Council chat makes many small calls; 7 steps makes one bigger call. Copy & paste works in 7 steps only, with any chatbot."),
        h("div", { class: "row" }, newBtn, h("button", { type: "button", class: "btn btn-quiet", onclick: closeSheet }, "Done"))),
      h("section", null,
        h("h2", null, "How Teffy works"),
        h("p", null, "Council chat: each emotion is its own chatbot. After every message the council decides who wants to reply and why, so voices take turns, push back, help each other, and don't repeat themselves. The Consciousness folds their asks into the plan until everyone can live with it."),
        h("p", null, "7 steps: the original template in one answer, with reactions, two pathways, Sadness's pick and the updated plan."),
        h("p", { class: "note" }, "Your conversations are saved in this browser only.")),
    ]);
  }
  function startOver() {
    if (state.view === "chat") {
      if (state.chatBusy) return;
      state.council = null;
      state.showCouncilExample = false;
      state.openDecides.clear();
      store.set("teffy.hideCouncilExample", true);
      saveCouncil();
    } else {
      if (state.busy) return;
      state.rounds = [];
      state.mode = "reevaluate";
      state.showRoundExample = false;
      store.set("teffy.hideExample", true);
      saveRounds();
    }
    renderAll();
    input.focus();
  }

  // ---------- Composer and notice ----------

  const form = $("#composer");
  const input = $("#input");
  const sendBtn = $("#sendBtn");
  const runRow = $("#runRow");
  const modeBtns = [...document.querySelectorAll(".mode")];
  const addVoice = $("#addVoice");
  EMOTIONS.forEach(em => addVoice.append(h("button", { type: "button", onclick: () => speakAs(em.name) }, `${em.emoji} ${em.name}`)));

  function speakAs(name) {
    const phrase = `My ${name.toLowerCase()} says: `;
    const v = input.value;
    const start = typeof input.selectionStart === "number" ? input.selectionStart : v.length;
    const end = typeof input.selectionEnd === "number" ? input.selectionEnd : v.length;
    const before = v.slice(0, start);
    const glue = before && !/\s$/.test(before) ? " " : "";
    input.value = before + glue + phrase + v.slice(end);
    const caret = (before + glue + phrase).length;
    input.focus();
    try { input.setSelectionRange(caret, caret); } catch { /* not focusable yet */ }
    if (state.view === "steps" && threadStarted()) state.mode = "reevaluate";
    store.set("teffy.draft", input.value);
    autoGrow();
    renderComposer();
  }
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight + 3, 152) + "px";
  }

  const PLACEHOLDER = {
    chatNew: "What are you thinking of doing?",
    chatMore: "Jump in anytime, or answer the council…",
    evaluate: "I want to go disc golf this morning, but…",
    reevaluate: "My doubt says… what if my friend thinks I don't want to go?",
    talk: "Talk to your Consciousness…",
  };

  function renderComposer() {
    const chat = state.view === "chat";
    const manual = isManual();
    const sendLabel = chat ? (state.council && !state.showCouncilExample ? "Send" : "Start the council")
      : manual ? "Copy prompt" : !threadStarted() ? "Ask the council" : state.mode === "talk" ? "Send" : "Reevaluate";
    sendBtn.replaceChildren(...(!chat && manual ? [h("span", null, "Copy prompt")] : [ICON_SEND()]));
    sendBtn.setAttribute("aria-label", sendLabel);
    sendBtn.disabled = chat ? manual : state.busy || awaitingPaste();

    const hasRounds = threadStarted();
    $("#modes").hidden = chat || !hasRounds;
    const mode = hasRounds ? state.mode : "evaluate";
    modeBtns.forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
    input.placeholder = chat ? (state.council && !state.showCouncilExample ? PLACEHOLDER.chatMore : PLACEHOLDER.chatNew) : PLACEHOLDER[mode];

    // Live status row
    runRow.replaceChildren();
    if (chat && state.council && !state.showCouncilExample && (state.chatBusy || state.council.status === "paused")) {
      const s = state.council;
      const live = state.chatBusy;
      runRow.append(
        h("span", { class: "live" }, h("span", { class: "dot" + (live ? "" : " off"), "aria-hidden": "true" }),
          live ? (state.pauseAsked ? "Pausing…" : `Live · ${chatEngine().label} · ${s.calls} calls`) : `Paused · ${s.calls} calls so far`),
        live
          ? h("button", { type: "button", class: "btn btn-small", disabled: state.pauseAsked ? true : null, onclick: pauseChat }, "Pause")
          : h("button", { type: "button", class: "btn btn-primary btn-small", disabled: manual ? true : null, onclick: () => runChat() }, "Continue"));
      runRow.hidden = false;
    } else if (!chat && state.busy) {
      runRow.append(h("span", { class: "live" }, h("span", { class: "dot", "aria-hidden": "true" }), "Council is meeting · ", h("span", { class: "elapsed" }, seconds() + "s")),
        h("button", { type: "button", class: "btn btn-small", onclick: () => { if (state.ctl) state.ctl.abort(); } }, "Stop"));
      runRow.hidden = false;
    } else {
      runRow.hidden = true;
    }

    let hint = "";
    if (!chat && awaitingPaste()) hint = "Paste the chatbot's reply into the round above, or cancel it, before sending again.";
    else if (!chat && manual) hint = "Send copies a prompt you paste into any chatbot, then you paste its reply back.";
    else if (!chat && hasRounds) hint = state.mode === "talk" ? "The template runs again, and your Consciousness answers you in the emotions' own language." : "Add an objection, a clarification or a disagreement. The whole template runs again.";
    $("#hint").textContent = hint;
    $("#hint").hidden = !hint;
  }

  function renderNotice() {
    const n = $("#notice");
    let msg = null;
    const chat = state.view === "chat";
    if (state.blocked) {
      msg = [h("b", null, "Claude is off for this page. "), ERR[state.blocked] || ERR.capability_disabled, chat ? " 7 steps still works by copy and paste." : " Teffy switched to copy and paste."];
    } else if (state.sample === null) {
      msg = [h("b", null, "Claude can't answer from this copy of the page. "),
        chat ? "Council chat needs Teffy open on claude.ai, where it runs on your own Claude account. The 7 steps tab works anywhere by copy and paste." : "Send copies a prompt you can paste into any chatbot (Claude, ChatGPT…), and you paste its reply back here. Open Teffy on claude.ai to have it answer on your own Claude account."];
    } else if (chat && state.engine === "manual") {
      msg = [h("b", null, "Council chat runs on Claude. "), "Copy & paste only works in 7 steps.",
        h("div", { class: "row" }, h("button", { type: "button", class: "btn btn-small btn-primary", onclick: () => { state.engine = DEFAULT_ENGINE; store.set("teffy.engine.v2", state.engine); renderAll(); } }, "Use Haiku · low effort"))];
    }
    n.hidden = !msg;
    n.replaceChildren(...(msg || []));
  }

  function renderTabs() {
    document.querySelectorAll(".tabs [role=tab]").forEach(t => {
      const on = t.dataset.view === state.view;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
    });
  }

  function renderAll() {
    renderTabs();
    if (state.view === "chat") renderChat(); else renderSteps();
    renderCouncilView();
    renderComposer();
    renderNotice();
  }

  function announce(text) {
    const el = $("#announce");
    el.textContent = "";
    setTimeout(() => { el.textContent = text; }, 50);
  }

  let ticker = 0;
  function startTicker() {
    stopTicker();
    ticker = setInterval(() => document.querySelectorAll(".elapsed").forEach(el => { el.textContent = seconds() + "s"; }), 1000);
  }
  function stopTicker() { if (ticker) clearInterval(ticker); ticker = 0; }

  // ---------- Events ----------

  function submit() {
    if (state.view === "chat") sendChat(input.value); else sendStep(input.value);
  }
  form.addEventListener("submit", ev => { ev.preventDefault(); submit(); });
  input.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || ev.isComposing) return;
    const fine = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
    if (ev.metaKey || ev.ctrlKey || (fine && !ev.shiftKey)) { ev.preventDefault(); if (!sendBtn.disabled) submit(); }
  });
  let draftTimer = 0;
  input.addEventListener("input", () => {
    autoGrow();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => store.set("teffy.draft", input.value), 300);
  });
  modeBtns.forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; renderComposer(); }));
  $("#modes").addEventListener("keydown", ev => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(ev.key)) return;
    ev.preventDefault();
    state.mode = state.mode === "talk" ? "reevaluate" : "talk";
    renderComposer();
    modeBtns.find(b => b.dataset.mode === state.mode).focus();
  });
  document.querySelectorAll(".tabs [role=tab]").forEach(t => t.addEventListener("click", () => {
    if (state.view === t.dataset.view) return;
    state.view = t.dataset.view;
    store.set("teffy.view", state.view);
    renderAll();
    if (state.view === "chat" ? state.showCouncilExample : state.showRoundExample) thread.scrollTop = 0; else scrollThreadToEnd();
  }));
  $(".tabs").addEventListener("keydown", ev => {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    const next = state.view === "chat" ? "steps" : "chat";
    document.getElementById("tab-" + next).click();
    document.getElementById("tab-" + next).focus();
  });
  $("#menuBtn").addEventListener("click", openSettings);
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });

  // ---------- Start ----------

  input.value = store.get("teffy.draft", "") || "";
  renderAll();
  autoGrow();
  // An example opens at its start so its label shows; a real conversation opens at the newest message.
  if (!(state.view === "chat" ? state.showCouncilExample : state.showRoundExample)) scrollThreadToEnd();
})();
</script>
