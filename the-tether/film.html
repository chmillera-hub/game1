<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Tether</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; margin: 0 auto; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="build/timeline.js"></script>
<script>
"use strict";
// ============================================================================
// THE TETHER — a procedurally animated short. Everything is drawn from code;
// render(t) is a pure function of time so frames can be captured in any order.
// ============================================================================
const C = document.getElementById("c");
let ctx = C.getContext("2d");          // swapped to an offscreen layer while drawing Jesus
// ?portrait renders a 9:16 phone version (1080x1920) with its own framing.
const PORTRAIT = new URLSearchParams(location.search).has("portrait");
if (PORTRAIT) { C.width = 1080; C.height = 1920; }
const W = C.width, H = C.height, BAR = PORTRAIT ? 0 : 92;  // landscape: 2.39:1 letterbox
const U = Math.min(W, H) / 720;                            // screen-space scale for text and effects
const TL = window.TIMELINE, M = TL.marks, CUES = TL.cues;

// ---------------------------------------------------------------- math ----
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t); return -(Math.cos(Math.PI * t) - 1) / 2; };
const ecub = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const ramp = (t, a, b) => sm((t - a) / (b - a));
const win = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d));
const TAU = Math.PI * 2;
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function noise1(x, seed = 0) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57.31), hash(i + 1 + seed * 57.31), u) * 2 - 1;
}
const fbm1 = (x, s = 0) => noise1(x, s) * .6 + noise1(x * 2.13, s + 3) * .28 + noise1(x * 4.37, s + 7) * .12;
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function kf(t, keys, e = eio) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i], u = e((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], u)) : lerp(v0, v1, u);
    }
  }
  return keys[keys.length - 1][1];
}
const V = (x, y) => ({ x, y });
const vadd = (a, b, k = 1) => V(a.x + b.x * k, a.y + b.y * k);
const vlerp = (a, b, t) => V(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const dir = a => V(Math.cos(a), Math.sin(a));
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mulc = (a, k) => [a[0] * k, a[1] * k, a[2] * k];

// ------------------------------------------------------------ cue helpers --
const cue = i => CUES[i];
const cueEnd = i => CUES[i].start + CUES[i].dur;
function mouthEnv(t) {               // lip-sync for the lines spoken aloud
  for (const c of CUES) if (c.env && t >= c.start && t < c.start + c.dur) {
    const f = (t - c.start) * 30, i = Math.floor(f);
    return lerp(c.env[i] || 0, c.env[i + 1] || 0, f - i);
  }
  return 0;
}

// --------------------------------------------------------------- flashes --
function flash(t, where) {
  let s = 0;
  for (const f of TL.flashes) {
    if (where && f.where !== where) continue;
    const d = t - f.t;
    if (d < 0 || d > 2.5) continue;
    const flick = 0.55 + 0.45 * Math.abs(noise1(d * 40, f.t));
    s += f.s * (Math.exp(-d * 5) + 0.7 * Math.exp(-Math.abs(d - 0.16) * 18) + 0.25 * Math.exp(-d * 1.4)) * flick;
  }
  return s;
}

// ================================================================ WORLD ====
// World units, y grows downward, the invisible floor is y = 0.
const FX = 560;                     // the Father's centre line
const STRIDE = 22;

// Crawl progress is the integral of a hand-tuned speed curve.
function crawlSpeed(t) {
  let v = 0.27 * ramp(t, M.jesus - 1.5, M.jesus + 1.5) * (1 - ramp(t, M.plea - 0.5, M.plea + 1.8));
  v *= 1 - win(t, 48.6, 49.5, 51.9, 53.2);                                  // collapse
  v *= 1 - 0.92 * win(t, M.father + 1.2, M.father + 1.7, M.father + 8, M.father + 10.5); // frozen by thunder
  v *= 1 + 0.3 * noise1(t * 0.45, 4);
  return Math.max(0, v);
}
const DT = 1 / 120, PT = [0];
for (let i = 1; i * DT <= TL.duration + 2; i++) PT.push(PT[i - 1] + crawlSpeed(i * DT) * DT);
function crawlP(t) {
  const f = clamp(t, 0, TL.duration + 1.9) / DT, i = Math.floor(f);
  return lerp(PT[i], PT[Math.min(i + 1, PT.length - 1)], f - i);
}
function timeOfP(p) {
  let lo = 0, hi = PT.length - 1;
  if (PT[hi] < p) return Infinity;
  while (lo < hi) { const m = (lo + hi) >> 1; if (PT[m] < p) lo = m + 1; else hi = m; }
  return lo * DT;
}
const PEND = PT[PT.length - 1];
const JX0 = -STRIDE * PEND;          // so the crawl ends with the shoulders at x = 0
const bxAt = p => JX0 + STRIDE * (p + 0.05 * Math.sin(TAU * 2 * p));

// Two-bone IK; the elbow/knee takes whichever solution is nearer the pole.
function ik2(s, tgt, l1, l2, pole) {
  let dx = tgt.x - s.x, dy = tgt.y - s.y, d = Math.hypot(dx, dy);
  const maxd = l1 + l2 - 0.05;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  d = Math.max(d, Math.abs(l1 - l2) + 0.05);
  const a = Math.atan2(dy, dx), off = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const e1 = vadd(s, dir(a + off), l1), e2 = vadd(s, dir(a - off), l1);
  const e = Math.hypot(e1.x - pole.x, e1.y - pole.y) < Math.hypot(e2.x - pole.x, e2.y - pole.y) ? e1 : e2;
  return { s, e, w: V(s.x + dx, s.y + dy) };
}

// Gait: each limb swings for `sf` of a cycle and is planted (fixed in the world) otherwise.
const LIMBS = {
  aN: { o: 0.0, sf: 0.38, lift: 6, reach: 16, arm: true },
  aF: { o: 0.5, sf: 0.38, lift: 6, reach: 13, arm: true },
  lN: { o: 0.62, sf: 0.5, lift: 1.2, reach: -27 },
  lF: { o: 0.12, sf: 0.5, lift: 1.2, reach: -29 },
};
const TORSO = 34, UA = 19, FA = 18, TH = 26, SH = 25;
function anchorX(p, L) {                                  // shoulder or hip x at plant
  const bx = bxAt(p);
  return L.arm ? bx : bx - TORSO * Math.cos(0.14);
}
function gaitTarget(L, p) {
  const u = p + L.o, k = Math.floor(u), q = u - k;
  const plant = kk => anchorX(kk - L.o + L.sf, L) + L.reach;
  if (q < L.sf) {
    const e = eio(q / L.sf);
    return V(lerp(plant(k - 1), plant(k), e), -1.5 - L.lift * Math.sin(Math.PI * q / L.sf));
  }
  return V(plant(k), -1.5);
}
function plantRipples(t, p) {            // where and when the hands last touched down
  const out = [];
  for (const key of ["aN", "aF"]) {
    const L = LIMBS[key];
    const k0 = Math.floor(p + L.o);
    for (let k = k0; k > k0 - 3; k--) {
      const pp = k - L.o + L.sf, tp = timeOfP(pp);
      if (tp <= t && t - tp < 3) out.push({ x: anchorX(pp, L) + L.reach, age: t - tp });
    }
  }
  return out;
}

// --------------------------------------------------------- Jesus' story ----
function jesusParams(t) {
  const s = {};
  s.p = crawlP(t);
  s.bx = bxAt(s.p);
  s.slump = Math.max(1 - ramp(t, M.jesus - 1.5, M.jesus + 2.2), win(t, 48.8, 50.3, 51.7, 53.3));
  s.look = 0.15 + 0.25 * win(t, 30, 32, 34, 36) + 0.55 * win(t, M.father + 1.5, M.father + 2.6, M.father + 8, M.father + 10.5);
  s.look = Math.max(s.look, 0.95 * win(t, M.plea + 0.8, M.plea + 3.0, M.withdraw + 0.2, M.withdraw + 2.0));
  s.look -= 0.35 * win(t, cue(16).start - 2, cue(16).start, cue(17).start, cue(17).start + 1.5); // eyes drop at "give it to God"
  s.kneel = ramp(t, 89.4, 93.8);
  s.clutchN = ramp(t, M.plea + 0.4, M.plea + 2.4);
  s.reach = (0.72 * ramp(t, 95.0, 100.8) + 0.28 * ramp(t, M.hover - 5.5, M.hover + 0.5)) * (1 - ramp(t, M.withdraw + 0.15, M.withdraw + 2.1));
  s.clutchF = ramp(t, M.withdraw + 0.6, M.withdraw + 2.4);
  s.curl = ramp(t, M.curl + 0.1, M.curl + 5.4);
  s.open = s.reach * (0.6 + 0.4 * ramp(t, M.hover - 4, M.hover + 1));
  // Breath and sobbing. Sobs are irregular double-heaves.
  s.sob = 0.35 * win(t, M.plea + 1, M.plea + 3, M.withdraw, M.withdraw + 1) + 0.75 * ramp(t, M.curl + 2, M.curl + 6)
        - 0.35 * win(t, M.grief + 15.5, M.grief + 16.5, M.pullback + 6, M.pullback + 9);
  const sp = t * 0.62 + 0.4 * noise1(t * 0.3, 21);
  const ph = sp - Math.floor(sp);
  s.heave = s.sob * (Math.exp(-Math.pow((ph - 0.1) * 9, 2)) + 0.7 * Math.exp(-Math.pow((ph - 0.3) * 9, 2)));
  s.breath = Math.sin(t * TAU / 4.2);
  s.tremble = 0.25 + 0.75 * ramp(t, M.hover - 6, M.hover);
  s.eye = 0.05 + 0.85 * win(t, M.plea + 1.2, M.plea + 2.4, M.withdraw - 0.5, M.withdraw + 1.2)
        - 0.8 * win(t, 85.3, 85.5, 86.1, 86.4) + 0.4 * win(t, 30.5, 31.5, 34, 35);   // squeezed shut on "This hurts"
  s.sorrow = 0.4 + 0.6 * ramp(t, M.plea, M.plea + 2);
  s.tears = ramp(t, M.plea + 4, M.plea + 9);
  s.mouth = mouthEnv(t);
  return s;
}

function jesusPose(t) {
  const s = jesusParams(t);
  const P = { s };
  // --- crawl body
  const cHip = V(s.bx - TORSO * Math.cos(0.14), -27 + s.slump * 9 + 1.1 * Math.sin(TAU * 2 * s.p) + 0.6 * s.breath);
  const cTh = 0.14 + s.slump * 0.24 + 0.03 * Math.sin(TAU * 2 * s.p + 1);
  // --- kneel body (anchored where the crawl stopped)
  const kx = bxAt(PEND) - TORSO * Math.cos(0.14);
  const kHip = V(kx, -29.5 + 0.8 * s.breath);
  const kTh = -0.92 + 0.12 * (1 - s.reach) - 0.06 * s.heave;
  // --- curled body (child's pose, arms wrapped round the chest)
  const uHip = V(kx - 5, -15.5);
  const uTh = 0.08 - 0.08 * s.heave;

  const wk = s.kneel, wu = s.curl;
  let hip = vlerp(vlerp(cHip, kHip, wk), uHip, wu);
  let th = lerp(lerp(cTh, kTh, wk), uTh, wu);
  hip.y -= s.heave * (1.5 + wu);
  const d = dir(th), n = V(-d.y, d.x);
  const S = vadd(hip, d, TORSO);
  P.hip = hip; P.S = S; P.d = d; P.n = n; P.th = th;

  // --- head: neck angle + face pitch
  const lookC = s.look;
  const naC = th - 0.3 - lookC * 0.55 + s.slump * 0.5;
  const naK = th + 0.05 - (lookC - 0.6) * 0.35;
  const naU = 1.15;
  const na = lerp(lerp(naC, naK, wk), naU, wu);
  const ha = lerp(lerp(lerp(0.85, -0.5, lookC) + s.slump * 0.3, lerp(0.3, -0.75, lookC), wk), 1.35, wu) + 0.04 * s.heave;
  P.Hc = vadd(vadd(S, d, 2.5), dir(na), 9.5);
  P.ha = ha + 0.015 * noise1(t * 2, 5);

  // --- chest point: where the hands hold the ache
  P.chest = vadd(vadd(hip, d, 30 - 4 * wu), n, 10 - 2 * wu);   // over the heart

  // --- arm targets
  const gN = gaitTarget(LIMBS.aN, s.p), gF = gaitTarget(LIMBS.aF, s.p);
  const hangN = vadd(S, V(4, 1), 34), hangF = vadd(S, V(8, 1), 34);
  let tN = vlerp(vlerp(gN, hangN, wk), P.chest, s.clutchN);
  const tr = s.tremble * s.reach;
  const reachDir = -0.5 + 0.035 * tr * noise1(t * 7, 2) + 0.02 * tr * noise1(t * 13, 3);
  const reachT = vadd(S, dir(reachDir), 36.8 - 1.2 * (1 - s.open));
  let tF = vlerp(vlerp(gF, hangF, wk), reachT, s.reach);
  tF = vlerp(tF, vadd(P.chest, d, -2), s.clutchF);
  // Pulling the hand back: the elbow drops to his side first (hand at the waist), then the hand rises to the chest.
  const wd = clamp((t - M.withdraw - 0.15) / 2.25);
  if (wd > 0 && wd < 1) {
    const waist = vadd(vadd(S, d, -17), n, 19), u = eio(wd);
    tF = u < 0.55 ? vlerp(reachT, waist, eio(u / 0.55)) : vlerp(waist, vadd(P.chest, d, -2), eio((u - 0.55) / 0.45));
  }
  // Holding the chest, the elbow stays tucked at his side: back along the torso toward the hip.
  const poleSide = vadd(vadd(S, d, -20), n, 4);
  const poleCrawl = vadd(S, V(-10, 30));
  const poleArm = vlerp(poleCrawl, poleSide, Math.max(s.clutchN, wu));
  const poleReach = vlerp(poleCrawl, vadd(S, V(4, 40)), s.reach);
  P.aN = ik2(vadd(S, n, 1.5), tN, UA, FA, poleArm);
  // the elbow drops to his side as soon as he starts pulling the hand back
  P.aF = ik2(vadd(S, n, -1), tF, UA, FA, vlerp(poleReach, poleSide, Math.max(s.clutchF, wu, ramp(t, M.withdraw + 0.05, M.withdraw + 0.5))));
  P.aF.open = s.open; P.aN.open = 0;
  P.aN.fist = s.clutchN; P.aF.fist = s.clutchF;

  // --- leg targets
  const lNc = gaitTarget(LIMBS.lN, s.p), lFc = gaitTarget(LIMBS.lF, s.p);
  const lNk = V(hip.x - 24, -2.5), lFk = V(hip.x - 26, -2.5);
  const lNu = V(hip.x - 6, -2.5), lFu = V(hip.x - 8, -2.5);
  const tLN = vlerp(vlerp(lNc, lNk, wk), lNu, wu), tLF = vlerp(vlerp(lFc, lFk, wk), lFu, wu);
  const poleLeg = vlerp(vadd(hip, V(20, 30)), vadd(hip, V(40, 4)), wu);
  P.lN = ik2(vadd(hip, n, 2), tLN, TH, SH, poleLeg);
  P.lF = ik2(vadd(hip, n, -2), tLF, TH, SH, poleLeg);
  return P;
}

// ============================================================== CAMERA ====
// A list of shots; each is a hard cut. Shots may track the characters.
function tearPath(t) {
  const t0 = M.grief + 9.6, t1 = t0 + 5.4;           // detaches during "even grief"
  const u = clamp((t - t0) / (t1 - t0));
  const P = jesusPose(M.pullback);
  const land = V(P.Hc.x + 22, -1.5);
  const a = V(FX + FEYE.x + 4, FEYE.y + 4), b = V(FX + 300, -900), c = V(land.x + 110, -380);
  const e = 1 - Math.pow(1 - u, 1.6) * (1 - u * 0.4);
  const k = clamp(e), ik = 1 - k;
  const pos = V(ik * ik * ik * a.x + 3 * ik * ik * k * b.x + 3 * ik * k * k * c.x + k * k * k * land.x,
                ik * ik * ik * a.y + 3 * ik * ik * k * b.y + 3 * ik * k * k * c.y + k * k * k * land.y);
  return { u, pos, t0, t1, land };
}

function camera(t, P) {
  const head = P.Hc, hip = P.hip;
  const body = vlerp(hip, head, 0.5);
  let c;
  const f = M.father;
  if (t < M.jesus) {
    const u = t / M.jesus;
    c = { x: kf(t, [[0, -1900], [18, -1150], [M.jesus, JX0 + 60]]),
          y: kf(t, [[0, -2900], [21, -420], [M.jesus - 0.2, -110]]),
          z: kf(t, [[0, 0.42], [17, 0.55], [M.jesus, 1.25]]) };
  } else if (t < 36.0) {
    c = { x: body.x + 18, y: -42, z: lerp(3.3, 2.9, (t - M.jesus) / 9.4) };
  } else if (t < 44.6) {
    const u = (t - 36) / 8.6;
    c = { x: lerp(hip.x - 34, head.x + 4, eio(u * 1.6)), y: lerp(-22, head.y - 7, eio(u * 1.6)), z: lerp(4.8, 10.5, eio(u)) };
  } else if (t < f) {
    c = { x: body.x + 70, y: -95, z: 1.75 };
  } else if (t < f + 7.6) {
    const u = (t - f - 1.6) / 5.8;
    c = { x: lerp(body.x + 60, FX - 40, ecub(u)), y: lerp(-60, -620, ecub(u)), z: Math.exp(lerp(Math.log(2.1), Math.log(0.44), ecub(u))) };
  } else if (t < 66.6) {
    const u = (t - f - 7.6) / (66.6 - f - 7.6);
    c = { x: FX + 15, y: lerp(-860, -900, u), z: lerp(0.95, 1.12, u) };
  } else if (t < 72.9) {
    const u = (t - 66.6) / 6.3;
    c = { x: lerp(FX - 360, FX - 300, u), y: -268 / 0.4 + 30, z: lerp(0.4, 0.42, u) };
  } else if (t < M.plea + 0.5) {
    c = { x: kf(t, [[72.9, FX + 40], [76, FX + 120], [80.5, FX + 760]]), y: kf(t, [[72.9, -1018], [80.5, -1080]]),
          z: kf(t, [[72.9, 2.3], [76, 2.0], [80.5, 0.95]]) };
  } else if (t < 92.4) {
    c = { x: head.x + 3, y: head.y - 2, z: lerp(10.5, 12, (t - M.plea) / 10) };
  } else if (t < 101.5) {
    const u = (t - 92.4) / 9.1;
    c = { x: hip.x + 150, y: -268 / 1.45 + 26, z: lerp(1.45, 1.6, u) };
  } else if (t < M.ghost) {
    c = { x: head.x + 4, y: head.y - 1, z: lerp(11, 12.5, (t - 101.5) / 5.4) };
  } else if (t < 115.0) {
    const u = (t - M.ghost) / 8.1;
    c = { x: lerp(hip.x + 230, hip.x + 300, u), y: -268 / 0.78 + 30, z: lerp(0.78, 0.74, u) };
  } else if (t < 121.0) {
    const w = P.aF.w;
    c = { x: w.x + 6, y: w.y - 6, z: lerp(5.2, 6.0, (t - 115) / 6) };
  } else if (t < M.hover) {
    const u = (t - 121) / (M.hover - 121);
    c = { x: lerp(FX - 120, FX - 150, u), y: -268 / 0.46 + 24, z: lerp(0.46, 0.49, u) };
  } else if (t < M.curl) {
    const w = P.aF.w;
    c = { x: w.x + 2, y: w.y - 4, z: kf(t, [[M.hover, 6.2], [M.withdraw, 6.6], [M.curl, 4.6]]) };
  } else if (t < M.inner) {
    const u = (t - M.curl) / (M.inner - M.curl);
    c = { x: hip.x + 22, y: -32, z: lerp(2.6, 3.4, eio(u)) };
  } else if (t < M.thread) {
    const u = (t - M.inner) / (M.thread - M.inner);
    c = { x: P.chest.x + 2, y: P.chest.y - 8, z: lerp(5.4, 6.6, u) };
  } else if (t < M.tether) {
    const g = threadGeom(t, P);
    const u = (t - M.thread) / (M.tether - M.thread);
    const tip = g.tip;
    const k = ecub(clamp(u * 1.15));
    c = { x: lerp(P.chest.x, tip.x - 80, k), y: lerp(P.chest.y - 8, tip.y + 60, k),
          z: Math.exp(lerp(Math.log(5.0), Math.log(0.5), eio(clamp(u * 1.5)))) };
  } else if (t < M.grief) {
    const u = (t - M.tether) / (M.grief - M.tether);
    c = { x: lerp(1150, 1050, u), y: -268 / 0.33 + 40, z: lerp(0.33, 0.37, u) };
  } else {
    const tp = tearPath(t);
    if (t < tp.t0 + 0.4) {
      const u = (t - M.grief) / (tp.t0 - M.grief);
      c = { x: FX + 42, y: -1022, z: lerp(2.1, 2.6, eio(u)) };
    } else if (t < tp.t0 + 1.4) {                 // the bead falls out of frame

      const y = src.y + 40 * ph * ph * 4;
      if (y > -0.5) continue;
      ctx.fillStyle = `rgba(220,235,255,${0.8 * s.tears * (1 - ph)})`;
      ctx.beginPath(); ctx.ellipse(src.x, y, 0.35, 0.55, 0, 0, TAU); ctx.fill();
    }
  }
}

function drawHalo(t, P) {
  const lv = haloLevel(t);
  const ca = Math.cos(P.ha * 0.6), sa = Math.sin(P.ha * 0.6);
  const off = V(-1.2, -11.5), c = V(P.Hc.x + off.x * ca - off.y * sa, P.Hc.y + off.x * sa + off.y * ca);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 24);
  g.addColorStop(0, `rgba(255,225,160,${0.28 * lv})`); g.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = g; ctx.fillRect(c.x - 24, c.y - 24, 48, 48);
  ctx.translate(c.x, c.y); ctx.rotate(P.ha * 0.6);
  for (const [lw, al] of [[3.2, 0.12], [1.4, 0.35], [0.55, 0.95]]) {
    ctx.strokeStyle = `rgba(255,232,180,${al * lv})`; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.ellipse(0, 0, 8.4, 2.5, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================== THREAD ====
function threadGeom(t, P) {
  const g = clamp((t - M.thread - 0.6) / 9.2);
  const start = P.chest;
  const B = V(1600, -760);
  const pts = [];
  const N = 90;
  const gl = ecub(g);
  for (let i = 0; i <= N; i++) {
    const u = i / N * gl;
    // cubic arc rising past the Father's shoulder into the void he watches
    const a = start, b = V(start.x + 160, start.y - 260), c = V(900, -1500), d = B;
    const iu = 1 - u;
    let x = iu * iu * iu * a.x + 3 * iu * iu * u * b.x + 3 * iu * u * u * c.x + u * u * u * d.x;
    let y = iu * iu * iu * a.y + 3 * iu * iu * u * b.y + 3 * iu * u * u * c.y + u * u * u * d.y;
    const wob = Math.sin(u * 30 - t * 1.5) * 6 * u + fbm1(u * 8 + t * 0.2, 2) * 10 * u;
    x += wob * 0.5; y += wob;
    pts.push(V(x, y));
  }
  return { g, pts, tip: pts[pts.length - 1], B };
}
function soulsLevel(t) { return ramp(t, M.thread + 7.5, M.tether - 0.2); }
function drawThread(t, P) {
  if (t < M.thread) return;
  const G = threadGeom(t, P);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const px = U / CAM.z;
  for (const [lw, al] of [[7 * px, 0.08], [2.6 * px, 0.25], [1.0 * px, 0.95]]) {
    ctx.strokeStyle = `rgba(255,214,140,${al})`; ctx.lineWidth = lw;
    ctx.beginPath(); G.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  }
  // sparks travelling outward along it
  for (let k = 0; k < 10; k++) {
    const u = ((t * 0.07 + k / 10) % 1);
    const p = G.pts[Math.floor(u * (G.pts.length - 1))];
    ctx.fillStyle = `rgba(255,240,200,${0.8 * Math.sin(Math.PI * u)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2 * px, 0, TAU); ctx.fill();
  }
  // tip glow
  const tg = ctx.createRadialGradient(G.tip.x, G.tip.y, 0, G.tip.x, G.tip.y, 26 * px);
  tg.addColorStop(0, "rgba(255,230,170,0.8)"); tg.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = tg; ctx.fillRect(G.tip.x - 26 * px, G.tip.y - 26 * px, 52 * px, 52 * px);
  // filaments from the branch point to distant lights
  const fl = ramp(t, M.thread + 8.8, M.tether + 1.5);
  if (fl > 0) {
    SOULS.forEach((s, i) => {
      if (i % 5) return;
      const k = clamp(fl * 1.6 - s.delay * 0.6);
      if (k <= 0) return;
      const e = vlerp(G.B, V(s.x, s.y), k);
      ctx.strokeStyle = `rgba(255,214,150,${0.35})`; ctx.lineWidth = 0.9 * px;
      const m = V((G.B.x + e.x) / 2, (G.B.y + e.y) / 2 - 120 * k);
      ctx.beginPath(); ctx.moveTo(G.B.x, G.B.y); ctx.quadraticCurveTo(m.x, m.y, e.x, e.y); ctx.stroke();
    });
  }
  ctx.restore();
}
function drawSouls(t) {
  const lv = Math.max(soulsLevel(t), 0.18 * ramp(t, 76, 80) * (1 - ramp(t, 82, 83)));
  if (lv <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const px = U / CAM.z;
  const fl = ramp(t, M.thread + 8.8, M.tether + 1.5);
  SOULS.forEach((s, i) => {
    const a = clamp(lv * 1.4 - s.delay * 0.5) * (0.55 + 0.45 * Math.sin(t * 1.3 * s.s + s.ph));
    if (a <= 0) return;
    const touched = i % 5 === 0 ? clamp(fl * 1.6 - s.delay * 0.6) : 0;
    const R = (5 + 6 * touched) * px * s.s + 3;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
    const col = s.warm ? "255,210,150" : "190,210,255";
    g.addColorStop(0, `rgba(${col},${a * (0.7 + 0.3 * touched)})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(s.x - R, s.y - R, 2 * R, 2 * R);
  });
  ctx.restore();
}

// ================================================================ TEAR ====
function drawTear(t) {
  const tp = tearPath(t);
  if (t < tp.t0 || t > tp.t1 + 0.05) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const px = U / CAM.z;
  for (let k = 12; k >= 0; k--) {          // trail
    const q = tearPath(t - k * 0.05);
    if (t - k * 0.05 < tp.t0) continue;
    const r = (k ? 3.0 : 5) * px * (1 - k / 14) + (k ? 0 : 1.2);
    ctx.fillStyle = `rgba(255,244,220,${k ? 0.25 * (1 - k / 13) : 1})`;
    ctx.beginPath(); ctx.arc(q.pos.x, q.pos.y, r, 0, TAU); ctx.fill();
  }
  const g = ctx.createRadialGradient(tp.pos.x, tp.pos.y, 0, tp.pos.x, tp.pos.y, 30 * px + 8);
  g.addColorStop(0, "rgba(255,240,210,0.6)"); g.addColorStop(1, "rgba(255,220,170,0)");
  ctx.fillStyle = g; const R = 30 * px + 8; ctx.fillRect(tp.pos.x - R, tp.pos.y - R, 2 * R, 2 * R);
  ctx.restore();
}

// ============================================================ OVERLAYS ====
const GHOST_POS = [[0.30, 0.36], [0.68, 0.30], [0.56, 0.64], [0.36, 0.56]];
function drawGhost(t) {
  const g = CUES.find(c => c.who === "G");
  if (!g) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  g.parts.forEach((p, i) => {
    const a = ramp(t, p.start - 0.2, p.start + 0.5) * (1 - ramp(t, p.start + p.dur, p.start + p.dur + 2.4));
    if (a <= 0) return;
    const [fx, fy] = GHOST_POS[i];
    const drift = (t - p.start) * 9;
    ctx.font = `italic ${(30 + i * 2) * U}px Caladea`; ctx.textAlign = "center"; ctx.letterSpacing = `${4 * U}px`;
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = `rgba(225,215,255,${a * (k ? 0.12 : 0.55)})`;
      ctx.fillText(p.who === "G1" && i === 3 ? "give it to God…" : "Give it to God.", fx * W + drift * U + (k ? noise1(t * 3 + k, k) * 6 * U : 0), fy * H - drift * 0.3 * U + (k ? noise1(t * 3 + k, k + 9) * 4 * U : 0));
    }
  });
  ctx.letterSpacing = "0px";
}
function wrapLines(text, maxw) {
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const tryl = cur ? cur + " " + w : w; if (ctx.measureText(tryl).width > maxw && cur) { lines.push(cur); cur = w; } else cur = tryl; }
  if (cur) lines.push(cur); return lines;
}
function drawCaptions(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (PORTRAIT) {                    // a soft dark band so captions read over the picture
    const g = ctx.createLinearGradient(0, H * 0.7, 0, H);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, "rgba(0,0,0,0.45)"); g.addColorStop(1, "rgba(0,0,0,0.7)");
    ctx.fillStyle = g; ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }
  CUES.forEach((c, i) => {
    if (c.who === "G") return;
    const next = CUES[i + 1] ? CUES[i + 1].start : 1e9;
    const end = Math.min(c.start + c.dur + 0.6, next - 0.05);
    const a = ramp(t, c.start - 0.15, c.start + 0.2) * (1 - ramp(t, end - 0.3, end));
    if (a <= 0) return;
    const fs = (c.who === "J" ? 22 : 21) * (PORTRAIT ? 1.9 : 1);
    const style = { N: ["", "232,226,214"], J: ["italic ", "255,214,170"], I: ["italic ", "214,200,255"] }[c.who];
    ctx.font = `${style[0]}${fs}px Caladea`; ctx.textAlign = "center";
    const txt = c.who === "N" ? c.text : `“${c.text}”`;
    const lines = wrapLines(txt, W * (PORTRAIT ? 0.86 : 0.78));
    const lh = PORTRAIT ? fs * 1.3 : 26;
    const y0 = PORTRAIT ? H * 0.855 - (lines.length - 1) * lh / 2 : H - BAR + 36 - (lines.length - 1) * 8;
    if (PORTRAIT) {
      ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 12 * U;
    }
    ctx.fillStyle = `rgba(${style[1]},${a * 0.95})`;
    lines.forEach((l, k) => ctx.fillText(l, W / 2, y0 + k * lh));
    ctx.shadowBlur = 0; ctx.shadowColor = "rgba(0,0,0,0)";
  });
}
function drawTitle(t) {
  const a = ramp(t, M.title, M.title + 2.2) * (1 - ramp(t, M.end - 1.6, M.end - 0.1));
  if (a <= 0) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = "center";
  const s = PORTRAIT ? U * 1.1 : 1;
  ctx.font = `${44 * s}px Caladea`; ctx.letterSpacing = `${18 * s}px`; ctx.fillStyle = `rgba(240,228,205,${a})`;
  ctx.fillText("THE TETHER", W / 2 + 9 * s, H / 2 - 4 * s);
  ctx.font = `italic ${19 * s}px Caladea`; ctx.letterSpacing = `${3 * s}px`; ctx.fillStyle = `rgba(200,190,220,${a * 0.8})`;
  ctx.fillText("a prayer without words", W / 2, H / 2 + 38 * s);
  ctx.letterSpacing = "0px";
  // thin gold thread under the title
  const w = 220 * s * ramp(t, M.title + 0.8, M.title + 3.5);
  ctx.strokeStyle = `rgba(255,210,140,${a * 0.8})`; ctx.lineWidth = s;
  ctx.beginPath(); ctx.moveTo(W / 2 - w / 2, H / 2 + 14 * s); ctx.lineTo(W / 2 + w / 2, H / 2 + 14 * s); ctx.stroke();
}

// ============================================================== RENDER ====
function render(t) {
  const P = jesusPose(t);
  CAM = camera(t, P);
  drawSky(t);
  applyCam();
  drawSkyClouds(t);
  drawFarBolt(t);
  applyCam();
  drawRays(t);
  drawSouls(t);
  drawFloor(t, P);
  if (onScreen(FX, -600, 900)) drawFather(t);
  applyCam();
  drawMist(t);
  drawThread(t, P);
  if (onScreen(P.hip.x + 10, -30, 140)) {
    // Body into its own layer so it can be rim-lit as one silhouette.
    const main = ctx;
    ctx = JCTX; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    applyCam(); drawJesus(t, P);
    ctx = main;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(JL, 0, 0);
    const px = clamp(0.32 * CAM.z, 0.8, 3.2 * U);
    rim(LDIR, px, `rgb(255,226,180)`, clamp(0.75 * LAMT));
    rim(V(-LDIR.x * 0.6 - LDIR.y * 0.5, -LDIR.y * 0.6 + LDIR.x * 0.5), px * 0.8, "rgb(120,140,230)", 0.35);
    applyCam(); drawJesusGlow(t, P);
  }
  drawTear(t);
  drawMotes(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // global flash wash
  const fw = flash(t, "father") * 0.22 + flash(t, "far") * 0.05;
  if (fw > 0.003) { ctx.fillStyle = `rgba(215,225,255,${clamp(fw)})`; ctx.fillRect(0, 0, W, H); }
  // vignette
  const hd = Math.hypot(W, H) / 2;
  const vg = ctx.createRadialGradient(W / 2, H / 2, hd * 0.34, W / 2, H / 2, hd * 1.25);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.72)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawGhost(t);
  // film grain
  ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = "overlay";
  ctx.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  // fades (cuts are hard; open and close are soft)
  const black = 1 - ramp(t, 0.3, 4.5) + ramp(t, M.fade, M.title - 0.2);
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(black)})`; ctx.fillRect(0, 0, W, H); }
  if (BAR) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR); }
  drawCaptions(t);
  drawTitle(t);
}
window.render = render;
window.DURATION = TL.duration;

// -------------------------------------------- preview: #t=SECONDS or #play
(function boot() {
  const h = location.hash;
  if (h.startsWith("#t=")) { render(parseFloat(h.slice(3))); return; }
  if (h.startsWith("#play")) {
    const audio = new Audio("build/mix.wav");
    const start = parseFloat(h.split("=")[1] || "0");
    audio.currentTime = start;
    document.body.addEventListener("click", () => audio.play(), { once: true });
    render(start);
    const loop = () => { render(audio.paused ? start : audio.currentTime); requestAnimationFrame(loop); };
    loop();
    return;
  }
  render(0);
})();
</script>
</body>
</html>
