<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistically Likely</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #d8d4cc; font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { display: block; width: 100%; height: 100%; }
  #controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px; background: linear-gradient(transparent, rgba(0,0,0,.65)); opacity: 0; transition: opacity .3s; }
  #stage:hover #controls, #controls.show { opacity: 1; }
  #controls button { background: none; border: 1px solid rgba(255,255,255,.35); color: #eee; border-radius: 6px;
    font: 500 13px Inter, Arial, sans-serif; padding: 6px 12px; cursor: pointer; }
  #controls input { flex: 1; accent-color: #ffcf8a; }
  #controls span { font: 12px "JetBrains Mono", Menlo, monospace; color: #bbb; min-width: 84px; text-align: right; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" width="1920" height="1080"></canvas>
  <div id="controls" class="show"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0:00 / 2:28</span></div>
</div>
<audio id="score" src="soundtrack.m4a" preload="auto"></audio>
<script>
(() => {
'use strict';
/* =====================================================================
   STATISTICALLY LIKELY — a short film about fear, love & arithmetic.
   Everything is a pure function of time t (seconds), except the web of
   threads, which is simulated once up front. Any frame can be drawn in
   any order, so the renderer can split the film across workers.
   ===================================================================== */

const W = 1920, H = 1080, FPS = 30;
const canvas = document.getElementById('film');
const ctx = canvas.getContext('2d');

// ---------- utilities ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const smooth = k => k * k * (3 - 2 * k);
const win = (t, a, b, fi = .6, fo = .6) => {
  if (t <= a || t >= b) return 0;
  return Math.min(fi > 0 ? smooth(clamp((t - a) / fi)) : 1, fo > 0 ? smooth(clamp((b - t) / fo)) : 1);
};
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261026);
const R = (a, b) => a + (b - a) * rand();
function hash01(a, b = 0, c = 0) {
  let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x27d4eb2f, 0x165667b1);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const mix = (c1, c2, k) => [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a < 0 ? 0 : a > 1 ? 1 : a.toFixed(3)})`;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ---------- look ----------
const SERIF = "'Bitstream Charter', Charter, 'Iowan Old Style', Georgia, serif";
const SANS = "Inter, 'Helvetica Neue', Arial, sans-serif";
const MONO = "'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace";
const AMBER = [255, 178, 86], CYAN = [96, 206, 255], GOLD = [255, 240, 208], GOLD2 = [255, 210, 140];
const GRAY = [118, 128, 148], RED = [255, 62, 74], VIOLET = [196, 148, 255], TEXT = [238, 233, 224];
const ROSE = [255, 178, 160], DATA = [150, 162, 184];

// ---------- timeline (seconds) ----------
const T = {
  END: 148,
  fieldIn: 7.4, pEnter: 9.4, pArrive: 13.6,
  cardIn: 22.2, ringDur: 2.2,
  ghost1: 37.6, ghost2: 41.2,
  sortStart: 43.6, zoomStart: 44.0, zoomEnd: 50.6,
  fieldOut: 54.0, s2End: 55.0,
  mirrorIn: 55.2, mirrorOut: 85.4,
  famIn: 86.0, mobStart: 91.0, freeze: 98.0, fallStart: 98.4,
  flameIn: 100.4, flameOut: 110.6, famBack: 110.2, s4End: 119.2,
  cityIn: 119.0, doors: 124.4, zoomInStart: 128.0, zoomInEnd: 140.0,
  labelsIn: 131.6, endFade: 141.6, titleIn: 142.6, blackOut: 147.0,
};

// The comment, typed out. Its rhythm sets the timing of the second act.
const CPS = 32;
const CARD = [
  { text: 'If I could give young women one piece of advice when heading off to school, it’s to avoid men at all costs.', hi: 'avoid men at all costs.' },
  { text: 'Stick with your girlfriends. Party with your girlfriends. Study with your girlfriends.', hi: '' },
  { text: 'Reject any and all advances or offers from people statistically likely to do you harm.', hi: 'statistically likely' },
];
CARD[0].t0 = 22.6; CARD[0].t1 = CARD[0].t0 + CARD[0].text.length / CPS;
T.snap = CARD[0].t1 + 0.2;
CARD[1].t0 = T.snap + 0.9; CARD[1].t1 = CARD[1].t0 + CARD[1].text.length / CPS;
T.ringStart = CARD[1].t0 + 0.2;
CARD[2].t0 = CARD[1].t1 + 0.6; CARD[2].t1 = CARD[2].t0 + CARD[2].text.length / CPS;
T.grayStart = CARD[2].t0 + CARD[2].text.indexOf('statistically') / CPS;
T.cardOut = CARD[2].t1 + 1.6;

const CAPTIONS = [
  { t0: 10.2, t1: 14.2, lines: ['First week. New city. Everyone is a stranger.'] },
  { t0: 14.8, t1: 21.2, lines: ['Connection happens the way it always has —', 'by proximity, by accident, by courage.'], l2: 1.2 },
  { t0: 35.6, t1: 39.3, lines: ['The fear is real. The harm is real.'] },
  { t0: 39.6, t1: 43.5, lines: ['But a wall can’t tell a threat from a friend.'] },
  { t0: 43.9, t1: 46.8, lines: ['Now multiply it.'] },
  { t0: 47.1, t1: 50.3, lines: ['A campus of safe little circles.'] },
  { t0: 50.6, t1: 54.4, lines: ['…and a generation wondering why it feels so alone.'] },
  { t0: 87.2, t1: 91.4, lines: ['Somewhere, a man loves his wife, his kids —', 'and someone else.'], l2: 1.4 },
  { t0: 101.2, t1: 105.6, lines: ['A flame that lights another flame loses nothing.'] },
  { t0: 106.0, t1: 109.9, lines: ['Love isn’t a pie. It’s a fire.'] },
  { t0: 111.2, t1: 115.3, lines: ['The hurt is real.', 'So was the love.'], l2: 1.5 },
  { t0: 115.7, t1: 118.8, lines: ['Both can be true.'], size: 46 },
  { t0: 121.2, t1: 124.2, lines: ['Keep the boundaries.'] },
  { t0: 124.5, t1: 128.2, lines: ['Make them doors.'] },
  { t0: 128.6, t1: 132.8, lines: ['A person is not a probability.'] },
  { t0: 134.0, t1: 141.6, lines: ['Every one of us is statistically likely', 'to need each other.'], l2: 2.2, final: true },
];

const PAIRS = [
  ['We say we want deep connection', 'and flinch when it’s offered.'],
  ['We say we want non-violence', 'and lean on violent institutions.'],
  ['We say we want love', 'and punish lovability.'],
  ['We say we want honesty', 'and fear the truth.'],
  ['“Respect my privacy.”', '“What are you hiding?”'],
];
PAIRS.forEach((p, k) => { p.s = k < 4 ? 56.4 + k * 5.6 : 78.8; p.dur = k < 4 ? 5.6 : 6.8; p.flip = 2.0; });

const MOB_CAPTION = 'the internet, having met him zero times:';
const MOB_CAP_T0 = 91.6, MOB_CPS = 34;
const SHOUT_TEXT = ['IT WAS ALL A LIE', 'HE NEVER LOVED THEM', 'FRAUD', 'I BET HE NEVER LOVED HIS KIDS', 'DISGUSTING',
  'TOTAL SCAM', 'NEVER REAL', 'LIAR', 'NOBODY CAN LOVE TWO PEOPLE', 'WAKE UP', 'SHE DESERVES BETTER', 'SO FAKE',
  'WHAT ELSE IS HE HIDING', 'ALL OF IT WAS FAKE', 'THOSE KIDS MEANT NOTHING', 'PATHETIC', 'LOVE IS FINITE',
  'CANCEL HIM', 'IT WAS NEVER LOVE', 'TRASH', 'EVERY MEMORY = A LIE', 'BURN IT DOWN', 'I KNEW IT', 'COWARD', 'FAKE FAMILY', 'LIAR'];
const WORDS = ['friend', 'brother', 'lab partner', 'teammate', 'mentor', 'neighbor', 'best friend', 'study buddy',
  'roommate’s brother', 'a kind stranger', 'bandmate', 'dad', 'tutor', 'the one who listened'];

// =====================================================================
// WORLD: people as lights, sites as the circles they end up inside
// =====================================================================
const P_REST = [820, 560], R0 = 235, FINAL_Z = 0.8;
const people = [];
const sites = [];
let friends = [];

function jitterColor(c) { return [clamp(c[0] + R(-14, 10), 0, 255), clamp(c[1] + R(-14, 14), 0, 255), clamp(c[2] + R(-14, 10), 0, 255)]; }
function wobble(p, amp) {
  p.a1 = R(18, 44) * amp; p.w1 = R(0.10, 0.26); p.p1 = R(0, 6.28);
  p.a2 = R(6, 16) * amp; p.w2 = R(0.33, 0.7); p.p2 = R(0, 6.28);
  p.b1 = R(16, 40) * amp; p.v1 = R(0.09, 0.24); p.q1 = R(0, 6.28);
  p.b2 = R(6, 15) * amp; p.v2 = R(0.3, 0.66); p.q2 = R(0, 6.28);
  p.dA = R(30, 85); p.dw = R(0.018, 0.05); p.dp = R(0, 6.28);
}
function newPerson(hue, x, y, far) {
  const p = {
    id: people.length, hue, isP: false, far: !!far, hx: x, hy: y, r: R(2.6, 4.1),
    cluster: -1, assignT: Infinity, joinT: Infinity, joinDur: 1, slotX: x, slotY: y,
    rel: false, relT: Infinity, relDur: 1, appear: far ? -Infinity : T.fieldIn + R(0, 1.8),
    friend: false, grayT: Infinity, colorT: Infinity,
  };
  p.col = jitterColor(hue === 'A' ? AMBER : CYAN);
  wobble(p, 1);
  people.push(p);
  return p;
}

function pPos(t, out) {
  if (t < T.pEnter) { out[0] = -120; out[1] = 660; return out; }
  const k = ease(clamp((t - T.pEnter) / (T.pArrive - T.pEnter)));
  const u = 1 - k;
  const bx = u * u * -60 + 2 * u * k * 360 + k * k * P_REST[0];
  const by = u * u * 660 + 2 * u * k * 430 + k * k * P_REST[1];
  const w = smooth(clamp((t - T.pArrive + 1) / 2));
  out[0] = bx + w * (7 * Math.sin(0.5 * t) + 3 * Math.sin(1.3 * t + 1));
  out[1] = by + w * (6 * Math.sin(0.43 * t + 2) + 3 * Math.sin(1.1 * t));
  return out;
}

function ringProg(s, t) { return s.formT === -Infinity ? 1 : clamp((t - s.formT) / (s.id === 0 ? T.ringDur : 2.0)); }
function doorGap(s, t) { return easeOut(clamp((t - s.doorT) / 1.3)) * 0.46; }

function posAt(p, t, out) {
  if (p.isP) return pPos(t, out);
  let ax = p.hx + p.dA * Math.sin(t * p.dw + p.dp);
  let ay = p.hy + p.dA * Math.cos(t * p.dw * 0.8 + p.dp * 1.3);
  let amp = 1, joined = 0, relS = 0;
  if (p.friend && p.hue === 'B' && t > T.snap) {
    // after the advice, her friends of the other kind drift away
    const k = ease(clamp((t - T.snap - 0.4) / 4.5)), dx = p.hx - P_REST[0], dy = p.hy - P_REST[1], d = Math.hypot(dx, dy) || 1;
    ax = lerp(ax, P_REST[0] + dx / d * 450, k); ay = lerp(ay, P_REST[1] + dy / d * 450, k);
  }
  if (t > p.joinT) {
    joined = p.joinT === -Infinity ? 1 : ease(clamp((t - p.joinT) / p.joinDur));
    ax = lerp(ax, p.slotX, joined); ay = lerp(ay, p.slotY, joined); amp = lerp(1, 0.28, joined);
  }
  if (p.rel && t > p.relT) {
    relS = ease(clamp((t - p.relT) / p.relDur));
    const u = 1 - relS;
    ax = u * u * p.slotX + 2 * u * relS * p.ctrlX + relS * relS * p.tgtX;
    ay = u * u * p.slotY + 2 * u * relS * p.ctrlY + relS * relS * p.tgtY;
    amp = lerp(0.28, 0.65, relS);
  }
  let x = ax + amp * (p.a1 * Math.sin(p.w1 * t + p.p1) + p.a2 * Math.sin(p.w2 * t + p.p2));
  let y = ay + amp * (p.b1 * Math.sin(p.v1 * t + p.q1) + p.b2 * Math.sin(p.v2 * t + p.q2));
  // members stay inside their circle until a door opens
  if (p.cluster >= 0 && joined > 0.5 && relS < 0.02 && t < T.doors + 1.5) {
    const s = sites[p.cluster], dx = x - s.x, dy = y - s.y, d = Math.hypot(dx, dy), lim = s.R - 24;
    if (d > lim) { x = s.x + dx / d * lim; y = s.y + dy / d * lim; }
  }
  // everyone else is kept out of her circle
  if (p.cluster !== 0 && t > T.ringStart && t < T.doors) {
    const rex = (R0 + 46) * smooth(ringProg(sites[0], t));
    const dx = x - P_REST[0], dy = y - P_REST[1], d = Math.hypot(dx, dy) || 1;
    if (d < rex) { x = P_REST[0] + dx / d * rex; y = P_REST[1] + dy / d * rex; }
  }
  out[0] = x; out[1] = y;
  return out;
}

function clusterAt(p, t) { return p.cluster >= 0 && t >= p.assignT ? p.cluster : -1; }
function grayness(p, t) {
  if (p.hue !== 'B') return 0;
  let g = p.far ? 1 : smooth(clamp((t - p.grayT) / 1.6));
  if (t > p.colorT) g *= 1 - smooth(clamp((t - p.colorT) / 2.5));
  return g;
}
function presence(p, t) {
  if (p.far) return 1;
  if (p.isP) return smooth(clamp((t - T.pEnter) / 0.8));
  return smooth(clamp((t - p.appear) / 1.2));
}
function fieldAlpha(t) {
  if (t < 100) return win(t, T.fieldIn, T.s2End, 2.0, 1.0);
  let a = smooth(clamp((t - T.cityIn) / 2.0));
  if (t > T.endFade) a *= lerp(1, 0.2, smooth(clamp((t - T.endFade) / 2.0)));
  return a * (1 - smooth(clamp((t - 146.2) / 1.2)));
}
function camera(t) {
  if (t < T.zoomStart) return { z: 1, fx: 960, fy: 540 };
  if (t < 100) {
    const k = ease(clamp((t - T.zoomStart) / (T.zoomEnd - T.zoomStart)));
    return { z: Math.exp(lerp(0, Math.log(0.32), k)), fx: lerp(960, P_REST[0], k), fy: lerp(540, P_REST[1], k) };
  }
  const k = ease(clamp((t - T.zoomInStart) / (T.zoomInEnd - T.zoomInStart)));
  return { z: Math.exp(lerp(Math.log(0.32), Math.log(FINAL_Z), k)), fx: P_REST[0], fy: P_REST[1] + 70 * k };
}

function buildWorld() {
  // the protagonist
  people.push({ id: 0, hue: 'P', isP: true, far: false, col: GOLD, r: 5.6, cluster: 0, assignT: Infinity,
    joinT: Infinity, rel: false, relT: Infinity, appear: T.pEnter, friend: false, grayT: Infinity, colorT: Infinity });

  // a campus full of strangers
  const pts = [];
  let guard = 0;
  while (pts.length < 118 && guard++ < 50000) {
    const x = R(70, 1850), y = R(80, 1000);
    if (dist(x, y, P_REST[0], P_REST[1]) < 150) continue;
    if (pts.some(q => dist(q[0], q[1], x, y) < 72)) continue;
    pts.push([x, y]);
  }
  pts.forEach((q, i) => newPerson(i % 2 ? 'B' : 'A', q[0], q[1], false));

  // her first friends, of both kinds
  const byDist = people.slice(1).sort((a, b) => dist(a.hx, a.hy, ...P_REST) - dist(b.hx, b.hy, ...P_REST));
  const fa = byDist.filter(p => p.hue === 'A').slice(0, 3), fb = byDist.filter(p => p.hue === 'B').slice(0, 3);
  friends = [fa[0], fb[0], fa[1], fb[1], fa[2], fb[2]];
  friends.forEach((p, k) => {
    const ang = 0.35 + k * (Math.PI / 3) + R(-0.18, 0.18), d = R(185, 250);
    p.hx = P_REST[0] + Math.cos(ang) * d; p.hy = P_REST[1] + Math.sin(ang) * d;
    p.dA = R(8, 20); p.friend = true;
  });

  // sites: a hex grid of future circles around her
  const SP = 640;
  for (let gy = -3; gy <= 3; gy++) for (let gx = -5; gx <= 5; gx++) {
    let x = P_REST[0] + gx * SP + (gy & 1) * SP / 2, y = P_REST[1] + gy * SP * 0.9;
    const isZero = gx === 0 && gy === 0;
    if (!isZero) { x += R(-80, 80); y += R(-70, 70); }
    if (Math.abs(x - P_REST[0]) > 3350 || Math.abs(y - P_REST[1]) > 1950) continue;
    const local = x > -200 && x < W + 200 && y > -200 && y < H + 200;
    const s = { id: sites.length, x, y, R: isZero ? R0 : R(160, 198), hue: isZero ? 'A' : (rand() < 0.5 ? 'A' : 'B'),
      local, cap: isZero ? 99 : local ? 8 : Math.floor(R(5, 9)), members: [], formT: Infinity, doorT: Infinity, rot: R(0, 6.28) };
    if (isZero) sites.unshift(s); else sites.push(s);
  }
  sites.forEach((s, i) => s.id = i);

  // her circle, drawn when the advice lands
  const tmp = [0, 0];
  const ambers = people.filter(p => p.hue === 'A').map(p => {
    posAt(p, T.ringStart, tmp);
    return { p, d: dist(tmp[0], tmp[1], ...P_REST) - (p.friend ? 300 : 0) };
  }).sort((a, b) => a.d - b.d).slice(0, 6);
  people[0].assignT = T.ringStart;
  sites[0].formT = T.ringStart;
  ambers.forEach(({ p }, k) => {
    const ang = k * (Math.PI * 2 / 6) + R(-0.3, 0.3), d = R(85, 140);
    p.cluster = 0; p.assignT = T.ringStart; p.joinT = T.ringStart + R(0, 0.5); p.joinDur = R(2.2, 3.0);
    p.slotX = P_REST[0] + Math.cos(ang) * d; p.slotY = P_REST[1] + Math.sin(ang) * d;
    sites[0].members.push(p.id);
  });

  // everyone else sorts into circles of their own kind
  const free = people.filter(p => !p.isP && p.cluster < 0);
  const pairs = [];
  free.forEach(p => {
    posAt(p, T.sortStart, tmp);
    const px = tmp[0], py = tmp[1];
    sites.forEach(s => { if (s.id && s.hue === p.hue) pairs.push({ p, s, d: dist(px, py, s.x, s.y) }); });
  });
  pairs.sort((a, b) => a.d - b.d);
  pairs.forEach(({ p, s }) => {
    if (p.cluster >= 0 || s.members.length >= s.cap) return;
    p.cluster = s.id; p.assignT = T.sortStart; p.joinT = T.sortStart + R(0, 1.4); p.joinDur = R(4.0, 5.8);
    s.members.push(p.id);
  });
  sites.forEach(s => {
    if (!s.id) return;
    if (s.local) s.formT = T.sortStart + 1.6 + R(0, 1.0);
    else {
      s.formT = -Infinity;
      while (s.members.length < s.cap) {
        const fp = newPerson(s.hue, s.x, s.y, true);
        fp.cluster = s.id; fp.assignT = -Infinity; fp.joinT = -Infinity;
        s.members.push(fp.id);
      }
    }
    const n = s.members.length;
    s.members.forEach((id, k) => {
      const p = people[id], rr = s.R * 0.62 * Math.sqrt((k + 0.5) / n), a = k * 2.39996 + s.rot;
      p.slotX = s.x + Math.cos(a) * rr; p.slotY = s.y + Math.sin(a) * rr;
      if (p.far) { p.hx = p.slotX; p.hy = p.slotY; }
    });
  });

  // neighbours and doors
  sites.forEach(s => {
    s.nbrs = sites.filter(o => o !== s).sort((a, b) => dist(s.x, s.y, a.x, a.y) - dist(s.x, s.y, b.x, b.y)).slice(0, 3);
    s.dir = Math.atan2(s.nbrs[0].y - s.y, s.nbrs[0].x - s.x) + R(-0.25, 0.25);
    s.doorT = T.doors + dist(s.x, s.y, ...P_REST) / 2600;
  });

  // the fear arrives as a ripple; colour returns the same way
  people.forEach(p => {
    if (p.isP) return;
    if (p.hue === 'B' && !p.far) { posAt(p, T.grayStart, tmp); p.grayT = T.grayStart + dist(tmp[0], tmp[1], ...P_REST) / 3000; }
    const s = sites[p.cluster];
    if (!s) return;
    if (p.hue === 'B') p.colorT = T.doors + 1.0 + dist(s.x, s.y, ...P_REST) / 2600 + R(0, 0.8);
    const dP = dist(s.x, s.y, ...P_REST), roll = rand();
    let go = false;
    if (s.id === 0 ? roll < 0.5 : dP < 1500 && roll < 0.5) {
      // people come to meet her at her open circle (and her circle walks out to meet them)
      const ang = s.id === 0 ? Math.atan2(p.slotY - P_REST[1], p.slotX - P_REST[0]) + R(-0.4, 0.4)
        : Math.atan2(s.y - P_REST[1], s.x - P_REST[0]) + R(-0.55, 0.55);
      const rr = s.id === 0 ? R(R0 + 40, R0 + 190) : R(R0 + 60, R0 + 390);
      p.tgtX = P_REST[0] + Math.cos(ang) * rr; p.tgtY = P_REST[1] + Math.sin(ang) * rr * (Math.sin(ang) > 0 ? 0.72 : 0.9);
      go = true;
    } else if (rand() < 0.55) {

// =====================================================================
// THREADS: simulated once, then replayed as intervals
// =====================================================================
const threads = [];
const events = [];
const snapPos = new Map();

}
function threshold(a, b, t) {

// while her circle is closed, no thread between outsiders may pass through it

function simulate() {

    const t = s * STEP, cam = camera(t), fa = fieldAlpha(t);
    for (let i = 0; i < N; i++) { posAt(people[i], t, tmp); xs[i] = tmp[0]; ys[i] = tmp[1]; }
    for (const [key, th] of active) {
      const a = people[th.a], b = people[th.b];
      const d = dist(xs[th.a], ys[th.a], xs[th.b], ys[th.b]);
      let end = null;
      if (!allowed(a, b, t)) end = t < T.sortStart ? 'snap' : 'fade';
      else if (d > threshold(a, b, t) * th.aff * 1.3) end = 'fade';
      else if (crossesWall(a, b, t, xs[th.a], ys[th.a], xs[th.b], ys[th.b])) end = 'fade';
      if (end) {

      }
    }

      if (i > j) { const k = i; i = j; j = k; }

      if (active.has(key)) return;
      const a = people[i], b = people[j];
      if (deg[i] >= maxDeg(a, t) || deg[j] >= maxDeg(b, t)) return;
      const aff = affinity(a, b, t);
      if (aff <= 0) return;
      const le = lastEnd.get(key);
      if (le !== undefined && t - le < 2.0) return;
      if (!allowed(a, b, t)) return;
      if (dist(xs[i], ys[i], xs[j], ys[j]) > threshold(a, b, t) * aff) return;

}

// scripted sound cues for the score
function scriptedEvents() {
  const add = (t, type, extra = {}) => events.push(Object.assign({ t, type }, extra));
  add(1.5, 'title');
  CARD.forEach(c => { for (let i = 0; i < c.text.length; i++) if (c.text[i] !== ' ') add(c.t0 + i / CPS, 'key'); });
  for (let i = 0; i < MOB_CAPTION.length; i++) if (MOB_CAPTION[i] !== ' ') add(MOB_CAP_T0 + i / MOB_CPS, 'key');
  add(T.snap, 'bigsnap'); add(T.ringStart, 'ring'); add(T.ghost1 + 0.8, 'ghost'); add(T.ghost2 + 0.8, 'ghost');
  add(T.zoomStart, 'zoom'); add(T.mirrorIn + 0.1, 'mirror');
  PAIRS.forEach((p, k) => { add(p.s, 'pair', { k }); add(p.s + p.flip + 0.3, 'flip', { k }); });
  add(PAIRS[4].s + 4.7, 'glitch'); add(PAIRS[4].s + 5.6, 'collapse');

  add(100.6, 'flame');

// DRAWING

  g = vignette.getContext('2d');

// ---------- text helpers ----------

// ---------- title ----------

  dot(GOLD, 960, 430, 4.5, pa);
  ctx.globalCompositeOperation = 'source-over';

    const a = smooth(clamp((t - (1.5 + i * 0.075)) / 0.9));

// ---------- the field ----------

  const N = NP();
  if (!SX) { SX = new Float32Array(N); SY = new Float32Array(N); AL = new Float32Array(N); }
  const cols = new Array(N), grays = new Float32Array(N);

    const p = people[i];
    posAt(p, t, tmp);
    SX[i] = (tmp[0] - cam.fx) * z + W / 2; SY[i] = (tmp[1] - cam.fy) * z + H / 2;
    AL[i] = presence(p, t) * fa;

      const hit = Math.max(win(t, T.ghost1 + 0.8, T.ghost1 + 1.5, 0.05, 0.6), win(t, T.ghost2 + 0.8, T.ghost2 + 1.5, 0.05, 0.6));

  ctx.bezierCurveTo(x + w * 0.75, y - hh * 0.55, x + w, y, x, y + w * 0.25);
  const g = ctx.createRadialGradient(x, y - hh * 0.22, 0, x, y - hh * 0.3, hh * 0.95);
  g.addColorStop(0, rgba([255, 255, 244], alpha)); g.addColorStop(0.32, rgba([255, 218, 128], alpha * 0.95));
  g.addColorStop(0.72, rgba([255, 132, 52], alpha * 0.65)); g.addColorStop(1, rgba([255, 80, 30], 0));
  ctx.fillStyle = g; ctx.fill();
}
function candleBody(x, top, h, w, alpha, lit) {
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, rgba([92, 84, 78], alpha)); g.addColorStop(0.42, rgba([226, 216, 200], alpha)); g.addColorStop(1, rgba([86, 78, 74], alpha));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x - w / 2, top, w, h, [w * 0.3, w * 0.3, 3, 3]); ctx.fill();
  if (lit > 0) {
    const lg = ctx.createLinearGradient(0, top, 0, top + h * 0.6);
    lg.addColorStop(0, rgba([255, 190, 110], alpha * 0.45 * lit)); lg.addColorStop(1, rgba([255, 190, 110], 0));
    ctx.fillStyle = lg; ctx.beginPath(); ctx.roundRect(x - w / 2, top, w, h, [w * 0.3, w * 0.3, 3, 3]); ctx.fill();
  }
  ctx.strokeStyle = rgba([30, 24, 20], alpha); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top - 9); ctx.stroke();
}
function drawFlames(t) {
  const a = win(t, T.flameIn, T.flameOut, 0.9, 0.9);
  if (a <= 0) return;
  const grow = smooth(clamp((t - 100.5) / 0.9));
  candleBody(MAINC.x, MAINC.top, MAINC.h, MAINC.w, a * grow, 1);
  CANDLES.forEach((c, i) => candleBody(c.x, c.top, c.h, 16, a * 0.9 * smooth(clamp((t - 100.8 - i * 0.12) / 0.8)), smooth(clamp((t - IGN[i]) / 0.4))));
  ctx.globalCompositeOperation = 'lighter';
  flame(MAINC.x, MAINC.top - 8, 56 * grow, 13, t, 1.3, a);
  let lit = 1;
  CANDLES.forEach((c, i) => {
    const lt = t - IGN[i];
    if (lt > -0.55 && lt < 0) {
      const s = easeOut((lt + 0.55) / 0.55), sx = MAINC.x, sy = MAINC.top - 40, ex = c.x, ey = c.top - 12;
      const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 150;
      for (let q = 0; q < 6; q++) {
        const ss = clamp(s - q * 0.035), u = 1 - ss;
        glow([255, 230, 170], u * u * sx + 2 * u * ss * cx + ss * ss * ex, u * u * sy + 2 * u * ss * cy + ss * ss * ey, 14 - q * 1.6, a * (1 - q / 6));
      }
    }
    if (lt >= 0) {
      lit++;
      const pop = easeOut(clamp(lt / 0.35)) * (1 + 0.25 * Math.exp(-lt * 6) * Math.sin(lt * 30));
      flame(c.x, c.top - 8, 42 * pop, 10, t, 2 + i, a);
      if (lt < 0.6) glow([255, 240, 200], c.x, c.top - 20, 90, a * (1 - lt / 0.6));
    }
  });
  TINY.forEach(f => {
    const lt = t - f.t;
    if (lt < 0) return;
    lit++;
    flame(f.x, f.y, 16 * f.s * easeOut(clamp(lt / 0.3)), 4.5 * f.s, t, f.ph, a * 0.9);
    if (lt < 0.4) glow([255, 236, 190], f.x, f.y - 6, 34, a * (1 - lt / 0.4) * 0.7);
  });
  ctx.globalCompositeOperation = 'source-over';
  const ra = a * smooth(clamp((t - 101.3) / 0.6));
  if (ra > 0) {
    ctx.font = `20px ${MONO}`; ctx.textAlign = 'right'; ctx.fillStyle = rgba(DATA, ra * 0.85);
    ctx.fillText('original flame', 988, 748); ctx.fillText('total flames', 988, 780);
    ctx.textAlign = 'left'; ctx.fillStyle = rgba([255, 238, 214], ra);
    ctx.fillText('100%', 1010, 748); ctx.fillText(String(lit), 1010, 780);
    IGN.forEach(ti => {
      const lt = t - ti;
      if (lt < 0 || lt > 1.2) return;
      ctx.font = `16px ${MONO}`; ctx.fillStyle = rgba([255, 196, 150], ra * (1 - lt / 1.2));
      ctx.fillText('−0%', 1072, 746 - 34 * lt);
    });
  }
}

// ---------- captions & end ----------
function drawCaptions(t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  CAPTIONS.forEach(c => {
    if (t < c.t0 || t > c.t1) return;
    const a = win(t, c.t0, c.t1, 0.7, 0.6), n = c.lines.length, size = c.size || 38, lh = size * 1.4;
    const lastY = 950, y0 = lastY - (n - 1) * lh;
    // a soft pool of darkness so the words sit above the web
    ctx.font = `italic ${size}px ${SERIF}`;
    const tw = Math.max(...c.lines.map(l => ctx.measureText(l).width));
    ctx.save();
    ctx.translate(960, (y0 + lastY) / 2 - size * 0.35); ctx.scale(tw / 2 + 160, n * 34 + 46);
    const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    pool.addColorStop(0, `rgba(3,5,10,${0.62 * a})`); pool.addColorStop(0.6, `rgba(3,5,10,${0.38 * a})`); pool.addColorStop(1, 'rgba(3,5,10,0)');
    ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    c.lines.forEach((line, i) => {
      const d = i > 0 && c.l2 ? c.l2 : 0;
      const la = a * smooth(clamp((t - c.t0 - d) / 0.8));
      if (la <= 0) return;
      const dy = (1 - easeOut(clamp((t - c.t0 - d) / 0.9))) * 10;
      const fin = c.final && i === 1;
      ctx.font = `italic ${fin ? 50 : size}px ${SERIF}`;
      glowText(line, 960, y0 + i * lh + dy + (fin ? 6 : 0), fin ? GOLD2 : TEXT, la, fin ? 26 : 16);
    });
  });
}
function drawEnd(t) {
  if (t < T.titleIn) return;
  const out = smooth(clamp((147.6 - t) / 1.2));
  spacedText('STATISTICALLY LIKELY', 960, 548, `200 58px ${SANS}`, 18, TEXT, i => {
    const a = smooth(clamp((t - (T.titleIn + i * 0.05)) / 1.2));
    return [a * out, (1 - a) * 10];
  });
  ctx.font = `italic 27px ${SERIF}`; ctx.textAlign = 'center';
  ctx.fillStyle = rgba(GOLD2, win(t, T.titleIn + 1.3, 147.6, 1.2, 1.2) * 0.9);
  ctx.fillText('love is not a scarce resource', 960, 606);
}

function post(t) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(vignette, 0, 0);
  // a fixed dither, not moving grain: it stops banding in the dark gradients
  // without costing the encoder a new texture every frame
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = dither; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const black = Math.max(1 - smooth(clamp(t / 0.9)), smooth(clamp((t - T.blackOut) / 1.0)));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bgCanvas, 0, 0);
  drawTitle(t);
  drawField(t);
  drawCard(t);
  drawMirror(t);
  drawFamily(t);
  drawMob(t);
  drawFlames(t);
  drawCaptions(t);
  drawEnd(t);
  post(t);
}

// =====================================================================
// API + player
// =====================================================================
const ready = (async () => {
  try { await Promise.all([`200 84px ${SANS}`, `300 31px ${SANS}`, `italic 38px ${SERIF}`, `24px ${MONO}`].map(f => document.fonts.load(f))); } catch (e) {}
  buildWorld();
  buildPlates();
  simulate();
  scriptedEvents();
  pickLabeled();
  draw(0);
  return true;
})();

window.FILM = {
  ready, W, H, FPS, T, events, threads, people,
  frames: Math.round(T.END * FPS),
  draw,
  frame(i) { draw(i / FPS); },
  frameDataURL(i, type = 'image/png', q) { draw(i / FPS); return canvas.toDataURL(type, q); },
};

const params = new URLSearchParams(location.search);
if (params.has('render')) { document.body.classList.add('render'); return; }

const audio = document.getElementById('score'), playBtn = document.getElementById('play');
const scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let audioOK = false, playing = false, cur = 0, wall0 = 0, t0 = 0;
audio.addEventListener('canplaythrough', () => { audioOK = true; });
audio.addEventListener('error', () => { audioOK = false; });
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(on) {
  playing = on; playBtn.textContent = on ? 'Pause' : 'Play';
  document.getElementById('controls').classList.toggle('show', !on);
  if (on) {
    if (cur >= T.END - 0.05) cur = 0;
    wall0 = performance.now(); t0 = cur;
    if (audioOK) { audio.currentTime = cur; audio.play().catch(() => { audioOK = false; }); }
  } else audio.pause();
}
playBtn.onclick = () => setPlaying(!playing);
canvas.onclick = () => setPlaying(!playing);
scrub.oninput = () => {
  cur = scrub.value / 1000 * T.END; t0 = cur; wall0 = performance.now();
  if (audioOK) audio.currentTime = cur;
  draw(cur);
};
function tick() {
  if (playing) {
    cur = audioOK && !audio.paused ? audio.currentTime : t0 + (performance.now() - wall0) / 1000;
    if (cur >= T.END) { cur = T.END; setPlaying(false); }
    draw(cur);
    scrub.value = Math.round(cur / T.END * 1000);
  }
  clock.textContent = `${fmt(cur)} / ${fmt(T.END)}`;
  requestAnimationFrame(tick);
}
ready.then(() => requestAnimationFrame(tick));
})();
</script>
