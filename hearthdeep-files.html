<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hearthdeep Files</title>
<meta name="description" content="An animated storybook of thirteen emotional-introspection koans, set among the Quickfolk of Hearthdeep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one storybook leaf per koan, an animated plate (left, or top on phones) beside a
   D.E.E.P. Watch case-file page, turned like a real page. Dark-first: night pages by default,
   parchment pages in light mode. The plates are always underground, so they stay dark. */
:root{
  --bg:#050c0b; --bg-2:#0a1714; --paper:#0c1916; --paper-edge:#1c3a31;
  --ink:#efe6cf; --ink-soft:#c9bfa5; --muted:#8e8a72; --rule:#24443a;
  --accent:#43e3a1; --gold:#d8b25e; --alarm:#ff6a4d;
  --shadow:rgba(0,0,0,.55); --btn:rgba(239,230,207,.06); --btn-hi:rgba(239,230,207,.14);
  --plate:#050b0e; --hud:#43e3a1;
  --joy:#ffd447; --sad:#6bb6f0; --anger:#ff6a3a; --fear:#a58bff; --disgust:#86d46b; --love:#ff8fb8; --lamp:#ffd98a;
  --f-display:'Cinzel','Trajan Pro',Georgia,serif;
  --f-body:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --f-mono:'Share Tech Mono',Consolas,'Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e6dbc2; --bg-2:#d9cbaa; --paper:#f6efdc; --paper-edge:#d6c49b;
    --ink:#271f14; --ink-soft:#4d412d; --muted:#76684b; --rule:#cfba8d;
    --accent:#13704b; --gold:#8f6a1b; --alarm:#b23d1c;
    --shadow:rgba(70,48,12,.28); --btn:rgba(39,31,20,.05); --btn-hi:rgba(39,31,20,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e6dbc2; --bg-2:#d9cbaa; --paper:#f6efdc; --paper-edge:#d6c49b;
  --ink:#271f14; --ink-soft:#4d412d; --muted:#76684b; --rule:#cfba8d;
  --accent:#13704b; --gold:#8f6a1b; --alarm:#b23d1c;
  --shadow:rgba(70,48,12,.28); --btn:rgba(39,31,20,.05); --btn-hi:rgba(39,31,20,.12);
  color-scheme:light;
}

html{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg-2),var(--bg) 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:14px;min-height:38px;font-family:var(--f-mono);
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand{color:var(--ink-soft);white-space:nowrap}
.brand b{color:var(--accent);font-weight:400}
.topbar .spacer{flex:1}
.toplink{border:0;background:transparent;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;padding:8px 4px}
.toplink:hover{color:var(--ink)}

/* ---------- the book ---------- */
.stage{flex:1;min-height:0;position:relative;perspective:3400px;perspective-origin:50% 40%}
.leaf{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(320px,1fr);
  background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px 12px 12px 3px;
  box-shadow:0 18px 50px var(--shadow),inset 12px 0 18px -12px var(--shadow);overflow:hidden;
  transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.leaf.turn-out{z-index:3;animation:turnOut .95s cubic-bezier(.5,.05,.55,.95) forwards}
.leaf.turn-out::after{animation:shade .95s forwards}
.leaf.turn-in{z-index:3;animation:turnIn .95s cubic-bezier(.45,.05,.5,.95) forwards}
.leaf.turn-in::after{opacity:1;animation:shade .95s reverse forwards}
@keyframes turnOut{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnIn{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
@keyframes shade{from{opacity:0}to{opacity:1}}

/* ---------- plate ---------- */
.plate{position:relative;min-width:0;min-height:0;margin:14px 0 14px 14px;border-radius:4px;overflow:hidden;
  background:var(--plate);cursor:pointer;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 70%,transparent),0 0 0 5px var(--paper),
    0 0 0 6px color-mix(in srgb,var(--gold) 40%,transparent)}
.plate svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:10px;pointer-events:none;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--hud);
  text-shadow:0 0 8px color-mix(in srgb,var(--hud) 60%,transparent)}
.hud i{position:absolute;width:16px;height:16px;border:1.5px solid color-mix(in srgb,var(--hud) 70%,transparent)}
.hud .tl{top:0;left:0;border-right:0;border-bottom:0}.hud .tr{top:0;right:0;border-left:0;border-bottom:0}
.hud .bl{bottom:0;left:0;border-right:0;border-top:0}.hud .br{bottom:0;right:0;border-left:0;border-top:0}
.hud span{position:absolute;white-space:nowrap;background:rgba(2,12,12,.42);padding:2px 6px;border-radius:3px}
.hud .h-lab{top:5px;left:24px}.hud .h-read{top:5px;right:24px;text-align:right;transition:opacity .4s}
.hud .h-sig{bottom:5px;left:24px;opacity:.75}.hud .h-rec{bottom:5px;right:24px}
.hud .h-rec::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
  background:var(--alarm);vertical-align:1px;animation:recblink 1.6s steps(1) infinite}
@keyframes recblink{50%{opacity:0}}
.paused .hud .h-rec::before{animation:none;opacity:.35}
.paused .plate *{animation-play-state:paused!important}

/* ---------- text page ---------- */
.page{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;padding:24px 28px 0 30px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;cursor:pointer}
.file-tag{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--f-mono);font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.file-tag .cl{color:var(--muted)}
.title{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.2vw,34px);line-height:1.12;
  margin:.4em 0 .35em;letter-spacing:.02em;text-wrap:balance}
.lead{font-style:italic;font-size:clamp(16.5px,1.22vw,19px);line-height:1.45;color:var(--ink-soft);margin:0 0 1.05em;max-width:60ch}
.koan{font-size:clamp(19px,1.55vw,24.5px);line-height:1.52;font-weight:500;max-width:34em;margin:0;
  padding-top:.75em;border-top:1px solid var(--rule)}
.beat{opacity:.13;transition:opacity 1.1s ease,color 1.4s ease}
.beat.on{opacity:1;color:var(--ink-soft)}
.beat.now{color:var(--ink)}
.dropcap{float:left;font-family:var(--f-display);font-weight:700;font-size:3.05em;line-height:.8;
  padding:.07em .12em 0 0;color:var(--accent);text-transform:uppercase}
.beat-dots{display:flex;gap:6px;margin:16px 0 18px}
.beat-dots b{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background .4s,transform .4s}
.beat-dots b.on{background:var(--accent)}
.beat-dots b.now{transform:scale(1.5)}
.runes{flex:none;height:30px;display:flex;align-items:center;gap:0;overflow:hidden;color:var(--gold);
  border-top:1px solid var(--rule);opacity:.85}
.runes svg{flex:none;display:block}

/* cover page */
.cover-scroll{display:flex;flex-direction:column;align-items:flex-start}
.cover-scroll>*{order:5}.cover-scroll .file-tag{order:1}.cover-scroll .book-title{order:2}.cover-scroll .book-sub{order:3}.cover-scroll .lead{order:5}.cover-scroll .begin{order:6}.cover-scroll .hint{order:7}
.book-title{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,3.6vw,58px);line-height:1.02;
  margin:.3em 0 .2em;letter-spacing:.03em;text-wrap:balance}
.book-sub{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 1.3em;line-height:1.6}
.begin{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;font-size:17px;
  letter-spacing:.1em;padding:14px 24px;border-radius:999px;border:1px solid var(--accent);cursor:pointer;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--ink);transition:background .3s,transform .3s}
.begin:hover{background:color-mix(in srgb,var(--accent) 28%,transparent);transform:translateY(-1px)}
.begin svg{width:16px;height:16px}
.hint{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:16px 0 18px;line-height:1.7;max-width:46ch}

/* personnel files */
.dossier{display:grid;gap:0;margin:0;padding-top:.3em;border-top:1px solid var(--rule)}
.dcard{display:grid;grid-template-columns:8px minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px dashed var(--rule)}
.dcard .sw{border-radius:4px;background:var(--c)}
.dcard h3{margin:0;font-family:var(--f-display);font-size:15.5px;letter-spacing:.07em;font-weight:700}
.dcard .meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:.25em 0 .3em}
.dcard p{margin:0;font-size:17.5px;line-height:1.38;color:var(--ink-soft)}

/* epilogue */
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:12px 0 16px}
.key div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border:1px solid var(--rule);
  border-radius:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.key svg{color:var(--gold)}
.encode label{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.encode input{box-sizing:border-box;width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:8px;
  border:1px solid var(--rule);background:var(--btn);color:var(--ink)}
.encoded{min-height:30px;color:var(--gold);margin:10px 0 4px;overflow-x:auto;display:flex;flex-wrap:wrap;gap:0}
.again{margin:14px 0 22px}
.colophon{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);line-height:1.7;margin:0 0 18px}

/* ---------- controls ---------- */
.controls{flex:none;display:flex;align-items:center;gap:8px;min-height:50px}
.btn{appearance:none;flex:none;border:1px solid var(--rule);background:var(--btn);width:40px;height:40px;border-radius:999px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .2s}
.btn:hover{background:var(--btn-hi)}
.btn svg{width:17px;height:17px;display:block}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:3px;padding:0 6px}
.prog button{flex:1;min-width:0;height:24px;border:0;padding:0;background:transparent;cursor:pointer;position:relative}
.prog button::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;
  background:var(--rule);transition:background .3s,height .3s,margin .3s}
.prog button.done::before{background:color-mix(in srgb,var(--accent) 50%,var(--rule))}
.prog button.cur::before{background:var(--accent);height:5px;margin-top:-2.5px}
.count{flex:none;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- contents ---------- */
.toc{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.toc-card{box-sizing:border-box;width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--paper);
  border:1px solid var(--paper-edge);border-radius:10px;padding:20px 22px;box-shadow:0 20px 60px var(--shadow)}
.toc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toc-head h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.toc li button{width:100%;display:flex;gap:14px;align-items:baseline;text-align:left;border:0;background:transparent;
  padding:8px 10px;border-radius:6px;cursor:pointer;font-size:18.5px}
.toc li button:hover,.toc li button.cur{background:var(--btn-hi)}
.toc .no{flex:none;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--accent);min-width:5.2em}

/* ---------- phones and portrait tablets ---------- */
@media (max-width:820px),(max-aspect-ratio:4/5){
  .leaf{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(180px,47%) minmax(0,1fr)}
  .plate{margin:10px 10px 0}
  .page{padding:14px 14px 0 16px}
  .title{font-size:23px;margin:.3em 0 .25em}
  .lead{font-size:16px;margin-bottom:.8em}
  .koan{font-size:18.5px;line-height:1.48}
  .book-title{font-size:32px}
  .hud{font-size:9.5px;inset:7px}
  .hud .h-sig,.hud .h-lab{display:none}
  .hud .h-read{left:22px;right:22px;text-align:left;overflow:hidden;text-overflow:ellipsis;width:max-content;max-width:calc(100% - 44px);box-sizing:border-box}
  .cover-scroll .begin{order:4}
  .count{min-width:0}
}
@media (max-width:420px){ .brand .long{display:none} .toc-link-text{display:none} }
@media (max-height:520px) and (min-aspect-ratio:4/5){ .topbar{display:none} .page{padding-top:12px} .hud .h-lab,.hud .h-sig{display:none} }

@media (prefers-reduced-motion:reduce){
  .leaf.turn-out{animation:fadeOut .45s forwards}
  .leaf.turn-in{animation:fadeIn .45s forwards}
  .leaf.turn-out::after,.leaf.turn-in::after{animation:none}
  @keyframes fadeOut{to{opacity:0}} @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .plate svg *{animation-iteration-count:1!important}
}

/* ---------- shared SVG mechanics ---------- */
svg .pv{transform-box:view-box;transform-origin:0 0}
svg .cb{transform-box:fill-box;transform-origin:50% 50%}
svg .cbb{transform-box:fill-box;transform-origin:50% 100%}
svg .ctb{transform-box:fill-box;transform-origin:50% 0%}
svg text{font-family:var(--f-mono)}
.fade{transition:opacity 1s ease}
.char .act{transform-box:view-box;transform-origin:0 0;transition:transform 1.2s cubic-bezier(.45,.08,.3,1),opacity .9s ease}
.char .idle,.char .shake{transform-box:view-box;transform-origin:0 0}
.char .v{opacity:0;transition:opacity .22s}
.char .arm-l,.char .arm-r,.char .ear-l,.char .ear-r,.char .lan{transition:transform .6s cubic-bezier(.34,1.35,.5,1)}
.char .shadow{transition:opacity .6s}

/* idle loops (staggered so the cast never moves in lockstep) */
.c-glim .idle{animation:hover 3.1s ease-in-out infinite}
.c-ro .idle{animation:hover 4.3s ease-in-out -1.4s infinite}
.c-mere .idle{animation:sway 4.8s ease-in-out -.7s infinite}
.c-scorch .idle{animation:breathe 3.3s ease-in-out -.4s infinite}
.c-quiver .idle{animation:breathe 2.1s ease-in-out -1s infinite}
.c-pinch .idle{animation:breathe 3.9s ease-in-out -2.2s infinite}
.c-lamp .idle{animation:breathe 5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
.char.jitter .shake{animation:jitter .11s linear infinite}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(.9px,-.5px)}50%{transform:translate(-.8px,.4px)}75%{transform:translate(.5px,.7px)}100%{transform:translate(0,0)}}
.char.hop .shake{animation:hop .5s cubic-bezier(.3,0,.5,1) 3}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.char.bounce .shake{animation:hop .42s cubic-bezier(.3,0,.5,1) infinite}

/* blinking */
.char .e-open{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s infinite}
.c-glim .e-open{animation-delay:-1.2s}.c-mere .e-open{animation-delay:-3s;animation-duration:6.2s}
.c-scorch .e-open{animation-delay:-2.1s}.c-quiver .e-open{animation-duration:3.1s}
.c-pinch .e-open{animation-delay:-4s;animation-duration:7s}.c-ro .e-open{animation-delay:-.5s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* moods: each character ships face variants (.m-* mouths, .e-* eyes, .b-* brows) */
.mood-happy :is(.m-smile,.e-open),
.mood-laugh :is(.m-open,.e-happy),
.mood-sad :is(.m-frown,.e-open,.b-sad),
.mood-worried :is(.m-o,.e-open,.b-sad),
.mood-angry :is(.m-frown,.e-open,.b-angry),
.mood-grump :is(.m-flat,.e-open,.b-angry),
.mood-calm :is(.m-smile,.e-closed),
.mood-surprised :is(.m-o,.e-open),
.mood-flat :is(.m-flat,.e-open),
.mood-soft :is(.m-smile,.e-open,.b-sad){opacity:1}
.c-pinch.mood-flat .b-arch{opacity:1}
.c-pinch:is(.mood-flat,.mood-grump,.mood-sad,.mood-angry) .lids{opacity:1}

/* glows and auras */
.char .aura{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3.6s ease-in-out infinite;transition:opacity .8s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.char.dim .aura{opacity:.25}
.char.bright .aura{animation-duration:1.6s}

/* wings */
.c-glim .wing-l,.c-glim .wing-r{animation:flutter .13s ease-in-out infinite alternate}
.c-glim .wing-r{animation-delay:-.06s}
@keyframes flutter{from{transform:rotate(-10deg) scale(1,1)}to{transform:rotate(8deg) scale(.86,1)}}
.c-ro .wing-l{animation:flapL 2.6s ease-in-out infinite}.c-ro .wing-r{animation:flapR 2.6s ease-in-out infinite}
@keyframes flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg) scale(.94,1)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg) scale(.94,1)}}
.c-mere .gill-l{animation:gillL 3.2s ease-in-out infinite}.c-mere .gill-r{animation:gillR 3.2s ease-in-out infinite}
@keyframes gillL{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes gillR{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.c-quiver .tail{animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}

/* Scorch's crest grows with temper */
.c-scorch .flame-size{transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.c-scorch .flame{animation:flicker .5s ease-in-out infinite alternate}
.c-scorch .flame.f2{animation-duration:.37s;animation-delay:-.2s}.c-scorch .flame.f3{animation-duration:.43s;animation-delay:-.1s}
@keyframes flicker{from{transform:scale(1,1) skewX(0)}to{transform:scale(1.07,.88) skewX(4deg)}}
.c-scorch.mood-angry .flame-size{transform:scale(1.6)}
.c-scorch.mood-laugh .flame-size{transform:scale(1.25)}
.c-scorch.mood-calm .flame-size{transform:scale(.78)}
.c-scorch.mood-calm .flame{animation-duration:2.4s}
.c-scorch .crack{animation:embers 2.2s ease-in-out infinite}
@keyframes embers{0%,100%{opacity:.75}50%{opacity:1}}
.c-scorch.mood-angry .crack{animation-duration:.6s}

/* the Lamp's lantern */
.c-lamp .flame-l{transform-box:fill-box;transform-origin:50% 100%;animation:candle 1.4s ease-in-out infinite alternate}
@keyframes candle{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const r1 = n => Math.round(n * 10) / 10;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* The six Quickfolk and their signature light */
const EMO = {
  glim:   { c: '#ffd447', g: 'gwJoy',   name: 'Glim' },
  mere:   { c: '#6bb6f0', g: 'gwSad',   name: 'Mere' },
  scorch: { c: '#ff6a3a', g: 'gwAnger', name: 'Scorch' },
  quiver: { c: '#a58bff', g: 'gwFear',  name: 'Quiver' },
  pinch:  { c: '#86d46b', g: 'gwDis',   name: 'Pinch' },
  ro:     { c: '#ff8fb8', g: 'gwLove',  name: 'Ro' },
};
const SIX = ['glim', 'mere', 'scorch', 'quiver', 'pinch', 'ro'];

/* ================= Quickrune ================= */
/* An original 26-glyph cipher: five base forms x six marks. Every page hides a message in its ribbon. */
const RUNE_W = 13, RUNE_H = 18;
function runeBody(ch) {
  const n = ch.toUpperCase().charCodeAt(0) - 65;
  if (n < 0 || n > 25) return '<circle cx="6" cy="10" r="1.3" fill="currentColor"/>';
  const base = [
    '<circle cx="6" cy="10" r="4.1"/>',
    '<path d="M2 14.2 6 5.6l4 8.6Z"/>',
    '<path d="M2.4 6.3h7.2v7.4H2.4Z"/>',
    '<path d="M4 4.6v11M4 10.2l5.2-4.4"/>',
    '<path d="M6 4.4l4 5.6-4 5.6-4-5.6Z"/>',
  ][n % 5];
  const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="1.1" fill="currentColor" stroke="none"/>`;
  const mark = ['', dot(6, 1.8), '<path d="M2 17.4h8"/>', dot(6, 10.2), '<path d="M1.2 16 10.8 4"/>', dot(3.6, 1.8) + dot(8.4, 1.8)][Math.floor(n / 5)];
  return `<g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${base}${mark}</g>`;
}
function runeSVG(text, size = 1) {
  let x = 0, out = '';
  for (const c of String(text).toUpperCase()) {
    if (c === ' ') { x += 9; continue; }
    if (!/[A-Z]/.test(c) && c !== '.') continue;
    out += `<g transform="translate(${x} 0)">${runeBody(c)}</g>`;
    x += RUNE_W + 2;
  }
  x = Math.max(x, 1);
  return `<svg width="${r1(x * size)}" height="${r1(RUNE_H * size)}" viewBox="0 0 ${x} ${RUNE_H}" aria-hidden="true">${out}</svg>`;
}
function runeRibbon(msg) {
  const sep = '<svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M11 6l3 3-3 3-3-3Z" fill="currentColor"/></svg>';
  let s = '';
  for (let i = 0; i < 8; i++) s += runeSVG(msg) + sep;
  return s;
}

/* ================= sound (off until the reader turns it on) ================= */
const Sound = {
  ctx: null, out: null, on: false,
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const c = this.ctx;
    this.out = c.createGain(); this.out.gain.value = 0; this.out.connect(c.destination);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.7; lp.connect(this.out);
    [[73.42, 'sine', 0.07], [110, 'triangle', 0.02], [146.83, 'sine', 0.032], [220.5, 'sine', 0.012]].forEach(([f, type, g], i) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = (i - 1.5) * 5;
      const gg = c.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(lp); o.start();
    });

    const lg = c.createGain(); lg.gain.value = 220; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    return true;
  },
  set(on) {
    if (!this.init()) return false;
    this.on = on;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.out.gain.setTargetAtTime(on ? 0.6 : 0, this.ctx.currentTime, 0.5);
    return true;
  },
  chime(i = 0) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime;
    const notes = [587.33, 659.25, 739.99, 880, 987.77, 1174.66, 1318.51];
    const f = notes[((i % notes.length) + notes.length) % notes.length];
    [[f, 0.16, 2.8], [f * 2.01, 0.04, 1.3], [f * 3.02, 0.015, 0.7]].forEach(([fr, g, d]) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = fr;

    });

    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);

    s.connect(bp); bp.connect(g); g.connect(this.out); s.start(t);
  },
};

/* ================= scenery =================
   Scenes are drawn in a 1200 x 900 space; the plate crops to its frame, so the story stays inside
   x 150-1050, y 135-765. Props sit in an outer <g transform> with an inner classed <g> that scenes animate. */
let UID = 0;
function Sc(name) { this.p = name + '-' + (++UID); this.defs = []; this.n = 0; }
Sc.prototype.id = function () { return this.p + '-' + (this.n++); };
Sc.prototype.lin = function (stops, x1 = 0, y1 = 0, x2 = 0, y2 = 1) {
  const id = this.id();
  this.defs.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('')}</linearGradient>`);
  return `url(#${id})`;
};
Sc.prototype.rad = function (stops, cx = 0.5, cy = 0.5, r = 0.5) {
  const id = this.id();
  this.defs.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('')}</radialGradient>`);
  return `url(#${id})`;
};
Sc.prototype.glow = function (c, a = 0.55) { return this.rad([[0, c, a], [0.45, c, a * 0.35], [1, c, 0]]); };
Sc.prototype.def = function (markup) { this.defs.push(markup); };
Sc.prototype.wrap = function (body) { return `<defs>${this.defs.join('')}</defs>${body}`; };

const at = (x, y, cls, inner, s = 1, extra = '') =>
  `<g transform="translate(${x} ${y})${s !== 1 ? ` scale(${s})` : ''}"><g class="${cls}"${extra}>${inner}</g></g>`;
const sky = (S, a, b, c) => `<rect width="1200" height="900" fill="${S.lin([[0, a], [0.55, b], [1, c]])}"/>`;

function ridge(seed, { y = 620, amp = 50, step = 90, fill = '#0b1a1f', top = false, cls = '' } = {}) {
  const R = rng(seed), pts = [];
  for (let x = -90; x < 1290; x += step * (0.7 + R() * 0.6)) pts.push([x, y + (R() - 0.5) * 2 * amp]);
  pts.push([1300, y + (R() - 0.5) * 2 * amp]);
  const edge = top ? -20 : 920;
  let d = `M-90 ${edge}L-90 ${r1(pts[0][1])}`;
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [x, yy] = pts[i];
    d += `Q${r1(px)} ${r1(py)} ${r1((px + x) / 2)} ${r1((py + yy) / 2)}`;
  }
  d += `L1300 ${r1(pts[pts.length - 1][1])}L1300 ${edge}Z`;
  return `<path${cls ? ` class="${cls}"` : ''} d="${d}" fill="${fill}"/>`;
}
function spikes(seed, { n = 12, fill = '#081217', y = 0, len = [40, 170], w = [12, 34], x0 = -20, x1 = 1220, up = false } = {}) {
  const R = rng(seed); let d = '';
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * (i + R() * 0.8) / n, L = (len[0] + R() * (len[1] - len[0])) * (up ? -1 : 1), W = w[0] + R() * (w[1] - w[0]);
    d += `M${r1(x - W)} ${y}Q${r1(x - W * 0.25)} ${r1(y + L * 0.55)} ${r1(x)} ${r1(y + L)}Q${r1(x + W * 0.25)} ${r1(y + L * 0.55)} ${r1(x + W)} ${y}Z`;
  }
  return `<path d="${d}" fill="${fill}"/>`;
}
function spores(seed, n, col, { x0 = 0, x1 = 1200, y0 = 0, y1 = 900, r = [1, 2.6], cls = '' } = {}) {
  const R = rng(seed); let g = '';
  for (let i = 0; i < n; i++) {
    const d = 6 + R() * 8;
    g += `<circle class="spore" cx="${r1(x0 + R() * (x1 - x0))}" cy="${r1(y0 + R() * (y1 - y0))}" r="${r1(r[0] + R() * (r[1] - r[0]))}" fill="${col}" style="--d:${r1(d)}s;--dl:${r1(-R() * d)}s;--dx:${r1((R() - 0.5) * 70)}px;--dy:${r1(-(30 + R() * 100))}px"/>`;
  }
  return `<g class="spores ${cls}">${g}</g>`;
}
function stars(seed, n, { y1 = 500, col = '#fff6dc', cls = '' } = {}) {
  const R = rng(seed); let g = '';
  for (let i = 0; i < n; i++) g += `<circle class="star" cx="${r1(R() * 1200)}" cy="${r1(R() * y1)}" r="${r1(0.6 + R() * 1.6)}" fill="${col}" style="--d:${r1(2 + R() * 4)}s;--dl:${r1(-R() * 5)}s"/>`;
  return `<g class="${cls}">${g}</g>`;
}
function crystal(x, y, s, col, glowId, { rot = 0, cls = 'xtal', style = '' } = {}) {
  const prism = (h, w, a) => `<g transform="rotate(${a})"><path d="M0 0L${-w}${-h * 0.12}L${-w * 0.7}${-h}L0${-h * 1.15}L${w * 0.7}${-h}L${w}${-h * 0.12}Z" fill="${col}" opacity=".88"/>` +

/* small shared props for the middle files */
function isle(x, y, w, seed, cls = 'isle') {
  const R = rng(seed), h = w * 0.62, n = 8;
  let d = `M${-w / 2} 0`;
  for (let i = 1; i < n; i++) { const t = i / n; d += `L${r1(-w / 2 + w * t)} ${r1(h * Math.sin(Math.PI * t) * (0.65 + R() * 0.55))}`; }
  d += `L${w / 2} 0Z`;
  return at(x, y, cls, `<path d="${d}" fill="#15242c"/><path d="${d}" fill="url(#gRock)" opacity=".7"/>` +
    `<ellipse cx="0" cy="0" rx="${w / 2}" ry="${r1(w * 0.09)}" fill="#24413f"/><ellipse cx="0" cy="-2" rx="${r1(w / 2 - 6)}" ry="${r1(w * 0.065)}" fill="#3a6a5a"/>`);
}
function flower(x, y, s, col, cls = 'flw') {
  const pet = [0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-7" rx="3.6" ry="6.4" fill="${col}" transform="rotate(${a})"/>`).join('');

}
function starShape(x, y, r, cls = 'meaning') {

}
function cloud(x, y, s, col, cls) {

/* ---------- navigation ---------- */

  $$('#tocList button').forEach((b, k) => b.classList.toggle('cur', k === state.i));
  $('#prevBtn').disabled = state.i === 0;
  $('#nextBtn').disabled = state.i === SCENES.length - 1;
}
function setPlaying(p) {
  state.playing = p;
  $('#app').classList.toggle('paused', !p);
  const b = $('#playBtn');
  b.innerHTML = p ? ICON.pause : ICON.play;
  b.setAttribute('aria-label', p ? 'Pause' : 'Play');
}
const HASH = i => (SCENES[i].kind === 'cover' ? '' : SCENES[i].hash);
function syncHash(i) {
  const h = HASH(i);
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* sandboxed frames may refuse */ }
}
function themeNow() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function paintThemeBtn() {
  const dark = themeNow() === 'dark', b = $('#themeBtn');
  b.innerHTML = dark ? ICON.sun : ICON.moon;
  b.setAttribute('aria-label', dark ? 'Switch to parchment pages' : 'Switch to night pages');
}
function initChrome() {
  $('#prog').innerHTML = SCENES.map((s, k) => `<button type="button" aria-label="Page ${k + 1}: ${esc(s.title)}" title="${esc(s.title)}"></button>`).join('');
  $$('#prog button').forEach((b, k) => b.addEventListener('click', () => go(k)));
  $('#tocList').innerHTML = SCENES.map((s, k) => `<li><button type="button"><span class="no">${esc(s.tocNo)}</span><span>${esc(s.title)}</span></button></li>`).join('');
  $$('#tocList button').forEach((b, k) => b.addEventListener('click', () => { closeToc(); go(k); }));
  $('#prevBtn').addEventListener('click', () => go(state.i - 1, -1));
  $('#nextBtn').addEventListener('click', () => go(state.i + 1, 1));
  $('#playBtn').addEventListener('click', () => setPlaying(!state.playing));
  const paintSound = () => { const b = $('#soundBtn'); b.innerHTML = Sound.on ? ICON.soundOn : ICON.soundOff; b.setAttribute('aria-pressed', String(Sound.on)); b.setAttribute('aria-label', Sound.on ? 'Turn sound off' : 'Turn sound on'); };
  $('#soundBtn').addEventListener('click', () => { Sound.set(!Sound.on); paintSound(); });
  paintSound();
  $('#themeBtn').addEventListener('click', () => {
    const next = themeNow() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('hearthdeep-theme', next); } catch (e) { /* storage may be unavailable */ }
    paintThemeBtn();
  });
  try { const t = localStorage.getItem('hearthdeep-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  paintThemeBtn();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', paintThemeBtn);
  $('#tocBtn').addEventListener('click', openToc);
  $('#tocClose').addEventListener('click', closeToc);
  $('#toc').addEventListener('click', e => { if (e.target.id === 'toc') closeToc(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    if (!$('#toc').hidden) { if (e.key === 'Escape') closeToc(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? go(state.i + 1, 1) : advance(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.i - 1, -1); }
    else if (e.key === 'PageDown') { e.preventDefault(); go(state.i + 1, 1); }
    else if (e.key === 'PageUp') { e.preventDefault(); go(state.i - 1, -1); }
    else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); if (!state.started) start(); else setPlaying(!state.playing); }
    else if (e.key === 'Home') go(0, -1);
    else if (e.key === 'End') go(SCENES.length - 1, 1);
  });
  let sx = null, sy = 0;
  $('#stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#stage').addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(state.i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener('hashchange', () => { const k = SCENES.findIndex(s => s.hash === location.hash.slice(1)); go(k < 0 ? 0 : k); });
}
let tocReturn = null;
function openToc() { tocReturn = document.activeElement; $('#toc').hidden = false; ($('#tocList button.cur') || $('#tocList button')).focus(); }
function closeToc() { $('#toc').hidden = true; if (tocReturn && tocReturn.focus) tocReturn.focus(); }

/* test hook: jump straight to a page with its first k beats shown */
window.__jump = (idx, k = 0) => {
  state.started = true; state.i = idx;
  leaves[1 - front].hidden = true;
  mount(leaves[front], idx); leaves[front].hidden = false;
  startScene(idx);
  state.svg.classList.add('on');
  for (let n = 1; n <= Math.min(k, state.bs.length); n++) showBeat(n);
  if (k > state.bs.length) finishScene();
  state.t = k ? (k > state.bs.length ? state.sched.doneAt : state.sched.at[k - 1]) : 0;
};

function boot() {
  SCENES.forEach((s, k) => { s.n = k; });
  const st = document.createElement('style');
  st.textContent = SCENES.map(s => s.css || '').join('\n');
  document.head.appendChild(st);
  initChrome();
  setPlaying(true);
  const k = SCENES.findIndex(s => s.hash && s.hash === location.hash.slice(1));
  state.i = k > 0 ? k : 0;
  state.started = state.i > 0;
  mount(leaves[front], state.i);
  startScene(state.i);
  requestAnimationFrame(tick);
}
boot();
</script>
</body>
</html>
