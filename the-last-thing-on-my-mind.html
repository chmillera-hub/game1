<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A short film in light and sound: ninety-nine years, one bed, and the emotional family that lived inside me the whole time.">
<title>The Last Thing on My Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one full-bleed cinema screen; captions in the lower third; transport floats at the bottom edge */
:root {
  --night: #06070c;      /* the room before light */
  --parchment: #ece3d2;  /* caption ink: warm, like old paper in candlelight */
  --candle: #f3b66d;     /* the warm accent */
  --moon: #a9bde0;       /* cold, secondary */
  --dim: rgba(236, 227, 210, .58);
  --rule: rgba(236, 227, 210, .18);
  --f-voice: 'Cormorant Garamond', 'Cormorant', 'EB Garamond', Garamond, 'Times New Roman', serif;
  --f-ui: 'Jost', 'Futura', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--parchment); overflow: hidden; }
body { font-family: var(--f-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.idle { cursor: none; }
#stage { position: fixed; inset: 0; display: block; background: var(--night); }

/* film texture */
#grain { position: fixed; inset: -50%; pointer-events: none; opacity: .075; mix-blend-mode: overlay; animation: grain 0.9s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0, 0) } 20% { transform: translate(-4%, 3%) } 40% { transform: translate(3%, -5%) } 60% { transform: translate(-6%, -2%) } 80% { transform: translate(5%, 4%) } 100% { transform: translate(0, 0) } }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 120% 95% at 50% 46%, transparent 50%, rgba(0,0,0,.55) 100%), linear-gradient(to top, rgba(0,0,0,.42), transparent 30%); }
.lb { position: fixed; left: 0; right: 0; height: 0; background: #000; pointer-events: none; z-index: 2; }
#lb-top { top: 0; } #lb-bot { bottom: 0; }

/* captions */
#captions { position: fixed; left: 0; right: 0; bottom: max(7.5vh, calc(env(safe-area-inset-bottom, 0px) + 64px)); z-index: 3; pointer-events: none;
  display: grid; place-items: end center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.cap { grid-area: 1 / 1; margin: 0; max-width: min(94vw, 46ch); text-align: center; text-wrap: balance;
  font-family: var(--f-voice); font-weight: 400; font-style: italic; font-size: clamp(20px, 1.9vw + 9px, 38px); line-height: 1.24; letter-spacing: .005em;
  color: var(--parchment); text-shadow: 0 0 24px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9); }
.cap .w { display: inline-block; opacity: 0; will-change: opacity, transform; }
.cap { padding: .5em 1.6em; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.42), rgba(0,0,0,.22) 60%, transparent); }
.cap.big { font-style: normal; font-weight: 300; font-size: clamp(30px, 4.6vw + 10px, 72px); letter-spacing: .01em; max-width: 18ch; }
.cap.up { align-self: center; }
.cap.small { font-size: clamp(18px, 1.8vw + 8px, 30px); font-style: normal; letter-spacing: .02em; color: var(--dim); }
#captions { transition: bottom .45s ease; }
body.hud-on #captions { bottom: max(11vh, calc(env(safe-area-inset-bottom, 0px) + 112px)); }
@media (orientation: landscape) and (max-height: 500px) { #intro .inner { transform: none; gap: 10px; } #intro h1 { font-size: clamp(30px, 12vh, 56px); } #intro p.sub { font-size: 16px; } #btn-begin { padding: 11px 24px 11px 18px; } }
@media (orientation: portrait) { #captions { bottom: max(11vh, calc(env(safe-area-inset-bottom, 0px) + 84px)); } .cap { max-width: 26ch; font-size: clamp(19px, 5.2vw, 28px); } }

/* intro */
#intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse 80% 70% at 50% 62%, rgba(243,182,109,.06), transparent 60%), transparent; transition: opacity 1.4s ease, filter 1.4s ease; }
#intro.gone { opacity: 0; filter: blur(6px); pointer-events: none; }
#intro .inner { display: grid; gap: 22px; justify-items: center; max-width: 640px; transform: translateY(-6vh); }
#intro .eyebrow { font: 400 12px/1 var(--f-ui); letter-spacing: .32em; text-transform: uppercase; color: var(--dim); }
#intro h1 { margin: 0; font-family: var(--f-voice); font-weight: 300; font-size: clamp(40px, 7vw + 6px, 96px); line-height: .98; letter-spacing: -.005em; text-wrap: balance; }
#intro h1 em { font-style: italic; color: var(--candle); }
#intro p.sub { margin: 0; max-width: 42ch; font-family: var(--f-voice); font-style: italic; font-weight: 300; font-size: clamp(18px, 1.4vw + 10px, 24px); line-height: 1.4; color: var(--dim); text-wrap: balance; }
#btn-begin { margin-top: 10px; display: inline-flex; align-items: center; gap: 14px; padding: 15px 30px 15px 24px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(243,182,109,.45); background: rgba(243,182,109,.07); color: var(--parchment);
  font: 400 14px/1 var(--f-ui); letter-spacing: .26em; text-transform: uppercase; transition: background .3s, border-color .3s, box-shadow .3s; }
#btn-begin:hover { background: rgba(243,182,109,.14); border-color: rgba(243,182,109,.8); box-shadow: 0 0 40px rgba(243,182,109,.18); }
#btn-begin:focus-visible, #hud button:focus-visible, #btn-again:focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; }
#btn-begin .flame { width: 10px; height: 16px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 70%, #fff6e0 0 22%, var(--candle) 48%, rgba(243,120,40,.0) 72%); animation: flick 2.2s ease-in-out infinite; }
@keyframes flick { 0%,100% { transform: scale(1) rotate(-2deg) } 37% { transform: scale(1.06, .94) rotate(2deg) } 64% { transform: scale(.96, 1.05) rotate(-1deg) } }
#intro .meta { font: 300 12px/1.6 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: rgba(236,227,210,.42); }

/* transport */
#hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; opacity: 0; transition: opacity .6s ease; pointer-events: none;
  padding: 26px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(0,0,0,.6), transparent); }
#hud.show { opacity: 1; pointer-events: auto; }
#hud .row { display: flex; align-items: center; gap: 14px; }
#hud button { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: rgba(0,0,0,.25); color: var(--parchment); cursor: pointer; display: grid; place-items: center; padding: 0; }
#hud button:hover { border-color: rgba(236,227,210,.45); }
#hud svg { width: 16px; height: 16px; fill: currentColor; }
#btn-play[data-state="playing"] .i-play, #btn-play:not([data-state="playing"]) .i-pause { display: none; }
#btn-mute[data-state="muted"] .i-on, #btn-mute:not([data-state="muted"]) .i-off { display: none; }
#chap-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 400 11px/1 var(--f-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
#track { position: relative; height: 22px; margin-bottom: 8px; cursor: pointer; }
#track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); border-radius: 2px; }
#fill { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--candle); transform-origin: 0 50%; transform: scaleX(0); border-radius: 2px; }
#track .tick { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; padding: 0; border: 0; background: transparent; cursor: pointer; }
#track .tick::after { content: ""; position: absolute; left: 6px; top: 3px; width: 2px; height: 8px; background: rgba(236,227,210,.5); border-radius: 1px; }
#track .tick:hover::after { background: var(--candle); }

/* end card */
#end { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); z-index: 7; }
#btn-again { padding: 12px 24px; border-radius: 999px; border: 1px solid rgba(243,182,109,.45); background: rgba(0,0,0,.35); color: var(--parchment); cursor: pointer; font: 400 12px/1 var(--f-ui); letter-spacing: .26em; text-transform: uppercase; }
#btn-again:hover { background: rgba(243,182,109,.12); }
@media (prefers-reduced-motion: reduce) { #grain { animation: none; } }
</style>
</head>
<body>


<canvas id="stage" aria-label="Animated film: The Last Thing on My Mind" role="img"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="lb-top" class="lb" aria-hidden="true"></div>
<div id="lb-bot" class="lb" aria-hidden="true"></div>
<div id="captions" aria-live="polite"></div>

<section id="intro">
  <div class="inner">
    <div class="eyebrow">A short film in light and sound</div>
    <h1>The Last Thing<br>on <em>My Mind</em></h1>
    <p class="sub">Ninety-nine years, one bed, and the family that lived inside me the whole time.</p>
    <button id="btn-begin" type="button"><span class="flame" aria-hidden="true"></span>Begin</button>
    <div class="meta">Sound on &middot; About 5&frac12; minutes &middot; Headphones help</div>
  </div>
</section>

<div id="hud">
  <div id="track" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
  <div class="row">
    <button id="btn-play" type="button" aria-label="Pause" data-state="playing">
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
    </button>
    <div id="chap-label" data-k="-1"></div>
    <button id="btn-mute" type="button" aria-label="Mute" data-state="on">
      <svg class="i-on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3.5v11L5 10H2zM11 5.2a4 4 0 0 1 0 5.6l-.8-.8a2.9 2.9 0 0 0 0-4z"/></svg>
      <svg class="i-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3.5v11L5 10H2zM11 6l1 1 1-1 .8.8-1 1 1 1-.8.8-1-1-1 1-.8-.8 1-1-1-1z"/></svg>
    </button>
    <button id="btn-full" type="button" aria-label="Full screen">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h4v1.5H3.5V6H2zM10 2h4v4h-1.5V3.5H10zM2 10h1.5v2.5H6V14H2zM12.5 10H14v4h-4v-1.5h2.5z"/></svg>
    </button>
  </div>
</div>
<div id="end" hidden><button id="btn-again" type="button">Watch again</button></div>
<script>
"use strict";
// ---- 01-util.js
// ============================================================================
//  UTIL — math, easing, noise, keyframe tracks, seeded random
// ============================================================================
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
const range = (a, b, v) => smooth(inv(a, b, v));          // smooth 0..1 between a and b
const Ease = {
  linear: t => t,
  in: t => t * t * t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  back: t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  smooth, smoother,
};
// envelope: 0 before a, ramps to 1 by b, holds, ramps down from c to 0 at d
const env = (t, a, b, c, d) => t <= a || t >= d ? 0 : t < b ? smooth((t - a) / (b - a)) : t <= c ? 1 : smooth((d - t) / (d - c));

// Keyframe track: K([[t,v],[t,v,'ease'],...]) -> f(t). Ease on a key shapes the segment arriving at it.
function K(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const k = keys[i];
      if (t <= k[0]) {
        const p = keys[i - 1];
        const e = Ease[k[2] || 'inOut'];
        return lerp(p[1], k[1], e((t - p[0]) / (k[0] - p[0] || 1)));
      }
    }
    return keys[keys.length - 1][1];
  };
}

// Seeded RNG (mulberry32)
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 2D simplex noise (compact) — returns -1..1
const Noise = (() => {
  const R = rng(1337), p = new Uint8Array(512), g = [];
  const perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (R() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = R() * TAU; g.push([Math.cos(a), Math.sin(a)]); }
  const F2 = .5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  function n2(x, y) {
    const s = (x + y) * F2, i = Math.floor(x + s), j = Math.floor(y + s);
    const t = (i + j) * G2, x0 = x - (i - t), y0 = y - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, tt;
    tt = .5 - x0 * x0 - y0 * y0; if (tt > 0) { const q = g[p[ii + p[jj]]]; tt *= tt; n += tt * tt * (q[0] * x0 + q[1] * y0); }
    tt = .5 - x1 * x1 - y1 * y1; if (tt > 0) { const q = g[p[ii + i1 + p[jj + j1]]]; tt *= tt; n += tt * tt * (q[0] * x1 + q[1] * y1); }
    tt = .5 - x2 * x2 - y2 * y2; if (tt > 0) { const q = g[p[ii + 1 + p[jj + 1]]]; tt *= tt; n += tt * tt * (q[0] * x2 + q[1] * y2); }
    return 70 * n;
  }
  const n1 = x => n2(x, 0.5);
  const fbm = (x, y, o = 3) => { let v = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { v += a * n2(x * f, y * f); f *= 2; a *= .5; } return v; };
  return { n2, n1, fbm };
})();

// Colors
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// ---- 02-audio.js
// ============================================================================
//  AUDIO — fully procedural score + foley (Web Audio API)
//  The audio clock drives the film clock, so picture and sound never drift.
// ============================================================================
const Sound = (() => {
  let ac = null, master, comp, verb, epochBus, musicBus, sfxBus, verbSend, noiseBuf, duck, heartBus;
  let drone = null, warmth = null, wind = null, cold = null;
  let muted = false, ok = false;

  function makeIR(seconds, decay) {
    const rate = ac.sampleRate, len = Math.floor(rate * seconds);
    const buf = ac.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        // pre-delay + soft early reflections + smooth exponential tail, gently low-passed
        const early = i < rate * 0.08 ? (Math.random() < 0.004 ? (Math.random() * 2 - 1) * 0.6 : 0) : 0;
        const tail = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
        lp += (tail - lp) * (0.25 + 0.6 * (1 - t));
        d[i] = i < rate * 0.012 ? 0 : lp * 0.9 + early;
      }
    }
    return buf;
  }

  function init(offline) {
    if (ac && !offline) return ok;
    try {
      ac = offline || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
    } catch (e) { ac = null; return (ok = false); }
    epochBus = null;
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3.2;
    comp.attack.value = 0.02; comp.release.value = 0.35;
    master = ac.createGain(); master.gain.value = 0.0;
    // duck: a gate for the film's true silences (the freeze, 'When they die, I die'); the heartbeat bypasses it
    duck = ac.createGain(); duck.gain.value = 1;
    master.connect(duck); duck.connect(comp); comp.connect(ac.destination);
    heartBus = ac.createGain(); heartBus.gain.value = 1; heartBus.connect(comp);
    verb = ac.createConvolver(); verb.buffer = makeIR(5.5, 2.6);
    const verbRet = ac.createGain(); verbRet.gain.value = 0.85;
    verb.connect(verbRet); verbRet.connect(master);
    verbSend = ac.createGain(); verbSend.gain.value = 1; verbSend.connect(verb);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    newEpoch();
    buildBeds();
    ok = true;
    return ok;
  }

  // An "epoch" bus holds every scheduled voice. Seeking fades the old epoch out
  // (killing pending notes) and opens a fresh one.
  function newEpoch() {
    const now = ac.currentTime;
    if (epochBus) {
      const old = epochBus;
      old.gain.cancelScheduledValues(now);
      old.gain.setValueAtTime(old.gain.value, now);
      old.gain.linearRampToValueAtTime(0, now + 0.12);
      setTimeout(() => { try { old.disconnect(); } catch (e) { } }, 400);
    }
    epochBus = ac.createGain(); epochBus.gain.value = 1;
    musicBus = ac.createGain(); musicBus.gain.value = 1.8;
    sfxBus = ac.createGain(); sfxBus.gain.value = 1;
    const mv = ac.createGain(); mv.gain.value = 0.6;
    const sv = ac.createGain(); sv.gain.value = 0.35;
    musicBus.connect(epochBus); musicBus.connect(mv); mv.connect(verbSend);
    sfxBus.connect(epochBus); sfxBus.connect(sv); sv.connect(verbSend);
    epochBus.connect(master);
    if (duck) { duck.gain.cancelScheduledValues(now); duck.gain.setValueAtTime(1, now); }
  }

  // Continuous beds whose levels follow the picture every frame
  function buildBeds() {
    // Reaper drone: two beating low sines + growling filtered noise
    drone = { g: ac.createGain() };
    drone.g.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 0.7;
    [36.7, 38.1, 55.0].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = i === 2 ? 0.08 : 0.12;
      o.connect(g); g.connect(lp); o.start();
    });
    { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 73.4;
      const gl = ac.createBiquadFilter(); gl.type = 'lowpass'; gl.frequency.value = 320; gl.Q.value = 1.5;
      const g = ac.createGain(); g.gain.value = 0.16; o.connect(gl); gl.connect(g); g.connect(drone.g); o.start(); }
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 190; nb.Q.value = 1.2;
    const ng = ac.createGain(); ng.gain.value = 1.4;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ac.createGain(); lfoG.gain.value = 60;
    lfo.connect(lfoG); lfoG.connect(nb.frequency); lfo.start();
    n.connect(nb); nb.connect(ng); ng.connect(lp); n.start();
    lp.connect(drone.g); drone.g.connect(master);
    const dv = ac.createGain(); dv.gain.value = 0.4; drone.g.connect(dv); dv.connect(verbSend);

    // Room tone / night wind: very soft, airy
    wind = { g: ac.createGain() }; wind.g.gain.value = 0;
    const wn = ac.createBufferSource(); wn.buffer = noiseBuf; wn.loop = true; wn.playbackRate.value = 0.7;
    const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 500; wf.Q.value = 0.6;
    const wl = ac.createOscillator(); wl.frequency.value = 0.05;
    const wlg = ac.createGain(); wlg.gain.value = 260; wl.connect(wlg); wlg.connect(wf.frequency); wl.start();
    wn.connect(wf); wf.connect(wind.g); wind.g.connect(master); wn.start();

    // Warmth: a sustained, slowly breathing chord of sines (family presence)
    warmth = { g: ac.createGain(), oscs: [] };
    warmth.g.gain.value = 0;
    const wlp = ac.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 1600;
    [50, 57, 64, 69].forEach((m, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m);
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = mtof(m) * 1.003;
      const g = ac.createGain(); g.gain.value = 0.05 / (1 + i * 0.25);
      const trem = ac.createOscillator(); trem.frequency.value = 0.11 + i * 0.037;
      const tg = ac.createGain(); tg.gain.value = 0.025 / (1 + i * 0.25);
      trem.connect(tg); tg.connect(g.gain); trem.start();
      o.connect(g); o2.connect(g); g.connect(wlp); o.start(); o2.start();
      warmth.oscs.push(o, o2);
    });
    wlp.connect(warmth.g); warmth.g.connect(master);
    const wv = ac.createGain(); wv.gain.value = 0.7; warmth.g.connect(wv); wv.connect(verbSend);

    // Cold cluster: death's high glassy shimmer; its lowpass closes when it is 'behind the glass'
    cold = { g: ac.createGain(), lp: ac.createBiquadFilter() };
    cold.g.gain.value = 0; cold.lp.type = 'lowpass'; cold.lp.frequency.value = 9000; cold.lp.Q.value = 0.5;
    [1318.5, 1396.9, 1480.0].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const v = ac.createOscillator(); v.frequency.value = 0.27 + i * 0.05;
      const vg = ac.createGain(); vg.gain.value = f * 0.0035; v.connect(vg); vg.connect(o.frequency);
      const g = ac.createGain(); g.gain.value = 0.33;
      o.connect(g); g.connect(cold.lp); o.start(); v.start();
    });
    cold.lp.connect(cold.g); cold.g.connect(master);
    const cv_ = ac.createGain(); cv_.gain.value = 0.8; cold.g.connect(cv_); cv_.connect(verbSend);
  }

  function setBeds(dr, wa, wi, co = 0, cut = 9000) {
    if (!ok) return;
    bedsAt(ac.currentTime, dr, wa, wi, co, cut);
  }

  // offline export: bed levels addressed by absolute context time
  function bedsAt(time, dr, wa, wi, co = 0, cut = 9000) {
    drone.g.gain.setTargetAtTime(dr * 0.55, time, 0.25);
    warmth.g.gain.setTargetAtTime(wa * 0.28, time, 0.4);
    wind.g.gain.setTargetAtTime(wi * 0.05, time, 0.5);
    cold.g.gain.setTargetAtTime(co * 0.05, time, 0.3);
    cold.lp.frequency.setTargetAtTime(Math.max(200, cut), time, 0.35);
  }

  // ---------- helpers
  function envGain(when, peak, a, d, sustainLevel, holdEnd, r) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + a);
    if (d > 0) g.gain.setTargetAtTime(peak * sustainLevel, when + a, d / 3);
    g.gain.setValueAtTime(peak * sustainLevel, Math.max(when + a + 0.001, holdEnd));
    g.gain.exponentialRampToValueAtTime(0.0001, holdEnd + r);
    return g;
  }
  const pan = v => { const p = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain(); if (p.pan) p.pan.value = v; return p; };

  // ---------- instruments
  // Felt piano: triangle/sine partials with hammer softness and a closing filter
  function piano(when, midi, vel = 0.5, dur = 4, p = 0) {
    const f = mtof(midi);
    const out = pan(p); out.connect(musicBus);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.4;
    lp.frequency.setValueAtTime(Math.min(9000, f * 9), when);
    lp.frequency.exponentialRampToValueAtTime(Math.max(380, f * 1.6), when + Math.min(dur, 3.5));
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vel * 0.22, when + 0.012);
    g.gain.exponentialRampToValueAtTime(vel * 0.07, when + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    [[1, 1, 'triangle'], [2, 0.32, 'sine'], [3, 0.1, 'sine'], [4.02, 0.05, 'sine']].forEach(([m, a, type]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = f * m;
      o.detune.value = (Math.random() - 0.5) * 4;
      const og = ac.createGain(); og.gain.value = a;
      o.connect(og); og.connect(lp); o.start(when); o.stop(when + dur + 0.1);
    });
    // soft hammer felt
    const n = ac.createBufferSource(); n.buffer = noiseBuf;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = f * 3; nf.Q.value = 1;
    const ng = ac.createGain(); ng.gain.setValueAtTime(vel * 0.05, when); ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
    n.connect(nf); nf.connect(ng); ng.connect(lp); n.start(when, Math.random() * 2); n.stop(when + 0.08);
    lp.connect(g); g.connect(out);
  }

  // Warm pad: detuned saws -> breathing lowpass, long attack and release
  function pad(when, midis, dur, o = {}) {
    const vel = o.vel ?? 0.16, att = o.att ?? 2.5, rel = o.rel ?? 3.5, cut = o.cut ?? 900;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.9;
    lp.frequency.setValueAtTime(cut * 0.5, when);
    lp.frequency.linearRampToValueAtTime(cut, when + att);
    lp.frequency.linearRampToValueAtTime(cut * 0.6, when + dur + rel);
    const g = envGain(when, vel, att, 0, 1, when + dur, rel);
    const out = pan(o.pan ?? 0);
    lp.connect(g); g.connect(out); out.connect(musicBus);
    midis.forEach((m, i) => {
      const f = mtof(m);
      [-7, 6].forEach(c => {
        const osc = ac.createOscillator(); osc.type = o.type || 'sawtooth'; osc.frequency.value = f; osc.detune.value = c + (Math.random() - .5) * 3;
        const og = ac.createGain(); og.gain.value = 0.11 / Math.sqrt(midis.length);
        osc.connect(og); og.connect(lp); osc.start(when); osc.stop(when + dur + rel + 0.2);
      });
      if (i === 0 && !o.noSub) {
        const s = ac.createOscillator(); s.type = 'sine'; s.frequency.value = f / 2;
        const sg = ac.createGain(); sg.gain.value = 0.18;
        s.connect(sg); sg.connect(g); s.start(when); s.stop(when + dur + rel + 0.2);
      }
    });
  }

  // Strings-ish swell (bowed): saw + vibrato, slow bow
  function bowed(when, midi, dur, vel = 0.12, p = 0) {
    const f = mtof(midi);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(3200, f * 5); lp.Q.value = 0.5;
    const g = envGain(when, vel, Math.min(1.8, dur * 0.4), 0, 1, when + dur, Math.min(2.5, dur * 0.6));
    const out = pan(p);
    const vib = ac.createOscillator(); vib.frequency.value = 4.8 + Math.random() * 0.6;
    const vg = ac.createGain(); vg.gain.setValueAtTime(0, when); vg.gain.linearRampToValueAtTime(f * 0.004, when + dur * 0.5);
    vib.connect(vg);
    [0, 5].forEach(c => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c;
      vg.connect(o.frequency);
      const og = ac.createGain(); og.gain.value = 0.5;
      o.connect(og); og.connect(lp); o.start(when); o.stop(when + dur + 3);
    });
    vib.start(when); vib.stop(when + dur + 3);
    lp.connect(g); g.connect(out); out.connect(musicBus);
  }

  // Choir "ah": saw through formant filters, gentle vibrato
  function choir(when, midis, dur, vel = 0.1) {
    const formants = [[750, 1, 0.9], [1150, 0.5, 0.9], [2800, 0.18, 1.2]];
    const g = envGain(when, vel, 2.4, 0, 1, when + dur, 3.5);
    g.connect(musicBus);
    midis.forEach((m, i) => {
      const f = mtof(m);
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const vib = ac.createOscillator(); vib.frequency.value = 5 + i * 0.13;
      const vg = ac.createGain(); vg.gain.value = f * 0.006; vib.connect(vg); vg.connect(o.frequency);
      const p = pan((i / Math.max(1, midis.length - 1) - 0.5) * 0.8);
      formants.forEach(([ff, a, q]) => {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = ff / 90 * q;
        const bg = ac.createGain(); bg.gain.value = a * 0.6 / Math.sqrt(midis.length);
        o.connect(bp); bp.connect(bg); bg.connect(p);
      });
      p.connect(g);
      o.start(when); o.stop(when + dur + 4); vib.start(when); vib.stop(when + dur + 4);
    });
  }

  // Celesta / glass bell: FM sine
  function bell(when, midi, vel = 0.15, dur = 3, p = 0) {
    const f = mtof(midi);
    const c = ac.createOscillator(); c.type = 'sine'; c.frequency.value = f;
    const m = ac.createOscillator(); m.type = 'sine'; m.frequency.value = f * 3.5;
    const mg = ac.createGain(); mg.gain.setValueAtTime(f * 2.2, when); mg.gain.exponentialRampToValueAtTime(f * 0.05, when + dur * 0.5);
    m.connect(mg); mg.connect(c.frequency);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(vel * 0.25, when + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    const out = pan(p);
    c.connect(g); g.connect(out); out.connect(musicBus);
    c.start(when); m.start(when); c.stop(when + dur + 0.1); m.stop(when + dur + 0.1);
  }

  // Heartbeat: lub-dub with pitch drop
  function heart(when, amp = 0.5) {
    const out = ac.createGain(); out.gain.value = 1; out.connect(heartBus);
    const rv = ac.createGain(); rv.gain.value = 0.25; out.connect(rv); rv.connect(verbSend);
    [[0, 1], [0.24, 0.62]].forEach(([dt, a]) => {
      const t = when + dt;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(78, t); o.frequency.exponentialRampToValueAtTime(36, t + 0.14);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp * a, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
      o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
      // a body an octave up, and a soft knock, so small speakers hear it
      const o2 = ac.createOscillator(); o2.type = 'triangle';
      o2.frequency.setValueAtTime(156, t); o2.frequency.exponentialRampToValueAtTime(72, t + 0.14);
      const g2 = ac.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(amp * a * 0.35, t + 0.008); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t + 0.26);
      const n = ac.createBufferSource(); n.buffer = noiseBuf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 220; bp.Q.value = 1.2;
      const ng = ac.createGain(); ng.gain.setValueAtTime(amp * a * 0.25, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
      n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t, (t * 7.3) % 2); n.stop(t + 0.04);
    });
  }

  // Breath: filtered noise swell (inhale brighter, exhale darker and longer)
  function breath(when, dur, inhale, amp = 0.05) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(inhale ? 700 : 1100, when);
    bp.frequency.linearRampToValueAtTime(inhale ? 1500 : 500, when + dur);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 280;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(amp, when + dur * (inhale ? 0.6 : 0.25));
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    n.connect(bp); bp.connect(hp); hp.connect(g); g.connect(sfxBus);
    n.start(when, Math.random() * 1.5); n.stop(when + dur + 0.05);
  }

  // Clock: tick / tock
  function tick(when, tock = false, amp = 0.08) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = tock ? 1900 : 2600; bp.Q.value = 9;
    const g = ac.createGain(); g.gain.setValueAtTime(amp, when); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
    n.connect(bp); bp.connect(g); g.connect(sfxBus); n.start(when, Math.random()); n.stop(when + 0.06);
  }

  // Whoosh / transition swell
  function whoosh(when, dur = 2.5, amp = 0.12, up = true) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(up ? 180 : 3200, when);
    bp.frequency.exponentialRampToValueAtTime(up ? 3200 : 180, when + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(amp, when + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, when + dur);
    n.connect(bp); bp.connect(g); g.connect(sfxBus); n.start(when); n.stop(when + dur + 0.1);
  }

  // Low boom (impact / tug)
  function boom(when, amp = 0.5) {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(90, when); o.frequency.exponentialRampToValueAtTime(28, when + 0.9);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(amp, when + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, when + 1.6);
    o.connect(g); g.connect(sfxBus); o.start(when); o.stop(when + 1.7);
    const n = ac.createBufferSource(); n.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 0.9;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, when); ng.gain.linearRampToValueAtTime(amp * 0.6, when + 0.003); ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    n.connect(bp); bp.connect(ng); ng.connect(sfxBus); n.start(when, (when * 3.1) % 2); n.stop(when + 0.12);
    const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.setValueAtTime(160, when); o2.frequency.exponentialRampToValueAtTime(60, when + 0.12);
    const g2 = ac.createGain(); g2.gain.setValueAtTime(0.0001, when); g2.gain.linearRampToValueAtTime(amp * 0.4, when + 0.005); g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    o2.connect(g2); g2.connect(sfxBus); o2.start(when); o2.stop(when + 0.2);
  }

  // Rain: bright hiss with soft fades
  function rain(when, dur = 5, amp = 0.05) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6000; bp.Q.value = 0.4;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(amp, when + 0.6); g.gain.setValueAtTime(amp, when + dur - 0.6); g.gain.linearRampToValueAtTime(0.0001, when + dur);
    n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(sfxBus); n.start(when); n.stop(when + dur + 0.1);
  }

  // Gate: true silence (everything but the heartbeat), with quick clean fades
  function gate(when, dur, down = 0.012, up = 0.03, floor = 0.0001) {
    duck.gain.cancelScheduledValues(when);
    duck.gain.setValueAtTime(1, when);
    duck.gain.linearRampToValueAtTime(floor, when + down);
    duck.gain.setValueAtTime(floor, when + dur);
    duck.gain.linearRampToValueAtTime(1, when + dur + up);
  }

  // Cloth / creak: short filtered noise rub
  function rub(when, dur = 0.6, amp = 0.05, freq = 900, att = 0.3) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 2;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(amp, when + Math.min(dur * att, 0.4)); g.gain.linearRampToValueAtTime(0.0001, when + dur);
    n.connect(bp); bp.connect(g); g.connect(sfxBus); n.start(when, Math.random() * 2); n.stop(when + dur + 0.05);
  }

  // Wave wash (sea)
  function wave(when, dur = 4, amp = 0.08) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(300, when); lp.frequency.linearRampToValueAtTime(1400, when + dur * 0.45); lp.frequency.linearRampToValueAtTime(250, when + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(amp, when + dur * 0.45); g.gain.linearRampToValueAtTime(0.0001, when + dur);
    n.connect(lp); lp.connect(g); g.connect(sfxBus); n.start(when, Math.random() * 2); n.stop(when + dur + 0.1);
  }

  const INSTR = { piano, pad, bowed, choir, bell, heart, breath, tick, whoosh, boom, rub, wave, rain, gate };

  function play(ev, when, offset = 0) {
    if (!ok) return;
    const f = INSTR[ev.i];
    if (!f) return;
    const a = ev.a || [];
    if (offset > 0) {
      // joining a sustained event mid-way: shorten its duration (arg index 2 is dur for pad/choir, 1 for bowed)
      const b = a.slice();
      if (ev.i === 'pad') { b[1] = Math.max(0.5, b[1] - offset); b[2] = Object.assign({}, b[2], { att: 0.8 }); }
      else if (ev.i === 'choir') { b[1] = Math.max(0.5, b[1] - offset); }
      else if (ev.i === 'bowed') { b[1] = Math.max(0.5, b[1] - offset); }
      f(when, ...b);
      return;
    }
    f(when, ...a);
  }

  return {
    init, play, setBeds, bedsAt, newEpoch,
    get ok() { return ok; },
    get ctx() { return ac; },
    get time() { return ac ? ac.currentTime : 0; },
    resume() { if (ac && ac.state !== 'running') return ac.resume(); return Promise.resolve(); },
    suspend() { if (ac && ac.state === 'running') return ac.suspend(); return Promise.resolve(); },
    setMuted(m) { muted = m; if (ok) master.gain.setTargetAtTime(m ? 0 : 0.95, ac.currentTime, 0.08); },
    fadeIn() { if (ok && !muted) master.gain.setTargetAtTime(0.95, ac.currentTime, 0.3); },
    setMaster(v) { if (ok) master.gain.value = v; },
    get muted() { return muted; },
  };
})();

// ---- 03-draw.js
// ============================================================================
//  DRAW — reusable procedural primitives (sprites, light, figures, reaper)
// ============================================================================
const Draw = (() => {
  // ---- glow sprite cache: one soft radial dot per color, drawn with drawImage (fast)
  const spriteCache = new Map();
  function sprite(c, hard = 0) {
    const key = (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + '|' + hard;
    let s = spriteCache.get(key);
    if (s) return s;
    if (spriteCache.size > 512) spriteCache.delete(spriteCache.keys().next().value);
    s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    if (hard) {
      gr.addColorStop(0, rgba([255, 255, 255], 1));
      gr.addColorStop(0.18, rgba(mix(c, [255, 255, 255], 0.5), 0.9));
      gr.addColorStop(0.4, rgba(c, 0.35));
      gr.addColorStop(1, rgba(c, 0));
    } else {
      gr.addColorStop(0, rgba(c, 1));
      gr.addColorStop(0.25, rgba(c, 0.55));
      gr.addColorStop(0.6, rgba(c, 0.14));
      gr.addColorStop(1, rgba(c, 0));
    }
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    spriteCache.set(key, s);
    return s;
  }
  // additive glow at (x,y) radius r
  function glow(ctx, x, y, r, c, a = 1, hard = 0) {
    if (a <= 0.002 || r <= 0) return;
    const pa = ctx.globalAlpha, pc = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = pa * clamp(a);
    ctx.drawImage(sprite(c, hard), x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = pa; ctx.globalCompositeOperation = pc;
  }
  function radial(ctx, x, y, r0, r1, stops) {
    const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    return g;
  }

  // ---- two-bone IK: returns elbow point. bend = +1 / -1 chooses elbow side
  function ik(sx, sy, tx, ty, l1, l2, bend = 1) {
    let dx = tx - sx, dy = ty - sy;
    let d = Math.hypot(dx, dy);
    const maxD = (l1 + l2) * 0.965;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    const a = Math.atan2(dy, dx);

    const ang = a + bend * Math.acos(cosA);

        hand.moveTo(side * 270, -30); hand.quadraticCurveTo(side * 300, 110, side * 10, 118); hand.lineTo(side * 10, 88); hand.quadraticCurveTo(side * 250, 84, side * 236, -24); hand.closePath();
        const hg = ctx.createLinearGradient(0, -30, 0, 120);
        hg.addColorStop(0, rgba([255, 230, 190], 0)); hg.addColorStop(0.5, rgba([255, 230, 190], 0.16 * car)); hg.addColorStop(1, rgba([255, 240, 215], 0.3 * car));
        ctx.fillStyle = hg; ctx.fill(hand);
        for (let q = 0; q < 4; q++) { ctx.fillStyle = rgba([255, 236, 200], 0.14 * car); ctx.beginPath(); ctx.ellipse(side * (262 - q * 2), -40 - q * 16, 9, 20, side * 0.2, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
    }
    if (o.man && o.man.a > 0.01) {
      // the man, sitting at the stern, silhouette with a warm rim
      ctx.save(); ctx.translate(-170, -6); ctx.globalAlpha = o.man.a;
      ctx.fillStyle = 'rgb(10,9,12)';
      ctx.beginPath(); ctx.ellipse(0, -66, 13, 15, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, -48); ctx.quadraticCurveTo(-24, -10, -16, 6); ctx.lineTo(22, 6); ctx.quadraticCurveTo(26, -30, 16, -48); ctx.quadraticCurveTo(0, -56, -18, -48); ctx.fill();
      ctx.strokeStyle = rgba([255, 214, 170], 0.5); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -66, 13.5, -1.2, 1.0); ctx.stroke();
      // arm on the tiller, or both arms around the smallest light
      ctx.strokeStyle = 'rgb(10,9,12)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      if (car > 0.5) {
        const sm = fam.find(f => f.small);
        Draw.glow(ctx, 26, -40, 46, sm ? sm.c : [255, 240, 200], 0.7 * car);
        Draw.glow(ctx, 26, -40, 12, [255, 250, 235], 0.95 * car, 1);
        ctx.beginPath(); ctx.moveTo(10, -44); ctx.quadraticCurveTo(40, -48, 38, -26); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-8, -40); ctx.quadraticCurveTo(30, -12, 44, -34); ctx.stroke();
      } else { ctx.beginPath(); ctx.moveTo(10, -40); ctx.lineTo(34, -20); ctx.lineTo(-30, -2); ctx.stroke(); }
      ctx.restore();
    }
    // hull
    const hull = new Path2D();
    hull.moveTo(-230, -22); hull.quadraticCurveTo(-210, 34, -120, 40); hull.lineTo(150, 40);
    hull.quadraticCurveTo(220, 30, 250, -34); hull.lineTo(-230, -22); hull.closePath();
    const hg = ctx.createLinearGradient(0, -30, 0, 40);
    hg.addColorStop(0, 'rgb(46,30,24)'); hg.addColorStop(1, 'rgb(14,10,10)');
    ctx.fillStyle = hg; ctx.fill(hull);
    ctx.strokeStyle = 'rgba(255,220,180,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-228, -20); ctx.lineTo(248, -32); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    for (let k = 1; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-220 + k * 8, -20 + k * 18); ctx.quadraticCurveTo(0, -12 + k * 18, 240 - k * 14, -30 + k * 20); ctx.stroke(); }
    // lantern at the prow
    Draw.glow(ctx, 236, -60, 60, [255, 190, 110], 0.6);
    Draw.glow(ctx, 236, -60, 10, [255, 240, 210], 0.9, 1);
    ctx.strokeStyle = 'rgb(18,14,14)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(236, -34); ctx.lineTo(236, -52); ctx.stroke();
    // arms over the gunwale (carrying / being carried)
    figs.forEach(f => Draw.figureArms(ctx, f));
    ctx.restore();
    return { x: bx, y: y0, ang, sc };
  }

  // --------------------------------------------------------------- CURTAIN (screen space)
  // p: 0 open .. 1 closed. Warm stage light from the centre gap.
  function curtain(ctx, p, W, H, t, glowAmt = 1) {
    if (p <= 0.001) return;
    const half = W / 2, cover = half * Ease.inOut(clamp(p)) * 1.04;
    const velvet = [86, 14, 24];
    for (const side of [-1, 1]) {
      const x0 = side < 0 ? 0 : W - cover, x1 = side < 0 ? cover : W;
      ctx.save();
      const path = new Path2D();
      const edgeX = side < 0 ? x1 : x0;
      path.moveTo(side < 0 ? 0 : W, -10);
      path.lineTo(edgeX, -10);
      // edge sways slightly and gathers at the bottom
      for (let y = 0; y <= H + 20; y += 20) path.lineTo(edgeX + side * (Math.sin(y * 0.01 + t * 0.6) * 6 + (y / H) * 12) * (1 - p * 0.4), y);
      path.lineTo(side < 0 ? 0 : W, H + 20); path.closePath();
      ctx.clip(path);
      // folds: alternating light/dark vertical bands, compressed toward the outer edge
      const folds = 9;
      for (let i = 0; i < folds; i++) {
        const u0 = i / folds, u1 = (i + 1) / folds;
        const fx0 = side < 0 ? lerp(0, cover, Math.pow(u0, 0.8)) : lerp(W, W - cover, Math.pow(u0, 0.8));
        const fx1 = side < 0 ? lerp(0, cover, Math.pow(u1, 0.8)) : lerp(W, W - cover, Math.pow(u1, 0.8));
        const a = Math.min(fx0, fx1), b = Math.max(fx0, fx1);
        const g = ctx.createLinearGradient(a, 0, b, 0);
        const lit = 0.35 + 0.65 * (1 - u0) * 0 + 0.65 * u0; // brighter toward the gap
        g.addColorStop(0, rgba(mix(velvet, [0, 0, 0], 0.6), 1));
        g.addColorStop(0.45, rgba(mix(velvet, [255, 150, 110], 0.18 * lit), 1));
        g.addColorStop(1, rgba(mix(velvet, [0, 0, 0], 0.55), 1));
        ctx.fillStyle = g; ctx.fillRect(a, -10, b - a + 1, H + 30);
      }
      // warm spill near the gap
      const gx = side < 0 ? cover : W - cover;
      const sg = ctx.createLinearGradient(gx - side * 160, 0, gx, 0);
      sg.addColorStop(0, 'rgba(255,170,110,0)'); sg.addColorStop(1, rgba([255, 180, 120], 0.22 * glowAmt));
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = sg; ctx.fillRect(Math.min(gx, gx - side * 160), 0, 160, H);
      ctx.restore();
    }
    // valance across the top
    const vh = H * 0.09;
    const vg = ctx.createLinearGradient(0, 0, 0, vh);
    vg.addColorStop(0, rgba([40, 6, 12], 1)); vg.addColorStop(1, rgba([96, 18, 28], 1));
    ctx.fillStyle = vg;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, vh * 0.7);
    const sw = W / 8;
    for (let i = 8; i >= 0; i--) ctx.quadraticCurveTo(i * sw + sw / 2, vh * 1.25, i * sw, vh * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(230,180,90,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); for (let i = 0; i <= 8; i++) { const x = i * sw; i ? ctx.quadraticCurveTo(x - sw / 2, vh * 1.25, x, vh * 0.7) : ctx.moveTo(x, vh * 0.7); } ctx.stroke();
  }

  // --------------------------------------------------------------- SKY OF STARS (screen space)
  const SKY = Array.from({ length: 260 }, (_, i) => { const R = rng(500 + i); return { x: R(), y: R(), s: R(), p: R() * TAU }; });
  function starfield(ctx, a, W, H, t, drift = 0) {
    if (a <= 0.001) return;
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
    bg.addColorStop(0, rgba([22, 22, 48], a)); bg.addColorStop(1, rgba([3, 3, 9], a));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (const s of SKY) {
      const tw = 0.5 + 0.5 * Math.sin(t * (0.4 + s.s * 1.6) + s.p);
      const x = ((s.x + drift * (0.2 + s.s) * 0.02) % 1) * W, y = s.y * H;
      Draw.glow(ctx, x, y, 1.5 + s.s * 3.5, [225, 230, 255], a * (0.2 + 0.7 * tw) * (0.4 + s.s * 0.6), 1);
    }
    // faint nebula drift in the family's colours
    const neb = [[243, 182, 109], [111, 211, 196], [185, 162, 255]];
    neb.forEach((c, i) => Draw.glow(ctx, W * (0.3 + i * 0.22) + Noise.n1(t * 0.03 + i) * W * 0.05, H * (0.35 + (i % 2) * 0.15), Math.max(W, H) * 0.35, c, 0.06 * a));
  }

  return { makePlants, garden, fireflies, sea, curtain, starfield, waveY };
})();

// ============================================================================
//  SIL — shadow-puppet people for projected memories. Pose-driven skeleton,
//  drawn as solid silhouettes (source-over) so a whole scene can be composited
//  onto the wall as light, without bright overlaps at the joints.
//  pose angles are radians from hanging straight down; + swings toward `dir`.
// ============================================================================
const Sil = (() => {
  const POSES = {
    stand: { lean: 0, head: 0, ua: [0.08, -0.08], fa: [0.05, -0.05], th: [0.04, -0.04], sh: [0, 0] },
    shield: { lean: 0.12, head: -0.05, ua: [1.7, 1.25], fa: [0.15, 0.35], th: [0.3, -0.25], sh: [0, -0.15] },
    sit: { lean: -0.08, head: 0.08, ua: [0.5, 0.3], fa: [1.4, 1.2], th: [1.5, 1.45], sh: [-0.05, 0] },
    lean: { lean: 0.35, head: 0.25, ua: [0.9, 0.7], fa: [1.4, 1.2], th: [0.05, -0.1], sh: [0, 0] },
    bow: { lean: 0.42, head: 0.35, ua: [0.25, 0.2], fa: [0.2, 0.15], th: [0, 0], sh: [0, 0] },
    cane: { lean: 0.32, head: 0.15, ua: [0.55, -0.05], fa: [0.15, 0.05], th: [0.12, -0.08], sh: [0, 0.05] },
    reach: { lean: 0.15, head: 0.05, ua: [1.2, 0.2], fa: [1.3, 0.1], th: [0.1, -0.1], sh: [0, 0] },
    hold: { lean: 0.05, head: 0.3, ua: [0.55, 0.5], fa: [1.7, 1.6], th: [0.04, -0.04], sh: [0, 0] },
    lie: { lean: 0, head: 0, ua: [0.1, 0.05], fa: [1.6, 0.05], th: [0, 0], sh: [0, 0] },
  };
  function walkPose(ph, run = 0) {
    const a = 0.42 + run * 0.3, s = Math.sin(ph);
    return { lean: 0.06 + run * 0.15, head: 0, ua: [s * a * 0.9, -s * a * 0.9], fa: [Math.max(0, s) * 0.5 + 0.2 + run * 0.6, Math.max(0, -s) * 0.5 + 0.2 + run * 0.6],
      th: [-s * a, s * a], sh: [-Math.max(0, Math.cos(ph)) * 0.9 * (0.5 + run), -Math.max(0, -Math.cos(ph)) * 0.9 * (0.5 + run)], bob: Math.abs(Math.cos(ph)) * 0.02 };
  }
  function mixPose(a, b, k) {
    const o = {};
    for (const key of ['lean', 'head', 'bob']) o[key] = lerp(a[key] || 0, b[key] || 0, k);
    for (const key of ['ua', 'fa', 'th', 'sh']) o[key] = [lerp(a[key][0], b[key][0], k), lerp(a[key][1], b[key][1], k)];
    return o;
  }
  // person: feet at (x,y), height h, facing dir (+1 right). child=true gives a child's proportions.
  // returns joint positions (hands, head) so props can attach.
  function person(ctx, x, y, h, pose, dir = 1, o = {}) {
    const P = typeof pose === 'string' ? POSES[pose] : pose;
    const child = o.child ? 1 : 0;
    const legL = h * lerp(0.47, 0.4, child), torso = h * lerp(0.31, 0.3, child), hr = h * lerp(0.068, 0.1, child);
    const out = {};
    const pt = (x0, y0, ang, len) => [x0 + Math.sin(ang) * len * dir, y0 + Math.cos(ang) * len];
    const sitting = P.th[0] > 1.2;
    const hip = [x, y - (sitting ? legL * 0.52 : legL) - (P.bob || 0) * h];
    // legs
    for (let i = 0; i < 2; i++) {
      const knee = pt(hip[0], hip[1], P.th[i], legL * 0.52);
      const foot = pt(knee[0], knee[1], P.th[i] + P.sh[i] - (sitting ? 1.5 : 0), legL * 0.5);
      Draw.taper(ctx, Draw.crPts([hip, knee, foot], 5), h * 0.075, h * 0.034); ctx.fill();
      ctx.beginPath(); ctx.ellipse(foot[0] + dir * h * 0.025, foot[1], h * 0.04, h * 0.016, 0, 0, TAU); ctx.fill();
    }
    // torso
    const neck = [hip[0] + Math.sin(P.lean) * torso * dir, hip[1] - Math.cos(P.lean) * torso];
    const nx = Math.cos(P.lean) * dir, ny = Math.sin(P.lean) * dir;  // across-body direction
    const sw = h * 0.085, hw = h * 0.07;
    ctx.beginPath();
    ctx.moveTo(neck[0] - nx * sw * 0.4, neck[1] - ny * sw * 0.4);
    ctx.quadraticCurveTo(neck[0] - nx * sw * 1.1, neck[1] - ny * sw * 1.1 + h * 0.01, lerp(neck[0], hip[0], 0.45) - nx * hw * 0.9, lerp(neck[1], hip[1], 0.45));
    ctx.lineTo(hip[0] - nx * hw, hip[1] - ny * hw + h * 0.02);
    ctx.lineTo(hip[0] + nx * hw, hip[1] + ny * hw + h * 0.02);
    ctx.lineTo(lerp(neck[0], hip[0], 0.45) + nx * hw * 0.9, lerp(neck[1], hip[1], 0.45));
    ctx.quadraticCurveTo(neck[0] + nx * sw * 1.1, neck[1] + ny * sw * 1.1 + h * 0.01, neck[0] + nx * sw * 0.4, neck[1] + ny * sw * 0.4);
    ctx.closePath(); ctx.fill();
    if (o.skirt) { ctx.beginPath(); ctx.moveTo(hip[0] - h * 0.07, hip[1] - h * 0.03); ctx.lineTo(hip[0] + h * 0.07, hip[1] - h * 0.03); ctx.lineTo(hip[0] + h * 0.11, hip[1] + h * 0.2); ctx.lineTo(hip[0] - h * 0.11, hip[1] + h * 0.2); ctx.fill(); }
    // head
    const hd = [neck[0] + Math.sin(P.lean + P.head) * hr * 1.35 * dir, neck[1] - Math.cos(P.lean + P.head) * hr * 1.35];
    ctx.beginPath(); ctx.ellipse(hd[0], hd[1], hr * 0.88, hr, (P.lean + P.head) * dir, 0, TAU); ctx.fill();
    ctx.fillRect(neck[0] - h * 0.016, neck[1] - hr * 0.5, h * 0.032, hr * 0.7);
    if (o.hat) { ctx.beginPath(); ctx.ellipse(hd[0], hd[1] - hr * 0.7, hr * 1.5, hr * 0.25, 0, 0, TAU); ctx.fill(); ctx.fillRect(hd[0] - hr * 0.7, hd[1] - hr * 1.5, hr * 1.4, hr * 0.85); }
    if (o.hair === 'long') { ctx.beginPath(); ctx.ellipse(hd[0] - dir * hr * 0.4, hd[1] + hr * 0.6, hr * 0.6, hr * 1.2, 0, 0, TAU); ctx.fill(); }
    // arms
    const shoulder = [neck[0] + Math.sin(P.lean) * h * 0.012 * dir, neck[1] + h * 0.03];
    out.hands = [];
    for (let i = 0; i < 2; i++) {
      const s0 = [shoulder[0] + (i ? 1 : -1) * nx * h * 0.035, shoulder[1]];
      const el = pt(s0[0], s0[1], P.ua[i] + P.lean, h * 0.165);
      const hn = pt(el[0], el[1], P.ua[i] + P.fa[i] + P.lean, h * 0.15);
      Draw.taper(ctx, Draw.crPts([s0, el, hn], 5), h * 0.05, h * 0.026); ctx.fill();
      ctx.beginPath(); ctx.arc(hn[0], hn[1], h * 0.02, 0, TAU); ctx.fill();
      out.hands.push(hn);
    }
    out.head = hd; out.neck = neck; out.hip = hip;
    return out;
  }
  return { POSES, walkPose, mixPose, person };
})();

// ---- 05b-theatre.js
// ============================================================================
//  THEATRE — the room is a set on a stage: proscenium, traveller curtain,
//  spotlight, ghost light, the house, act cards, and death's vaudeville hook.
//  World units as the room: stage floor y=190, lip at y=300.
// ============================================================================
const Theatre = (() => {
  const OPEN = { x0: -820, x1: 820, y0: -760, y1: 300 };   // proscenium opening
  const LIP = 300;
  const VELVET = [90, 14, 26];

  // spotlight from the fly gallery onto the bed: cone + pool
  function spot(ctx, k, c = [255, 227, 176], o = {}) {
    if (k <= 0.003) return;
    const sx = o.x ?? -40, sy = -1300, px = o.px ?? -30, py = 196, rx = o.rx ?? 560;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const cone = ctx.createLinearGradient(0, sy, 0, py);
    cone.addColorStop(0, rgba(c, 0.0)); cone.addColorStop(0.35, rgba(c, 0.05 * k)); cone.addColorStop(1, rgba(c, 0.09 * k));
    ctx.fillStyle = cone;
    ctx.beginPath(); ctx.moveTo(sx - 40, sy); ctx.lineTo(sx + 40, sy); ctx.lineTo(px + rx, py); ctx.lineTo(px - rx, py); ctx.closePath(); ctx.fill();
    // pool on the floor
    ctx.save(); ctx.translate(px, py + 18); ctx.scale(1, 0.13);
    const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.05);
    pool.addColorStop(0, rgba(c, 0.32 * k)); pool.addColorStop(0.7, rgba(c, 0.16 * k)); pool.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0, 0, rx * 1.05, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // the house curtain (traveller), drawn in world space inside the proscenium.
  // p: 0 open .. 1 closed. light: how much warm light falls on it from the stage.
  function traveller(ctx, p, t, o = {}) {
    if (p <= 0.001) return;
    const W = OPEN.x1 - OPEN.x0, half = W / 2, cover = half * clamp(p) * 1.02;
    const lightX = o.lightX ?? 0, light = o.light ?? 0.4, ghost = o.ghost ?? 0;
    for (const side of [-1, 1]) {
      const outer = side < 0 ? OPEN.x0 : OPEN.x1, inner = outer - side * cover;
      const a = Math.min(outer, inner), b = Math.max(outer, inner);
      ctx.save();
      const path = new Path2D();
      path.moveTo(outer, OPEN.y0 - 20);
      path.lineTo(inner, OPEN.y0 - 20);
      for (let y = OPEN.y0; y <= LIP + 4; y += 30) {
        const sway = Math.sin(y * 0.006 + t * 0.7 + side) * 6 * (1 - p * 0.5) + (y - OPEN.y0) / (LIP - OPEN.y0) * 14 * side * -1;
        path.lineTo(inner + sway, y);
      }
      path.lineTo(outer, LIP + 4); path.closePath();
      ctx.clip(path);
      // folds: compressed toward the outer edge
      const folds = 26;
      for (let i = 0; i < folds; i++) {
        const u0 = i / folds, u1 = (i + 1) / folds;
        const x0 = side < 0 ? lerp(a, b, Math.pow(u0, 1.15)) : lerp(b, a, Math.pow(u0, 1.15));
        const x1 = side < 0 ? lerp(a, b, Math.pow(u1, 1.15)) : lerp(b, a, Math.pow(u1, 1.15));
        const l = Math.min(x0, x1), r = Math.max(x0, x1);
        const g = ctx.createLinearGradient(l, 0, r, 0);
        g.addColorStop(0, rgba(mix(VELVET, [0, 0, 0], 0.62), 1));
        g.addColorStop(0.42, rgba(mix(VELVET, [255, 140, 110], 0.12), 1));
        g.addColorStop(0.6, rgba(VELVET, 1));
        g.addColorStop(1, rgba(mix(VELVET, [0, 0, 0], 0.55), 1));
        ctx.fillStyle = g; ctx.fillRect(l, OPEN.y0 - 30, r - l + 1, LIP - OPEN.y0 + 40);
      }
      // light on the velvet: stage spill near the gap, the ghost light from below
      ctx.globalCompositeOperation = 'lighter';
      const gx = inner;
      const sg = ctx.createLinearGradient(gx - side * 260, 0, gx, 0);
      sg.addColorStop(0, 'rgba(255,170,110,0)'); sg.addColorStop(1, rgba([255, 186, 130], 0.2 * light));
      ctx.fillStyle = sg; ctx.fillRect(Math.min(gx, gx - side * 260), OPEN.y0 - 30, 260, LIP - OPEN.y0 + 40);
      if (ghost > 0) {
        const gg = ctx.createRadialGradient(0, 150, 10, 0, 150, 760);
        gg.addColorStop(0, rgba([255, 200, 140], 0.34 * ghost)); gg.addColorStop(1, 'rgba(255,200,140,0)');
        ctx.fillStyle = gg; ctx.fillRect(OPEN.x0, OPEN.y0, W, LIP - OPEN.y0 + 10);
      }
      // footlight warmth along the hem
      const fg = ctx.createLinearGradient(0, LIP, 0, LIP - 300);
      fg.addColorStop(0, rgba([255, 194, 122], 0.14 * (o.foot ?? 0.5))); fg.addColorStop(1, 'rgba(255,194,122,0)');
      ctx.fillStyle = fg; ctx.fillRect(a, LIP - 300, b - a, 304);
      ctx.restore();
      // scalloped hem shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(a, LIP - 6, b - a, 10);
    }
    // the spotlight landing on the closed curtain
    if (o.spot > 0.01 && p > 0.5) Draw.glow(ctx, -30, 60, 560, [255, 220, 170], 0.3 * o.spot * (p - 0.5) * 2);
    // the seam: a line of warm light where the halves meet, that never goes out
    if (o.seam > 0) {
      const sx = 0;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const sg = ctx.createLinearGradient(sx - 30, 0, sx + 30, 0);
      sg.addColorStop(0, 'rgba(255,217,160,0)'); sg.addColorStop(0.5, rgba([255, 217, 160], 0.85 * o.seam)); sg.addColorStop(1, 'rgba(255,217,160,0)');
      ctx.fillStyle = sg; ctx.fillRect(sx - 30, OPEN.y0, 60, LIP - OPEN.y0);
      Draw.glow(ctx, sx, LIP - 4, 220, [255, 210, 150], 0.35 * o.seam);
      ctx.fillStyle = rgba([255, 226, 180], 0.5 * o.seam); ctx.fillRect(sx - 260, LIP - 2, 520, 3);
      ctx.restore();
    }
  }

  // proscenium: dark wall around the opening, gilt frame, valance, stage lip & footlights
  function proscenium(ctx, o = {}) {
    const big = 8000;
    ctx.save();
    // the house wall around the opening
    const wall = new Path2D();
    wall.rect(-big, -big, big * 2, big * 2);
    wall.rect(OPEN.x0, OPEN.y0, OPEN.x1 - OPEN.x0, LIP - OPEN.y0);
    ctx.fillStyle = 'rgb(9,7,9)'; ctx.fill(wall, 'evenodd');
    // stage lip and the apron below it
    ctx.fillStyle = 'rgb(14,10,9)'; ctx.fillRect(OPEN.x0 - 60, LIP, OPEN.x1 - OPEN.x0 + 120, 44);
    ctx.fillStyle = rgba([90, 64, 48], 0.9); ctx.fillRect(OPEN.x0 - 60, LIP, OPEN.x1 - OPEN.x0 + 120, 3);
    // footlights
    const fl = o.foot ?? 0.4;
    for (let i = 0; i < 17; i++) {
      const x = OPEN.x0 + 40 + i * ((OPEN.x1 - OPEN.x0 - 80) / 16);
      ctx.fillStyle = 'rgb(20,16,14)'; ctx.fillRect(x - 16, LIP + 6, 32, 10);
      Draw.glow(ctx, x, LIP + 4, 46, [255, 194, 122], 0.3 * fl, 1);
    }
    // gilt frame
    const gilt = (w, a) => { ctx.strokeStyle = rgba([138, 106, 58], a); ctx.lineWidth = w; ctx.strokeRect(OPEN.x0 - w / 2, OPEN.y0 - w / 2, OPEN.x1 - OPEN.x0 + w, LIP - OPEN.y0 + w); };
    gilt(34, 0.55); gilt(6, 0.9);
    ctx.strokeStyle = rgba([220, 180, 110], 0.3); ctx.lineWidth = 2;
    ctx.strokeRect(OPEN.x0 - 30, OPEN.y0 - 30, OPEN.x1 - OPEN.x0 + 60, LIP - OPEN.y0 + 60);

    const vh = 70;
    const vg = ctx.createLinearGradient(0, OPEN.y0, 0, OPEN.y0 + vh);
    vg.addColorStop(0, rgba(mix(VELVET, [0, 0, 0], 0.6), 1)); vg.addColorStop(1, rgba(VELVET, 1));

  function ghostLight(ctx, k, t, x = 0) {
    const y = LIP - 6;
    ctx.save();

    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 170); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x - 34, y + 8); ctx.moveTo(x, y - 6); ctx.lineTo(x + 34, y + 8); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 10); ctx.stroke();

      Draw.glow(ctx, x, y - 194, 120, [255, 214, 160], 0.55 * on);
      Draw.glow(ctx, x, y - 194, 18, [255, 250, 230], 0.95 * on, 1);

  // the house: a few rows of heads and seat backs in front of the stage (screen space)
  function house(ctx, W, H, DPR, k, glow = 0) {
    if (k <= 0.003) return;
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  function actCard(ctx, W, H, DPR, k, text) {
    if (k <= 0.003) return;

    ctx.font = `500 ${size}px "Jost", "Futura", system-ui, sans-serif`;
    try { ctx.letterSpacing = (size * 0.32).toFixed(1) + 'px'; } catch (e) { }

  }

  // the vaudeville stage hook: a long pole ending in a shepherd's crook
  // from (x0,y0) toward angle a, length L; returns the crook tip
  function hook(ctx, x0, y0, x1, y1, a = 1, bent = 0) {
    if (a <= 0.003) return;

    ctx.lineCap = 'round';

    const cx = x1 - Math.cos(ang) * 0, cy = y1;
    ctx.strokeStyle = `rgba(26,22,26,${a})`; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);

    const up = -Math.PI / 2;
    ctx.arc(x1 + Math.cos(ang + Math.PI / 2 + bent) * 0, y1 - cr, cr, Math.PI / 2, Math.PI / 2 + Math.PI * (1.15 - bent * 0.4), ang > -Math.PI / 2 && ang < Math.PI / 2);
    ctx.stroke();
    ctx.strokeStyle = rgba([170, 186, 214], 0.65 * a); ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
  }

  return { OPEN, LIP, spot, traveller, proscenium, ghostLight, house, actCard, hook };
})();

// ============================================================================
//  SCORE — chord parsing + event generators. Every event: {t, i, a, len?}
//  (t = film seconds, i = instrument name, a = args after `when`, len = sustain)
// ============================================================================
const Score = (() => {
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const QUAL = {
    '': [0, 4, 7], 'm': [0, 3, 7], 'maj7': [0, 4, 7, 11], 'm7': [0, 3, 7, 10], '7': [0, 4, 7, 10],
    'add9': [0, 4, 7, 14], 'madd9': [0, 3, 7, 14], 'sus2': [0, 2, 7], 'sus4': [0, 5, 7], 'dim': [0, 3, 6], '6': [0, 4, 7, 9], 'm6': [0, 3, 7, 9],
  };
  const pc = s => { let n = NOTE[s[0]]; if (s[1] === '#') n++; if (s[1] === 'b') n--; return (n + 12) % 12; };
  // 'F#m/A' -> { bass: midi, tones: [midi...] } voiced around a centre pitch
  function chord(name, centre = 60) {
    const [main, slash] = name.split('/');
    const m = main.match(/^([A-G][#b]?)(.*)$/);
    const root = pc(m[1]);
    const ints = QUAL[m[2]] || QUAL[''];
    let base = centre - 6 + ((root - (centre - 6)) % 12 + 12) % 12;  // root nearest below centre
    const tones = ints.map(i => base + i);
    const bassPc = slash ? pc(slash) : root;
    const bass = 36 + ((bassPc - 36) % 12 + 12) % 12;                 // C2..B2
    return { bass, tones };
  }
  const mid = n => n; // passthrough for midi literals
  // name -> midi ('F#5' -> 78)
  function note(s) { const m = s.match(/^([A-G][#b]?)(-?\d)$/); return pc(m[1]) + (+m[2] + 1) * 12; }

  // ---- generators
  // voice-led pads: each chord's tones move to the nearest octave of the previous voicing
  function pads(t0, chords, dur, o = {}) {
    let prev = null;
    return chords.map((c, k) => {
      const ch = chord(c, o.centre ?? 60);
      let tones = ch.tones;
      if (prev) {
        tones = ch.tones.map(m => { let best = m, bd = 1e9; for (let oc = -2; oc <= 2; oc++) { const c2 = m + oc * 12; const d = Math.min(...prev.map(p => Math.abs(p - c2))); if (d < bd && c2 >= 52 && c2 <= 76) { bd = d; best = c2; } } return best; });
        tones = [...new Set(tones)].sort((a, b) => a - b);
      }
      prev = tones;
      const bassN = ch.bass + 12;
      const notes = o.noBass ? tones : (tones.includes(bassN) ? tones : [bassN, ...tones]);
      const len = dur * (o.overlap ?? 1.08);
      return { t: t0 + k * dur, i: 'pad', a: [notes, len, { vel: o.vel ?? 0.14, att: o.att ?? Math.min(2.5, dur * 0.5), rel: o.rel ?? Math.min(3, dur * 0.8), cut: o.cut ?? 900, pan: o.pan ?? 0, type: o.type }], len };
    });
  }
  function bass(t0, chords, dur, o = {}) {
    return chords.map((c, k) => ({ t: t0 + k * dur, i: 'bowed', a: [chord(c).bass + (o.oct ?? 0) * 12, dur * 0.95, o.vel ?? 0.09, 0], len: dur }));
  }
  function choir(t0, chords, dur, o = {}) {
    return chords.map((c, k) => ({ t: t0 + k * dur, i: 'choir', a: [chord(c, o.centre ?? 64).tones, dur * 1.05, o.vel ?? 0.08], len: dur }));
  }
  // arpeggio over chords; pattern indexes into [bass, ...tones, tones+12]
  function arp(t0, chords, dur, o = {}) {
    const out = [], step0 = o.step ?? dur / 8, pat = o.pattern ?? [0, 2, 3, 4, 5, 4, 3, 2];
    chords.forEach((c, k) => {
      const ch = chord(c, o.centre ?? 64);
      const pool = [ch.bass + 24, ...ch.tones, ...ch.tones.map(x => x + 12)];
      const n = Math.max(1, Math.round(dur / step0)), step = dur / n;
      for (let j = 0; j < n; j++) {
        const m = pool[pat[j % pat.length] % pool.length];
        const sw = (j % 2 ? (o.swing ?? 0) : 0) * step;
        out.push({ t: t0 + k * dur + j * step + sw, i: o.instr || 'piano', a: [m, (o.vel ?? 0.35) * (j % pat.length === 0 ? 1.15 : 1) * (0.85 + 0.15 * Math.sin(j)), o.ring ?? 2.6, (j % 2 ? 0.2 : -0.2)] });
      }
    });
    return out;
  }
  // melodic line: [[noteName|midi, startBeat, beats], ...] at bpm
  function line(t0, notes, bpm, o = {}) {
    const b = 60 / bpm;
    return notes.map(([n, s, d]) => {
      const m = typeof n === 'string' ? note(n) : n;
      const instr = o.instr || 'piano';
      const args = instr === 'bowed' ? [m, d * b, o.vel ?? 0.08, o.pan ?? 0] : instr === 'bell' ? [m, o.vel ?? 0.18, Math.max(1.5, d * b * 2), o.pan ?? 0] : [m, o.vel ?? 0.4, Math.max(2, d * b * 1.6), o.pan ?? 0];
      return { t: t0 + s * b, i: instr, a: args, len: instr === 'bowed' ? d * b : 0 };
    });
  }
  function heart(t0, t1, bpm, amp = 0.4, ampEnd = amp) {
    const out = []; const step = 60 / bpm;
    for (let t = t0; t < t1; t += step) out.push({ t, i: 'heart', a: [lerp(amp, ampEnd, (t - t0) / (t1 - t0))] });
    return out;
  }
  function ticks(t0, t1, bpm = 60, amp = 0.06) {
    const out = []; const step = 60 / bpm; let k = 0;
    for (let t = t0; t < t1; t += step, k++) out.push({ t, i: 'tick', a: [k % 2 === 1, amp] });
    return out;
  }
  // breaths follow a period track so the chest on screen moves with the sound
  function breaths(t0, t1, period, amp = 0.04) {
    const out = [];
    for (let t = t0; t < t1;) {
      const P = typeof period === 'function' ? period(t) : period;
      out.push({ t, i: 'breath', a: [P * 0.42, true, amp] });
      out.push({ t: t + P * 0.45, i: 'breath', a: [P * 0.52, false, amp * 1.1] });
      t += P;
    }
    return out;
  }
  const at = (t, i, ...a) => ({ t, i, a });
  return { chord, note, pads, bass, choir, arp, line, heart, ticks, breaths, at };
})();

// ---- 07-fx.js
// ============================================================================
//  FX — camera, offscreen layers, transitions, light streams
// ============================================================================
const FX = (() => {
  // ---- camera: world box -> screen transform. Portrait frames tighter on width.
  // shot = { cx, cy, w } world width visible in landscape; h derived from 16:9.
  function camera(ctx, shot, W, H, DPR, shake = 0, t = 0) {
    const land = W >= H;
    const w = land ? shot.w : shot.w * (shot.pw ?? 0.62);
    const h = land ? shot.w * 9 / 16 : shot.w * (shot.ph ?? 1.15);
    const S = Math.min(W / w, H / h);
    const cy = land ? shot.cy : (shot.pcy ?? shot.cy);
    const cx = land ? shot.cx : (shot.pcx ?? shot.cx);
    const sx = shake ? Noise.n2(t * 31, 1.7) * shake * 2.4 : 0, sy = shake ? Noise.n2(4.2, t * 29) * shake * 2.4 : 0;
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (W / 2 - cx * S + sx), DPR * (H / 2 - cy * S + sy));
    return { S, cx, cy, toScreen: (x, y) => [W / 2 + (x - cx) * S, H / 2 + (y - cy) * S] };
  }
  // interpolate between shots with easing
  function shotAt(t, keys) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, a] = keys[i - 1], [t1, b, e] = keys[i];
        const k = (Ease[e || 'sine'])((t - t0) / (t1 - t0 || 1));
        const o = {};
        for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
          const va = a[key] ?? b[key], vb = b[key] ?? a[key];
          o[key] = lerp(va, vb, k);
        }
        return o;
      }
    }
    return keys[keys.length - 1][1];
  }

  // ---- make every frame independent of what was drawn before
  function resetState(g) {
    g.filter = 'none'; g.lineCap = 'butt'; g.lineJoin = 'miter'; g.lineWidth = 1; g.shadowBlur = 0; g.shadowColor = 'rgba(0,0,0,0)';
    g.textAlign = 'start'; g.textBaseline = 'alphabetic'; g.setLineDash([]);
  }
  // ---- offscreen layer (same size as the main canvas)
  const layers = {};
  function layer(name, cv) {
    let L = layers[name];
    if (!L || L.c.width !== cv.width || L.c.height !== cv.height) {
      const c = L ? L.c : document.createElement('canvas');
      c.width = cv.width; c.height = cv.height;
      L = layers[name] = { c, g: c.getContext('2d') };
    }
    L.g.setTransform(1, 0, 0, 1, 0, 0);
    L.g.globalAlpha = 1; L.g.globalCompositeOperation = 'source-over'; resetState(L.g);
    L.g.clearRect(0, 0, L.c.width, L.c.height);
    return L;
  }
  // composite a layer onto ctx with a transition mask in screen space
  // kind: 'fade' | 'bloom' (noisy radial from point) | 'rise' (wavy line from bottom) | 'iris'
  function composite(ctx, L, k, kind, o = {}) {
    k = clamp(k);
    if (k <= 0.001) return;
    const cw = L.c.width, ch = L.c.height;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (k >= 0.999 || kind === 'fade') {
      ctx.globalAlpha = kind === 'fade' ? k : 1;
      ctx.drawImage(L.c, 0, 0);
      ctx.restore(); return;
    }
    const t = o.t || 0;
    ctx.beginPath();
    if (kind === 'bloom' || kind === 'iris') {
      const px = (o.x ?? 0.5) * cw, py = (o.y ?? 0.5) * ch;
      const R = Math.hypot(Math.max(px, cw - px), Math.max(py, ch - py)) * 1.15 * (kind === 'iris' ? 1 : 1.1);
      const r = R * Ease.inOut(k);
      const N = 90;
      for (let i = 0; i <= N; i++) {
        const a = i / N * TAU;
        const wob = kind === 'bloom' ? 1 + 0.16 * Noise.n2(Math.cos(a) * 1.6 + 3, Math.sin(a) * 1.6 + t * 0.4) + 0.05 * Math.sin(a * 9 + t) : 1;
        const x = px + Math.cos(a) * r * wob, y = py + Math.sin(a) * r * wob;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
    } else if (kind === 'rise') {
      const y0 = ch * (1 - Ease.inOut(k) * 1.12);
      ctx.moveTo(0, ch);
      for (let x = 0; x <= cw; x += cw / 60) ctx.lineTo(x, y0 + Math.sin(x / cw * 9 + t * 2) * ch * 0.02 + Noise.n2(x / cw * 3, t) * ch * 0.02);
      ctx.lineTo(cw, ch); ctx.closePath();
    } else if (kind === 'wipe') {
      const x0 = cw * Ease.inOut(k) * 1.2 - cw * 0.1;
      ctx.moveTo(0, 0);
      for (let y = 0; y <= ch; y += ch / 40) ctx.lineTo(x0 + Noise.n2(y / ch * 4, t) * cw * 0.05, y);
      ctx.lineTo(0, ch); ctx.closePath();
    }
    ctx.clip();
    ctx.drawImage(L.c, 0, 0);
    ctx.restore();
    // a soft light along the leading edge of organic reveals
    if (o.edge && kind !== 'fade') {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 0.18 * Math.sin(k * Math.PI);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = o.edge; ctx.fillRect(0, 0, cw, ch);
      ctx.restore();
    }
  }

  // ---- streams of coloured light flowing from a to b (used for joining / merging)
  function stream(ctx, ax, ay, bx, by, c, k, t, seed = 0, n = 26, width = 30) {
    if (k <= 0.001) return;
    for (let i = 0; i < n; i++) {
      const ph = ((t * 0.35 + i / n + seed * 0.13) % 1);
      const u = ph;
      const bend = Math.sin(u * Math.PI) * width * (1 + 0.6 * Noise.n2(i, seed));
      const nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny) || 1;
      const x = lerp(ax, bx, u) + nx / nl * bend * Math.sin(i * 1.7 + seed);
      const y = lerp(ay, by, u) + ny / nl * bend * Math.sin(i * 1.7 + seed);
      Draw.glow(ctx, x, y, 4 + 6 * Math.sin(u * Math.PI), c, k * Math.sin(u * Math.PI) * 0.9, 1);
    }
  }

  // ---- expanding ring (touch / heartbeat)
  function ring(ctx, x, y, r, c, a, w = 2) {
    if (a <= 0.003) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(c, a); ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // full-frame tint (screen space)
  function wash(ctx, W, H, DPR, c, a, op = 'source-over') {
    if (a <= 0.002) return;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = op; ctx.fillStyle = rgba(c, a);
    ctx.fillRect(0, 0, W * DPR, H * DPR);
    ctx.restore();
  }

  // ---- bloom: chained downsample of the frame, screened back on top
  const BL = {};
  function bloom(ctx, cv, amount) {
    if (amount <= 0.001) return;
    const mk = (k, d) => {
      let c = BL[k];
      const w = Math.max(2, Math.round(cv.width / d)), h = Math.max(2, Math.round(cv.height / d));
      if (!c || c.width !== w || c.height !== h) { c = BL[k] = document.createElement('canvas'); c.width = w; c.height = h; c._g = c.getContext('2d'); }
      return c;
    };
    const a = mk('a', 4), b = mk('b', 8), c = mk('c', 16);
    a._g.globalCompositeOperation = 'copy'; a._g.drawImage(cv, 0, 0, a.width, a.height);
    b._g.globalCompositeOperation = 'copy'; b._g.drawImage(a, 0, 0, b.width, b.height);
    c._g.globalCompositeOperation = 'copy'; c._g.drawImage(b, 0, 0, c.width, c.height);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = clamp(amount * 0.55); ctx.drawImage(c, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = clamp(amount * 0.35); ctx.drawImage(b, 0, 0, cv.width, cv.height);
    ctx.restore();
  }

  // gentle filmic contrast: deepen the mids so light reads as light
  function tone(ctx, cv, k = 1) {
    if (k <= 0) return;
    const L = layer('tone', cv);
    L.g.drawImage(cv, 0, 0);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = `contrast(${(1 + 0.14 * k).toFixed(3)}) saturate(${(1 + 0.08 * k).toFixed(3)}) brightness(${(1 - 0.03 * k).toFixed(3)})`;
    ctx.drawImage(L.c, 0, 0);
    ctx.restore();
  }

  return { camera, shotAt, layer, composite, stream, ring, wash, bloom, tone, resetState };
})();

// ---- 08-film.js
// ============================================================================
//  FILM — "The Last Thing on My Mind"
//  A deathbed staged as the last night of a 99-year run. Everything on screen
//  and in the score is a pure function of time t.
// ============================================================================

  // ------------------------------------------------------------------ family state
  const touchT = { keel: 1.0, hearth: 1.0, tidewell: 2.6, mender: 4.4, loom: 6.8, kindle: 26.2 };
  function famState(f, i, t, A, spirit) {
    const enter = at('S3', f.enter);
    let a = smooth((t - enter) / 1.8);
    // dissolve into him (S9), re-form after (S10)
    const m0 = MERGE[0] + i * 0.35;
    const mergeK = smooth((t - m0) / 3.2);
    const reform = smooth((t - REFORM[0] - i * 0.35) / 2.4);
    a *= 1 - mergeK * (1 - reform);
    let x = f.x, y = f.y, lean = f.lean, tilt = f.tilt, kneel = f.kneel || 0;
    // gather on the candle side to meet his spirit (S7)
    const g = tr.groupK(t);
    if (g > 0) {
      const [gx, gy] = GROUP[f.id];
      x = lerp(x, gx, g); y = lerp(y, gy, g); kneel = lerp(kneel, 0, g);
      const toward = spirit ? Math.sign(spirit.x - x) || 1 : 1;
      lean = lerp(lean, 0.18 * toward, g); tilt = lerp(tilt, 0.15 * toward, g);
    }
    // the hair stroke: Loom comes round the bedpost; the two at his head give it room
    const hairWin = env(t, at('S4', 6.2), at('S4', 7.0), at('S4', 12.4), at('S4', 13.2));
    if (f.id === 'loom') x = lerp(x, -420, hairWin);
    if (f.id === 'keel' || f.id === 'hearth') a *= 1 - 0.55 * hairWin;
    // hug: lean in closer (S9)
    const hug = tr.hug(t) * (1 - mergeK) + (t > REFORM[0] ? 0.6 * reform : 0);
    if (hug > 0 && !f.front && f.id !== 'mender') { x = lerp(x, x + (-170 - x) * 0.32, hug); lean = lean + (x < -170 ? 0.12 : -0.12) * hug; }
    // signature motion
    let bob = 0;
    if (f.id === 'kindle') {
      bob = Math.abs(Math.sin(t * Math.PI * 1.2)) * 6;
      const hop = t - at('S6', 32.6); if (hop > 0 && hop < 0.7) bob += Math.sin(hop / 0.7 * Math.PI) * 26;
    }
    if (f.id === 'keel') lean += Math.sin(t * TAU / 10) * 0.035;
    tilt += tr.nod(t) * (i % 2 ? 1 : 0.8);
    // heads turn to each other briefly (S5)
    tilt += env(t, at('S5', 26.2), at('S5', 27.2), at('S5', 28.9), at('S5', 30.2)) * (i % 2 ? 0.25 : -0.25);
    tilt += tr.glance(t) * (i % 2 ? 0.28 : -0.28);   // after the wink they glance at each other
    const eyes = tr.eyesFam(t);
    // hands
    const hands = [];
    const tt = at('S4', touchT[f.id]);
    for (let h = 0; h < 2; h++) {
      const [key, dx, dy] = f.touch[h];
      let target = A[key] ? [A[key][0] + dx, A[key][1] + dy] : null;
      let w = smooth((t - tt - h * 0.35) / 0.7);
      if (f.id === 'loom' && h === 0) {
        // three slow passes through what hair he has left: forehead, crown, back; then a lifted return
        const u = clamp((t - at('S4', 6.8)) / 5.5);
        const pass = (u * 3) % 1;
        const path = [[A.brow[0] - 6, A.brow[1] - 6], [A.hair[0] + 2, A.hair[1] - 18], [A.hair[0] + 10, A.hair[1] + 14]];
        let p;
        if (pass < 0.72) {
          const q = pass / 0.72, seg = q < 0.5 ? 0 : 1, k = q < 0.5 ? q * 2 : (q - 0.5) * 2;
          p = [lerp(path[seg][0], path[seg + 1][0], Ease.sine(k)), lerp(path[seg][1], path[seg + 1][1], Ease.sine(k))];
        } else {
          const k = Ease.sine((pass - 0.72) / 0.28), c = [A.hair[0] - 20, A.hair[1] - 60], a0 = path[2], a1 = path[0], v = 1 - k;
          p = [v * v * a0[0] + 2 * v * k * c[0] + k * k * a1[0], v * v * a0[1] + 2 * v * k * c[1] + k * k * a1[1]];
        }
        const settle = smooth((t - at('S4', 12.3)) / 0.5), crown = [A.crown[0] + dx, A.crown[1] + dy];
        if (u > 0 && u < 1) target = p;
