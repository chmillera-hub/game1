    <div id="app">
      <section id="view" class="screen"></section>
      <section id="battle" class="battle" hidden>
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" aria-label="Battlefield"></canvas>
          <div class="board-tools" id="boardTools"></div>
          <div class="relic-bar" id="relicBar"></div>
          <div class="banner" id="banner"></div>
          <div class="rotate-hint" id="rotateHint" hidden>Turn your phone sideways for a bigger board</div>
        </div>
        <div class="side">
          <div class="topbar" id="topbar"></div>
          <div class="cmd" id="cmd"></div>
        </div>
      </section>
    </div>

    <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script src="js/audio.js"></script>

    <script src="js/main.js"></script>
