<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Letter Tiles</title>
<style>
  :root {
    --cell: 56px;
    --tile: 48px;
    --bg: #eef1f0;
    --bar-bg: #ffffff;
    --tile-bg: #fdfcf8;
    --tile-border: #d8d2c4;
    --tile-shadow: rgba(60, 50, 30, 0.18);
    --tile-text: #3a3630;
    --btn-bg: #ffffff;
    --btn-border: #cfcabb;
    --btn-text: #4a463d;
    --btn-active-bg: #f0ece0;
    --accent: #6b8f71;
    --grid-line: rgba(60, 50, 30, 0.07);
    --grid-bg: #e6e9e6;
    --hand-bg: #ffffff;
    --hand-border: #e2ddd0;
    --deck-bg: #4a5a4d;
    --deck-back: #5c6f60;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    touch-action: none;
  }

  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bar-bg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    z-index: 200;
    position: relative;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    letter-spacing: 0.02em;
  }

  .btn:active {
    transform: scale(0.95);
    background: var(--btn-active-bg);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .hint {
    flex: 0 0 auto;
    text-align: center;
    font-size: 12px;
    color: #8a8578;
    padding: 4px 10px 6px;
    background: var(--bar-bg);
    transition: opacity 0.6s ease;
  }

  .hint.hidden {
    opacity: 0;
    height: 0;
    padding: 0;
    overflow: hidden;
  }

  /* --- Hand + deck row --- */

  .handRow {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 8px 10px;
    background: var(--hand-bg);
    border-bottom: 1px solid var(--hand-border);
    z-index: 150;
  }

  .handTray {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 6px;
    padding: 4px;
    max-height: calc(var(--tile) * 2 + 30px);
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
  }

  .deckPile {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 72px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 4px 2px;
    border-radius: 10px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .deckPile:active .deckStack {
    transform: scale(0.94);
  }

  .deckPile:disabled {
    cursor: default;
    opacity: 0.4;
  }

  .deckStack {
    position: relative;
    width: var(--tile);
    height: var(--tile);
    transition: transform 0.1s ease;
  }

  .deckBack {
    position: absolute;
    inset: 0;
    background: var(--deck-back);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.15);
  }

  .deckBack::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 4px;
  }

  .deckBack.b1 { transform: translate(0, 0) rotate(0deg); background: var(--deck-bg); z-index: 3; }
  .deckBack.b2 { transform: translate(-3px, 2px) rotate(-4deg); z-index: 2; }
  .deckBack.b3 { transform: translate(3px, 3px) rotate(3deg); z-index: 1; }

  .deckInfo {
    text-align: center;
    line-height: 1.2;
  }

  .deckCount {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: var(--btn-text);
  }

  .deckLabel {
    display: block;
    font-size: 9px;
    color: #9a9484;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* --- Grid --- */

  #gridViewport {
    flex: 1 1 auto;
    position: relative;
    overflow: auto;
    background: var(--grid-bg);
    touch-action: pan-x pan-y;
  }

  #gridInner {
    position: relative;
    background-image:
      repeating-linear-gradient(to right, var(--grid-line), var(--grid-line) 1px, transparent 1px, transparent var(--cell)),
      repeating-linear-gradient(to bottom, var(--grid-line), var(--grid-line) 1px, transparent 1px, transparent var(--cell));
    border: 1px solid var(--grid-line);
  }

  #gridZones {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    pointer-events: none;
  }

  /* --- Tiles --- */

  .tile {
    width: var(--tile);
    height: var(--tile);
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile) * 0.46);
    font-weight: 700;
    color: var(--tile-text);
    box-shadow: 0 2px 0 rgba(0,0,0,0.08), 0 3px 6px var(--tile-shadow);
    cursor: grab;
    user-select: none;
    touch-action: none;
    flex: 0 0 auto;
  }

  .tile.on-grid {
    position: absolute;
  }

  .tile.dragging {
    cursor: grabbing;
    transform: scale(1.1);
    box-shadow: 0 12px 20px rgba(0,0,0,0.28), 0 4px 6px rgba(0,0,0,0.15);
  }

  .tile.drop-bounce {
    animation: dropBounce 0.28s ease;
  }

  .tile.deal {
    animation: dealIn 0.32s cubic-bezier(.34, 1.56, .64, 1);
  }

  @keyframes dropBounce {
    0% { transform: scale(0.9); }
    55% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  @keyframes dealIn {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #23262b;
      --bar-bg: #2b2f36;
      --tile-bg: #3a3d42;
      --tile-border: #4c4f55;
      --tile-shadow: rgba(0, 0, 0, 0.45);
      --tile-text: #eee8d9;
      --btn-bg: #34383e;
      --btn-border: #4a4e55;
      --btn-text: #d8d4c8;
      --btn-active-bg: #40444b;
      --accent: #7ea885;
      --grid-line: rgba(255, 255, 255, 0.07);
      --grid-bg: #1c1f23;
      --hand-bg: #2b2f36;
      --hand-border: #3a3e44;
      --deck-bg: #6b8f71;
      --deck-back: #454a45;
    }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="btn primary" id="newGameBtn">New Game</button>
    <button class="btn" id="shuffleBtn">Shuffle Hand</button>
    <button class="btn" id="clearGridBtn">Clear Grid</button>
  </div>
  <div class="hint" id="hint">Drag letters onto the grid to arrange words &middot; tap the deck to draw more</div>

  <div class="handRow">
    <div class="handTray" id="handTray"></div>
    <button class="deckPile" id="deckPile" title="Draw a letter">
      <div class="deckStack">
        <div class="deckBack b3"></div>
        <div class="deckBack b2"></div>
        <div class="deckBack b1"></div>
      </div>
      <div class="deckInfo">
        <span class="deckCount" id="deckCount">43</span>
        <span class="deckLabel">draw</span>
      </div>
    </button>
  </div>

  <div id="gridViewport">
    <div id="gridInner">
      <canvas id="gridZones"></canvas>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // Approximate English letter frequency, weighted so common letters
      // (E, A, I, O, N...) appear more often but rare ones can still show up.
      const LETTER_WEIGHTS = {
        E: 12, A: 9, I: 9, O: 8, N: 7, R: 7, T: 7, L: 4, S: 6, U: 4,
        D: 4, G: 3, B: 2, C: 2, M: 2, P: 2, F: 2, H: 2, V: 2, W: 2,
        Y: 2, K: 1, J: 1, X: 1, Q: 1, Z: 1
      };

      const LETTER_POOL = [];
      Object.entries(LETTER_WEIGHTS).forEach(([letter, weight]) => {
        for (let i = 0; i < weight; i++) LETTER_POOL.push(letter);
      });

      function randomLetter() {
        return LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];
      }

      function generateLetters(count) {
        const letters = [];
        for (let i = 0; i < count; i++) letters.push(randomLetter());
        return letters;
      }

      const TOTAL_LETTERS = 50;
      const HAND_SIZE = 7;
      const GRID_SIZE = 50;

      const gridViewport = document.getElementById("gridViewport");
      const gridInner = document.getElementById("gridInner");
      const gridZones = document.getElementById("gridZones");
      const handTray = document.getElementById("handTray");
      const deckPile = document.getElementById("deckPile");
      const deckCountEl = document.getElementById("deckCount");
      const deckLabelEl = document.querySelector(".deckLabel");
      const hint = document.getElementById("hint");

      let CELL = 56;
      let deck = [];
      let tilesById = new Map();
      let occupied = new Map(); // "x,y" -> tileId
      let zCounter = 10;
      let nextId = 1;
      let hintTimer = null;

      function hideHintSoon() {
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.add("hidden"), 5000);
      }

      function computeCell() {
        return window.innerWidth < 480 ? 42 : 56;
      }

      function applySizes() {
        CELL = computeCell();
        const tile = CELL - 8;
        document.documentElement.style.setProperty("--cell", CELL + "px");
        document.documentElement.style.setProperty("--tile", tile + "px");
        gridInner.style.width = (CELL * GRID_SIZE) + "px";
        gridInner.style.height = (CELL * GRID_SIZE) + "px";

        // Reposition any tiles already placed on the grid.
        tilesById.forEach(tile => {
          if (tile.container === "grid") positionGridTile(tile);
        });

        drawZones();
      }

      // Soft color zones radiating out (in concentric squares) from the
      // grid's center, so players get a gentle visual cue before they
      // wander close to the edge — a faded green "safe" core, fading
      // through yellow, to a faded red border near the last few cells.
      function drawZones() {
        const size = CELL * GRID_SIZE;
        gridZones.width = size;
        gridZones.height = size;
        gridZones.style.width = size + "px";
        gridZones.style.height = size + "px";

        const ctx = gridZones.getContext("2d");
        ctx.clearRect(0, 0, size, size);

        const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const boost = isDark ? 1.5 : 1;

        const center = GRID_SIZE / 2;
        const maxDist = center - 0.5;

        // Distance (in cells) -> [r, g, b, alpha] anchor stops, scaled
        // proportionally to the board so the bands keep roughly the same
        // "40% core, 75% caution ring" feel at any GRID_SIZE.
        const stops = [
          { d: 0, c: [110, 168, 120, 0.04 * boost] },
          { d: center * 0.4, c: [110, 168, 120, 0.16 * boost] },
          { d: center * 0.75, c: [219, 181, 74, 0.20 * boost] },
          { d: maxDist, c: [204, 90, 78, 0.30 * boost] }
        ];

        function colorAt(d) {
          if (d <= stops[0].d) return stops[0].c;
          for (let i = 0; i < stops.length - 1; i++) {
            const a = stops[i], b = stops[i + 1];
            if (d <= b.d) {
              const t = (d - a.d) / (b.d - a.d);
              return [
                a.c[0] + (b.c[0] - a.c[0]) * t,
                a.c[1] + (b.c[1] - a.c[1]) * t,
                a.c[2] + (b.c[2] - a.c[2]) * t,
                a.c[3] + (b.c[3] - a.c[3]) * t
              ];
            }
          }
          return stops[stops.length - 1].c;
        }

        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            const d = Math.max(Math.abs(x + 0.5 - center), Math.abs(y + 0.5 - center));
            const [r, g, b, a] = colorAt(d);
            ctx.fillStyle = `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${a.toFixed(3)})`;
            ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
          }
        }
      }

      function cellPad() {
        const tileSize = CELL - 8;
        return (CELL - tileSize) / 2;
      }

      function positionGridTile(tile) {
        const pad = cellPad();
        tile.el.style.left = (tile.gridX * CELL + pad) + "px";
        tile.el.style.top = (tile.gridY * CELL + pad) + "px";
      }

      function centerGridScroll() {
        const vpRect = gridViewport.getBoundingClientRect();
        gridViewport.scrollLeft = Math.max(0, (gridInner.offsetWidth - vpRect.width) / 2);
        gridViewport.scrollTop = Math.max(0, (gridInner.offsetHeight - vpRect.height) / 2);
      }

      // --- Tile creation ---

      function createTile(letter) {
        const el = document.createElement("div");
        el.className = "tile";
        el.textContent = letter;
        el.setAttribute("data-letter", letter);

        const tile = { id: nextId++, letter, el, container: "hand", gridX: null, gridY: null };
        tilesById.set(tile.id, tile);
        attachDragHandlers(tile);
        return tile;
      }

      function addTileToHand(tile, animate) {
        tile.container = "hand";
        tile.el.classList.remove("on-grid");
        tile.el.style.position = "";
        tile.el.style.left = "";
        tile.el.style.top = "";
        handTray.appendChild(tile.el);
        if (animate) {
          tile.el.classList.add("deal");
          tile.el.addEventListener("animationend", function handler() {
            tile.el.classList.remove("deal");
            tile.el.removeEventListener("animationend", handler);
          });
        }
      }

      // --- Deck / hand / grid setup ---

      function newGame() {
        occupied.clear();
        tilesById.forEach(t => t.el.remove());
        tilesById.clear();

        const pool = generateLetters(TOTAL_LETTERS);
        const handLetters = pool.slice(0, HAND_SIZE);
        deck = pool.slice(HAND_SIZE);

        handLetters.forEach(letter => {
          const tile = createTile(letter);
          addTileToHand(tile, false);
        });

        updateDeckUI();
        centerGridScroll();
      }

      function handCount() {
        return handTray.children.length;
      }

      function updateDeckUI() {
        deckCountEl.textContent = String(deck.length);
        const handFull = handCount() >= HAND_SIZE;
        deckPile.disabled = deck.length === 0 || handFull;
        deckLabelEl.textContent = deck.length === 0 ? "empty" : (handFull ? "hand full" : "draw");
      }

      function drawTile() {
        if (deck.length === 0 || handCount() >= HAND_SIZE) return;
        const letter = deck.shift();
        const tile = createTile(letter);
        addTileToHand(tile, true);
        updateDeckUI();
      }

      function clearGrid() {
        const gridTiles = Array.from(tilesById.values()).filter(t => t.container === "grid");
        gridTiles.forEach(tile => addTileToHand(tile, false));
        occupied.clear();
        updateDeckUI();
      }

      function shuffleHand() {
        const children = Array.from(handTray.children);
        if (children.length < 2) return;
        const firstRects = new Map(children.map(el => [el, el.getBoundingClientRect()]));

        for (let i = children.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [children[i], children[j]] = [children[j], children[i]];
        }
        children.forEach(el => handTray.appendChild(el));

        children.forEach(el => {
          const first = firstRects.get(el);
          const last = el.getBoundingClientRect();
          const dx = first.left - last.left;
          const dy = first.top - last.top;
          el.style.transition = "none";
          el.style.transform = `translate(${dx}px, ${dy}px)`;
          requestAnimationFrame(() => {
            el.style.transition = "transform 0.4s cubic-bezier(.34, 1.4, .64, 1)";
            el.style.transform = "translate(0, 0)";
          });
        });

        setTimeout(() => {
          children.forEach(el => {
            el.style.transition = "";
            el.style.transform = "";
          });
        }, 450);
      }

      // --- Dragging ---

      function attachDragHandlers(tile) {
        const el = tile.el;
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;
        let originalContainer = null;
        let originalGridX = null;
        let originalGridY = null;
        let originalIndex = -1;

        function onPointerDown(e) {
          if (e.button !== undefined && e.button !== 0) return;
          dragging = true;

          const rect = el.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;

          originalContainer = tile.container;
          originalGridX = tile.gridX;
          originalGridY = tile.gridY;
          originalIndex = Array.from(handTray.children).indexOf(el);

          el.style.transition = "none";
          el.style.transform = "";
          el.classList.remove("drop-bounce");
          el.classList.add("dragging");
          el.style.position = "fixed";
          el.style.left = rect.left + "px";
          el.style.top = rect.top + "px";
          el.style.margin = "0";
          el.style.zIndex = ++zCounter;
          document.body.appendChild(el);
          el.setPointerCapture && el.setPointerCapture(e.pointerId);

          hint.classList.add("hidden");
          if (hintTimer) clearTimeout(hintTimer);

          e.preventDefault();
        }

        function onPointerMove(e) {
          if (!dragging) return;
          el.style.left = (e.clientX - offsetX) + "px";
          el.style.top = (e.clientY - offsetY) + "px";
          e.preventDefault();
        }

        function onPointerUp(e) {
          if (!dragging) return;
          dragging = false;
          el.classList.remove("dragging");
          el.style.zIndex = "";
          el.style.margin = "";
          el.style.transition = "";

          const px = e.clientX;
          const py = e.clientY;
          const gridRect = gridViewport.getBoundingClientRect();
          const handRect = handTray.getBoundingClientRect();

          let placed = false;

          if (px >= gridRect.left && px <= gridRect.right && py >= gridRect.top && py <= gridRect.bottom) {
            placed = tryPlaceOnGrid(tile, px, py);
          }

          if (!placed && px >= handRect.left && px <= handRect.right && py >= handRect.top && py <= handRect.bottom) {
            placeInHand(tile, px);
            placed = true;
          }

          if (!placed) {
            revertTile(tile, originalContainer, originalGridX, originalGridY, originalIndex);
          }

          el.classList.add("drop-bounce");
          el.addEventListener("animationend", function handler() {
            el.classList.remove("drop-bounce");
            el.removeEventListener("animationend", handler);
          });

          try { el.releasePointerCapture && el.releasePointerCapture(e.pointerId); } catch (err) {}
        }

        el.addEventListener("pointerdown", onPointerDown);
        el.addEventListener("pointermove", onPointerMove);
        el.addEventListener("pointerup", onPointerUp);
        el.addEventListener("pointercancel", onPointerUp);
      }

      function tryPlaceOnGrid(tile, clientX, clientY) {
        const innerRect = gridInner.getBoundingClientRect();
        const pad = cellPad();
        const localX = clientX - innerRect.left;
        const localY = clientY - innerRect.top;

        let cellX = Math.floor(localX / CELL);
        let cellY = Math.floor(localY / CELL);
        cellX = Math.min(Math.max(cellX, 0), GRID_SIZE - 1);
        cellY = Math.min(Math.max(cellY, 0), GRID_SIZE - 1);

        const key = cellX + "," + cellY;
        const occupant = occupied.get(key);
        if (occupant !== undefined && occupant !== tile.id) {
          return false;
        }

        if (tile.container === "grid") {
          occupied.delete(tile.gridX + "," + tile.gridY);
        }

        tile.container = "grid";
        tile.gridX = cellX;
        tile.gridY = cellY;
        occupied.set(key, tile.id);

        tile.el.classList.add("on-grid");
        tile.el.style.margin = "";
        gridInner.appendChild(tile.el);
        tile.el.style.position = "absolute";
        positionGridTile(tile);
        updateDeckUI();

        return true;
      }

      function placeInHand(tile, clientX) {
        if (tile.container === "grid") {
          occupied.delete(tile.gridX + "," + tile.gridY);
        }

        tile.container = "hand";
        tile.gridX = null;
        tile.gridY = null;
        tile.el.classList.remove("on-grid");
        tile.el.style.position = "";
        tile.el.style.left = "";
        tile.el.style.top = "";

        const siblings = Array.from(handTray.children);
        let insertBefore = null;
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (clientX < r.left + r.width / 2) {
            insertBefore = sib;
            break;
          }
        }
        if (insertBefore) {
          handTray.insertBefore(tile.el, insertBefore);
        } else {
          handTray.appendChild(tile.el);
        }
        updateDeckUI();
      }

      function revertTile(tile, originalContainer, originalGridX, originalGridY, originalIndex) {
        if (originalContainer === "grid") {
          tile.container = "grid";
          tile.gridX = originalGridX;
          tile.gridY = originalGridY;
          tile.el.classList.add("on-grid");
          gridInner.appendChild(tile.el);
          tile.el.style.position = "absolute";
          positionGridTile(tile);
        } else {
          tile.container = "hand";
          tile.gridX = null;
          tile.gridY = null;
          tile.el.classList.remove("on-grid");
          tile.el.style.position = "";
          tile.el.style.left = "";
          tile.el.style.top = "";

          const children = Array.from(handTray.children);
          const idx = Math.min(Math.max(originalIndex, 0), children.length);
          if (idx >= children.length) {
            handTray.appendChild(tile.el);
          } else {
            handTray.insertBefore(tile.el, children[idx]);
          }
          updateDeckUI();
        }
      }

      // --- Controls ---

      document.getElementById("newGameBtn").addEventListener("click", newGame);
      document.getElementById("shuffleBtn").addEventListener("click", shuffleHand);
      document.getElementById("clearGridBtn").addEventListener("click", clearGrid);
      deckPile.addEventListener("click", drawTile);

      // Prevent page scroll/bounce on touch devices outside the scrollable regions.
      document.body.addEventListener("touchmove", (e) => {
        if (!e.target.closest("#gridViewport") && !e.target.closest(".handTray")) {
          e.preventDefault();
        }
      }, { passive: false });

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(applySizes, 150);
      });

      const darkModeQuery = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
      if (darkModeQuery && darkModeQuery.addEventListener) {
        darkModeQuery.addEventListener("change", drawZones);
      }

      applySizes();
      newGame();
      hideHintSoon();
    })();
  </script>
</body>
</html>
