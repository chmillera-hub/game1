@font-face{font-family:'InterM';src:url('file:///usr/share/fonts/opentype/inter/Inter-Medium.otf');}

<body><canvas id="c" width="720" height="1280"></canvas>
<script>
'use strict';
const W = 720, H = 1280;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TL = null, EV = null;

// ------------------------------------------------------------------ utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 3);
const win = (t, a, b, f = 0.3) => clamp((t - a) / f) * clamp((b - t) / f);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const noise1 = (t, s = 0) => Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 2.9 + s * 2.1) * 0.3 + Math.sin(t * 5.3 + s * 3.7) * 0.2;
const E = id => EV[id];
const T0 = id => EV[id].t0, T1 = id => EV[id].t1;

// scalar track: keys [[t, v, dur]]
function Track(def) { this.k = [[-1e9, def, 0]]; }
Track.prototype.at = function (t, v, d = 0.4) { this.k.push([t, v, d]); return this; };
Track.prototype.val = function (t) {
  const k = this.k; let i = 0;
  for (let j = 0; j < k.length; j++) if (k[j][0] <= t) i = j;
  if (i === 0) return k[0][1];
  const a = k[i - 1][1], b = k[i][1], d = k[i][2];
  return lerp(a, b, d <= 0 ? 1 : ease((t - k[i][0]) / d));
};
function sortTracks(o) { for (const k in o) o[k].k.sort((a, b) => a[0] - b[0]); }

// ------------------------------------------------------------ characters
const DEF = { lookX: 0, lookY: 0, lid: 1, lidLow: 0, lidTilt: 0, browY: 0, browTilt: 0, browAsym: 0, smile: 0, mouth: 0, mouthW: 1,
  tilt: 0, turn: 0, pupil: 1, tear: 0, wet: 0, blush: 0, sweat: 0, bx: 0, by: 0, mugX: 0.62, mugY: 1.3, mug: 0,
  handRaise: 0, shake: 0, glow: 0.25, closed: 0, chest: 0, hide: 0 };
const CH = {
  jun: { x: 215, y: 640, size: 150, skin: '#b98262', shade: '#9a6649', hair: '#26170f', hairHi: '#4a2e20', uni: '#2f62a8', uniD: '#1c3a66', trim: '#0f1b30',
    iris: '#4b2c1a', lip: '#7d3f35', brow: '#26170f', kind: 'jun' },
  orrin: { x: 520, y: 622, size: 158, skin: '#dfe4e6', shade: '#b8c2c8', hair: '#1a1d22', hairHi: '#4b5560', uni: '#1f6f6b', uniD: '#124341', trim: '#c9d3d8',
    iris: '#33e6ff', lip: '#9aa3a8', brow: '#1a1d22', kind: 'orrin' },
};
const EXP = { jun: [], orrin: [] };
function K(who, t, o, d = 0.35) { EXP[who].push([t, o, d]); }
function stateAt(who, t) {
  const L = EXP[who];
  const base = Object.assign({}, DEF, who === 'jun' ? { mug: 1 } : {});
  // build cumulative full states (each keyframe inherits the previous target)
  let prev = base, cur = base, idx = -1;
  if (!L._full) {
    L.sort((a, b) => a[0] - b[0]);
    let acc = base; L._full = L.map(k => (acc = Object.assign({}, acc, k[1])));
  }
  for (let i = 0; i < L.length; i++) if (L[i][0] <= t) idx = i;
  if (idx < 0) return Object.assign({}, base);
  cur = L._full[idx]; prev = idx > 0 ? L._full[idx - 1] : base;
  const k = ease((t - L[idx][0]) / Math.max(1e-3, L[idx][2]));
  const s = {};
  for (const key in cur) s[key] = lerp(prev[key], cur[key], k);
  return s;
}
// deterministic blinks
const BLINKS = { jun: [], orrin: [] };
(function () {
  let r = mulberry(11), t = 1;
  while (t < 260) { BLINKS.jun.push(t); t += 2.2 + r() * 3.2; if (r() < 0.15) { BLINKS.jun.push(t); t += 0.35; } }
  r = mulberry(5); t = 2;
  while (t < 260) { BLINKS.orrin.push(t); t += 4.5 + r() * 4; }
})();
function blinkAmt(who, t) {
  const d = who === 'jun' ? 0.17 : 0.11;
  let b = 0;
  for (const bt of BLINKS[who]) { if (bt > t + 1) break; const x = (t - bt) / d; if (x >= 0 && x <= 1) b = Math.max(b, Math.sin(Math.PI * x)); }
  return b;
}
function mouthEnv(who, t) {
  const m = TL.mouth[who]; const f = t * TL.fps; const i = Math.floor(f);
  const a = m[i] || 0, b = m[i + 1] || 0, c = m[i - 1] || 0;
  return clamp((a * 0.6 + b * 0.25 + c * 0.15) * 1.1);
}

function drawEye(c, side, st, P, t) {
  // side: -1 = screen-left eye, +1 = screen-right. Mirror so +x is the inner corner.
  c.save();
  c.translate(side * 0.19 + st.turn * 0.07, 0.02);
  c.scale(-side, 1);
  const ew = 0.088, eh = 0.075 * (P.kind === 'orrin' ? 0.9 : 1), ebh = 0.045;
  const open = clamp(st.lid, 0, 1.5);
  const lx = st.lookX * -side, ly = st.lookY;
  if (st.closed > 0.5 || open < 0.1) {
    c.beginPath();
    c.moveTo(-ew, 0.005);
    const bow = st.closed > 0.5 ? -0.05 : 0.025;
    c.quadraticCurveTo(0, bow, ew, 0.005 - st.lidTilt * 0.01);
    c.lineWidth = 0.022; c.strokeStyle = '#1a0f0a'; c.lineCap = 'round'; c.stroke();
    if (st.tear > 0.05) drawTear(c, st, t, side);
    c.restore(); return;
  }
  const topY = -eh * 1.55 * open;
  const tilt = st.lidTilt;
  const lowY = ebh * 1.4 * (1 - st.lidLow * 0.6);
  const path = () => {
    c.beginPath();
    c.moveTo(-ew, 0.004);
    c.bezierCurveTo(-ew * 0.45, topY * (1 - tilt * 0.35), ew * 0.45, topY * (1 + tilt * 0.35), ew, 0.0 - tilt * 0.012);
    c.bezierCurveTo(ew * 0.45, lowY, -ew * 0.45, lowY, -ew, 0.004);
    c.closePath();
  };
  path();
  c.fillStyle = P.kind === 'orrin' ? '#f4fbff' : '#fbf7f2'; c.fill();
  c.save(); path(); c.clip();
  // iris
  const ix = lx * 0.042, iy = ly * 0.028 + 0.004;
  const ir = 0.056;
  if (P.kind === 'orrin') {
    const g = c.createRadialGradient(ix, iy, 0, ix, iy, ir);
    const glow = clamp(st.glow);
    g.addColorStop(0, '#e8ffff'); g.addColorStop(0.35, `rgba(${80 + 120 * glow | 0},${220 + 35 * glow | 0},255,1)`); g.addColorStop(1, '#0a7a99');
    c.fillStyle = g;
  } else {
    const g = c.createRadialGradient(ix, iy - 0.01, 0, ix, iy, ir);
    g.addColorStop(0, '#8a5a36'); g.addColorStop(1, P.iris); c.fillStyle = g;
  }
  c.beginPath(); c.arc(ix, iy, ir, 0, Math.PI * 2); c.fill();
  c.lineWidth = 0.008; c.strokeStyle = 'rgba(0,0,0,0.5)'; c.stroke();
  if (P.kind === 'orrin' && st.glow > 0.6) { // scan lines while computing
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 0.005;
    for (let k = 0; k < 5; k++) { const yy = iy - ir + ((t * 3 + k * 0.2) % 1) * ir * 2; c.beginPath(); c.moveTo(ix - ir, yy); c.lineTo(ix + ir, yy); c.stroke(); }
  }
  c.fillStyle = P.kind === 'orrin' ? '#04313d' : '#120804';
  c.beginPath(); c.arc(ix, iy, 0.025 * st.pupil, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.95)';
  c.beginPath(); c.arc(ix + 0.02 * -side * -1, iy - 0.02, 0.015 + st.wet * 0.006, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(ix - 0.018, iy + 0.018, 0.007 + st.wet * 0.006, 0, Math.PI * 2); c.fill();
  if (st.wet > 0.05) {
    c.fillStyle = `rgba(160,210,255,${0.35 * st.wet})`;
    c.fillRect(-ew, lowY * 0.55, ew * 2, 0.04);
    c.fillStyle = `rgba(255,255,255,${0.7 * st.wet})`;
    c.beginPath(); c.arc(ix + 0.03, iy + 0.03, 0.008, 0, Math.PI * 2); c.fill();
  }
  // upper lid shadow
  c.fillStyle = 'rgba(60,30,20,0.18)';
  c.fillRect(-ew, topY * 0.9 - 0.03, ew * 2, 0.04);
  c.restore();
  // lash line
  c.beginPath(); c.moveTo(-ew - 0.008, 0.008);
  c.bezierCurveTo(-ew * 0.45, topY * (1 - tilt * 0.35), ew * 0.45, topY * (1 + tilt * 0.35), ew, 0.0 - tilt * 0.012);
  c.lineWidth = P.kind === 'jun' ? 0.024 : 0.018; c.strokeStyle = '#140b07'; c.lineCap = 'round'; c.stroke();
  if (P.kind === 'jun') { c.beginPath(); c.moveTo(-ew - 0.005, 0.0); c.lineTo(-ew - 0.035, -0.022); c.lineWidth = 0.014; c.stroke(); }
  // lower lid hint
  c.beginPath(); c.moveTo(-ew * 0.7, lowY * 0.8); c.quadraticCurveTo(0, lowY * 1.25, ew * 0.7, lowY * 0.8);
  c.lineWidth = 0.008; c.strokeStyle = 'rgba(80,40,30,0.35)'; c.stroke();
  if (st.tear > 0.05) drawTear(c, st, t, side);
  c.restore();
}
function drawTear(c, st, t, side) {
  const len = 0.36 * st.tear;
  c.save();
  const g = c.createLinearGradient(0, 0.04, 0, 0.04 + len);
  g.addColorStop(0, 'rgba(170,220,255,0.85)'); g.addColorStop(1, 'rgba(170,220,255,0.15)');
  c.strokeStyle = g; c.lineWidth = 0.022; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0.0, 0.05); c.bezierCurveTo(0.01, 0.1, -0.02, 0.05 + len * 0.6, -0.01, 0.05 + len); c.stroke();
  // falling drops
  for (let k = 0; k < 2; k++) {
    const ph = ((t * 0.55 + k * 0.5 + (side > 0 ? 0.25 : 0)) % 1);
    const y = 0.06 + ph * (len + 0.1);
    c.fillStyle = `rgba(200,235,255,${0.9 * (1 - ph) * st.tear})`;
    c.beginPath(); c.ellipse(-0.01, y, 0.016, 0.022, 0, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}
function drawBrow(c, side, st, P) {
  c.save();
  c.translate(side * 0.19 + st.turn * 0.07, 0);
  c.scale(-side, 1);
  const r = st.browY + (side > 0 ? st.browAsym : -st.browAsym * 0.3);
  const ox = -0.105, ix = 0.085;
  const oy = -0.15 - r * 0.05 + st.browTilt * 0.018;
  const iy = -0.145 - r * 0.05 - st.browTilt * 0.05;
  c.beginPath(); c.moveTo(ox, oy); c.quadraticCurveTo(0, Math.min(oy, iy) - 0.035, ix, iy);
  c.lineWidth = P.kind === 'jun' ? 0.038 : 0.032; c.lineCap = 'round'; c.strokeStyle = P.brow; c.stroke();
  c.restore();
}
function drawMouth(c, st, P, t, env) {
  const open = clamp(Math.max(st.mouth, env * 0.75), 0, 1.1);
  const sm = st.smile;
  const w = 0.105 * st.mouthW * (1 + 0.18 * sm) * (1 - open * 0.12) * (1 + 0.08 * Math.sin(t * 17) * env);
  c.save(); c.translate(st.turn * 0.06, 0.33);
  const cy = -sm * 0.032;
  if (open < 0.07) {
    c.beginPath(); c.moveTo(-w, cy); c.quadraticCurveTo(0, sm * 0.05, w, cy);
    c.lineWidth = 0.02; c.lineCap = 'round'; c.strokeStyle = P.kind === 'jun' ? '#5a2620' : '#59636a'; c.stroke();
    if (sm > 0.25) { // dimples
      c.lineWidth = 0.012; c.beginPath(); c.arc(-w - 0.012, cy - 0.005, 0.02, -0.5, 1.2); c.stroke(); c.beginPath(); c.arc(w + 0.012, cy - 0.005, 0.02, Math.PI - 1.2, Math.PI + 0.5); c.stroke();
    }
    c.restore(); return;
  }
  const top = -0.012 - open * 0.025 + sm * 0.015;
  const bot = 0.02 + open * 0.14 + sm * 0.02;
  const path = () => { c.beginPath(); c.moveTo(-w, cy); c.bezierCurveTo(-w * 0.5, top, w * 0.5, top, w, cy); c.bezierCurveTo(w * 0.6, bot, -w * 0.6, bot, -w, cy); c.closePath(); };
  path(); c.fillStyle = '#4a1518'; c.fill();
  c.save(); path(); c.clip();
  if (open > 0.22) { c.fillStyle = '#f7f3ea'; c.fillRect(-w, top - 0.02, w * 2, 0.032 + open * 0.01); }
  c.fillStyle = '#c4545c'; c.beginPath(); c.ellipse(0, bot + 0.01, w * 0.6, 0.04 + open * 0.02, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  c.lineWidth = 0.016; c.strokeStyle = P.kind === 'jun' ? '#5a2620' : '#59636a'; path(); c.stroke();
  c.restore();
}
function headPath(c, kind) {
  c.beginPath();
  c.moveTo(0, -0.6);
  c.bezierCurveTo(0.33, -0.6, 0.5, -0.4, 0.5, -0.05);
  if (kind === 'orrin') { c.bezierCurveTo(0.5, 0.3, 0.3, 0.6, 0, 0.63); c.bezierCurveTo(-0.3, 0.6, -0.5, 0.3, -0.5, -0.05); }
  else { c.bezierCurveTo(0.5, 0.3, 0.32, 0.58, 0, 0.61); c.bezierCurveTo(-0.32, 0.58, -0.5, 0.3, -0.5, -0.05); }
  c.bezierCurveTo(-0.5, -0.4, -0.33, -0.6, 0, -0.6);
  c.closePath();
}
function drawMug(c, x, y, rot, t, steam = true) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = '#efe7d6'; c.strokeStyle = '#2a2420'; c.lineWidth = 0.014;
  c.beginPath(); c.arc(0.15, 0.02, 0.07, -1.3, 1.3); c.lineWidth = 0.035; c.strokeStyle = '#d8ccb6'; c.stroke();
  c.lineWidth = 0.014; c.strokeStyle = '#2a2420';
  c.beginPath(); c.roundRect(-0.13, -0.14, 0.26, 0.3, 0.04); c.fill(); c.stroke();
  c.fillStyle = '#c0392b'; c.fillRect(-0.13, -0.04, 0.26, 0.05);
  c.fillStyle = '#5b3a24'; c.beginPath(); c.ellipse(0, -0.14, 0.12, 0.025, 0, 0, Math.PI * 2); c.fill();
  if (steam) {
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 0.014; c.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      const ph = (t * 0.4 + k / 3) % 1;
      c.globalAlpha = Math.sin(Math.PI * ph) * 0.8;
      c.beginPath(); const bx = -0.06 + k * 0.06; c.moveTo(bx, -0.18 - ph * 0.1);
      c.bezierCurveTo(bx + 0.04, -0.24 - ph * 0.15, bx - 0.04, -0.3 - ph * 0.2, bx, -0.36 - ph * 0.25); c.stroke();
    }
    c.globalAlpha = 1;
  }
  c.restore();
}
function drawHand(c, x, y, P, r = 0.075) {
  c.fillStyle = P.skin; c.strokeStyle = 'rgba(40,20,10,0.5)'; c.lineWidth = 0.01;
  c.beginPath(); c.ellipse(x, y, r, r * 0.85, 0, 0, Math.PI * 2); c.fill(); c.stroke();
}

function drawBust(c, who, st, t) {
  const P = CH[who];
  if (st.hide > 0.99) return;
  const env = mouthEnv(who, t);
  const sx = st.shake * (Math.sin(t * 43) * 0.012 + Math.sin(t * 61) * 0.008);
  const breathe = Math.sin(t * 1.6 + (who === 'jun' ? 0 : 2)) * 0.004;
  c.save();
  c.translate(P.x + st.bx, P.y + st.by);
  c.scale(P.size, P.size);
  c.translate(sx, 0);
  // ---- torso
  c.save(); c.scale(1, 1 + breathe);
  c.fillStyle = P.uni;
  c.beginPath(); c.moveTo(-0.22, 0.62);
  c.bezierCurveTo(-0.5, 0.72, -0.88, 0.74, -0.98, 1.05); c.lineTo(-1.15, 3.2); c.lineTo(1.15, 3.2); c.lineTo(0.98, 1.05);
  c.bezierCurveTo(0.88, 0.74, 0.5, 0.72, 0.22, 0.62); c.closePath(); c.fill();
  // shoulder panel
  c.fillStyle = P.uniD;
  c.beginPath(); c.moveTo(-0.22, 0.62); c.bezierCurveTo(-0.5, 0.72, -0.88, 0.74, -0.98, 1.05); c.lineTo(-1.0, 1.2);
  c.bezierCurveTo(-0.6, 1.0, 0.6, 1.0, 1.0, 1.2); c.lineTo(0.98, 1.05); c.bezierCurveTo(0.88, 0.74, 0.5, 0.72, 0.22, 0.62); c.closePath(); c.fill();
  c.strokeStyle = P.trim; c.lineWidth = 0.025; c.beginPath(); c.moveTo(-1.0, 1.2); c.bezierCurveTo(-0.6, 1.0, 0.6, 1.0, 1.0, 1.2); c.stroke();
  // badge (original emblem: ring + 4-point star)
  c.save(); c.translate(-0.45, 1.35);
  c.fillStyle = '#e8c766'; c.beginPath(); c.arc(0, 0, 0.075, 0, Math.PI * 2); c.fill();
  c.fillStyle = P.uniD; c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? 0.02 : 0.06; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.fill();
  c.restore();
  // shading
  const g = c.createLinearGradient(-1, 0, 1, 0); g.addColorStop(0, 'rgba(0,0,0,0.25)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.2)');
  c.fillStyle = g; c.fillRect(-1.2, 0.6, 2.4, 2.6);
  c.restore();
  // neck
  c.fillStyle = P.shade; c.beginPath(); c.roundRect(-0.15, 0.38, 0.3, 0.32, 0.08); c.fill();
  c.fillStyle = P.trim; c.beginPath(); c.moveTo(-0.24, 0.62); c.quadraticCurveTo(0, 0.78, 0.24, 0.62); c.lineTo(0.2, 0.58); c.quadraticCurveTo(0, 0.7, -0.2, 0.58); c.fill();
  // ---- head (rotated around neck)
  c.save();
  c.translate(0, 0.5); c.rotate(st.tilt + noise1(t * 0.6, who === 'jun' ? 1 : 7) * 0.025); c.translate(0, -0.5);
  c.translate(0, noise1(t * 0.5, 3) * 0.006);
  // back hair
  if (who === 'jun') {
    c.fillStyle = P.hair;
    c.beginPath(); c.arc(0.05 - st.turn * 0.05, -0.66, 0.24, 0, Math.PI * 2); c.fill();
    c.fillStyle = P.hairHi; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(-0.05 + k * 0.05 - st.turn * 0.05, -0.74 + (k % 2) * 0.06, 0.04, 0, Math.PI); c.fill(); }
    c.fillStyle = P.hair; c.beginPath(); c.ellipse(0, -0.12, 0.56, 0.6, 0, 0, Math.PI * 2); c.fill();
  }
  // ears
  c.fillStyle = P.skin;
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * (0.49 - st.turn * s * 0.03), 0.05, 0.07, 0.11, 0, 0, Math.PI * 2); c.fill(); }
  // face
  headPath(c, P.kind);
  const fg = c.createRadialGradient(-0.12 + st.turn * 0.1, -0.15, 0.1, 0, 0, 0.75);
  fg.addColorStop(0, P.skin); fg.addColorStop(1, P.shade);
  c.fillStyle = fg; c.fill();
  c.lineWidth = 0.014; c.strokeStyle = 'rgba(30,15,10,0.45)'; c.stroke();
  // orrin seams + temple light
  if (who === 'orrin') {
    c.strokeStyle = 'rgba(120,135,145,0.45)'; c.lineWidth = 0.006;
    c.beginPath(); c.moveTo(0.36, -0.3); c.lineTo(0.42, 0.0); c.stroke();
    c.strokeStyle = 'rgba(120,135,150,0.25)'; c.lineWidth = 0.012;
    for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 0.33 + st.turn * 0.05, 0.12); c.quadraticCurveTo(sd * 0.26 + st.turn * 0.05, 0.3, sd * 0.16 + st.turn * 0.05, 0.42); c.stroke(); }
    const blink = 0.5 + 0.5 * Math.sin(t * (st.glow > 0.6 ? 30 : 2.5));
    c.fillStyle = `rgba(51,230,255,${0.35 + 0.6 * blink * clamp(st.glow * 1.5)})`;
    c.beginPath(); c.roundRect(0.4 - st.turn * 0.04, -0.2, 0.05, 0.12, 0.02); c.fill();
  }
  // blush
  if (st.blush > 0.02) {
    for (const s of [-1, 1]) {
      const bg = c.createRadialGradient(s * 0.28 + st.turn * 0.06, 0.18, 0, s * 0.28 + st.turn * 0.06, 0.18, 0.12);
      bg.addColorStop(0, `rgba(230,90,110,${0.45 * st.blush})`); bg.addColorStop(1, 'rgba(230,90,110,0)');

const RNG = mulberry(42);
const STARS = Array.from({ length: 420 }, () => ({ x: RNG() * 2000 - 640, y: RNG() * 1600 - 160, z: 0.2 + RNG() * 0.8, p: RNG() * 6.28, c: RNG() }));

let NEB = null;
function makeNebula() {
  NEB = document.createElement('canvas'); NEB.width = 900; NEB.height = 1500;

}
function drawStars(c, ox, oy, x0, y0, x1, y1, tw, t, bright = 1) {
  for (const s of STARS) {

}
function drawPlanet(c, x, y, r, t) {

function drawCosmic(c, t, st) {
  // st: {a, bloom, rays, pulse, collapse, s}
  c.save(); c.globalAlpha = st.a;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#07051a'); g.addColorStop(0.5, '#1b0c3d'); g.addColorStop(1, '#061a36');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (NEB) {
    c.save(); c.translate(W / 2, H / 2); c.rotate(t * 0.01); c.scale(1.2 + st.s * 0.002, 1.2 + st.s * 0.002);
    c.globalAlpha = st.a * (0.9 - st.collapse * 0.8); c.drawImage(NEB, -450, -750); c.restore();
  }
  c.globalAlpha = st.a * (1 - st.collapse * 0.7);
  drawStars(c, -t * 12, t * 4, 0, 0, W, H, 0.7, t, 1.3);
  // aurora ribbons
  c.globalCompositeOperation = 'lighter';
  const ribA = st.a * clamp(st.rib) * (1 - st.collapse);
  for (let k = 0; k < 5; k++) {
    const hue = (190 + k * 35 + t * 8) % 360;
    const y0 = 300 + k * 170;
    c.beginPath();
    for (let x = -40; x <= W + 40; x += 20) {
      const y = y0 + Math.sin(x * 0.006 + t * (0.5 + k * 0.13) + k) * 90 + Math.sin(x * 0.017 - t * 0.9) * 25;

    c.strokeStyle = `hsla(${hue},90%,75%,${0.3 * ribA})`; c.lineWidth = 12; c.stroke();
    c.strokeStyle = `hsla(${hue},100%,90%,${0.6 * ribA})`; c.lineWidth = 2; c.stroke();
  }
  // motes and notes
  c.font = '28px "DejaVu Sans"';
  for (const m of MOTES) {
    const y = ((m.y - t * m.sp) % (H + 100) + H + 100) % (H + 100) - 50;
    const x = m.x + Math.sin(t * 0.7 + m.p) * 30;
    const a = st.a * clamp(st.rib * 1.5) * (0.4 + 0.6 * Math.sin(t * 2 + m.p) ** 2) * (1 - st.collapse);
    if (m.n) { c.fillStyle = `hsla(${m.hue},90%,80%,${a})`; c.fillText(m.n, x, y); }
    else { c.fillStyle = `hsla(${m.hue},90%,85%,${a})`; c.beginPath(); c.arc(x, y, 1.5 + m.s * 2.5, 0, Math.PI * 2); c.fill(); }
  }

      c.strokeStyle = `rgba(255,220,160,${a})`; c.lineWidth = 6 * (1 - ph) + 1;
      c.beginPath(); c.arc(W / 2, 560, r, 0, Math.PI * 2); c.stroke();
    }
  }
  // god rays
  if (st.rays > 0.01) {
    c.save(); c.translate(W / 2, -60);
    for (let k = 0; k < 14; k++) {
      const a = -Math.PI / 2 + Math.PI / 2 + (k - 6.5) * 0.12 + Math.sin(t * 0.3 + k) * 0.03;
      c.save(); c.rotate(a);
      const rg = c.createLinearGradient(0, 0, 0, 1500);
      rg.addColorStop(0, `rgba(255,240,200,${0.22 * st.rays * st.a})`); rg.addColorStop(1, 'rgba(255,240,200,0)');
      c.fillStyle = rg; c.beginPath(); c.moveTo(-8, 0); c.lineTo(-60 - k % 3 * 20, 1500); c.lineTo(60 + k % 3 * 20, 1500); c.lineTo(8, 0); c.fill();
      c.restore();
    }
    c.restore();
  }
  // bloom / supernova
  if (st.bloom > 0.01) {
    const r = 200 + st.bloom * 520;
    const bg = c.createRadialGradient(W / 2, 520, 0, W / 2, 520, r);
    bg.addColorStop(0, `rgba(255,255,240,${0.9 * st.bloom * st.a})`); bg.addColorStop(0.25, `rgba(255,210,140,${0.45 * st.bloom * st.a})`);
    bg.addColorStop(0.6, `rgba(255,120,200,${0.15 * st.bloom * st.a})`); bg.addColorStop(1, 'rgba(0,0,0,0)');

    c.strokeStyle = `rgba(255,255,255,${0.5 * st.a})`; c.lineWidth = 2;
    c.beginPath(); c.moveTo(W / 2 - s * 5, 520); c.lineTo(W / 2 + s * 5, 520); c.moveTo(W / 2, 520 - s * 5); c.lineTo(W / 2, 520 + s * 5); c.stroke();

function drawSilhouette(c, x, y, s, kneel, kind, t, opts = {}) {
  // full-body figure in units of head height (h); feet at (x,y)
  c.save(); c.translate(x, y); c.scale(s, s);
  const k = clamp(kneel);
  const drop = 1.55 * k;
  const bow = opts.bow || 0;
  const body = '#0b0716';
  const rim = kind === 'jun' ? 'rgba(255,200,150,0.95)' : 'rgba(120,240,255,0.95)';
  c.lineCap = 'round'; c.lineJoin = 'round';
  const limbs = (col, w) => {
    c.strokeStyle = col;
    // legs
    c.lineWidth = 0.62 + w;
    const hipY = -3.4 + drop;
    for (const sd of [-1, 1]) {
      const kx = sd * 0.35 + (k ? 0.55 * k * (sd > 0 ? 1 : 0.6) : 0), ky = lerp(-1.7, -0.25, k);
      const fx = lerp(sd * 0.38, -1.1 * k + sd * 0.25, k), fy = lerp(0, -0.1, k);
      c.beginPath(); c.moveTo(sd * 0.3, hipY); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    }
    // torso
    c.lineWidth = 1.5 + w;
    c.beginPath(); c.moveTo(0, -3.6 + drop); c.lineTo(bow * 0.4, -5.7 + drop); c.stroke();
    // arms
    c.lineWidth = 0.42 + w;
    const sh = -5.75 + drop;
    const open = opts.armsOpen || 0;
    for (const sd of [-1, 1]) {
      const ex = sd * lerp(0.95, 1.6, open), ey = sh + lerp(1.5, 0.9, open);
      const hx = sd * lerp(0.9, 2.3, open), hy = sh + lerp(3.0, 0.2, open) - (opts.chest && sd < 0 ? 0 : 0);
      c.beginPath(); c.moveTo(sd * 0.75 + bow * 0.4, sh);
      if (opts.chest && sd < 0) { c.lineTo(-0.9, sh + 1.3); c.lineTo(-0.1, sh + 0.9); }
      else { c.lineTo(ex, ey); c.lineTo(hx, hy); }
      c.stroke();
    }
    // head
    const hx = bow * 0.8, hy = -6.5 + drop + bow * 0.25;
    c.fillStyle = col; c.beginPath(); c.arc(hx, hy, 0.5 + w / 2, 0, Math.PI * 2); c.fill();
    if (kind === 'jun') { c.beginPath(); c.arc(hx + 0.05, hy - 0.55, 0.26 + w / 2, 0, Math.PI * 2); c.fill(); }
  };
  c.save(); c.shadowColor = rim; c.shadowBlur = 25; limbs(rim, 0.12); c.restore();
  limbs(body, 0);
  c.restore();
}

  for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (c.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}

// ------------------------------------------------------------ render
function render(t) {
  const sh = SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
  const k = clamp((t - sh.t0) / (sh.t1 - sh.t0));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const J = stateAt('jun', t), O = stateAt('orrin', t);
  const sym = E('sym');
  const symT = t - sym.t0;
  const pulses = [];
  if (t > sym.bars[12] && t < sym.bars[22]) {
    for (let b = 13; b <= 22; b++) { const ph = (t - sym.bars[b - 1]) / 2.2; if (ph >= 0 && ph < 1) pulses.push(ph); }
  }
  const cosSt = { a: 1, rib: TR.rib.val(t), bloom: TR.bloom.val(t), rays: TR.rays.val(t), collapse: TR.collapse.val(t), pulse: pulses.length, pulses, s: symT };

  if (sh.scene === 'space') drawSpaceOpen(t);
  else if (sh.scene === 'end') drawEnd(t, t - sh.t0);
  else if (sh.scene === 'cosmicwide') {
    const c = sh.a, d = sh.b, e = ease(k);
    const z = lerp(c.z, d.z, e), cy = lerp(c.y, d.y, e);
    drawCosmic(ctx, t, cosSt);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -cy);
    const bob = Math.sin(t * 0.8) * 10;
    const kn = TR.kneel.val(t);
    drawSilhouette(ctx, 470, 1010 + bob * 0.6, 62, 0, 'orrin', t, {});
    drawSilhouette(ctx, 255, 1010 + bob, 58, kn, 'jun', t, { armsOpen: kn > 0.5 ? 0.35 : 0.15, chest: sh.t0 >= sym.bars[22] && false, bow: sh.bow ? ease((t - sh.t0) / 4) * 0.6 : 0 });
    // floating mug
    if (t < sym.bars[16]) {
      const mp = (t - sym.bars[12]) / (sym.bars[16] - sym.bars[12]);
      ctx.save(); ctx.translate(320 + mp * 260, 690 - mp * 420); ctx.scale(70, 70); drawMug(ctx, 0, 0, mp * 5, t, false); ctx.restore();
    }
    ctx.restore();
    vignette(ctx, 0.5);
  } else {
    // lounge-based shot with camera
    const e = ease(k);
    let cx = lerp(sh.a.x, sh.b.x, e), cy = lerp(sh.a.y, sh.b.y, e), z = lerp(sh.a.z, sh.b.z, e);
    const shk = (sh.shake || 0) * Math.max(J.shake, 0.2);
    cx += Math.sin(t * 37) * 3 * shk; cy += Math.cos(t * 29) * 3 * shk;
    const cosmic = TR.cosmic.val(t);
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);
    if (cosmic < 0.999 && !sh.cosmicBg) {
      drawLounge(ctx, t);
      const dim = TR.dim.val(t);
      if (dim > 0) { ctx.fillStyle = `rgba(3,5,15,${dim * 0.75})`; ctx.fillRect(-400, -200, W + 800, H + 400); }
    }
    ctx.restore();
    if (cosmic > 0.001 || sh.cosmicBg) drawCosmic(ctx, t, Object.assign({}, cosSt, { a: sh.cosmicBg ? 1 : cosmic }));
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);
    if (sh.panels) drawPanels(ctx, t, TR.panels.val(t), TR.panelsOff.val(t));
    drawBust(ctx, 'orrin', O, t);
    drawBust(ctx, 'jun', J, t);
    const fadeConsole = sh.cosmicBg ? 1 : cosmic;
    if (fadeConsole < 0.99) { ctx.globalAlpha = 1 - fadeConsole; drawConsole(ctx, t, TR.mugConsole.val(t) > 0.5); ctx.globalAlpha = 1; }
    ctx.restore();
    const dim = TR.dim.val(t) * (1 - cosmic);
    if (dim > 0 && !sh.cosmicBg) { ctx.fillStyle = `rgba(3,5,15,${dim * 0.4})`; ctx.fillRect(0, 0, W, H); }
    if (sh.cosmicBg || cosmic > 0.2) {
      // warm light wash on faces
      ctx.save(); ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = `rgba(255,170,220,${0.35 * Math.max(cosmic, sh.cosmicBg ? 1 : 0)})`; ctx.fillRect(0, 0, W, H); ctx.restore();
      if (cosSt.bloom > 0.05) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,220,170,${0.12 * cosSt.bloom})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    }
    // a few motes in front during the symphony
    if (t > sym.t0 && t < sym.t1 && (cosmic > 0.2 || sh.cosmicBg)) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 25; i++) { const m = MOTES[i]; const y = ((m.y - t * m.sp * 2) % (H + 100) + H + 100) % (H + 100) - 50; ctx.fillStyle = `hsla(${m.hue},90%,85%,${0.35 * cosSt.rib})`; ctx.beginPath(); ctx.arc(m.x, y, 3 + m.s * 4, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    vignette(ctx, 0.35 + 0.25 * Math.max(cosmic, sh.cosmicBg ? 1 : 0));
    speedLines(ctx, t, t > T1('l22') && t < T1('l22') + 0.6 ? 1 - (t - T1('l22')) / 0.6 : 0);
    if (sh.panels) drawNowPlaying(ctx, t);
    drawComputeHUD(ctx, t);
    drawTimeHUD(ctx, t);
  }
  // flash
  const fl = TR.flash.val(t);
  if (fl > 0.01) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }
  drawSubtitle(ctx, t);
  // overall fade
  const fd = TR.fade.val(t) * clamp(t / 0.8);
  if (fd < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fd})`; ctx.fillRect(0, 0, W, H); }
}

function drawSpaceOpen(t) {
  const c = ctx;
  const zoomIn = easeIn((t - 6.3) / 1.2);
  c.save();
  c.translate(W / 2, 600); c.scale(1 + zoomIn * 9, 1 + zoomIn * 9); c.translate(-W / 2, -600);
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03040c'); g.addColorStop(1, '#0a0f28'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (NEB) { c.globalAlpha = 0.7; c.drawImage(NEB, -90 - t * 4, -100); c.globalAlpha = 1; }
  drawStars(c, -t * 10, 0, 0, 0, W, H, 0.3, t);
  drawPlanet(c, 590, 1120, 420, t);
  const p = easeOut(t / 6.5);
  drawShip(c, lerp(880, 360, p), lerp(1050, 600, p), lerp(0.5, 1.15, p), -0.55 + p * 0.25, t);
  c.restore();
  const ta = clamp((t - 1.2) / 0.8) * clamp((6.4 - t) / 0.5);
  centerText(c, 'DO YOU HAVE', 230, '64px InterX', '#ffffff', ta);
  centerText(c, 'A MINUTE?', 305, '64px InterX', '#5fe9ff', ta);
  centerText(c, 'a very short symphony', 360, '26px InterM', 'rgba(255,255,255,0.8)', ta * clamp((t - 2.2) / 0.8));
  if (t > 7.1) { c.fillStyle = `rgba(255,255,255,${clamp((t - 7.1) / 0.4)})`; c.fillRect(0, 0, W, H); }
}
function drawEnd(t, lt) {
  const c = ctx;
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03040c'); g.addColorStop(1, '#0a0f28'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (NEB) { c.globalAlpha = 0.7; c.drawImage(NEB, -60 - t * 2, -150); c.globalAlpha = 1; }
  drawStars(c, -t * 8, 0, 0, 0, W, H, 0.5, t);
  drawPlanet(c, 140, 1180, 380, t);
  const p = clamp(lt / 18);
  drawShip(c, lerp(300, 520, p), lerp(820, 640, p), lerp(0.8, 0.12, easeOut(p)), -0.5, t);
  const a = clamp(lt / 1.2);
  c.fillStyle = `rgba(0,0,0,${0.3 * a})`; c.fillRect(0, 0, W, H);
  centerText(c, 'DO YOU HAVE', 250, '60px InterX', '#ffffff', clamp((lt - 1.0) / 1));
  centerText(c, 'A MINUTE?', 322, '60px InterX', '#5fe9ff', clamp((lt - 1.0) / 1));
  centerText(c, '♪  Now playing: Symphony No. 4', 470, '28px InterB', '#ffd9a8', clamp((lt - 3.5) / 1));
  centerText(c, '“Lullaby for a Dying Star”', 515, 'italic 30px InterB', '#ffffff', clamp((lt - 3.5) / 1));
  centerText(c, '(composed in 0.1 seconds)', 565, '24px InterM', 'rgba(255,255,255,0.7)', clamp((lt - 6.5) / 1));
}

window.setup = async function (tl) {
  TL = tl; EV = tl.events;
  await document.fonts.load('34px InterB'); await document.fonts.load('22px InterX'); await document.fonts.load('20px InterM');
  makeNebula(); direct();
  return true;
};
window.renderAt = function (t) { render(t); return true; };
</script></body></html>
