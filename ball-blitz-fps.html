<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ball Blitz FPS</title>
<style>
  :root { --bg:#070b16; --fg:#e8eeff; --accent:#4de1ff; --warn:#ff5a5a; --gold:#ffd54a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Trebuchet MS",system-ui,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; -webkit-touch-callout:none; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 2px 4px #000; font-weight:700; letter-spacing:.5px; }
  #tl { top:12px; left:16px; font-size:20px; line-height:1.5; }
  #tr { top:12px; right:16px; font-size:20px; text-align:right; line-height:1.5; }
  #bl { bottom:14px; left:16px; font-size:16px; }
  #bc { bottom:14px; left:50%; transform:translateX(-50%); width:220px; text-align:center; font-size:13px; }
  .lives { color:#ff6b8b; } .coins { color:var(--gold); }
  .wep { display:inline-block; padding:3px 9px; margin-right:6px; border:2px solid #345; border-radius:6px; opacity:.45; }
  .wep.own { opacity:.85; } .wep.cur { border-color:var(--accent); color:var(--accent); opacity:1; }
  #dashbar { height:7px; background:#123; border-radius:4px; margin-top:4px; overflow:hidden; }
  #dashfill { height:100%; width:100%; background:var(--accent); }
  #mult { font-size:15px; } #mult.bad { color:var(--warn); } #mult.good { color:#7dff9b; }
  #cross { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none;
    border:2px solid #fff; border-radius:50%; opacity:.75; transition:transform .06s; }
  #cross::after { content:""; position:absolute; left:8px; top:8px; width:2px; height:2px; background:#fff; }
  #cross.far { border-color:#ffb44d; }
  #cross.on { border-color:#5dff8a; }
  #cross.rel { border-color:#ff5a5a; border-style:dashed; }
  #ammo { right:20px; bottom:16px; text-align:right; font-size:38px; line-height:1; }
  #ammo small { display:block; font-size:14px; opacity:.85; margin-bottom:4px; }
  #rbar { width:170px; height:7px; background:#123; border-radius:4px; margin:6px 0 0 auto; overflow:hidden; }
  #rfill { height:100%; width:0; background:#ffb44d; }
  body.touch #ammo { display:none; }
  .pick { border-left:10px solid var(--accent); }
  .pick.sold, .shopbtn.sold { opacity:.4; }
  #secBtn { right:max(124px,calc(env(safe-area-inset-right) + 110px)); bottom:112px; width:70px; height:70px; font-size:11px; line-height:1.1; pointer-events:none; }
  #secBtn b { font-size:22px; display:block; }
  #sec { right:20px; bottom:100px; text-align:right; font-size:15px; }
  body.touch #sec { display:none; }
  .hint { font-size:13px; opacity:.8; margin:4px 0 0; }
  #cross.hit { transform:scale(1.5); border-color:#fff; background:#ff4d4d55; }
  #flash { position:fixed; inset:0; background:radial-gradient(transparent 30%, #ff0000cc); opacity:0; pointer-events:none; }
  #msg { position:fixed; left:50%; top:24%; transform:translateX(-50%); font-size:54px; font-weight:900; color:#fff;
    text-shadow:0 4px 12px #f00; pointer-events:none; opacity:0; transition:opacity .25s; white-space:nowrap; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#050a14e6; overflow:auto; padding:16px; }
  #overlay.hidden { display:none; }
  .card { max-width:720px; width:100%; background:#0f1730; border:2px solid #2a3a7a; border-radius:14px;
    padding:24px 28px; box-shadow:0 10px 40px #000a; }
  h1 { margin:0 0 6px; font-size:40px; color:var(--accent); } h2 { margin:0 0 10px; color:var(--accent); }
  p, li { line-height:1.5; color:#c9d4ff; } ul { padding-left:20px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  button { font:inherit; font-weight:800; font-size:16px; color:#04101c; background:var(--accent); border:0;
    border-radius:8px; padding:10px 16px; cursor:pointer; }
  button:hover:not(:disabled) { filter:brightness(1.15); }
  button:disabled { background:#334; color:#778; cursor:not-allowed; }
  button.go { background:#7dff9b; font-size:20px; padding:12px 26px; }
  .shopbtn { flex:1 1 200px; text-align:left; } .shopbtn small { display:block; font-weight:500; opacity:.8; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  kbd { background:#223; border:1px solid #446; border-radius:4px; padding:1px 6px; }
  /* touch controls */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #bl { display:none; }
  #look { position:fixed; inset:0; }
  .tbtn { position:fixed; border-radius:50%; border:3px solid #ffffff88; background:#ffffff22; color:#fff; font-weight:900;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; touch-action:none; text-shadow:0 2px 4px #000; }
  .tbtn.down { background:#4de1ff88; }
  #reloadBtn { right:max(18px,env(safe-area-inset-right)); bottom:max(28px,env(safe-area-inset-bottom)); width:104px; height:104px; font-size:14px; line-height:1.2; border-color:#ffffffaa; overflow:hidden; }
  #reloadBtn b { font-size:26px; display:block; }
  #dashBtn { right:max(138px,calc(env(safe-area-inset-right) + 120px)); bottom:max(28px,env(safe-area-inset-bottom)); width:68px; height:68px; font-size:13px; }
  #wepBtn { right:max(30px,env(safe-area-inset-right)); bottom:170px; width:74px; height:52px; border-radius:14px; font-size:13px; }
  #pauseBtn { left:50%; margin-left:-22px; top:8px; width:44px; height:44px; font-size:18px; }
  #joy { position:fixed; left:max(22px,env(safe-area-inset-left)); bottom:max(30px,env(safe-area-inset-bottom)); width:140px; height:140px; border-radius:50%;
    border:3px solid #ffffff55; background:#ffffff14; touch-action:none; }
  #stick { position:absolute; left:50px; top:50px; width:40px; height:40px; border-radius:50%; background:#ffffffaa; }
  body.touch #bc { bottom:auto; top:64px; width:200px; }
  body.touch #bc div:nth-child(2) { display:none; }
  @media (max-width:640px) {
    #tl,#tr { font-size:15px; top:8px; } #tl { left:10px; } #tr { right:10px; }
    #msg { font-size:34px; } .card { padding:16px 16px; } h1 { font-size:30px; }
    button { font-size:15px; padding:10px 12px; } button.go { font-size:18px; }
    #cross { transform:none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="cross"></div>
<div id="msg"></div>
<div class="hud" id="tl"></div>
<div class="hud" id="tr"></div>
<div class="hud" id="bl"></div>
<div class="hud" id="ammo"></div>
<div class="hud" id="sec"></div>
<div class="hud" id="bc"><div id="mult"></div><div>DASH <kbd>Shift</kbd></div><div id="dashbar"><div id="dashfill"></div></div></div>
<div id="touch">
  <div id="look"></div>
  <div id="joy"><div id="stick"></div></div>
  <div class="tbtn" id="reloadBtn"><b>0</b>RELOAD</div>
  <div class="tbtn" id="dashBtn">DASH</div>
  <div class="tbtn" id="secBtn"><b>0</b>THROW</div>
  <div class="tbtn" id="wepBtn">Pistol</div>
  <div class="tbtn" id="pauseBtn">II</div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============================ CONFIG ============================ */
const A = 20;                 // arena half-size
const EYE = 1.6;              // eye height
const BALL_Y = 1.5;           // balls fly at chest/head height
const START_LIVES = 20;
const LAST_LEVEL = 8;
const STUN = 1.1;             // seconds you fly through the air after a hit
const CORNER_R = 8;           // "camping zone" radius around each corner

const WEAPONS = [
  // clip/reload: tradeoffs. clipInc = rounds gained per Magazine upgrade.
  { name:"Pistol",  dmg:1.0,  cd:0.30, range:26, pellets:1, spread:0.004, clip:12, reload:1.5, clipInc:4,  color:0x66ccff, cost:0,   size:[0.05,0.07,0.35], blurb:"12 rounds · 1.5s reload · balanced" },
  { name:"SMG",     dmg:0.45, cd:0.09, range:19, pellets:1, spread:0.03,  clip:30, reload:1.2, clipInc:10, color:0xff66cc, cost:200, size:[0.06,0.08,0.38], blurb:"30 rounds · 1.2s reload · short range, weak shots" },
  { name:"Shotgun", dmg:0.8,  cd:0.80, range:13, pellets:8, spread:0.07,  clip:6,  reload:2.4, clipInc:2,  color:0xffaa44, cost:160,  size:[0.1,0.09,0.4],   blurb:"6 shells · 2.4s reload · 8 pellets, very short range" },
  { name:"Sniper",  dmg:3.5,  cd:1.00, range:50, pellets:1, spread:0,     clip:3,  reload:3.2, clipInc:1,  color:0x9dff66, cost:240, size:[0.05,0.06,0.6],  blurb:"3 rounds · 3.2s reload · pierces every ball in line", pierce:true },
];

const BALL_TYPES = {
  normal:   { name:"Bouncer",   color:0x33ccff, r:1.1, hp:3, speed:1.0 },
  splitter: { name:"Splitter",  color:0x55ff77, r:1.7, hp:3, speed:0.9 },
  berserk:  { name:"Berserker", color:0xffaa33, r:1.2, hp:6, speed:0.8 },
};

/* ============================ STATE ============================ */
let state = "menu";           // menu | play | shop | over | win | paused
let level = 1;
let run;                      // per-run persistent data (coins, upgrades, weapons)
let balls = [];
let tracers = [];
let levelTime = 0, levelHits = 0;
let curWeapon = 0, fireCd = 0, reloadT = 0, reloadTotal = 1;
let dashCd = 0, dashT = 0, dashDx = 0, dashDz = 0;
let shake = 0;
const P = { x:0, z:0, vx:0, vz:0, kx:0, kz:0, yaw:0, pitch:0, roll:0, h:0, stun:0, inv:0 };
const keys = {};
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
let joyX = 0, joyZ = 0;
if (isTouch) document.body.classList.add("touch");
const inControl = () => isTouch || document.pointerLockElement === canvas;

function newRun() {
  run = { coins:0, lives:START_LIVES, owned:[true,false,false,false], kills:0, rerolls:0,
    wu: WEAPONS.map(() => ({ clip:0, reload:0, dmg:0, range:0, rate:0 })),
    g: { speed:0, dashcd:0, coin:0, refund:0, dashReload:0 }, ammo:[], sec:{ grenade:0, glue:0, shock:0 } };
  WEAPONS.forEach((w, i) => run.ammo[i] = ws(i).clip);
  curWeapon = 0; reloadT = 0; secBag = [];
}
// effective stats for weapon i, after upgrades
function ws(i) {
  const w = WEAPONS[i], u = run.wu[i];
  return { clip: w.clip + w.clipInc * u.clip, reload: w.reload * Math.pow(0.85, u.reload), dmg: w.dmg * (1 + 0.25 * u.dmg),
           range: w.range * (1 + 0.2 * u.range), cd: w.cd / (1 + 0.15 * u.rate) };
}
const speedMult = () => 1 + 0.08 * run.g.speed;
const dashMax = () => 1.3 * Math.pow(0.85, run.g.dashcd);

/* ============================ SCENE ============================ */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x070b16, 30, 90);
const camera = new THREE.PerspectiveCamera(78, 1, 0.1, 200);
camera.rotation.order = "YXZ";
scene.add(camera);

scene.add(new THREE.HemisphereLight(0x9bb8ff, 0x203050, 0.9));
const sun = new THREE.PointLight(0xffffff, 0.9, 120); sun.position.set(0, 14, 0); scene.add(sun);

// floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2*A, 2*A), new THREE.MeshStandardMaterial({ color:0x121a30, roughness:.9 }));
floor.rotation.x = -Math.PI/2; scene.add(floor);
const grid = new THREE.GridHelper(2*A, 20, 0x3b5bff, 0x1c2a55); grid.position.y = 0.02; scene.add(grid);

// walls
const wallMat = new THREE.MeshStandardMaterial({ color:0x18213f, roughness:.7, emissive:0x0a1230 });
const edgeMat = new THREE.LineBasicMaterial({ color:0x4de1ff });
[[0,-A-0.5,2*A+2,1],[0,A+0.5,2*A+2,1],[-A-0.5,0,1,2*A+2],[A+0.5,0,1,2*A+2]].forEach(([x,z,w,d]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 7, d), wallMat); m.position.set(x, 3.5, z); scene.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat); e.position.copy(m.position); scene.add(e);
});
// low-coin corner zones
const zoneMat = new THREE.MeshBasicMaterial({ color:0xff3355, transparent:true, opacity:.16, depthWrite:false });
[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz]) => {
  const z = new THREE.Mesh(new THREE.CircleGeometry(CORNER_R, 40), zoneMat);
  z.rotation.x = -Math.PI/2; z.position.set(sx*A, 0.03, sz*A); scene.add(z);
});

// viewmodel gun
const gun = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({ color:0x66ccff, metalness:.6, roughness:.3, emissive:0x112233 }));
gun.position.set(0.32, -0.28, -0.65); camera.add(gun);
function setGunLook() {
  const w = WEAPONS[curWeapon];
  gun.scale.set(...w.size); gun.material.color.setHex(w.color);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // keep a wide horizontal view in portrait
  camera.fov = camera.aspect < 1 ? Math.min(115, 2 * Math.atan(Math.tan(50 * Math.PI/180) / camera.aspect) * 180/Math.PI) : 78;
  camera.updateProjectionMatrix();
  gun.position.x = camera.aspect < 1 ? 0.17 : 0.32;
}
addEventListener("resize", resize); resize();

/* ============================ AUDIO ============================ */
let ac = null;
function beep(freq, dur, type="square", vol=0.08, slide=0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), ac.currentTime+dur);
  g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
const sfx = {
  shoot: i => beep([420,300,180,120][i], i === 3 ? .3 : .12, "sawtooth", .06, -200),
  hit:   () => beep(700, .05, "square", .05),
  kill:  () => { beep(300, .25, "triangle", .12, 500); },
  ouch:  () => { beep(500, .6, "sawtooth", .15, -420); },
  dash:  () => beep(200, .15, "sine", .1, 500),
  coin:  () => { beep(900, .08, "square", .05); },
};

/* ============================ BALLS ============================ */
const sphereGeo = new THREE.SphereGeometry(1, 28, 18);
const circleGeo = new THREE.CircleGeometry(1, 24);
const barBg = new THREE.SpriteMaterial({ color:0x000000, depthTest:false, transparent:true, opacity:.6 });

function spawnBall(type, x, z, ang, gen=0, r=null, hp=null) {
  const T = BALL_TYPES[type];
  const b = { type, gen, x, z, dx:Math.cos(ang), dz:Math.sin(ang),
    r: r ?? T.r, maxHp: hp ?? T.hp, hp: hp ?? T.hp, flash:0,
    base: (7 + level*0.7) * T.speed * (1 + gen*0.18), speed:0 };
  b.mat = new THREE.MeshStandardMaterial({ color:T.color, emissive:T.color, emissiveIntensity:.25, roughness:.35, metalness:.2 });
  b.mesh = new THREE.Mesh(sphereGeo, b.mat); b.mesh.scale.setScalar(b.r);
  b.bar = new THREE.Sprite(new THREE.SpriteMaterial({ color:0x55ff88, depthTest:false, transparent:true }));
  b.bg = new THREE.Sprite(barBg);
  b.bar.renderOrder = 11; b.bg.renderOrder = 10;
  b.shadow = new THREE.Mesh(circleGeo, new THREE.MeshBasicMaterial({ color:T.color, transparent:true, opacity:.35, depthWrite:false }));
  b.shadow.rotation.x = -Math.PI/2; b.shadow.scale.setScalar(b.r); b.shadow.position.y = 0.04;
  const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(15), 3));
  b.line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color:T.color, transparent:true, opacity:.55 }));
  b.line.frustumCulled = false;
  scene.add(b.mesh, b.bar, b.bg, b.shadow, b.line);
  balls.push(b);
  return b;
}
function removeBall(b) {
  scene.remove(b.mesh, b.bar, b.bg, b.shadow, b.line);
  b.line.geometry.dispose(); b.mat.dispose(); b.bar.material.dispose(); b.shadow.material.dispose(); b.line.material.dispose();
}
function speedFactor(b) {
  if (b.type === "berserk") return 1 + 1.9 * (1 - b.hp / b.maxHp);   // faster the more you hurt it
  return 1;
}
function updateTrajectory(b) {
  const p = b.line.geometry.attributes.position.array;
  let x = b.x, z = b.z, dx = b.dx, dz = b.dz, rem = 34, lim = A - b.r, n = 0;
  p[0] = x; p[1] = 0.06; p[2] = z;
  for (let k = 1; k <= 4; k++) {
    if (rem > 1e-6) {
      const tx = dx > 0 ? (lim-x)/dx : dx < 0 ? (-lim-x)/dx : 1e9;
      const tz = dz > 0 ? (lim-z)/dz : dz < 0 ? (-lim-z)/dz : 1e9;
      const t = Math.max(0, Math.min(tx, tz, rem));
      x += dx*t; z += dz*t; rem -= t;
      if (t === tx) dx = -dx; else if (t === tz) dz = -dz;
    }
    p[k*3] = x; p[k*3+1] = 0.06; p[k*3+2] = z; n++;
  }
  b.line.geometry.attributes.position.needsUpdate = true;
}
function killBall(b) {
  const idx = balls.indexOf(b); if (idx < 0) return;
  balls.splice(idx, 1);
  run.kills++;
  const m = coinMult();
  run.coins += (5 + b.r * 3) * m;
  sfx.kill(); shake = Math.max(shake, .15);
  if (run.g.refund && reloadT <= 0) run.ammo[curWeapon] = Math.min(ws(curWeapon).clip, run.ammo[curWeapon] + run.g.refund);
  const kids = [];
  if (b.type === "splitter" && b.gen < 2) {
    const ang = Math.atan2(b.dz, b.dx);
    const r = b.r * 0.68, hp = Math.max(1.4, b.maxHp * 0.7);
    for (const s of [-1, 1]) kids.push([b.x, b.z, ang + s*0.75, b.gen+1, r, hp]);
  }
  removeBall(b);
  kids.forEach(k => spawnBall("splitter", ...k));
}
function damageBall(b, d, quiet) {
  b.hp -= d; if (!quiet) b.flash = .12;
  run.coins += d * 1 * coinMult();
  if (b.hp <= 0) killBall(b); else if (!quiet) sfx.hit();
}

/* ============================ COINS / CAMPING ============================ */
function zoneMult() {
  // Far from every corner -> bonus, huddled in a corner -> penalty.
  const dc = Math.hypot(Math.abs(P.x)-A, Math.abs(P.z)-A);
  return Math.max(0.3, Math.min(1.5, 0.3 + 1.2 * dc / (CORNER_R + 6)));
}
const coinMult = () => zoneMult() * (1 + 0.15 * run.g.coin);

/* ============================ SHOOTING ============================ */
const _d = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3(), _o = new THREE.Vector3(), _m = new THREE.Vector3();
function rayAll(o, d, range, pad = 0) {
  const out = [];
  for (const b of balls) {
    const R = b.r + pad;
    const ox = o.x - b.x, oy = o.y - BALL_Y, oz = o.z - b.z;
    const bb = ox*d.x + oy*d.y + oz*d.z;
    const c = ox*ox + oy*oy + oz*oz - R*R;
    const disc = bb*bb - c; if (disc < 0) continue;
    let t = -bb - Math.sqrt(disc); if (t < 0) t = -bb + Math.sqrt(disc);
    if (t >= 0 && t <= range) out.push({ ball:b, t });
  }
  return out;
}
function rayBall(o, d, range, pad = 0) {
  let best = null, bt = range;
  for (const h of rayAll(o, d, range, pad)) if (h.t <= bt) { bt = h.t; best = h.ball; }
  return { ball:best, t:bt };
}
function syncCamera() {
  camera.position.set(P.x, EYE + P.h, P.z);
  camera.rotation.set(P.pitch, P.yaw, P.roll);
  camera.updateMatrixWorld();
}
// auto-fire trigger: a ball is under the crosshair (with a little forgiveness) and in range
function targetInSights(range) {
  camera.getWorldDirection(_d);
  return !!rayBall(camera.position, _d, range, 0.35).ball;
}
function startReload() {
  if (state !== "play" || reloadT > 0) return;
  const s = ws(curWeapon);
  if (run.ammo[curWeapon] >= s.clip) return;
  reloadT = reloadTotal = s.reload; beep(180, .1, "square", .05, 60);
}
function fire() {
  const w = WEAPONS[curWeapon], s = ws(curWeapon);
  fireCd = s.cd; run.ammo[curWeapon]--;
  camera.getWorldDirection(_d);
  _r.set(1,0,0).applyQuaternion(camera.quaternion);
  _u.set(0,1,0).applyQuaternion(camera.quaternion);
  _o.copy(camera.position);
  _m.copy(_o).addScaledVector(_r, .3).addScaledVector(_u, -.22).addScaledVector(_d, .8);
  const hitBalls = new Map();
  for (let i = 0; i < w.pellets; i++) {
    const dir = _d.clone().addScaledVector(_r, (Math.random()-.5)*2*w.spread).addScaledVector(_u, (Math.random()-.5)*2*w.spread).normalize();
    let end;
    if (w.pierce) {
      for (const h of rayAll(_o, dir, s.range)) hitBalls.set(h.ball, (hitBalls.get(h.ball) || 0) + 1);
      end = _o.clone().addScaledVector(dir, s.range);
    } else {
      const res = rayBall(_o, dir, s.range);
      end = _o.clone().addScaledVector(dir, res.ball ? res.t : s.range);
      if (res.ball) hitBalls.set(res.ball, (hitBalls.get(res.ball) || 0) + 1);
    }
    const g = new THREE.BufferGeometry().setFromPoints([_m.clone(), end]);
    const mat = new THREE.LineBasicMaterial({ color:w.color, transparent:true, opacity:.9 });
    const line = new THREE.Line(g, mat); scene.add(line);

  }
  let any = false;

  if (any) { const c = document.getElementById("cross"); c.classList.add("hit"); setTimeout(() => c.classList.remove("hit"), 70); }

/* ============================ SECONDARY WEAPONS ============================ */
const SEC = {
  grenade: { name:"Grenade",   color:0x88ff55, cost:100, blurb:"lobbed; explodes on contact or landing for big area damage" },
  glue:    { name:"Glue",      color:0xcc66ff, cost:100, blurb:"leaves a sticky puddle that slows balls and damages them over time" },
  shock:   { name:"Shockwave", color:0x55ddff, cost:100, blurb:"hurts nearby balls and blasts them away from you" },
};
let secBag = [], secTimer = 8, proj = [], puddles = [], fx = [];
const secTotal = () => run.sec.grenade + run.sec.glue + run.sec.shock;
const secCost = k => run.sec[k] ? 150 * run.sec[k] : SEC[k].cost;
function fillBag() {            // one token per charge, drawn at random like from a bag
  secBag = [];
  for (const k in SEC) for (let i = 0; i < run.sec[k]; i++) secBag.push(k);
  for (let i = secBag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [secBag[i], secBag[j]] = [secBag[j], secBag[i]]; }
}
function clearSec() {
  proj.forEach(p => { scene.remove(p.mesh); p.mesh.material.dispose(); });
  puddles.forEach(u => { scene.remove(u.mesh); u.mesh.material.dispose(); });
  fx.forEach(f => { scene.remove(f.mesh); f.mesh.material.dispose(); });
  proj = []; puddles = []; fx = []; secTimer = secDelay();
}
function addFx(mesh, life, kind, R) { scene.add(mesh); fx.push({ mesh, t:life, max:life, kind, R }); }
const secDelay = () => 7 + Math.random() * 3;
// secondaries deploy automatically, aimed at the nearest ball
function deploySec() {
  const k = secBag.shift();
  say(SEC[k].name.toUpperCase() + "!");
  if (k === "shock") return shockwave();
  let tb = null, td = 1e9;
  for (const b of balls) { const d = Math.hypot(b.x - P.x, b.z - P.z); if (d < td) { td = d; tb = b; } }
  if (!tb) { secBag.unshift(k); return; }
  const x0 = P.x, y0 = EYE - .3 + P.h, z0 = P.z, T = Math.max(.35, td / 22);
  const tx = Math.max(-A, Math.min(A, tb.x + tb.dx * tb.speed * T)), tz = Math.max(-A, Math.min(A, tb.z + tb.dz * tb.speed * T));
  const c = SEC[k].color;
  const m = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:.6 }));
  m.scale.setScalar(k === "glue" ? .3 : .25);
  proj.push({ k, mesh:m, x:x0, y:y0, z:z0, vx:(tx - x0) / T, vy:(BALL_Y - y0 + 9 * T * T) / T, vz:(tz - z0) / T, t:0 });
  scene.add(m); beep(260, .15, "triangle", .08, 200);
}
function explode(x, y, z) {
  const R = 5.5;
  for (const b of balls.slice()) if (Math.hypot(b.x - x, BALL_Y - y, b.z - z) <= R + b.r) damageBall(b, 4);
  const m = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color:0xffaa33, transparent:true, opacity:.6, depthWrite:false }));
  m.position.set(x, y, z); addFx(m, .35, "boom", R);
  shake = Math.max(shake, .35); beep(90, .35, "sawtooth", .15, -40);
}
function makePuddle(x, z) {
  const m = new THREE.Mesh(circleGeo, new THREE.MeshBasicMaterial({ color:0xcc66ff, transparent:true, opacity:.45, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.scale.setScalar(3.5); m.position.set(x, .05, z); scene.add(m);
  puddles.push({ x, z, r:3.5, t:9, mesh:m }); beep(160, .2, "sine", .1, -60);
}
function shockwave() {
  const R = 9;
  for (const b of balls.slice()) {
    const dx = b.x - P.x, dz = b.z - P.z, d = Math.hypot(dx, dz);
    if (d <= R + b.r) { if (d > .01) { b.dx = dx/d; b.dz = dz/d; } damageBall(b, 1.5); }
  }
  const m = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 48), new THREE.MeshBasicMaterial({ color:0x55ddff, transparent:true, opacity:.8, side:THREE.DoubleSide, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(P.x, .1, P.z); addFx(m, .45, "ring", R);
  shake = Math.max(shake, .25); beep(140, .4, "sine", .15, 300);
}
function updateSec(dt) {
  if (secBag.length && balls.length) { secTimer -= dt; if (secTimer <= 0) { deploySec(); secTimer = secDelay(); } }
  for (let i = proj.length - 1; i >= 0; i--) {
    const p = proj[i]; p.t += dt; p.vy -= 18 * dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt; p.mesh.position.set(p.x, p.y, p.z);
    let hit = false; for (const b of balls) if (Math.hypot(b.x - p.x, BALL_Y - p.y, b.z - p.z) < b.r + .3) { hit = true; break; }
    const wall = Math.abs(p.x) > A - .3 || Math.abs(p.z) > A - .3, floor = p.y <= .25 && p.vy < 0;
    if (hit || wall || floor || p.t > 3) {
      proj.splice(i, 1); scene.remove(p.mesh); p.mesh.material.dispose();
      const x = Math.max(-A + .5, Math.min(A - .5, p.x)), z = Math.max(-A + .5, Math.min(A - .5, p.z));
      if (p.k === "grenade") explode(x, Math.max(.25, p.y), z); else makePuddle(x, z);
    }
  }
  for (let i = puddles.length - 1; i >= 0; i--) {
    const u = puddles[i]; u.t -= dt; u.mesh.material.opacity = .45 * Math.min(1, u.t / 1.5);
    if (u.t <= 0) { scene.remove(u.mesh); u.mesh.material.dispose(); puddles.splice(i, 1); continue; }
    for (const b of balls.slice()) if (Math.hypot(b.x - u.x, b.z - u.z) < u.r + b.r * .5) { b.slowT = .2; damageBall(b, .9 * dt, true); }
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t -= dt; const q = Math.min(1, 1 - f.t / f.max);
    f.mesh.scale.setScalar(Math.max(.01, f.R * q)); f.mesh.material.opacity = (f.kind === "boom" ? .6 : .8) * (1 - q);
    if (f.t <= 0) { scene.remove(f.mesh); f.mesh.material.dispose(); if (f.kind === "ring") f.mesh.geometry.dispose(); fx.splice(i, 1); }
  }
}

/* ============================ PLAYER HIT ============================ */
function playerHit(b) {

  P.kx = nx * 34; P.kz = nz * 34; P.vx = P.vz = 0; dashT = 0;
  shake = .6; sfx.ouch();

  say(["OUCH!", "WHEEEE!", "BONK!", "YEEEET!"][Math.floor(Math.random()*4)]);

}
let msgT = 0;
function say(t) { const m = document.getElementById("msg"); m.textContent = t; m.style.opacity = 1; msgT = 1.0; }

/* ============================ LEVELS ============================ */
function levelPlan(n) {
  const plan = [];
  const normal = 2 + Math.floor(n/2), split = n >= 2 ? 1 + Math.floor((n-1)/2) : 0, bers = n >= 3 ? Math.floor(n/2) : 0;
  for (let i = 0; i < normal; i++) plan.push("normal");
  for (let i = 0; i < split; i++) plan.push("splitter");
  for (let i = 0; i < bers; i++) plan.push("berserk");
  return plan;
}
function startLevel() {
  balls.forEach(removeBall); balls = [];
  tracers.forEach(t => scene.remove(t.line)); tracers = [];
  P.x = P.z = P.vx = P.vz = P.kx = P.kz = 0; P.stun = 0; P.h = 0; P.roll = 0; P.inv = 1.2;
  P.yaw = 0; P.pitch = 0; dashT = 0; dashCd = 0;
  clearSec(); fillBag();
  levelTime = 0; levelHits = 0; reloadT = 0; fireCd = .5;
  WEAPONS.forEach((w, i) => run.ammo[i] = ws(i).clip);
  for (const type of levelPlan(level)) {
    let x, z, tries = 0;
    do { x = (Math.random()*2-1)*(A-3); z = (Math.random()*2-1)*(A-3); } while (Math.hypot(x, z) < 13 && ++tries < 50);
    spawnBall(type, x, z, Math.random()*Math.PI*2);
  }
  state = "play"; setGunLook();
  say("LEVEL " + level);
}
function levelClear() {
  state = "shop";
  document.exitPointerLock && document.exitPointerLock();
  const timeBonus = Math.max(0, Math.floor((50 + level*6 - levelTime) / 2));
  const cleanBonus = levelHits === 0 ? 30 : 0;
  run.coins += timeBonus + cleanBonus;
  if (level >= LAST_LEVEL) return showWin(timeBonus, cleanBonus);
  showPick(timeBonus, cleanBonus);
}
function gameOver() {
  state = "over"; document.exitPointerLock && document.exitPointerLock();
  card(`<h1 style="color:var(--warn)">You ran out of lives</h1>
    <p>You made it to <b>level ${level}</b>, destroyed <b>${run.kills}</b> balls and collected <b class="coins">${Math.floor(run.coins)}</b> coins.</p>

}

/* ---- upgrade catalogue ---- */

for (const k in GLOBAL) { const g = GLOBAL[k];

  return out;
}

/* ============================ INPUT ============================ */

addEventListener("mousemove", e => {

addEventListener("wheel", e => {
  if (state !== "play") return;
  const dir = e.deltaY > 0 ? 1 : -1; let i = curWeapon;

function selectWeapon(i) { if (run.owned[i] && i !== curWeapon) { curWeapon = i; reloadT = 0; fireCd = Math.max(fireCd, .3); setGunLook(); } }
function tryDash() {
  if (dashCd > 0 || P.stun > 0) return;
  let fx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), fz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (Math.hypot(joyX, joyZ) > 0.3) { fx = joyX; fz = joyZ; }
  if (!fx && !fz) fz = -1;
  const l = Math.hypot(fx, fz); fx /= l; fz /= l;

  dashDx = fx*c + fz*s; dashDz = -fx*s + fz*c;
  dashT = .16; dashCd = dashMax(); sfx.dash();

}

/* touch input */
if (isTouch) {
  const look = document.getElementById("look"), joy = document.getElementById("joy"), stick = document.getElementById("stick");
  let lookId = null, lx = 0, ly = 0, joyId = null;
  look.addEventListener("touchstart", e => { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; e.preventDefault(); }, { passive:false });
  look.addEventListener("touchmove", e => {
    for (const t of e.changedTouches) if (t.identifier === lookId) {
      if (state === "play" && P.stun <= 0) {
        P.yaw -= (t.clientX - lx) * 0.006;
        P.pitch = Math.max(-1.2, Math.min(1.2, P.pitch - (t.clientY - ly) * 0.006));
      }
      lx = t.clientX; ly = t.clientY;
    }
    e.preventDefault();
  }, { passive:false });
  const lookEnd = e => { for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null; };
  look.addEventListener("touchend", lookEnd); look.addEventListener("touchcancel", lookEnd);

  const joyMove = t => {
    const r = joy.getBoundingClientRect(), R = r.width / 2;
    let dx = t.clientX - (r.left + R), dy = t.clientY - (r.top + R);
    const d = Math.hypot(dx, dy), m = Math.min(1, d / R);
    if (d > 0) { dx /= d; dy /= d; }
    joyX = dx * m; joyZ = dy * m;
    stick.style.left = (R - 20 + dx * m * (R - 20)) + "px"; stick.style.top = (R - 20 + dy * m * (R - 20)) + "px";
  };
  joy.addEventListener("touchstart", e => { const t = e.changedTouches[0]; joyId = t.identifier; joyMove(t); e.preventDefault(); }, { passive:false });
  joy.addEventListener("touchmove", e => { for (const t of e.changedTouches) if (t.identifier === joyId) joyMove(t); e.preventDefault(); }, { passive:false });
  const joyEnd = e => { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyX = joyZ = 0; stick.style.left = stick.style.top = "50px"; } };
  joy.addEventListener("touchend", joyEnd); joy.addEventListener("touchcancel", joyEnd);

  const bind = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", e => { el.classList.add("down"); down(); e.preventDefault(); }, { passive:false });
    const end = e => { el.classList.remove("down"); up && up(); e.preventDefault(); };
    el.addEventListener("touchend", end, { passive:false }); el.addEventListener("touchcancel", end, { passive:false });
  };
  bind("reloadBtn", startReload);
  bind("dashBtn", () => { if (state === "play") tryDash(); });
  bind("wepBtn", () => {
    if (state !== "play") return;
    let i = curWeapon; for (let k = 0; k < WEAPONS.length; k++) { i = (i + 1) % WEAPONS.length; if (run.owned[i]) break; }
    selectWeapon(i);
  });
  bind("pauseBtn", () => { if (state === "play") { state = "paused"; showPause(); } });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; showPause(); } });
  document.addEventListener("contextmenu", e => e.preventDefault());
}

/* ============================ UPDATE ============================ */
function update(dt) {
  // --- player ---
  P.inv = Math.max(0, P.inv - dt); fireCd -= dt; dashCd = Math.max(0, dashCd - dt);
  if (P.stun > 0) {
    P.stun = Math.max(0, P.stun - dt);
    const t = 1 - P.stun / STUN;
    P.h = Math.sin(Math.PI * Math.min(1, t)) * 4.5;
    P.roll = P.stun > 0 ? t * Math.PI * 6 : 0;
  } else {
    P.h = 0; P.roll = 0;
    let fx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), fz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    const l = Math.hypot(fx, fz) || 1; fx /= l; fz /= l;
    if (Math.hypot(joyX, joyZ) > 0.12) { fx = joyX; fz = joyZ; }
    const s = Math.sin(P.yaw), c = Math.cos(P.yaw), sp = 10 * speedMult();
    let tx = (fx*c + fz*s) * sp, tz = (-fx*s + fz*c) * sp;
    if (dashT > 0) { dashT -= dt; tx = dashDx * 28; tz = dashDz * 28; }
    const k = 1 - Math.exp(-14 * dt);
    P.vx += (tx - P.vx) * k; P.vz += (tz - P.vz) * k;
  }
  const fr = Math.exp(-(P.stun > 0 ? 0.8 : 4) * dt);
  P.kx *= fr; P.kz *= fr;
  P.x += (P.vx + P.kx) * dt; P.z += (P.vz + P.kz) * dt;
  const lim = A - 0.6;
  if (P.x > lim)  { P.x = lim;  P.kx = -Math.abs(P.kx) * .75; P.vx = 0; }
  if (P.x < -lim) { P.x = -lim; P.kx =  Math.abs(P.kx) * .75; P.vx = 0; }
  if (P.z > lim)  { P.z = lim;  P.kz = -Math.abs(P.kz) * .75; P.vz = 0; }
  if (P.z < -lim) { P.z = -lim; P.kz =  Math.abs(P.kz) * .75; P.vz = 0; }

  // --- weapon: auto-fire + reload ---
  syncCamera();
  const cw = curWeapon, s = ws(cw);
  if (reloadT > 0) {
    reloadT -= dt;
    if (reloadT <= 0) { reloadT = 0; run.ammo[cw] = s.clip; beep(520, .08, "square", .05, 200); }
  } else if (run.ammo[cw] <= 0) startReload();
  if (reloadT <= 0 && fireCd <= 0 && P.stun <= 0 && run.ammo[cw] > 0 && targetInSights(s.range)) fire();

  updateSec(dt);

  // --- balls ---
  for (const b of balls) {
    b.speed = b.base * speedFactor(b) * (b.slowT > 0 ? 0.35 : 1);
    if (b.slowT > 0) b.slowT -= dt;
    b.x += b.dx * b.speed * dt; b.z += b.dz * b.speed * dt;
    const bl = A - b.r;
    if (b.x > bl)  { b.x = bl;  b.dx = -Math.abs(b.dx); }
    if (b.x < -bl) { b.x = -bl; b.dx =  Math.abs(b.dx); }
    if (b.z > bl)  { b.z = bl;  b.dz = -Math.abs(b.dz); }
    if (b.z < -bl) { b.z = -bl; b.dz =  Math.abs(b.dz); }
    if (P.inv <= 0 && P.stun <= 0) {
      const d = Math.hypot(b.x - P.x, b.z - P.z);
      const dy = Math.abs(BALL_Y - (0.9 + P.h));
      if (d < b.r + 0.5 && dy < b.r + 0.8) playerHit(b);
    }
  }
  // --- level complete ---
  if (state === "play") {
    levelTime += dt;
    if (balls.length === 0) levelClear();
  }
}

/* ============================ RENDER ============================ */
const hud = id => document.getElementById(id);
function render(dt) {
  camera.position.set(P.x, EYE + P.h, P.z);
  const sk = shake * (Math.random() - .5) * .25;
  camera.rotation.set(P.pitch + sk, P.yaw + sk, P.roll);
  shake = Math.max(0, shake - dt * 1.5);
  gun.position.z += (-0.65 - gun.position.z) * Math.min(1, dt * 18);
  gun.rotation.x += (0 - gun.rotation.x) * Math.min(1, dt * 14);
  gun.visible = P.stun <= 0;

  const t = performance.now() / 1000;
  for (const b of balls) {
    b.flash = Math.max(0, b.flash - dt);
    const frac = Math.max(0, b.hp / b.maxHp);
    b.mesh.position.set(b.x, BALL_Y + Math.sin(t*3 + b.r*7) * .05, b.z);
    let em = .25 + b.flash * 6;
    if (b.type === "berserk") { em += (1 - frac) * (.6 + .4*Math.sin(t*14)); b.mat.color.setHSL(.09 * frac, 1, .5); b.mat.emissive.copy(b.mat.color); }
    b.mat.emissiveIntensity = em;
    b.bg.position.set(b.x, BALL_Y + b.r + .7, b.z); b.bar.position.copy(b.bg.position);
    b.bg.scale.set(1.9, .24, 1); b.bar.scale.set(1.8 * frac, .16, 1);
    b.bar.material.color.setHSL(.33 * frac, 1, .5);
    b.shadow.position.set(b.x, .04, b.z);
    updateTrajectory(b);
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i]; tr.life -= dt; tr.line.material.opacity = Math.max(0, tr.life / tr.max);
    if (tr.life <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(i, 1); }
  }

  // crosshair state: on target & in range / on target but too far
  const cr = hud("cross");
  if (state === "play") {
    camera.getWorldDirection(_d);
    const rng = ws(curWeapon).range;
    const inR = rayBall(camera.position, _d, rng, 0.35).ball;
    const far = !inR && rayBall(camera.position, _d, 200).ball;
    cr.classList.toggle("on", !!inR); cr.classList.toggle("far", !!far); cr.classList.toggle("rel", reloadT > 0);
  }

  // HUD
  const m = zoneMult(), mc = coinMult();
  hud("tl").innerHTML = `<span class="lives">♥ ${run ? run.lives : 0}</span> / ${START_LIVES}<br><span class="coins">● ${run ? Math.floor(run.coins) : 0}</span>`;
  hud("tr").innerHTML = `Level ${level}/${LAST_LEVEL}<br>Balls left: ${balls.length}<br>${levelTime.toFixed(1)}s`;
  hud("bl").innerHTML = WEAPONS.map((w, i) => `<span class="wep ${run && run.owned[i] ? "own" : ""} ${i === curWeapon ? "cur" : ""}">${i+1} ${w.name} <small>${run && run.owned[i] ? run.ammo[i] : ""}</small></span>`).join("");
  const me = hud("mult");
  me.textContent = m < 0.75 ? `CORNER ZONE: coins x${mc.toFixed(1)}` : `Coins x${mc.toFixed(1)}`;
  me.className = m < 0.75 ? "bad" : m > 1.2 ? "good" : "";
  const sw = ws(curWeapon), frac = reloadT > 0 ? 1 - reloadT / reloadTotal : 1;
  hud("ammo").innerHTML = `<small>${WEAPONS[curWeapon].name}${reloadT > 0 ? " · RELOADING" : run.ammo[curWeapon] < sw.clip ? " · R to reload" : ""}</small>${run.ammo[curWeapon]} / ${sw.clip}<div id="rbar"><div id="rfill" style="width:${(frac * 100).toFixed(0)}%"></div></div>`;
  const nx = secBag[0];
  hud("sec").innerHTML = secTotal() ? `${nx ? `Next: ${SEC[nx].name} in ${Math.ceil(Math.max(0, secTimer))}s` : "secondaries used up"} · ${secBag.length} left` : "";
  if (isTouch) {
    const sb = hud("secBtn");
    sb.style.display = secTotal() ? "flex" : "none";
    sb.innerHTML = nx ? `<b>${Math.ceil(Math.max(0, secTimer))}s</b>${SEC[nx].name} · ${secBag.length}` : `<b>0</b>empty`;
    sb.style.borderColor = nx ? hex(SEC[nx].color) : ""; sb.style.opacity = nx ? 1 : .4;
    const rb = hud("reloadBtn");
    rb.innerHTML = `<b>${run.ammo[curWeapon]}/${sw.clip}</b>${reloadT > 0 ? "RELOADING" : "RELOAD"}`;
    rb.style.background = reloadT > 0 ? `linear-gradient(to top, #ffb44daa ${(frac*100).toFixed(0)}%, #ffffff22 ${(frac*100).toFixed(0)}%)` : "";
    document.getElementById("wepBtn").textContent = WEAPONS[curWeapon].name;
    document.getElementById("touch").style.display = state === "play" || state === "dying" ? "block" : "none";
  }
  hud("dashfill").style.width = (100 * (1 - dashCd / dashMax())) + "%";

  const fl = hud("flash"); fl.style.opacity = Math.max(0, parseFloat(fl.style.opacity || 0) - dt * 1.6);
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) hud("msg").style.opacity = 0; }
  renderer.render(scene, camera);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play" || state === "dying") update(dt);
  render(dt);
  requestAnimationFrame(loop);
}
newRun(); setGunLook(); showMenu();
requestAnimationFrame(loop);
window.__game = { P, balls: () => balls, get state() { return state; }, update, fire, startLevel, run: () => run, deploySec, secTimer: () => secTimer, ws, secBag: () => secBag, proj: () => proj, puddles: () => puddles, UPG, draw, upgOk, dbg: () => ({ ammo: run.ammo.slice(), reloadT, curWeapon }) };
</script>
</body>
</html>
