<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Möbius Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a workbench. Setup sheet on the left, the cutting mat (3D view) on the right with the results ledger docked under it. */
:root {
  --paper: #eef1ee;      /* panel / page */
  --sheet: #f9faf8;      /* raised cards */
  --ink: #1b2622;        /* text */
  --muted: #5a6a63;      /* secondary text */
  --rule: #d2dbd6;       /* borders */
  --mat: #2c5a4b;        /* cutting mat */
  --mat-line: #6f9c8b;   /* mat grid */
  --mat-ink: #e7efe9;    /* text on mat */
  --cut: #cf3e2a;        /* the scissors line */
  --tape: #d8c28a;       /* masking tape */
  --focus: #1f6fd1;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a17; --sheet: #19231f; --ink: #e4ebe7; --muted: #94a59d; --rule: #2b3934;
    --mat: #1b3a30; --mat-line: #3f6a5b; --mat-ink: #d6e5dc; --cut: #ff6a52; --tape: #b9a46c; --focus: #6aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121a17; --sheet: #19231f; --ink: #e4ebe7; --muted: #94a59d; --rule: #2b3934;
  --mat: #1b3a30; --mat-line: #3f6a5b; --mat-ink: #d6e5dc; --cut: #ff6a52; --tape: #b9a46c; --focus: #6aa8ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "setup bench";
}

/* ---------- setup sheet ---------- */
.setup {
  grid-area: setup;
  overflow-y: auto;
  border-right: 1px solid var(--rule);
  padding-block: 20px 28px;
  padding-inline: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.brand h1 {
  margin: 0;
  font: 700 30px/1.05 var(--font-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 34ch; }

.label {
  font: 600 11px/1.2 var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.field { display: flex; flex-direction: column; gap: 6px; }
select {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--sheet);
}

.strips { display: flex; flex-direction: column; gap: 0; }
.strip {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.strip-head { display: flex; align-items: center; gap: 10px; }
.swatch {
  width: 22px; height: 12px; border-radius: 2px;
  border: 1px solid rgba(0,0,0,.18);
  flex: none;
}
.strip-head h2 { margin: 0; font: 600 16px/1.2 var(--font-display); flex: 1; }
.icon-btn {
  border: 1px solid transparent; background: none; border-radius: var(--radius);
  padding: 4px 8px; color: var(--muted); cursor: pointer;
}
.icon-btn:hover { border-color: var(--rule); color: var(--ink); }

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.stepper button { border: 0; background: var(--paper); width: 32px; cursor: pointer; font-size: 17px; }
.stepper button:hover { background: var(--rule); }
.stepper output {
  min-width: 38px; text-align: center; padding: 5px 4px;
  font: 600 15px/1.4 var(--font-mono); font-variant-numeric: tabular-nums;
}
.twist-name { color: var(--muted); font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 999px;
  padding: 3px 11px; cursor: pointer; font: 500 14px/1.5 var(--font-mono);
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--cut); border-color: var(--cut); color: #fff; }
.custom { display: flex; gap: 6px; }
.custom input {
  width: 100%; min-width: 0; padding: 4px 9px; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--paper); font-family: var(--font-mono); font-size: 14px;
}
.custom button { border: 1px solid var(--rule); background: var(--paper); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
.note { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.4; }
.note.error { color: var(--cut); }

.joint {
  display: flex; flex-direction: column; align-items: stretch; gap: 6px;
  padding: 10px 0 10px 18px; margin-left: 18px;
  border-left: 3px dashed var(--tape);
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--sheet); padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--tape); color: #2a2412; font-weight: 600; }

.add-strip {
  border: 1px dashed var(--rule); background: none; border-radius: var(--radius); padding: 9px; cursor: pointer; color: var(--muted);
}
.add-strip:hover { color: var(--ink); border-color: var(--muted); }

.actions { display: flex; gap: 8px; position: sticky; bottom: -28px; padding-block: 12px; background: var(--paper); }
.btn {
  flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  padding: 11px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 600;
  border: 1px solid var(--rule); background: var(--sheet);
}
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.15); }
.btn svg { width: 18px; height: 18px; }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- bench: mat + results ---------- */
.bench {
  grid-area: bench;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  min-width: 0; min-height: 0;
}
.stage { position: relative; min-height: 0; background: var(--mat); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.toolbar {
  position: absolute; top: 12px; right: 12px; left: 12px;
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
.tool {
  display: inline-flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--mat) 70%, black 30%);
  color: var(--mat-ink); border: 1px solid var(--mat-line); border-radius: var(--radius);
  padding: 5px 10px; font-size: 13px;
}
button.tool { cursor: pointer; }
button.tool[aria-pressed="true"] { background: var(--mat-ink); color: var(--mat); }
.tool input[type="range"] { width: 110px; accent-color: var(--cut); }
.hint {
  position: absolute; left: 14px; bottom: 12px; margin: 0;
  color: var(--mat-ink); opacity: .75; font-size: 12px; pointer-events: none;
}
.status {
  position: absolute; left: 14px; top: 14px; margin: 0;
  font: 600 12px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--mat-ink);
  max-width: 45%;
}

.results {
  border-top: 1px solid var(--rule);
  background: var(--paper);
  padding-block: 14px 16px;
  padding-inline: 20px;
  max-height: 44vh;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
}
.headline {
  margin: 0; font: 600 20px/1.25 var(--font-display); letter-spacing: -0.01em; text-wrap: balance;
  max-width: 60ch;
}
.before { margin: 0; color: var(--muted); font-size: 14px; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.piece {
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 10px 12px; min-width: 0; cursor: pointer; text-align: left;
}
.piece:hover { border-color: var(--muted); }
.piece[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.piece.hidden-piece { opacity: .5; }
.piece .swatch { margin-top: 5px; width: 14px; height: 14px; border-radius: 3px; }
.piece h3 { margin: 0; font: 600 15px/1.35 var(--font-display); }
.piece h3 small { font: 500 12px var(--font-mono); color: var(--muted); margin-left: 4px; }
.facts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.facts li { font-size: 12.5px; padding: 1px 7px; border-radius: 4px; background: var(--paper); border: 1px solid var(--rule); }
.facts li.side { font-weight: 600; }
.facts li.linked { border-color: var(--cut); color: var(--cut); }
.eye { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 12px; text-decoration: underline; }

@media (max-width: 820px) {
  .app {
    height: auto;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto;
    grid-template-areas: "bench" "setup";
  }
  .bench { grid-template-rows: 58vh auto; }
  .setup { border-right: 0; border-top: 1px solid var(--rule); overflow: visible; padding-inline: 16px; }
  .results { max-height: none; padding-inline: 16px; }
  .actions { position: static; }
  .status { top: auto; bottom: 12px; max-width: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="setup" aria-label="Experiment setup">
    <header class="brand">
      <h1>Möbius Lab</h1>
      <p>Twist paper strips, tape them together, cut along a line and see what falls out. No paper needed.</p>
    </header>

    <div class="field">
      <label class="label" for="preset">Start from a classic experiment</label>
      <select id="preset"></select>
    </div>

    <div class="field">
      <span class="label">Strips</span>
      <div class="strips" id="strips"></div>
    </div>
    <button class="add-strip" id="add-strip" type="button">+ Tape on another strip</button>

    <div class="actions">
      <button class="btn primary" id="cut-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6 20 18M8.6 16.4 20 6"/></svg>
        Cut
      </button>
      <button class="btn" id="reset-btn" type="button">Tape back together</button>
    </div>
  </aside>

  <main class="bench">
    <div class="stage" id="stage">
      <p class="status" id="status"></p>
      <div class="toolbar">
        <label class="tool" for="gap">Spread cuts <input id="gap" type="range" min="0" max="1" step="0.01" value="0.5"></label>
        <button class="tool" id="edges-btn" type="button" aria-pressed="true">Edges</button>
        <button class="tool" id="view-btn" type="button">Reset view</button>
      </div>
      <p class="hint">Drag to turn · scroll or pinch to zoom · right-drag to move</p>
    </div>
    <section class="results" id="results" aria-live="polite"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="src/core.js"></script>
<script src="src/app.js"></script>
</body>
</html>
