<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcane Gambit piece sheet</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* Contact sheet for the figurines: every unit, both sides, light and dark
     squares, large and small. ?ids=a,b limits it; ?size=160 enlarges. */
  html, body.sheet { background: #ffffff; color: #111111; }
  body.sheet { margin: 0; padding: 12px; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  #out { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 8px; }
  .sh-cell { border: 1px solid #b9b9b9; padding: 6px; display: grid; gap: 4px; }
  .sh-nm { font-weight: 700; }
  .sh-meta { color: #666666; }
  .sh-row { display: flex; gap: 0; align-items: end; }
  .sh-t { display: grid; place-items: center; }
  .sh-t.lt { background: #f5f5f5; }
  .sh-t.dk { background: #c3c3c6; }
  .sh-t > svg { width: 86%; height: 86%; }
</style>
</head>
<body class="sheet">
<div id="out"></div>
<script src="../js/core/util.js"></script>
<script src="../js/core/board.js"></script>
<script src="../js/core/battle.js"></script>
<script src="../js/data/passives.js"></script>
<script src="../js/data/abilities.js"></script>
<script src="../js/data/units.js"></script>
<script src="../js/data/upgrades.js"></script>
<script src="../js/ui/dom.js"></script>
<script src="../js/ui/pieces.js"></script>
<script src="../js/art/player.js"></script>
<script src="../js/art/enemy.js"></script>
<script src="../js/art/enemy3.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const size = +(q.get('size') || 104);
  const extra = Object.keys(AG.Art.pieces).filter((k) => !AG.Units[k] && k !== '_fallback');
  const ids = q.get('ids') ? q.get('ids').split(',') : Object.keys(AG.Units).concat(extra);
  document.documentElement.style.setProperty('--cw', (size * 2 + 16) + 'px');
  const out = document.getElementById('out');
  const tile = (cls, px, el) => { const t = UI.h('div.sh-t.' + cls, { style: { width: px + 'px', height: px + 'px' } }); t.appendChild(el); return t; };
  const UI = AG.UI;
  for (const id of ids) {
    const d = AG.Units[id] || { name: id, pool: 'extra' };
    const has = !!AG.Art.pieces[id] || !!AG.Art.alias[id];
    const glow = AG.Art.glowFor(id);
    const cell = UI.h('div.sh-cell',
      UI.h('div.sh-nm', d.name + (has ? '' : '  (no art yet)')),
      UI.h('div.sh-meta', id + ' · ' + d.pool + (d.rarity ? ' · ' + d.rarity : '') + (glow ? ' · ' + glow : '') + (d.big ? ' · big' : '') + (d.flying ? ' · flies' : '')));
    const big = UI.h('div.sh-row');
    big.appendChild(tile('lt', size, UI.piece(id, { side: 0 })));
    big.appendChild(tile('dk', size, UI.piece(id, { side: 1 })));
    cell.appendChild(big);
    const small = UI.h('div.sh-row');
    for (const [side, bg] of [[0, 'dk'], [1, 'lt']]) small.appendChild(tile(bg, 52, UI.piece(id, { side })));
    for (const [side, bg] of [[0, 'lt'], [1, 'dk']]) small.appendChild(tile(bg, 30, UI.piece(id, { side, cls: 'sm' })));
    small.appendChild(tile('lt', 52, UI.piece(id, { side: 0, glow: '' })));
    cell.appendChild(small);
    out.appendChild(cell);
  }
})();
</script>
</body>
</html>
