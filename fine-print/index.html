    ctx.font = `17px ${MONO}`; ctx.textAlign = 'center';
    ctx.fillStyle = rgba(RED, 0.9 * ta); ctx.fillText('harm', nowX, y - 26);
    ctx.fillStyle = rgba(DATA, 0.8 * ta); ctx.fillText('now', nowX, y + 36);
    const u = t - later.t0 - 0.4;
    if (u > 0) {
      const mx = 1260 + 110 * u + 150 * u * u, ma = ta * smooth(clamp(u / 0.4)) * (1 - smooth(clamp((mx - 1700) / 250)));
      ctx.fillStyle = rgba(WARM_HI, 0.9 * ma);
      ctx.save(); ctx.translate(mx, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-6, -6, 12, 12); ctx.restore();
      ctx.fillStyle = rgba(WARM_HI, 0.85 * ma); ctx.fillText('accountability', mx, y - 26);
      ctx.fillStyle = rgba(DATA, 0.7 * ma); ctx.fillText('later', mx, y + 36);

      ctx.font = `italic 46px ${SERIF}`; ctx.textAlign = 'right';
      ctx.fillStyle = rgba(DATA, 0.85 * qa); ctx.fillText('?', 1860, y + 16);
    }
  }
}

// ---------- §4 force ----------
function drawAct4(t) {
  if (t < T.act4 || t > T.act5 + 0.3) return;
  const st = mainFig(t);
  const vis = smooth(clamp((t - T.act4 - 0.2) / 1.0)) * (1 - smooth(clamp((t - T.act5 + 0.9) / 0.9)));
  const hands = [handAt(hF, t), handAt(hG, t)];
  const tz = L('taser'), jit = t > tz.t0 + 0.15 && t < tz.t0 + 1.3;
  const f = Math.floor(t * 30);
  if (jit) { st.x += (hash01(f, 1) - 0.5) * 8; st.y += (hash01(f, 2) - 0.5) * 6; }
  const worse = smooth(clamp((t - L('worse').t0) / 0.5));
  drawAura(auraGeom(st), { a: 0.45 * vis * (1 - worse * 0.6), dents: hands.map(fingertip).filter(Boolean), time: t });
  const bn = L('bones');
  const fractures = [
    { j: 'knL', t0: bn.t0 + 0.5, seed: 1 }, { j: 'elR', t0: bn.t0 + 0.65, seed: 2 },
    { j: 'shR', t0: bn.t0 + 2.0, seed: 3 }, { j: 'knR', t0: bn.t0 + 2.15, seed: 4 },
  ];
  drawFigure(st, { a: vis, time: t, fractures, dim: worse * 0.35 });
  hands.forEach(h => drawHand(h, vis));
  if (worse > 0) { ctx.fillStyle = `rgba(0,0,0,${0.3 * worse * vis})`; ctx.fillRect(0, 0, W, H); }
  drawNo(t, L('no1'), vis > 0.1 ? st : null);
  // commands
  [['cmd1', 'HANDS BEHIND YOUR BACK'], ['cmd2', 'STOP RESISTING']].forEach(([id, text]) => {
    const l = L(id), a = win(t, l.t0, l.t1 + 0.6, 0.08, 0.4) * vis;
    if (a <= 0) return;
    ctx.font = `600 26px ${MONO}`; ctx.textAlign = 'center';
    glowText(text, 1240, 330, COLD, a, 14);
  });
  // baton
  const bt = L('baton').t0 + 0.3, bu = t - bt;
  if (bu > -0.01 && bu < 0.9) {
    const q = jw(st, 'knL'), p = [q[0] + 130, q[1] - 190], len = 225;
    const th1 = Math.atan2(q[1] - p[1], q[0] - p[0]), th0 = th1 - 1.7;
    const k = easeIn(clamp(bu / 0.16)), fa = 1 - smooth(clamp((bu - 0.45) / 0.45));
    for (let n = 5; n >= 0; n--) {
      const kk = clamp(k - n * 0.07), th = lerp(th0, th1, kk);
      ctx.strokeStyle = n ? rgba(COLD, 0.12 * fa) : rgba([210, 220, 240], 0.95 * fa); ctx.lineWidth = n ? 14 : 11; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + Math.cos(th) * len, p[1] + Math.sin(th) * len); ctx.stroke();
    }
    if (bu > 0.16 && bu < 0.5) { ctx.globalCompositeOperation = 'lighter'; glow([255, 255, 255], q[0], q[1], 90, (1 - (bu - 0.16) / 0.34)); ctx.globalCompositeOperation = 'source-over'; }
  }
  // Taser
  if (jit) {
    const a1 = jw(st, 'shR'), a2 = jw(st, 'hipR'), targets = [[lerp(a1[0], a2[0], 0.3), lerp(a1[1], a2[1], 0.3)], [lerp(a1[0], a2[0], 0.8), lerp(a1[1], a2[1], 0.8)]];
    ctx.globalCompositeOperation = 'lighter';
    targets.forEach((q, w) => {
      ctx.beginPath(); ctx.moveTo(1940, 560 + w * 20);
      for (let s = 1; s <= 16; s++) {
        const k = s / 16;
        ctx.lineTo(lerp(1940, q[0], k) + (s < 16 ? (hash01(f, s, w) - 0.5) * 26 : 0), lerp(560 + w * 20, q[1], k) + (s < 16 ? (hash01(f, s, w + 5) - 0.5) * 26 : 0));
      }
      ctx.strokeStyle = rgba([200, 225, 255], 0.9); ctx.lineWidth = 1.6; ctx.stroke();
      ctx.strokeStyle = rgba([150, 190, 255], 0.25); ctx.lineWidth = 7; ctx.stroke();
      glow([200, 225, 255], q[0], q[1], 70, 0.5 + 0.4 * hash01(f, w));
    });
    ctx.globalCompositeOperation = 'source-over';
  }
  // pepper spray
  const sp = L('spray').t0 + 0.2;
  if (t > sp && t < sp + 3.4) {
    const hd = jw(st, 'head'), nz = [hd[0] + 190, hd[1] - 70];
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 150; i++) {
      const te = sp + (i / 150) * 0.6, u = t - te;
      if (u < 0) continue;
      const tx = hd[0] + (hash01(i, 1) - 0.5) * 120, ty = hd[1] + (hash01(i, 2) - 0.5) * 90;
      const k = easeOut(clamp(u / 0.45));
      const x = lerp(nz[0], tx, k) + (hash01(i, 3) - 0.5) * 30 * u, y = lerp(nz[1], ty, k) + 10 * u;
      glow([255, 140, 60], x, y, 8 + 10 * k, 0.5 * (1 - clamp((u - 0.4) / 2.4)) * vis);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // the meter
  const ma = win(t, T.act4 + 0.4, T.act5 - 0.2, 1.0, 0.8);
  if (ma > 0) {
    const bx = 1640, top = 300, bot = 860;
    ctx.fillStyle = rgba([30, 34, 46], 0.9 * ma); ctx.fillRect(bx - 6, top, 12, bot - top);
    let lvl = 0;
    METER.forEach(m => { if (t >= m.t) lvl++; });
    const flick = t > L('worse').t0 ? 0.5 + 0.5 * hash01(f, 9) : 0;
    const fillTo = lerp(bot, top + 60, lvl / (METER.length + 1)) - flick * 40;
    const gr = ctx.createLinearGradient(0, bot, 0, top);
    gr.addColorStop(0, rgba([255, 190, 120], ma)); gr.addColorStop(1, rgba(RED, ma));
    ctx.fillStyle = gr; ctx.fillRect(bx - 6, fillTo, 12, bot - fillTo);
    ctx.font = `17px ${MONO}`; ctx.textAlign = 'left';
    METER.forEach((m, i) => {
      if (t < m.t) return;
      const y = lerp(bot, top + 60, (i + 1) / (METER.length + 1)), fresh = 1 - clamp((t - m.t) / 0.8);
      ctx.fillStyle = rgba(mix(DATA, [255, 200, 150], fresh), ma * (0.75 + 0.25 * fresh));
      ctx.fillText(m.label, bx + 24, y + 6);
      ctx.fillRect(bx + 8, y, 10, 1.5);
    });
    const da = ma * (0.35 + 0.65 * worse * (0.4 + 0.6 * hash01(f, 3)));
    ctx.font = `600 18px ${MONO}`; ctx.fillStyle = rgba(RED, da); ctx.fillText('deadly force', bx + 24, top + 6);
    ctx.fillStyle = rgba(DATA, 0.6 * ma); ctx.font = `13px ${MONO}`; ctx.fillText('FORCE', bx - 22, bot + 30);
  }
}

// ---------- §5 perception ----------
let dissolvePts = null;
function drawAct5(t) {
  if (t < T.act5 || t > T.coda + 0.2) return;
  const law = L('law'), jd = L('judged'), ct = L('courts'), kl = L('killed'), aw = L('away');
  const split = win(t, T.act5 + 0.6, kl.t0 + 1.4, 1.0, 1.2);
  // divider and labels
  if (split > 0) {
    ctx.fillStyle = rgba(DATA, 0.35 * split); ctx.fillRect(959, 230, 2, 700);
    ctx.font = `18px ${MONO}`; ctx.textAlign = 'center';
    ctx.fillStyle = rgba(WARM, 0.8 * split); ctx.fillText('what you did', 520, 250);
    ctx.fillStyle = rgba(RED, 0.85 * split); ctx.fillText('what was perceived', 1400, 250);
  }
  const la = win(t, law.t0 + 0.4, kl.t0 + 0.8, 0.8, 0.8);
  if (la > 0) {
    ctx.font = `13px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = rgba(DATA, 0.7 * la); ctx.fillText('THE STANDARD', 960, 120);
    ctx.font = `500 22px ${MONO}`; ctx.letterSpacing = '3px';
    glowText('IMMEDIATE THREAT OF DEATH OR SERIOUS INJURY', 961, 158, TEXT, la * 0.95, 10);
    ctx.letterSpacing = '0px';
  }
  // the officer's perspective, in the moment
  const fa = win(t, jd.t0 + 0.4, kl.t0 + 1.2, 0.3, 0.8);
  if (fa > 0) {
    brackets(1440, 600, 820, 640, RED, 0.75 * fa);
    const tc = Math.max(0, t - jd.t0 - 0.4);
    ctx.font = `16px ${MONO}`; ctx.textAlign = 'left'; ctx.fillStyle = rgba(RED, 0.8 * fa);
    ctx.fillText('in the moment', 1046, 312);
    ctx.textAlign = 'right';
    ctx.fillText(`00:00:${String(Math.floor(tc)).padStart(2, '0')}.${String(Math.floor((tc % 1) * 100)).padStart(2, '0')}`, 1834, 312);
    if (Math.floor(t * 1.5) % 2 === 0) { ctx.beginPath(); ctx.arc(1690, 306, 5, 0, Math.PI * 2); ctx.fill(); }
  }
  // benefit of the doubt
  const sa = win(t, ct.t0 + 0.6, kl.t0 + 0.6, 0.6, 0.8);
  if (sa > 0) {
    const tilt = ease(clamp((t - ct.t0 - 1.0) / 1.8)) * 0.2, px = 960, py = 560, hw = 250;
    const lx = px - Math.cos(tilt) * hw, ly = py - Math.sin(tilt) * hw, rx = px + Math.cos(tilt) * hw, ry = py + Math.sin(tilt) * hw;
    ctx.strokeStyle = rgba(DATA, 0.85 * sa); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(px, py - 50); ctx.lineTo(px, py + 150); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
    [[lx, ly, 'you', WARM], [rx, ry, 'officer', COLD]].forEach(([x, y, label, col]) => {
      ctx.strokeStyle = rgba(DATA, 0.6 * sa); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 34, y + 60); ctx.moveTo(x, y); ctx.lineTo(x + 34, y + 60); ctx.stroke();
      ctx.strokeStyle = rgba(col, 0.9 * sa); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 44, y + 60); ctx.lineTo(x + 44, y + 60); ctx.stroke();
      ctx.font = `16px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = rgba(col, 0.9 * sa); ctx.fillText(label, x, y + 86);
    });
  }
  // two figures, one movement
  const appear = smooth(clamp((t - T.act5 - 0.3) / 1.2));
  const red = 0.55 + 0.45 * smooth(clamp((t - L('each').t0) / 1.0));
  const rA = appear * (1 - smooth(clamp((t - kl.t0 - 0.2) / 1.2)));
  if (rA > 0) {
    const rs = rightFig(t);
    rs.s = 1.08;
    for (let n = 3; n >= 1; n--) {
      const ghost = rightFig(t - n * 0.07); ghost.s = 1.08;
      const moving = dist(...jw(ghost, 'haR'), ...jw(rs, 'haR')) > 2 || dist(...jw(ghost, 'head'), ...jw(rs, 'head')) > 2;
      if (moving) drawFigure(ghost, { a: rA * 0.18 / n, col: RED, glow: 1.5, time: t, jag: 10 });
    }
    drawAura(auraGeom(rs), { a: 0.6 * rA * red, col: RED, jag: 10, time: t });
    drawFigure(rs, { a: rA, col: mix([255, 120, 100], RED, red), glow: 1.6, core: [255, 190, 170], jag: 6 * red, time: t });
    ['pull', 'pocket', 'turn'].forEach(id => {
      const a = win(t, L(id).t0 + 0.2, L(id).t0 + 1.2, 0.04, 0.3) * rA;
      if (a <= 0) return;
      ctx.font = `700 26px ${MONO}`; ctx.textAlign = 'center';
      ctx.fillStyle = rgba(RED, 0.18 * a); ctx.fillRect(1320, 352, 160, 44);
      ctx.strokeStyle = rgba(RED, a); ctx.lineWidth = 2; ctx.strokeRect(1320, 352, 160, 44);
      ctx.fillStyle = rgba(RED, a); ctx.fillText('THREAT', 1400, 384);
    });
  }
  // you
  const dark = T.dark, out = smooth(clamp((t - dark - 0.15) / 0.6));
  const ls = leftFig(t);
  const hands = [handAt(hX, Math.min(t, dark)), handAt(hY, Math.min(t, dark))];
  const handFade = 1 - smooth(clamp((t - dark - 0.2) / 1.4));
  drawAura(auraGeom(ls), { a: 0.7 * appear * (1 - out), dents: hands.map(fingertip).filter(Boolean), time: Math.min(t, dark) });
  drawFigure(ls, { a: appear * (1 - out), time: Math.min(t, dark) });
  hands.forEach(h => drawHand(h, handFade));
  ['pull', 'pocket', 'turn'].forEach(id => {
    const a = win(t, L(id).t0 + 0.2, L(id).t0 + 1.2, 0.1, 0.3) * split;
    if (a <= 0) return;
    ctx.font = `20px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = rgba(WARM, 0.85 * a);
    ctx.fillText(L(id).text.replace('.', '').toLowerCase(), 520, 384);
  });
  // the light goes out
  if (t > dark) {
    if (!dissolvePts) dissolvePts = samplePoints(ls);
    const u = t - dark;
    ctx.globalCompositeOperation = 'lighter';
    dissolvePts.forEach((p, i) => {
      const d = hash01(i, 1) * 0.8, uu = u - 0.1 - d;
      if (uu < 0) { glow(WARM, p[0], p[1], 7, 0.5); return; }
      const x = p[0] + (hash01(i, 2) - 0.5) * 40 * uu, y = p[1] - (25 + 55 * hash01(i, 3)) * uu;
      glow(mix(WARM, [120, 110, 100], clamp(uu / 3)), x, y, 7, 0.55 * (1 - clamp(uu / 3.2)));
    });
    ctx.globalCompositeOperation = 'source-over';
  }
}
function samplePoints(st) {
  const out = [];
  const seg = (a, b) => { const n = Math.ceil(dist(...a, ...b) / 7); for (let i = 0; i <= n; i++) for (let k = -1; k <= 1; k++) out.push([lerp(a[0], b[0], i / n) + k * 6, lerp(a[1], b[1], i / n)]); };
  LIMBS.forEach(([a, b, c]) => { seg(jw(st, a), jw(st, b)); seg(jw(st, b), jw(st, c)); });
  const sl = jw(st, 'shL'), sr = jw(st, 'shR'), hl = jw(st, 'hipL'), hr = jw(st, 'hipR');
  for (let i = 0; i <= 8; i++) for (let k = 0; k <= 6; k++) out.push([lerp(lerp(sl[0], sr[0], k / 6), lerp(hl[0], hr[0], k / 6), i / 8), lerp(lerp(sl[1], sr[1], k / 6), lerp(hl[1], hr[1], k / 6), i / 8)]);
  const h = jw(st, 'head');
  for (let i = 0; i < 40; i++) { const a = i * 2.4, r = 24 * Math.sqrt(i / 40); out.push([h[0] + Math.cos(a) * r, h[1] + Math.sin(a) * r]); }
  return out;
}

// ---------- coda ----------
function drawCoda(t) {
  if (t < T.coda) return;
  const a = smooth(clamp((t - T.coda) / 0.8)) * (1 - smooth(clamp((t - T.END + 1.4) / 1.2)));
  const cl = L('close');
  const line = 'Your body belongs to you.';
  ctx.font = `italic 64px ${SERIF}`; ctx.textAlign = 'left';
  const full = ctx.measureText(line).width, x0 = 960 - full / 2, y = 300;
  glowText(typed(line, cl.t0 - 0.1, 17, t), x0, y, TEXT, a, 18);
  const ak = smooth(clamp((t - cl.t1 - 0.4) / 0.4));
  if (ak > 0) { ctx.font = `italic 52px ${SERIF}`; glowText('*', x0 + full + 8, y - 28, ASTER, a * ak, 22); }
  // the fine print is everything you just heard
  const font = `16px ${MONO}`;
  if (!drawCoda.lines) {
    drawCoda.lines = [];
    FULL_TEXT.forEach((p, i) => { wrap((i ? '' : '* ') + p, font, 1520).forEach(l => drawCoda.lines.push(l)); drawCoda.lines.push(''); });
  }
  ctx.font = font; ctx.textAlign = 'left';
  drawCoda.lines.forEach((l, i) => {
    const la = smooth(clamp((t - T.fine - i * 0.09) / 0.4)) * a;
    if (la > 0 && l) { ctx.fillStyle = rgba(DATA, 0.62 * la); ctx.fillText(l, 200, 390 + i * 22); }
  });
  ctx.font = `500 18px ${MONO}`; ctx.textAlign = 'center'; ctx.letterSpacing = '12px';
  ctx.fillStyle = rgba(DATA, 0.8 * win(t, T.fine + 2.0, T.END, 1.2, 1.4)); ctx.fillText('FINE PRINT', 966, 160);
  ctx.letterSpacing = '0px';
}

function post(t) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(vignette, 0, 0);
  ctx.save(); ctx.globalAlpha = 0.03; ctx.fillStyle = dither; ctx.fillRect(0, 0, W, H); ctx.restore();
  const black = Math.max(1 - smooth(clamp(t / 0.6)), smooth(clamp((t - T.END + 1.0) / 1.0)));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bgCanvas, 0, 0);
  if (t < T.dark) dissolvePts = null;
  drawTitle(t);
  drawAct1(t);
  drawAct2(t);
  drawAct3(t);
  drawAct4(t);
  drawAct5(t);
  drawCoda(t);
  drawFinePrint(t);
  drawSection(t);
  drawSubtitles(t);
  post(t);
}

const events = [];
function buildEvents() {

  add(L('most').t0 + 0.2, 'asterisk'); add(L('most').t1 + 0.4, 'title');
  add(T.act1 + 0.5, 'aura');
  FOOT.forEach(f => { for (let i = 0; i < f.text.length; i += 2) add(f.t + i / 45, 'key', { soft: 1 }); });
  add(L('grab').t0 - 0.1, 'handin', { pan: 0.9 }); add(L('grab').t0 + 0.45, 'grip');
  add(L('hold').t0 - 0.1, 'handin', { pan: 0.75 }); add(L('hold').t0 + 0.45, 'grip'); add(L('hold').t0 + 0.6, 'press');
  add(L('cuff').t0 + 0.6, 'cuff'); add(L('cuff').t0 + 0.85, 'cuff');
  ['no_move', 'no_ctrl', 'no1'].forEach(id => add(L(id).t0, 'no'));
  add(L('resist').t0 + 0.15, 'scuffle'); add(L('resist').t0 + 1.25, 'stamp');
  add(L('cell').t0 + 0.6, 'concrete'); add(L('cell').t0 + 2.8, 'slam');
  for (let i = 0; i < TALLY_N; i++) add(tallyTime(i), 'tally');
  add(L('search').t0 + 0.6, 'scan'); add(L('notreq').t0 + 0.4, 'scan');
  PATS.forEach(([off, , label]) => add(L('pat').t0 + off, 'pat', { hot: label ? 1 : 0 }));
  add(L('strip').t0 + 0.2, 'strip'); add(L('notreq').t0 + 1.8, 'noted');
  add(L('solitary').t0 + 0.5, 'concrete'); add(L('solitary').t0 + 1.6, 'slam', { small: 1 });
  PIN.forEach(([, , d]) => add(L('pinned').t0 + 1.45 + d, 'pin'));
  add(L('further').t0 + 0.3, 'handin', { pan: 0.85 }); add(L('further').t0 + 0.6, 'handin', { pan: 0.3 });
  add(L('further').t0 + 1.6, 'crack'); add(L('further').t0 + 2.9, 'crack');
  add(L('crimes').t0 + 0.3, 'tag'); add(L('crimes').t0 + 1.0, 'tag');
  add(L('later').t0 + 0.4, 'drift'); add(L('atall').t0 + 0.5, 'question');
  add(L('cmd1').t0 - 0.1, 'handin', { pan: 0.9 }); add(L('keepno').t0 + 1.25, 'grip'); add(L('keepno').t0 + 3.2, 'scuffle');
  add(L('keepno').t0 + 3.3, 'handin', { pan: 0.7 });
  METER.forEach((m, i) => add(m.t, 'meter', { i }));
  add(L('ground').t0 + 0.5, 'impact'); add(L('helddown').t0 + 0.1, 'press');
  add(L('baton').t0 + 0.3, 'whoosh'); add(L('baton').t0 + 0.46, 'impact', { sharp: 1 });
  add(L('taser').t0 + 0.15, 'taser'); add(L('spray').t0 + 0.2, 'spray');
  add(L('bones').t0 + 0.5, 'fracture'); add(L('bones').t0 + 2.0, 'fracture'); add(L('worse').t0, 'worse');
  add(L('law').t0 + 0.4, 'law'); add(L('judged').t0 + 0.4, 'frame'); add(L('courts').t0 + 1.0, 'scale');
  ['pull', 'pocket', 'turn'].forEach(id => add(L(id).t0 + 0.2, 'threat'));
  add(L('killed').t0 + 0.6, 'merge'); add(L('away').t0 - 0.35, 'handin', { pan: 0.85 });
  add(T.dark, 'freeze'); add(T.dark + 0.5, 'dissolve');
  for (let i = 0; i < 25; i++) add(L('close').t0 - 0.1 + i / 17, 'key');
  add(L('close').t1 + 0.4, 'asterisk'); add(T.fine, 'fine');
  events.sort((a, b) => a.t - b.t);
}

})();

window.FILM = {
  ready, W, H, FPS, T, events,
  frames: Math.round(T.END * FPS),
  draw,
  frameDataURL(i, type = 'image/png', q) { draw(i / FPS); return canvas.toDataURL(type, q); },
  cues: {
    voice: Object.values(LINE).map(l => ({ id: l.id, who: l.who, voice: l.voice || null, text: l.text, t0: l.t0, dur: l.dur, sub: l.sub !== false })),
  },
};

const params = new URLSearchParams(location.search);
if (params.has('render')) { document.body.classList.add('render'); return; }

const audio = document.getElementById('score'), playBtn = document.getElementById('play');
const scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let audioOK = false, playing = false, cur = 0, wall0 = 0, t0 = 0;
audio.addEventListener('canplaythrough', () => { audioOK = true; });
audio.addEventListener('error', () => { audioOK = false; });
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(on) {
  playing = on; playBtn.textContent = on ? 'Pause' : 'Play';
  document.getElementById('controls').classList.toggle('show', !on);
  if (on) {
    if (cur >= T.END - 0.05) cur = 0;
    wall0 = performance.now(); t0 = cur;
    if (audioOK) { audio.currentTime = cur; audio.play().catch(() => { audioOK = false; }); }
  } else audio.pause();
}
playBtn.onclick = () => setPlaying(!playing);
canvas.onclick = () => setPlaying(!playing);
scrub.oninput = () => {
  cur = scrub.value / 1000 * T.END; t0 = cur; wall0 = performance.now();
  if (audioOK) audio.currentTime = cur;
  draw(cur);
};
function tick() {
  if (playing) {
    cur = audioOK && !audio.paused ? audio.currentTime : t0 + (performance.now() - wall0) / 1000;
    if (cur >= T.END) { cur = T.END; setPlaying(false); }
    draw(cur);
    scrub.value = Math.round(cur / T.END * 1000);
  }
  clock.textContent = `${fmt(cur)} / ${fmt(T.END)}`;
  requestAnimationFrame(tick);
}
ready.then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
