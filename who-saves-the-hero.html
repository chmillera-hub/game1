<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Who Saves the Hero?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,800;1,9..144,400;1,9..144,600&family=Patrick+Hand&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a dark screening room. One film stage, a reel picker above it, a transport bar below. */
:root{
  --ink:#0e1120;
  --panel:#171b2e;
  --line:#2b3152;
  --fg:#efe8d8;
  --muted:#9ca1b9;
  --gold:#e8b04a;
  --cape:#e0535a;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --hand:'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--hand);font-size:18px;line-height:1.4;
  padding-inline:16px;padding-block:24px 40px;min-height:100%}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,46px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--gold)}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.part{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;
  padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}
.part:hover{border-color:#4a5280}
.part:focus-visible,.btn:focus-visible,#scrub:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.part .num{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.part .name{font-family:var(--display);font-style:italic;font-size:clamp(17px,2.2vw,22px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part[aria-current="true"]{border-color:var(--gold);background:#221f2a}
.part[aria-current="true"] .num{color:var(--gold)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 30px 80px -30px #000}
.stage canvas{display:block;width:100%;height:100%}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;
  border:2px solid var(--fg);background:rgba(14,17,32,.55);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.bigplay svg{width:34px;height:34px;margin-left:5px}
.subs{position:absolute;left:0;right:0;bottom:0;padding:40px 6% 18px;text-align:center;pointer-events:none;
  background:linear-gradient(to top,rgba(5,6,14,.82),rgba(5,6,14,0));min-height:30%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.subs .who{font-family:var(--mono);font-size:clamp(10px,1.1vw,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.subs .who.hero{color:#ff8a8f}
.subs .txt{font-family:var(--hand);font-size:clamp(16px,2.35vw,30px);line-height:1.2;color:#fff;text-shadow:0 2px 6px #000;text-wrap:balance}
.subs.narr .txt{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(15px,2.1vw,26px);color:#f3ead6}
.subs.thought .txt{color:#cfe0ff}
.stage:fullscreen{border-radius:0}
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;height:40px;min-width:40px;
  padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:12px}
.btn:hover{border-color:#4a5280}
.btn svg{width:18px;height:18px}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--gold);height:40px}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .stage{border-radius:0}
  .subs{position:static;background:var(--panel);min-height:96px;padding:12px 14px}
  .stage{overflow:visible;aspect-ratio:auto}
  .stage canvas{aspect-ratio:16/9;height:auto}
  .bigplay{top:calc((100vw - 32px) * 9 / 32)}
  .part .num span:last-child{display:none}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Who Saves <em>the Hero?</em></h1>
    <p class="eyebrow">An animated short in three parts</p>
  </header>

  <nav class="parts" id="parts" aria-label="Choose a part"></nav>

  <div class="stage" id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="Animation stage"></canvas>
    <button class="bigplay" id="bigplay" aria-label="Play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>
    </button>
    <div class="subs" id="subs" aria-live="polite"><span class="who" id="who"></span><span class="txt" id="txt"></span></div>
  </div>

  <div class="transport">
    <button class="btn" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
    <button class="btn" id="restart" aria-label="Restart this part"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span class="time" id="time">0:00 / 0:00</span>
    <button class="btn" id="sound" aria-pressed="true">Sound on</button>
    <button class="btn" id="full" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <p class="hint">Space plays and pauses. Left and right arrows skip 5 seconds. Parts play on into each other.</p>
</main>

<script>
(()=>{
'use strict';
// ============================================================
//  basics
// ============================================================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280,H=720,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD="'Fraunces', Georgia, serif", FH="'Patrick Hand', 'Comic Sans MS', cursive", FM="'IBM Plex Mono', monospace";
let T=0; // time within the current part, drives all idle motion

function rrp(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fr(x,y,w,h,r,c){rrp(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=c;ctx.fill();}
function ell(x,y,rx,ry,c,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU);ctx.fillStyle=c;ctx.fill();}
function ln(x1,y1,x2,y2,w,c){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=w;ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke();}
function poly(pts,c){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fillStyle=c;ctx.fill();}
function star(x,y,R,r,c){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();ctx.fillStyle=c;ctx.fill();}
function txt(s,x,y,font,c,align='center',base='alphabetic'){ctx.font=font;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);}
function grad(y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g;}

// ============================================================
//  characters
// ============================================================
const COST={
  hero:{skin:'#ecb68e',hair:'#2a1b12',top:'#2f5fd6',legs:'#1f449f',boots:'#c9333d',cape:'#c9333d',capeIn:'#9b2330',mask:'#17306f',belt:'#f1c443',emblem:'#f1c443',glove:'#c9333d',head:'hair'},
  kid:{skin:'#ecb68e',hair:'#2a1b12',top:'#2f5fd6',legs:'#1f449f',boots:'#c9333d',cape:'#c9333d',capeIn:'#9b2330',emblem:'#f1c443',head:'hair'},
  crim:{skin:'#c4875f',hair:'#1c1c22',top:'#ece7da',stripe:'#2b2b36',arm:'#2b2b36',legs:'#2b2b36',boots:'#17171c',mask:'#121216',head:'beanie',beanie:'#d99a2b'},
  thug1:{skin:'#d9a37b',hair:'#3a2a1a',top:'#4f7d55',legs:'#3b3b46',boots:'#222',head:'cap',cap:'#2c2c33',mask:'#1a1a1a'},
  thug2:{skin:'#8d5a3c',hair:'#111',top:'#8a4f9e',legs:'#2e2e38',boots:'#222',head:'bald',mask:'#1a1a1a'},
  cop:{skin:'#b47652',hair:'#222',top:'#26385f',legs:'#1b2848',boots:'#111',head:'copcap',cap:'#1b2848',badge:'#f1c443'},
  guard:{skin:'#e0b08c',hair:'#222',top:'#5a5f6a',legs:'#3c4049',boots:'#111',head:'copcap',cap:'#3c4049',badge:'#c9ccd3'},
  prisoner:{skin:'#a8714f',hair:'#222',top:'#e07a2e',legs:'#e07a2e',boots:'#333',head:'buzz'},
  mom:{skin:'#e8b996',hair:'#c9c2b6',top:'#7a9e7e',legs:'#59617a',boots:'#4a3a32',head:'bun'},
};
(()=>{const R=rng(7);const sk=['#f0c7a2','#d9a37b','#b47652','#8d5a3c','#e8b996','#6e4430'],tp=['#d9534f','#f0ad4e','#5bc0de','#7a9e7e','#9b6fc4','#e8e1d0','#3f7fbf','#e27aa4'],hr=['#2a1b12','#5a3a1a','#111','#c98b3a','#7a2e1a'],hd=['hair','bun','cap','hair','buzz'];
  for(let i=0;i<10;i++)COST['civ'+i]={skin:sk[(R()*sk.length)|0],top:tp[i%tp.length],legs:'#3d4256',boots:'#2b2b2b',hair:hr[(R()*hr.length)|0],head:hd[(R()*hd.length)|0],cap:tp[(i+3)%tp.length]};})();

const ARM={
  down:[5,32,7,62], hips:[24,24,5,54], cross:[12,30,-24,24], up:[4,-32,2,-64], wave:[26,-8,32,-42],
  point:[22,-6,24,-46], shrug:[24,16,42,0], fwd:[26,8,56,2], hug:[30,14,-10,30], palm:[16,-8,-17,-34],
  wind:[-12,-26,-26,-52], throw:[30,-16,62,-24], catch:[24,-6,42,-26], hold:[16,28,26,12], push:[28,-2,58,-8],
  hover:[30,8,48,-8], scratch:[20,-12,8,-46], reach:[24,14,52,24], cuff:[18,24,30,16], lift:[22,-16,30,-48],
  out:[28,10,52,-4], back:[-8,30,-14,58]
};
const FRONT_ARMS=['palm','scratch'];
function armP(name,sd,t){const a=(ARM[name]||ARM.down).slice();if(name==='wave'){a[2]+=Math.sin(t*12)*7;a[3]+=Math.cos(t*12)*3;}return [sd*a[0],a[1],sd*a[2],a[3]];}

function drawProp(name,x,y,sc=1,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  switch(name){
    case 'baton': ln(0,-26,0,22,6,'#22252b');ln(0,14,0,22,8,'#111');break;
    case 'crowbar': ln(0,-30,0,26,5,'#9aa0aa');ctx.beginPath();ctx.arc(-6,-30,6,Math.PI*1.9,Math.PI*1.1,true);ctx.lineWidth=5;ctx.strokeStyle='#9aa0aa';ctx.stroke();break;
    case 'vase': ctx.beginPath();ctx.moveTo(-8,-24);ctx.quadraticCurveTo(-20,-6,-12,10);ctx.lineTo(12,10);ctx.quadraticCurveTo(20,-6,8,-24);ctx.closePath();ctx.fillStyle='#4f8fc0';ctx.fill();rect(-9,-28,18,5,'#3b6f99');ln(-12,-4,12,-4,3,'#e8e1d0');break;
    case 'book': fr(-14,-18,28,36,3,'#b23a48');rect(10,-16,3,32,'#efe6d0');rect(-9,-8,14,3,'#f1c443');break;
    case 'pillow': fr(-24,-14,48,28,12,'#f3efe6');ln(-14,0,14,0,2,'#d8d0c0');break;
    case 'photo': fr(-22,-20,44,40,3,'#b8873b');rect(-17,-15,34,30,'#9cc3d8');rect(-17,4,34,11,'#7fae6a');circ(-6,-2,5,'#e8b996');circ(-6,-8,4,'#c9c2b6');circ(7,2,4,'#ecb68e');rect(4,6,6,8,'#2f5fd6');break;
    case 'clock': circ(0,0,20,'#c9333d');circ(0,0,15,'#fbf6ea');star(0,0,6,2.6,'#f1c443');ln(0,0,0,-11,2,'#222');ln(0,0,8,3,2,'#222');rect(-14,17,6,6,'#c9333d');rect(8,17,6,6,'#c9333d');break;
    case 'cash': for(let i=0;i<3;i++){fr(-20,-6-i*4,40,14,2,i%2?'#6aa86a':'#5c9a5c');}circ(0,-7,4,'#3d7a3d');break;
    case 'sack': ctx.beginPath();ctx.moveTo(-6,-22);ctx.quadraticCurveTo(-30,0,-20,22);ctx.quadraticCurveTo(0,30,20,22);ctx.quadraticCurveTo(30,0,6,-22);ctx.closePath();ctx.fillStyle='#9b7a4f';ctx.fill();rect(-7,-26,14,6,'#6d5233');break;
    case 'trophy': rect(-10,8,20,8,'#6b4a3a');rect(-3,-2,6,10,'#d9a730');ctx.beginPath();ctx.moveTo(-14,-22);ctx.lineTo(14,-22);ctx.quadraticCurveTo(12,0,0,0);ctx.quadraticCurveTo(-12,0,-14,-22);ctx.fillStyle='#f1c443';ctx.fill();break;
    case 'candle': rect(-10,14,20,5,'#d9a730');rect(-2,-6,4,20,'#d9a730');rect(-4,-20,8,14,'#f4ecd8');ell(0,-25,3,5,'#ffb347');break;
    case 'lamp': rect(-14,16,28,6,'#6b4a3a');rect(-2,-10,4,26,'#6b4a3a');ctx.beginPath();ctx.moveTo(-16,-10);ctx.lineTo(16,-10);ctx.lineTo(10,-34);ctx.lineTo(-10,-34);ctx.closePath();ctx.fillStyle='#e9c77b';ctx.fill();break;
  }
  ctx.restore();
}

function drawEye(x,y,type,c,pdx,pdy,lid){
  const dark='#16161c';
  if(type==='closed'){ctx.beginPath();ctx.arc(x,y-3,5.5,.18*Math.PI,.82*Math.PI);ctx.lineWidth=2.6;ctx.strokeStyle=dark;ctx.lineCap='round';ctx.stroke();return;}
  if(type==='blink'){ln(x-5,y,x+5,y,2.4,dark);return;}
  if(type==='happy'){ctx.beginPath();ctx.arc(x,y+3,5.5,1.15*Math.PI,1.85*Math.PI);ctx.lineWidth=2.6;ctx.strokeStyle=c.mask?'#fff':dark;ctx.lineCap='round';ctx.stroke();return;}
  const wide=type==='wide';
  ell(x,y,wide?7:6,wide?7.2:5.6,'#fff');
  circ(x+pdx,y+pdy,wide?2.4:2.9,dark);
  circ(x+pdx+1,y+pdy-1.2,.9,'#fff');
  if(lid>0){ctx.save();ctx.beginPath();ctx.ellipse(x,y,wide?7.4:6.4,wide?7.6:6,0,0,TAU);ctx.clip();rect(x-8,y-8,16,16*lid*0.5+ (lid>0?1:0),c.mask||c.skin);ln(x-7,y-8+16*lid*0.5,x+7,y-8+16*lid*0.5,1.6,dark);ctx.restore();}
}

function drawHead(c,o,t,hd){
  const r=25, lx=(o.look??2), dark='#16161c';
  let ly=(o.lookY??0)+hd*2.5;
  if(c.head==='bun')circ(0,-26,10,c.hair);
  circ(-r+1,3,5,c.skin);circ(r-1,3,5,c.skin);
  circ(0,0,r,c.skin);
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.clip();
  if(c.mask)fr(-r-2,-13,2*r+4,16,5,c.mask);
  ctx.restore();
  // headwear
  switch(c.head){
    case 'hair': ctx.beginPath();ctx.moveTo(-r-1,0);ctx.arc(0,0,r+1,Math.PI,TAU);ctx.lineTo(r+1,-3);ctx.quadraticCurveTo(10,-15,-2,-12);ctx.quadraticCurveTo(-14,-16,-r-1,0);ctx.fillStyle=c.hair;ctx.fill();
      ctx.beginPath();ctx.arc(6,-r+2,6,Math.PI*1.1,Math.PI*0.2);ctx.lineWidth=3;ctx.strokeStyle=c.hair;ctx.stroke();break;
    case 'beanie': ctx.beginPath();ctx.arc(0,-4,r+2,Math.PI,TAU);ctx.closePath();ctx.fillStyle=c.beanie;ctx.fill();fr(-r-3,-12,2*r+6,9,4,'#b67d1f');circ(0,-r-8,6,c.beanie);break;
    case 'cap': ctx.beginPath();ctx.arc(0,-4,r+1,Math.PI,TAU);ctx.closePath();ctx.fillStyle=c.cap;ctx.fill();ell(18,-6,16,4,c.cap);break;
    case 'copcap': fr(-r-1,-r-10,2*r+2,16,4,c.cap);ell(8,-r+5,r+6,5,'#111');star(0,-r-2,4,1.8,c.badge||'#f1c443');break;
    case 'buzz': ctx.beginPath();ctx.arc(0,-2,r+.5,Math.PI*1.05,Math.PI*1.95);ctx.lineWidth=5;ctx.strokeStyle=c.hair;ctx.stroke();break;
    case 'bun': ctx.beginPath();ctx.moveTo(-r-1,2);ctx.arc(0,0,r+1,Math.PI,TAU);ctx.lineTo(r+1,2);ctx.quadraticCurveTo(0,-14,-r-1,2);ctx.fillStyle=c.hair;ctx.fill();break;
  }
  // eyes
  let ey=o.eyes||'open';
  const blink=(t%4.7)<.13;
  const base=-4;
  for(const sd of [-1,1]){
    let type=ey,lid=0,pdx=lx*0.6,pdy=ly;
    if(ey==='one'){type=sd<0?'closed':'open';lid=.55;}
    else if(ey==='wink'){type=sd<0?'closed':'open';}
    else if(ey==='half'){type='open';lid=.6;}
    else if(ey==='squint'){type='open';lid=.8;}
    else if(ey==='roll'){type='open';pdy=-3.4;pdx=0;lid=.25;}
    else if(ey==='sad'){type='open';pdy=ly+1.5;lid=.3;}
    else if(ey==='down'){type='open';pdy=3;lid=.45;}
    else if(ey==='away'){type='open';pdx=-3.4;}
    else if(ey==='nerv'){type='open';pdx=(Math.sin(t*5)>0?3.4:-3.4);}
    if(blink&&['open','wide'].includes(type)&&!['nerv','roll'].includes(ey))type='blink';
    drawEye(sd*9+lx*.6,base,type,c,clamp(pdx,-3.4,3.4),clamp(pdy,-3.4,3.4),lid);
  }
  // brows
  const bw=c.mask?'#0c0c12':dark, by=-15;
  const brow=o.brow||'n';
  for(const sd of [-1,1]){
    const cx=sd*9+lx*.6;let yi=by,yo=by;
    if(brow==='raise'&&sd>0){yi-=6;yo-=7;}
    if(brow==='up'){yi-=5;yo-=5;}
    if(brow==='angry'){yi+=3;yo-=3;}
    if(brow==='sad'){yi-=4;yo+=2;}
    if(brow==='worry'){yi-=5;yo+=1;}
    ln(cx-sd*5,yi,cx+sd*6,yo,3,bw);
  }
  // nose
  ctx.beginPath();ctx.arc(lx*.9+1,5,3.2,-.4,Math.PI*.6);ctx.lineWidth=1.8;ctx.strokeStyle='rgba(80,40,30,.45)';ctx.stroke();
  // mouth
  const mx=lx*.6,my=13;let m=o.mouth||'flat';
  if(o.talk){const a=Math.abs(Math.sin(t*11))*Math.abs(Math.sin(t*4.3+1));m=a>.25?'talk':'flat';if(m==='talk'){ell(mx,my,5,1.5+a*4.5,'#5a2424');return finishHead();}}

// ============================================================
//  timeline
// ============================================================
const autoDur=s=>{if(!s)return 2;const w=s.trim().split(/\s+/).length;return Math.max(2,1+w*.275);};
PARTS.forEach(part=>{let t=0;part.shots.forEach(sh=>{let lt=0;sh.lines.forEach(l=>{l.d=l.d??autoDur(l.t);l.st=lt;lt+=l.d;l.en=lt;});sh.dur=lt;sh.start=t;t+=lt;});part.dur=t;});

let P=null; // pose accessor for the current shot
function makeK(sh,lt){
  const L=sh.lines;let li=L.findIndex(l=>lt<l.en);if(li<0)li=L.length-1;
  const cur=L[li],lp=clamp((lt-cur.st)/cur.d);
  const k={t:lt,d:sh.dur,p:lt/sh.dur,li,lp,L:cur,
    at:i=>L[i].st,since:i=>lt-L[i].st,
    tw:(i,a,b,e=ease)=>li<i?a:li>i?b:lerp(a,b,e(lp))};
  P=(name,base={})=>{
    const acc=Object.assign({},base);let prevL=null,prevR=null;
    for(let i=0;i<=li;i++){
      if(i===li){prevL=acc.armL||acc.arms||'down';prevR=acc.armR||acc.arms||'down';}
      const ov=L[i][name];if(ov){if('arms'in ov){delete acc.armL;delete acc.armR;}Object.assign(acc,ov);}
    }
    acc.pL=prevL;acc.pR=prevR;acc.blend=ease(clamp((lt-cur.st)/.35));
    acc.talk=cur.s===name&&!!cur.t&&lp<.94;
    acc.who=acc.who||name;
    return acc;
  };
  return k;
}
function locate(part,t){const sh=part.shots;for(let i=0;i<sh.length;i++){if(t<sh[i].start+sh[i].dur||i===sh.length-1)return [i,clamp(t-sh[i].start,0,sh[i].dur-1e-4)];}return [0,0];}

// ============================================================
//  render
// ============================================================
let partIdx=0,time=0,playing=false,dirty=true;
function render(){
  const part=PARTS[partIdx];T=time;
  const [si,lt]=locate(part,time);const sh=part.shots[si];const k=makeK(sh,lt);
  ctx.save();ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  rect(0,0,W,H,'#000');
  ctx.save();
  const [cx,cy,z]=sh.cam?sh.cam(k):[640,360,1];
  let sx=0,sy=0;const shk=k.L.shake;
  if(shk&&!REDUCED){const e=lt-k.L.st-(typeof shk==='number'?shk:0);if(e>0&&e<.45){const a=(1-e/.45)*14;sx=Math.sin(e*90)*a;sy=Math.cos(e*70)*a;}}
  ctx.translate(W/2+sx,H/2+sy);ctx.scale(z,z);ctx.translate(-cx,-cy);
  sh.draw(k);
  ctx.restore();
  if(sh.overlay)sh.overlay(k);
  // shot fades
  const fi=si===0?1.0:.4,fo=.4;
  let a=0;if(lt<fi)a=Math.max(a,1-lt/fi);if(sh.dur-lt<fo&&si<part.shots.length-1)a=Math.max(a,1-(sh.dur-lt)/fo);
  if(si===part.shots.length-1&&sh.dur-lt<1)a=Math.max(a,1-(sh.dur-lt)/1);
  if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}
  if(burnSubs)paintSubs(k.L);
  ctx.restore();
  updateSubs(k.L);
  updateUI();
  handleSfx(si,k);
}

const subs=document.getElementById('subs'),whoEl=document.getElementById('who'),txtEl=document.getElementById('txt');
let lastLine=null;
function updateSubs(L){
  if(L===lastLine)return;lastLine=L;
  subs.classList.toggle('narr',L.s==='n');subs.classList.toggle('thought',L.s==='th');
  whoEl.textContent=L.t&&L.s!=='n'?LABEL[L.s]||'':'';
  whoEl.className='who'+(L.s==='hero'||L.s==='th'?' hero':'');
  txtEl.textContent=L.t||' ';
}

// ============================================================
//  sound: a soft pad per part plus a handful of synthesized effects
// ============================================================
let AC=null,master,musicBus,sfxBus,noiseBuf,soundOn=true,AT=0;
const aNow=()=>AC.currentTime+AT;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  buildBuses();
}
function buildBuses(){
  master=AC.createGain();master.gain.value=soundOn?1.8:0;master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.5;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;musicBus.connect(lp);lp.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=.55;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
let voices=[],chordKey=null;
function releaseVoices(){if(!AC)return;const now=AC.currentTime;voices.forEach(v=>{try{v.g.gain.cancelScheduledValues(now);v.g.gain.setValueAtTime(v.g.gain.value,now);v.g.gain.linearRampToValueAtTime(0,now+2.2);v.o.stop(now+2.4);}catch(e){}});voices=[];}
function updateMusic(){
  if(!AC||!playing){if(chordKey!==null){releaseVoices();chordKey=null;}return;}
  const part=PARTS[partIdx],idx=Math.floor(time/8),key=partIdx+':'+idx;
  if(key===chordKey)return;chordKey=key;releaseVoices();
  const ch=part.music[idx%part.music.length],now=AC.currentTime;
  [...ch,ch[0]-12].forEach((m,i)=>{
    for(const det of [-4,4]){
      const o=AC.createOscillator(),g=AC.createGain();o.type=i===ch.length?'sine':'triangle';o.frequency.value=hz(m);o.detune.value=det;
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(i===ch.length?.05:.022,now+2.5);
      o.connect(g);g.connect(musicBus);o.start(now);voices.push({o,g});
    }
  });
}
function noise(dur,filt,f0,f1,vol,when=0,q=1){
  const t0=aNow()+when,s=AC.createBufferSource();s.buffer=noiseBuf;
  const bp=AC.createBiquadFilter();bp.type=filt;bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);bp.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.05,dur/4));g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(bp);bp.connect(g);g.connect(sfxBus);s.start(t0);s.stop(t0+dur+.05);
}
function tone(type,f0,f1,dur,vol,when=0){
  const t0=aNow()+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(sfxBus);o.start(t0);o.stop(t0+dur+.05);
}
const SFX={
  whoosh:w=>noise(.9,'bandpass',300,2400,.5,w,1.2),
  beep:w=>{tone('sine',1320,1320,.12,.25,w);tone('sine',1320,1320,.12,.25,w+.2);tone('sine',1760,1760,.16,.25,w+.4);},
  clank:w=>{[523,1187,1690,2311].forEach((f,i)=>tone('sine',f,f*.98,.7-i*.1,.12,w));noise(.15,'highpass',3000,5000,.2,w);},
  siren:w=>{for(let i=0;i<3;i++){tone('sine',620,900,.45,.12,w+i*.9);tone('sine',900,620,.45,.12,w+i*.9+.45);}},
  honk:w=>{tone('square',330,320,.35,.09,w);tone('square',415,405,.35,.07,w);},
  slam:w=>{tone('sine',140,40,.5,.7,w);noise(.35,'lowpass',1200,200,.6,w);},
  creak:w=>{const t0=aNow()+w,o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,t0);o.frequency.linearRampToValueAtTime(330,t0+.9);lfo.frequency.value=28;lg.gain.value=40;lfo.connect(lg);lg.connect(o.frequency);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=3;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.12,t0+.1);g.gain.linearRampToValueAtTime(0,t0+1);o.connect(bp);bp.connect(g);g.connect(sfxBus);o.start(t0);lfo.start(t0);o.stop(t0+1.05);lfo.stop(t0+1.05);},
  door:w=>{SFX.creak(w);tone('sine',120,60,.25,.3,w+1.0);},
  bonk:w=>{tone('sine',700,180,.35,.45,w);tone('triangle',1400,500,.2,.15,w);},
  boop:w=>tone('sine',520,880,.12,.25,w),
  thud:w=>{tone('sine',110,45,.35,.6,w);noise(.18,'lowpass',800,150,.35,w);},
  slap:w=>noise(.12,'bandpass',2000,1500,.5,w,.8),
  snore:w=>{for(let i=0;i<2;i++){noise(1.0,'lowpass',300,500,.35,w+i*1.2,4);tone('sawtooth',70,60,1.0,.05,w+i*1.2);}},
  type:w=>{for(let i=0;i<18;i++)noise(.04,'highpass',2500,3000,.12,w+i*.13+Math.random()*.05);},
  applause:w=>{for(let i=0;i<70;i++)noise(.05,'bandpass',1500+Math.random()*1500,1200,.12+Math.random()*.1,w+Math.random()*3.2,1);},
  none:()=>{}
};
let lastSfxKey=null;
function handleSfx(si,k){
  const key=partIdx+':'+si+':'+k.li;
  if(key===lastSfxKey)return;lastSfxKey=key;
  if(!playing||!AC||!soundOn)return;
  if(k.t-k.L.st>.35)return; // we jumped into the middle of a line
  const s=k.L.sfx;if(!s)return;
  const list=typeof s==='string'?[[s,0]]:s;
  list.forEach(([name,w])=>{try{SFX[name]&&SFX[name](w||0);}catch(e){}});
}

// ============================================================
//  player UI
// ============================================================
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const partsNav=document.getElementById('parts'),playBtn=document.getElementById('play'),big=document.getElementById('bigplay'),scrub=document.getElementById('scrub'),timeEl=document.getElementById('time'),soundBtn=document.getElementById('sound');
PARTS.forEach((p,i)=>{const b=document.createElement('button');b.className='part';b.type='button';
  b.innerHTML=`<span class="num"><span>${p.num}</span><span>${fmt(p.dur)}</span></span><span class="name">${p.name}</span>`;
  b.addEventListener('click',()=>{selectPart(i);play();});partsNav.appendChild(b);});
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
let uiState='';
function updateUI(){
  const d=PARTS[partIdx].dur;const st=partIdx+'|'+playing;
  if(document.activeElement!==scrub)scrub.value=Math.round(time/d*1000);
  timeEl.textContent=fmt(time)+' / '+fmt(d);
  if(st!==uiState){uiState=st;
    [...partsNav.children].forEach((b,i)=>b.setAttribute('aria-current',i===partIdx?'true':'false'));
    playBtn.innerHTML=playing?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute('aria-label',playing?'Pause':'Play');
    big.hidden=playing;}
}
function selectPart(i){partIdx=i;time=0;lastSfxKey=null;chordKey=null;releaseVoices();dirty=true;try{localStorage.setItem('wsth-part',String(i));}catch(e){}}
function play(){initAudio();if(AC&&AC.state==='suspended')AC.resume();if(time>=PARTS[partIdx].dur-.05)time=0;playing=true;lastTs=null;dirty=true;}
function pause(){playing=false;updateMusic();dirty=true;}
function toggle(){playing?pause():play();}
playBtn.addEventListener('click',toggle);big.addEventListener('click',play);
cv.addEventListener('click',toggle);
document.getElementById('restart').addEventListener('click',()=>{time=0;lastSfxKey=null;chordKey=null;releaseVoices();dirty=true;});
scrub.addEventListener('input',()=>{time=scrub.value/1000*PARTS[partIdx].dur;chordKey=null;dirty=true;});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off';soundBtn.setAttribute('aria-pressed',String(soundOn));if(master)master.gain.value=soundOn?1.8:0;});
document.getElementById('full').addEventListener('click',()=>{const st=document.getElementById('stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(st.requestFullscreen)st.requestFullscreen().catch(()=>{});}catch(e){}});
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,button')&&e.code!=='Space'&&e.target!==scrub)return;
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight'&&e.target!==scrub){time=Math.min(PARTS[partIdx].dur-.01,time+5);dirty=true;}
  if(e.code==='ArrowLeft'&&e.target!==scrub){time=Math.max(0,time-5);dirty=true;}
});

function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.round(Math.min(1920,Math.max(640,r.width*dpr)));cv.width=w;cv.height=Math.round(w*9/16);dirty=true;}
addEventListener('resize',resize);

let lastTs=null;
function frame(ts){
  if(playing){
    if(lastTs!==null)time+=Math.min(.1,(ts-lastTs)/1000);
    lastTs=ts;
    const d=PARTS[partIdx].dur;
    if(time>=d){if(partIdx<PARTS.length-1){selectPart(partIdx+1);playing=true;}else{time=d-.001;playing=false;}}
    updateMusic();dirty=true;
  }
  if(dirty){render();dirty=false;}
  requestAnimationFrame(frame);
}
// public hooks for frame-exact export and testing
// offline soundtrack for video export: same pads and effects, scheduled on an OfflineAudioContext
async function renderAudio(pi){
  const part=PARTS[pi],sr=44100,len=Math.ceil((part.dur+1)*sr);
  const live=AC,liveBuses=[master,musicBus,sfxBus,noiseBuf];
  AC=new OfflineAudioContext(1,len,sr);buildBuses();master.gain.value=1.8;
  for(let i=0;i*8<part.dur;i++){
    const ch=part.music[i%part.music.length],t0=i*8,t1=Math.min(part.dur,(i+1)*8);
    [...ch,ch[0]-12].forEach((m,j)=>{for(const det of [-4,4]){const o=AC.createOscillator(),g=AC.createGain();o.type=j===ch.length?'sine':'triangle';o.frequency.value=hz(m);o.detune.value=det;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(j===ch.length?.05:.022,t0+2.5);g.gain.setValueAtTime(j===ch.length?.05:.022,t1);g.gain.linearRampToValueAtTime(0,t1+2.2);
      o.connect(g);g.connect(musicBus);o.start(t0);o.stop(t1+2.4);}});
  }
  part.shots.forEach(sh=>sh.lines.forEach(l=>{if(!l.sfx)return;AT=sh.start+l.st;const list=typeof l.sfx==='string'?[[l.sfx,0]]:l.sfx;list.forEach(([n,w])=>{try{SFX[n]&&SFX[n](w||0);}catch(e){}});}));
  AT=0;
  const buf=await AC.startRendering();
  AC=live;[master,musicBus,sfxBus,noiseBuf]=liveBuses;
  const d=buf.getChannelData(0),pcm=new Int16Array(d.length);for(let i=0;i<d.length;i++)pcm[i]=Math.max(-1,Math.min(1,d[i]))*32767;
  let bin='';const u8=new Uint8Array(pcm.buffer);for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(bin);
}
// subtitles painted onto the canvas, used only for video export
let burnSubs=false;
function paintSubs(L){
  if(!L.t)return;
  const g=ctx.createLinearGradient(0,H-200,0,H);g.addColorStop(0,'rgba(5,6,14,0)');g.addColorStop(1,'rgba(5,6,14,.85)');ctx.fillStyle=g;ctx.fillRect(0,H-200,W,200);
  const narr=L.s==='n',font=narr?`italic 400 30px ${FD}`:`400 34px ${FH}`;ctx.font=font;
  const words=L.t.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>1000){lines.push(cur);cur=w;}else cur=t;}lines.push(cur);
  let y=H-34-(lines.length-1)*40;
  if(!narr)txt((LABEL[L.s]||'').toUpperCase(),W/2,y-44,`500 14px ${FM}`,L.s==='hero'||L.s==='th'?'#ff8a8f':'#e8b04a');
  ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=6;
  lines.forEach((l,i)=>txt(l,W/2,y+i*40,font,L.s==='th'?'#cfe0ff':narr?'#f3ead6':'#ffffff'));ctx.restore();
}
window.__film={PARTS,seek(p,t){partIdx=p;time=t;render();},render,renderAudio,set burnSubs(v){burnSubs=v;},get canvas(){return cv;}};

try{const s=parseInt(localStorage.getItem('wsth-part'),10);if(s>=0&&s<3)partIdx=s;}catch(e){}
resize();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{dirty=true;});
requestAnimationFrame(frame);
})();
</script>
